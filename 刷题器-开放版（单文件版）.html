 author's attitude to food self-suffi…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, it picked two newcomers that were attracting considerable buzz in Silicon Valley. Microsoft's own Office dominates the market for \" productivity \" software, but the start-ups represented a new wave of technology designed from the ground up for the smartphone world. Both apps, however, were later scrapped, after Microsoft said it had used their best features in its own products. Their teams of engineers stayed on, making them two of the many \"acqui-hires\" that the biggest companies have used to feed their great hunger for tech talent. To Microsoft's critics, the fates of Wunderlist and Sunrise are examples of a remorseless drive by Big Tech to chew up any innovative companies that lie in their path. \"They bought the seedlings and closed them down,\" complained Paul Arnold, a partner at San Francisco-based Switch Ventures, putting an end to businesses that might one day tum into competitors. Microsoft declined to comment. Like other start-up investors, Mr. Arnold's own business often depends on selling start-ups to larger tech companies, though he admits to mixed feelings about the result: \"I think these things are good for me, if I put my selfish hat on. But are they good for the American economy? I don't know.\" The US Federal Trade Commission says it wants to find the answer to that question. This week, it asked the five most valuable US tech companies for information about their many small acquisitions over the past decade. Although only a research project at this stage, the request has raised the prospect of regulators wading into early-stage tech markets that until now have been beyond their reach. Given their combined market value of more than $ 5 .5 trillion, rifling through such small deals-many of them much less prominent than Wunderlist and Sunrise-might seem beside the point. Between them, the five biggest tech companies have spent an average of only $ 3 .4 billion a year on sub- $ 1 billion acquisitions over the past five years-a drop in the ocean compared with their massive financial reserves, and the more than $ 130 billion of venture capital that was invested in the US last year. However, critics say the big companies use such deals to buy their most threatening potential competitors before their businesses have a chance to gain momentum, in some cases as part of a \"buy and kill\" tactic to simply close them down."],"questions":[{"num":31,"stem":"What is true about Wunderlist and Sunrise after their acquisitions?","opts":{"A":"Their engineers were retained.","B":"Their market values declined.","C":"Their tech features improved.","D":"Their products were re-priced."},"answer":"A","analysis":"【AI 解析】答案 [A]「Their engineers were retained.」。本题考查「What is true about Wunderlist and Sunris…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"Microsoft's critics believe that the big tech companies tend to ___","opts":{"A":"exaggerate their product quality","B":"eliminate their potential competitors","C":"treat new tech talent unfairly","D":"ignore public opinions"},"answer":"B","analysis":"【AI 解析】答案 [B]「eliminate their potential competitors」。本题考查「Microsoft's critics believe that the big…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"Paul Arnold is concerned that small acquisitions might ___","opts":{"A":"weaken big tech companies","B":"worsen market competition","C":"harm the national economy","D":"discourage start-up investors"},"answer":"C","analysis":"【AI 解析】答案 [C]「harm the national economy」。本题考查「Paul Arnold is concerned that small acqu…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"The US Federal Trade Commission intends to ___","opts":{"A":"limit Big Tech's expansion","B":"encourage research collaboration","C":"examine small acquisitions","D":"supervise start-ups' operation"},"answer":"C","analysis":"【AI 解析】答案 [C]「examine small acquisitions」。本题考查「The US Federal Trade Commission intends …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"For the five biggest tech companies, their small acquisitions have ___","opts":{"A":"brought little financial pressure","B":"raised few management challenges","C":"set an example for future deals","D":"generated considerable profits"},"answer":"A","analysis":"【AI 解析】答案 [A]「brought little financial pressure」。本题考查「For the five biggest tech companies, the…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["We're fairly good at judging people based on first impressions, thin slices of experience ranging from a glimpse of a photo to five-minute interaction, and deliberation can be not only extraneous but intrusive. In one study of the ability she called \"thin slicing,\" the late psychologist Nalini Ambady asked participants to watch silent 10-second video clips of professors and to rate the instructor's overall effectiveness. Their ratings correlated strongly with students' end-of-semester ratings. Another set of participants had to count backward from 1,000 by nines as they watched the clips, occupying their conscious working memory. Their ratings were just as accurate, demonstrating the intuitive nature of the social processing. Critically, another group was asked to spend a minute writing down reasons for their judgment, before giving the rating. Accuracy dropped dramatically. Ambady suspected that deliberation focused them on vivid but misleading cues, such as certain gestures or utterances, rather than letting the complex interplay of subtle signals form a holistic impression. She found similar interference when participants watched 15-second clips of pairs of people and judged whether they were strangers, friends, or dating partners. Other research shows we're better at detecting deception from thin slices when we rely on intuition instead of reflection. \"It's as if you're driving a stick shift,\" says Judith Hall, a psychologist at Northeastem University, \"and if you start thinking about it too much, you can't remember what you're doing. But if you go on automatic pilot, you're fine. Much of our social life is like that.\" Thinking too much can also harm our ability to form preferences. College students'ratings of strawberry jams and college courses aligned better with experts' opinions when the students weren't asked to analyze their rationale. And people made car-buying decisions that were both objectively better and more personally satisfying when asked to focus on their feelings rather than on details, but only if the decision was complex-when they had a lot of information to process. Intuition's special powers are unleashed only in certain circumstances. In one study, participants completed a battery of eight tasks, including four that tapped reflective thinking ( discerning rules, comprehending vocabulary) and four that tapped intuition and creativity (generating new products or figures of speech). Then they rated the degree to which they had used intuition (\" gut feelings,\" \"hunches,\" \"my heart\"). Use of their gut hurt their performance on the first four tasks, as expected, and helped them on the rest. Sometimes the heart is smarter than the head."],"questions":[{"num":36,"stem":"Nalini Ambady's study deals with ___","opts":{"A":"the power of people's memory","B":"the reliability of first impressions","C":"instructor-student interaction","D":"people's ability to influence others"},"answer":"B","analysis":"【AI 解析】答案 [B]「the reliability of first impressions」。本题考查「Nalini Ambady's study deals with ___」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"In Ambady's study, rating accuracy dropped when participants ___","opts":{"A":"focused on specific details","B":"gave the rating in limited time","C":"watched shorter video clips","D":"discussed with one another"},"answer":"A","analysis":"【AI 解析】答案 [A]「focused on specific details」。本题考查「In Ambady's study, rating accuracy dropp…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"Judith Hall mentions driving to show that ___","opts":{"A":"reflection can be distracting","B":"memory may be selective","C":"social skills must be cultivated","D":"deception is difficult to detect"},"answer":"A","analysis":"【AI 解析】答案 [A]「reflection can be distracting」。本题考查「Judith Hall mentions driving to show tha…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"When you are making complex decisions, it is advisable to ___","opts":{"A":"collect enough data","B":"list your preferences","C":"seek expert advice","D":"follow your feelings"},"answer":"D","analysis":"【AI 解析】答案 [D]「follow your feelings」。本题考查「When you are making complex decisions, i…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"What can we learn from the last paragraph?","opts":{"A":"Generating new products takes time.","B":"Intuition may affect reflective tasks.","C":"Vocabulary comprehension needs creativity.","D":"Objective thinking may boost intuitiveness."},"answer":"B","analysis":"【AI 解析】答案 [B]「Intuition may affect reflective tasks.」。本题考查「What can we learn from the last paragrap…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by choosing the most suitable subheading from the list A -G for each numbered paragraph ( 41 - 45 ). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)"],"options":[{"key":"A","text":"Stay calm."},{"key":"B","text":"Stay humble."},{"key":"C","text":"Decide whether to wait."},{"key":"D","text":"Be realistic about the risks."},{"key":"E","text":"Don't make judgements."},{"key":"F","text":"Identify a shared goal."},{"key":"G","text":"Ask permission to disagree."}],"passage":["- **A.** Stay calm. - **B.** Stay humble. - **C.** Decide whether to wait. - **D.** Be realistic about the risks. - **E.** Don't make judgements. - **F.** Identify a shared goal. - **G.** Ask permission to disagree. How to disagree with someone more powerful than you Your boss proposes a new initiative you think won't work. Your senior colleague outlines a project timeline you believe is unrealistic. What do you say when you disagree with someone who has more power than you do? How do you decide whether it's worth speaking up? And if you do, what exactly should you say? Here's how to disagree with someone more powerful than you."],"questions":[{"num":41,"stem":"You may decide it's best to hold off on voicing your opinion. Maybe you haven't finished thinking the problem through, or you want to get a clearer sense of what the group thinks. If you think other people are going to disagree, too, you might want to gather your army first. People can contribute experience or information to your thinking-all the things that would make the disagreement stronger or more valid. It's also a good idea to delay the conversation if you are in a meeting or other public space. Discussing the issue in private will make the powerful person feel less threatened.","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「Decide whether to wait.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"},{"num":42,"stem":"Before you share your thoughts, think about what the powerful person cares about-it may be the credibility of their team or getting a project done on time. You're more likely to be heard if you can connect your disagreement to a higher purpose. When you do speak up, don't assume the link will be clear. You'll want to state it overtly, contextualizing your statements so that you're seen not as a disagreeable subordinate but as a colleague who's trying to advance a common objective. The discussion will then become more like a chess game than a boxing match.","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]「Identify a shared goal.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [F]。"},{"num":43,"stem":"This step may sound overly deferential, but it's a smart way to give the powerful person psychological safety and control. You can say something like, \"I know we seem to be moving toward a first-quarter commitment here. I have reasons to think that won't work. I'd like to lay out my reasoning. Would that be OK?\" This gives the person a choice, allowing him to verbally opt in. And, assuming he says yes, it will make you feel more confident about voicing your disagreement.","opts":{},"answer":"G","analysis":"【AI 解析】答案 [G]「Ask permission to disagree.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [G]。"},{"num":44,"stem":"You might feel your heart racing or your face turning red, but do whatever you can to remain neutral in both your words and actions. When your body language communicates reluctance or anxiety, it undercuts the message. It sends a mixed message, and your counterpart gets to choose what signals to read. Deep breaths can help, as can speaking more slowly and deliberately. When we feel panicky, we tend to talk louder and faster. Simply slowing the pace and talking in an even tone helps the other person cool down and does the same for you. It also makes you seem confident, even if you aren't.","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「Stay calm.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":45,"stem":"Emphasize that you're only offering your opinion, not gospel truth. It may be a well-informed, well-researched opinion, but it's still an opinion, so talk tentatively and slightly understate your confidence. Instead of saying: \"If we set an end-of-quarter deadline, we will never make it,\" say, \"This is just my opinion, but I don't see how we will make that deadline.\" Having asserted your opinion (as a position, not as a fact), demonstrate equal curiosity about other views. Remind the person that this is your point of view, and then invite critique. Be open to hearing other opinions.","opts":{},"answer":"B","analysis":"【AI 解析】答案 [B]「Stay humble.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [B]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points) We tend to think that friends and family members are our biggest sources of connection, laughter, and warmth. While that may well be true, researchers have also recently found that interacting with strangers actually brings a boost in mood and feelings of belonging that we didn't expect. In one series of studies, researchers instructed Chicago-area commuters usmg public transportation to strike up a conversation with someone near them. On average, participants who followed this instruction felt better than those who had been told to stand or sit in silence. The researchers also argued that when we shy away from casual interactions with strangers, it is often due to a misplaced anxiety that they might not want to talk to us. Much of the time, however, this belief is false. As it turns out, many people are actually perfectly willing to talk-and may even be flattered to receive your attention. ## Section IV Writing ## Part A"],"reference":"我们往往认为，朋友和家人是我们获得联系、欢笑和温暖的最大源泉。尽管这很可能是对的，研究人员最近还发现，与陌生人交谈实际上能带来意想不到的情绪提升和归属感。在一系列研究中，研究人员让芝加哥地区乘坐公共交通出行的通勤者与身边的陌生人攀谈。平均而言，照做的人比那些被要求沉默站立或静坐的人感觉更好。研究人员还指出，我们回避与陌生人的随意交流，往往是出于一种错误的担忧——担心对方不想和我们说话。而事实上，这种想法在很多时候是错的。结果表明，许多人其实非常愿意交谈，甚至可能因为得到你的关注而感到高兴。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["Suppose you are organizing an online meeting. Write an email to Jack, an international student, to 1) invite him to participate, and 2) tell him the details. You should write about 100 words on the ANSWER SHEET. Do not use your own name. Use \"Li Ming\" instead. (10 points)"],"large":["**48.** Directions : Write an essay based on the chart below. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points)","**某市居民锻炼方式调查**","| 独自锻炼 | 和朋友一起 | 和家人一起 | 团体活动 | |---|---|---|---| | 54.3% | 47.7% | 23.9% | 15.8% |"],"small_ref":"Dear Jack,\n\nI am writing to invite you to an online meeting organized by our International Culture Club, which will be held via Tencent Meeting at 3 p.m. this Saturday and last about two hours.\n\nThe meeting aims to help Chinese and international students know each other better. At the meeting, participants will introduce their hometowns, share campus life experiences and discuss plans for future exchange activities. You are welcome to talk about British culture, which I believe will greatly interest everyone.\n\nPlease let me know by Friday whether you can join, and I will send you the meeting ID and password. We sincerely look forward to your participation.\n\nYours,\nLi Ming","large_ref":"The chart presents the ways residents in a city take physical exercise. Exercising alone is the most popular choice, accounting for 54.3%, followed by exercising with friends at 47.7%, with family members at 23.9% and group activities at 15.8%.\n\nThe preference for exercising alone is understandable. Modern people live at different paces, and running, jogging or working out alone offers flexibility in time and place, freeing people from coordinating with others. However, the low proportion of family and group exercise is somewhat worrying, because joint exercise not only builds bodies but also strengthens emotional bonds.\n\nTherefore, while keeping personal exercise habits, people are encouraged to invite family members or friends to work out together. Communities and employers could also organize more group sports, which would improve public health and, at the same time, promote interpersonal communication."},"label":"2021 年真题（AI 解析）"};

d for the land, the hens, and the eggs that we supply to our customers.\" The egg industry's push is the first major test of whether animal products from regenerative farms can become the next premium offering. In barely more than a decade, organic eggs went from being dismissed as a niche product in natural foods stores to being sold at Walmart. More recently there were similar doubts about probiotics and plant-based meats, but both have exploded into major supermarket categories. If the sustainable-egg rollout is successful, it could open the floodgates for regenerative beef, broccoli, and beyond. Regenerative products could be a hard sell, because the concept is tough to define quickly, says Julie Stanton, associate professor of agricultoal economics at Pennsylvania State University Brandywine. Such farming also brings minimal, if any, improvement to the food products (though some producers say their eggs have more protein). The industry is betting that the same consumers paying more for premium attributes such as free-range, non-GMO, and pasture-raised eggs will embrace sustainability. Surveys show that younger generations are more concerned about climate change, and some of the success of plant-based meat can be chalked up to shoppers wanting to signal their desire to protect the environment. Young adults “really care about the planet,“ says John Brunnquell, president of Egg Innovations. \" They are absolutely altering the food chain beyond what I think even they understand what they're doing.\""],"questions":[{"num":21,"stem":"The climate-friendly eggs are produced ___","opts":{"A":"ata considerably low cost.","B":"at the demand of regular shoppers.","C":"as a replacement for organic eggs.","D":"on specially designed farms."},"answer":"D","analysis":"【AI 解析】答案 [D]「on specially designed farms.」。本题考查「The climate-friendly eggs are produced _…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"Larry Brown is excited about his progress in ___","opts":{"A":"reducing the damage of worms.","B":"accelerating the disposal of waste.","C":"creating a sustainable system.","D":"attracting customers to his products."},"answer":"C","analysis":"【AI 解析】答案 [C]「creating a sustainable system.」。本题考查「Larry Brown is excited about his progres…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":23,"stem":"The example of organic eggs is used in Paragraph 4 to suggest ___","opts":{"A":"the doubts over natural feeds.","B":"the setbacks in the egg industry.","C":"the potential of regenerative products.","D":"the promotional success of supermarkets."},"answer":"C","analysis":"【AI 解析】答案 [C]「the potential of regenerative products.」。本题考查「The example of organic eggs is used in P…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":24,"stem":"It can be learned from the last paragraph that young people ___","opts":{"A":"are reluctant to change their diet.","B":"are likely to buy climate-friendly eggs.","C":"are curious about new food.","D":"are amazed at agriculture advances."},"answer":"B","analysis":"【AI 解析】答案 [B]「are likely to buy climate-friendly eggs.」。本题考查「It can be learned from the last paragrap…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":25,"stem":"John Brunnquell would disagree with Julie Stanton over regenerative products’ ___","opts":{"A":"market prospects.","B":"standard definition.","C":"nutritional value.","D":"moral implication."},"answer":"A","analysis":"【AI 解析】答案 [A]「market prospects.」。本题考查「John Brunnquell would disagree with Juli…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["More Americans are opting to work well into retirement, a growing trend that threatens to upend the old workforce model. One in three Americans who are at least 40 have, or plan to have a job in retirement to prepare for a longer life, according to a survey conducted by Harris Poll for TD Ameritrade. Even more surprising is that more than half of “unretirees”- those who plan to work in retirement or went back to work after retiring- said they would be employed in their later years even if they had enough money to settle down, the survey showed. Financial needs aren't the only culprit for the “unretirement“ trend. Other reasons, according to the study, include personal fulfillment such as staying mentally fit, preventing boredom or avoiding depression. “The concept of retirement is evolving,said Christine Russell, senior manager of retirement at TD Ameritrade. \"It's not just about finances. The value of work is also driving folks to continue working past retirement. One reason for the change in retirement patterns: Americans are living longer. Older Americans are also the fastest-growing segment of the U.S. workforce. The percentage of retirement-age people in the labor force has doubled over the past three decades. About 20% of people 65 and older were in the workforce in February 2019, up from an all-time low of 10% in January 1985, according to money manager United Income. Because of longer life spans, Americans are also boosting their savings to preserve their nest eggs, the TD Ameritrade study showed, which surveyed 2,000 adults between 40 to 79. Six in 10 \"unretirees“ are increasing their savings in anticipation of a longer life. Among the most popular ways they are doing this, the company said, is by reducing their overall expenses, securing life insurance or maximizing their contributions to retirement accounts. Unfortunately, many people who are opting to work in retirement are preparing to do so because they are worried about making ends meet in their later years, said Brent Weiss, a co-founder at Baltimore-based financial-planning firm Facet Wealth. He suggested that preretirees should speak with a financial adviser to set long-term financial goals. “The most challenging moments in life are getting married, starting a family and fraid.","C":"disappointed.","D":"enthusiastic."},"answer":"A","analysis":"【AI 解析】答案 [A]「unprepared.」。本题考查「With regard to retirement, Brent Weiss t…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["We have all encountered them, in both our personal and professional lives. Think about the times you felt tricked or fhistrated by a membership or subscription that had a seamless sign-up process but was later difficult to cancel. Something that should be simple and transparent can be complicated, intentionally or unintentionally, in ways that impair consumer choice. These are examples of dark patterns. First coined in 2010 by user experience expert Harry Brignull, \"'dark patterns” is a catch-all term for practices that manipulate user interfaces to influence the decision making ability of users. Brignull identifies 12 types of common dark patterns, ranging from misdirection and hidden costs to \"roach motel,“ where a user experience seems easy and intuitive at the start, but turns difficult when the user tries to get out. In a 2019 study of 53,000 product pages and 11,000 websites, researchers found that about one in 10 employs these design practices. Though widely prevalent, the concept of dark patterns is still not well understood. Business and nonprofit leaders should be aware of dark patterns and try to avoid the gray areas they engender. Where is the line between ethical, persuasive design and dark patterns? Businesses should engage in conversations with IT, compliance, risk, and legal teams to review their privacy policy, and include in the discussion the customer/user experience designers and coders responsible for the company's user interface, as well as the marketers and advertisers responsible for sign-ups, checkout baskets, pricing, and promotions. Any or all these teams can play a role in creating or avoiding \"digital deception. Lawmakers and regulators are slowly starting to address the ambiguity around dark patterns, most recently at the state level. In March, the California Attorney General announced the approval of additional regulations under the California Consumer Privacy Act (CCPA) that \"ensure that consumers will not be confused or misled when seeking to exercise their data privacy rights.\" The regulations aim to ban dark patterns- this means prohibiting companies from using confusing language or unnecessary steps such as forcing them to click through multiple screens or listen to reasons why they shouldn't opt out.” As more states consider promulgating additional regulations, there is a need for greater accountability from within the business community. Dark patterns also can be addressed on a self-regulatory basis, but only if organizations hold themselves accountable, not just to legal requirements but also to industry best practices and standards."],"questions":[{"num":31,"stem":"It can be learned from the first two paragraphs that dark patterns ___","opts":{"A":"improve user experiences","B":"leak user information for profit","C":"undermine users’ decision-making","D":"remind users of hidden costs"},"answer":"C","analysis":"【AI 解析】答案 [C]「undermine users’ decision-making」。本题考查「It can be learned from the first two par…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"The 2019 study on dark patterns is mentioned to show ___","opts":{"A":"their major flaws","B":"their complex designs","C":"their severe damage","D":"their strong presence"},"answer":"D","analysis":"【AI 解析】答案 [D]「their strong presence」。本题考查「The 2019 study on dark patterns is menti…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"To handle digital deception, businesses should ___","opts":{"A":"listen to customer feedback","B":"talk with relevant teams","C":"turn to independent agencies","D":"rely on professional training"},"answer":"B","analysis":"【AI 解析】答案 [B]「talk with relevant teams」。本题考查「To handle digital deception, businesses …」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"The additional regulations under the CCPA are intended to ___","opts":{"A":"guide users through opt-out processes","B":"protect consumers from being tricked","C":"grant companies data privacy rights","D":"restrict access to problematic content"},"answer":"B","analysis":"【AI 解析】答案 [B]「protect consumers from being tricked」。本题考查「The additional regulations under the CCP…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"According to the last paragraph, a key to coping with dark patterns is ___","opts":{"A":"new legal requirements","B":"businesses, self-discipline","C":"strict regulatory standards","D":"consumers’ safety awareness"},"answer":"B","analysis":"【AI 解析】答案 [B]「businesses, self-discipline」。本题考查「According to the last paragraph, a key t…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Although ethics classes are common around the world, scientists are unsure if their lessons can actually change behavior; evidence either way is weak, relying on contrived laboratory tests or sometimes unreliable self-reports. But a new study published in Cognition found that, in at least one real-world situation, a single ethics lesson may have had lasting effects. The researchers investigated one class session's impact on eating meat. They chose this particular behavior for three reasons, according to study co-author Eric Schwitzgebel, a philosopher at the University of California, Riverside: students’ attitudes on the topic are variable and unstable, behavior is easily measurable, and ethics literature largely agrees that eating less meat is good because it reduces environmental harm and animal suffering. Half of the students in four large philosophy classes read an article on the ethics of factory-farmed meat, optionally watched an 11-minute video on the topic and joined a 5O-minute discussion. The other half focused on charitable giving instead. Then, unknown to the students, the researchers studied their anonymized meal-card purchases for that semester- nearly 14,000 receipts for almost 500 students. Schwitzgebel predicted the intervention would have no effect; he had previously found that ethics professors do not differ from other professors on a range of behaviors, including voting rates, blood donation and returning library books. But among student subjects who discussed meat ethics, meal purchases containing meat decreased from 52 to 45 percent- and this effect held steady for the study's duration of several weeks. Purchases from the other group remained at 52 percent. “That's actually a pretty large effect for a pretty small intervention,Schwitzgebel says. Psychologist Nina Strohminger at the University of Pennsylvania, who was not involved in the study, says she wants the effect to be real but cannot rule out some unknown confounding variable. And if real, she notes, it might be reversible by another nudge: \"Easy come, easy go.” Schwitzgebel suspects the greatest impact came from social influence-classmates or teaching assistants leading the discussions may have shared their own vegetarianism, showing it as achievable or more common. Second, the video may have had an emotional impact. Least rousing, he thinks, was rational argument, although his co authors say reason might play a bigger role. Now the researchers are probing the specific effects of teaching style, teaching assistants’ eating habits and students’ video exposure. Meanwhile, Schwitzgebel- who had predicted no effect- will be eating his words."],"questions":[{"num":36,"stem":"Scientists generally believe that the effects of ethics classes are ___","opts":{"A":"hard to determine.","B":"narrowly interpreted.","C":"difficult to ignore.","D":"poorly summarized."},"answer":"A","analysis":"【AI 解析】答案 [A]「hard to determine.」。本题考查「Scientists generally believe that the ef…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"Which of the following is a reason for the researchers to study meat eating?","opts":{"A":"It is common among students.","B":"It is a behavior easy to measure.","C":"It is important to students5 health.","D":"It is a hot topic in ethics classes."},"answer":"B","analysis":"【AI 解析】答案 [B]「It is a behavior easy to measure.」。本题考查「Which of the following is a reason for t…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"Eric Schwitzgebefs previous findings suggest that ethics professors ___","opts":{"A":"are seldom critical of their students.","B":"are less sociable than other professors.","C":"are not sensitive to political issues.","D":"are not necessarily ethically better."},"answer":"D","analysis":"【AI 解析】答案 [D]「are not necessarily ethically better.」。本题考查「Eric Schwitzgebefs previous findings sug…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"Nina Strohminger thinks that the effect of the intervention is ___","opts":{"A":"permanent.","B":"predictable.","C":"uncertain.","D":"unrepeatable."},"answer":"C","analysis":"【AI 解析】答案 [C]「uncertain.」。本题考查「Nina Strohminger thinks that the effect …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"Eric Schwitzgebel suspects that the students’ change in behavior ___","opts":{"A":"can bring psychological benefits.","B":"can be analyzed statistically.","C":"is a result of multiple factors.","D":"is a sign of self-development."},"answer":"C","analysis":"【AI 解析】答案 [C]「is a result of multiple factors.」。本题考查「Eric Schwitzgebel suspects that the stud…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by choosing the most suitable subheading from the list A -G for each numbered paragraph (41 - 45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)"],"options":[{"key":"A","text":"Make it a Habit."},{"key":"B","text":"Don't go It alone."},{"key":"C","text":"Start low, go Slow."},{"key":"D","text":"Talk With Your doctor."},{"key":"E","text":"Listen to Your Body."},{"key":"F","text":"GO through the motions."},{"key":"G","text":"Round out your routine."}],"passage":["- **A.** Make it a Habit. - **B.** Don't go It alone. - **C.** Start low, go Slow. - **D.** Talk With Your doctor. - **E.** Listen to Your Body. - **F.** GO through the motions. - **G.** Round out your routine. How to Get Active Again Getting back into exercise after a break can be a challenge in the best of times, but with gyms and in-person exercise classes off-limits to many people these days, it can be tricky to know where to start. And ifs important to get the right dose of activity. <cToo much too soon either results in injury or burnout,“ says Mary Yoke, PhD, a faculty member in the kinesiology department at Indiana University in Bloomington. The following simple strategies will help you return to exercise safely after a break."],"questions":[{"num":41,"stem":"___________________________ Don't try to go back to what you were doing before your break. If you were walking 3 miles a day, playing 18 holes of golf three times a week, or lifting 10-pound dumbbells for three sets of 10 reps, reduce activity to half a mile every other day, or nine holes of golf once a week with short walks on other days, or use 5-pound dumbbells for one set of 10 reps. Increase time, distance, and intensity gradually. \"This isn't something you can do overnight,“ says Keri L. Denay, MD, lead author of a recent American College of Sports Medicine advisory that encourages Americans to not overlook the benefits of activity during the pandemic. But you'll reap benefits such as less anxiety and improve sleep right away.","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「Start low, go Slow.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"},{"num":42,"stem":"___________________________ If you're breathing too hard to talk in complete sentences, back off. If you feel good, go a little longer or faster. Feeling wiped out after a session? Go easier next time. And stay alert to serious symptoms, such as chest pain or pressure, severe shortness of breath or dizziness, or faintness, and seek medical attention immediately.","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「Listen to Your Body.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"},{"num":43,"stem":"___________________________ Consistency is the key to getting stronger and building endurance and stamina. Ten minutes of activity per day is a good start, says Marcus Jackovitz, DPT, a physical therapist at the University of Miami Hospital. All the experts we spoke with highly recommend walking because ifs the easiest, most accessible form of exercise. Althoughit can be a workout on its own, if your goal is to get back to Zumba classes, tennis, cycling, or any other activity, walking is also a great first step.","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「Make it a Habit.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":44,"stem":"___________________________ Even if you can't yet do a favorite activity, you can practice the moves. With or without a club or racket, swing like you're hitting the ball. Paddle like you're in a kayak or canoe. Mimic your favorite swimming strokes. The action will remind you of the joy the activity brought you and prime your muscles for when you can get out there again.","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]「GO through the motions.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [F]。"},{"num":45,"stem":"___________________________ Exercising with others “can keep you accountable and make it more fun, so you’re more likely to do it again,“ Jackovitz says. You can do activities such as golf and tennis or take a walk with others and still be socially distant. But when you can't connect in person, consider using technology. Chat on the phone with a friend while you walk around your neighborhood. FaceTime with a relative as you strength train or stretch at home. You can also join a livestream or on-demand exercise class.","opts":{},"answer":"B","analysis":"【AI 解析】答案 [B]「Don't go It alone.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [B]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points) Although we try our best, sometimes our paintings rarely turn out as originally planned. Changes in the light, the limitations of your painting materials, and the lack of experience and technique mean that what you start out trying to achieve may not come to life the way that you expected. Although this can be fhistrating and disappointing, it turns out that this can actually be good for you. Unexpected results have two benefits: you pretty quickly learn to deal with disappointment and realise that when one door closes, another opens. You also quickly learn to adapt and come up with creative solutions to the problems the painting presents, and thinking outside the box will become your second nature. In fact, creative problem-solving skills are incredibly useful in daily life, with which you’re more likely to be able to find a solution when a problem arises."],"reference":"尽管我们全力以赴，画作通常很少能完全达到最初的构想。光线的变化、绘画材料的局限，以及经验和技法的不足，都意味着你起初想要达到的效果未必能如预期般呈现。虽然这可能令人懊恼和失望，但事实证明这其实对你有益。意想不到的结果有两大好处：你会很快学会应对失望，并意识到当一扇门关闭时，另一扇门会打开；你还会迅速学会随机应变，为绘画中出现的问题想出创造性的解决办法，而打破常规思考将成为你的第二天性。事实上，创造性解决问题的能力在日常生活中极其有用，有了它，当问题出现时你更有可能找到解决之道。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose you are planning a campus food festival. Write an email to the international students in your university to 1) introduce the food festival, and 2) invite them to participate. You should write about 100 words on the ANSWER SHEET. Do not use your own name. Use \"Li Ming” instead. (10 points)"],"large":["**48.** Directions: Write an essay based on the following chart. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points) **2018~2020 年我国快递业务量变动情况**（单位：十亿件）","| 年份 | 总体 | 农村 | |---|---|---| | 2018 年 | 51 | 12 | | 2019 年 | 64 | 15 | | 2020 年 | 83 | 30 |"],"small_ref":"Dear international students,\n\nI am writing to introduce the Campus Food Festival to be held on the playground of our university from May 20 to May 22, and to invite you to take part in it.\n\nThe festival will feature food stalls from different provinces of China, where you can taste various local dishes, from Sichuan hot pot to Cantonese dim sum. Besides eating, there will be cooking demonstrations, food culture exhibitions and interesting games with prizes.\n\nAs the festival aims to promote cultural exchange, your participation will make it more colorful: you are welcome to set up a stall presenting food from your own countries. Please sign up at the Students' Union office before May 15.\n\nWe are looking forward to seeing you there.\n\nYours,\nLi Ming","large_ref":"The chart illustrates the volume of express delivery business in China from 2018 to 2020. The total volume grew steadily from 51 billion parcels in 2018 to 64 billion in 2019 and reached 83 billion in 2020. More strikingly, rural deliveries jumped from 12 billion to 30 billion, more than doubling within two years.\n\nTwo trends stand out in the data. First, the rapid growth of e-commerce, reinforced by the pandemic, has made online shopping an essential part of daily life. Second, the explosive increase in rural areas reflects the improvement of rural infrastructure and the expansion of e-commerce platforms into the countryside, which helps farmers sell their products nationwide.\n\nThe flourishing delivery industry brings convenience and employment opportunities, but it also raises concerns about packaging waste. Therefore, while enjoying the service, both companies and consumers should promote greener packaging to achieve sustainable development."},"label":"2022 年真题（AI 解析）"};
