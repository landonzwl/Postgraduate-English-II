window.QUIZ_DATA[2025] = {"year":2025,"cloze":{"directions":["**Directions:** Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)"],"passage":["There are many understandable reasons why you might find it difficult to ask for help when you need it. Psychologists have been interested in this ___1___ for decades, not least because people's widespread ___2___ to ask for help has led to some high-profile failures.","Asking for help takes ___3___. It involves communicating a need on your part—there's something you can't do. ___4___, you're broadcasting your own weaknesses, which can be ___5___. You might worry about coming across as incompetent. You might have ___6___ about losing control of whatever it is you're asking for help with. ___7___ someone starts to help, perhaps they'll take over, or get credit for your earlier efforts. Yet another ___8___ that might be worried about is being a nuisance or ___9___ the person you go to for help.","If you struggle with low self-esteem, you might find it especially difficult to ___10___ for help because you have the added worry of the other person ___11___ your request. You might see such refusals as implying something ___12___ about the status of your relationship with them. To ___13___ these difficulties, try to remind yourself that everyone needs help sometimes. Nobody knows everything and can do everything all by themselves. And while you might ___14___ coming across as incompetent, there's actually research that shows that advice-seekers are ___15___ as more competent, not less.","Perhaps most encouraging of all is a paper from 2022 by researchers at Stanford University, in California, that involved a mix of contrived help-seeking interactions and asking people to ___16___ times they'd sought help in the past. The findings showed that help-seekers generally underestimate how ___17___ other people will be to help and how good it'll make the help-giver feel (for most people, having the chance to help someone is highly ___18___).","So, bear all this in mind the next time you need to ask for help. ___19___, take care over who you ask and when you ask them. And if someone can't help right now, avoid taking it personally. They might just be too ___20___, or they might not feel confident about their ability to help."],"questions":[{"num":1,"stem":"","opts":{"A":"illusion","B":"discussion","C":"tradition","D":"question"},"answer":"D","analysis":"question**\n考点：名词辨析。\n解析：首句提出\"为何难以求助\"，本句说心理学家对**这一问题**（this question）研究了数十年，question 指代前述问题。"},{"num":2,"stem":"","opts":{"A":"reluctance","B":"ambition","C":"tendency","D":"enthusiasm"},"answer":"A","analysis":"reluctance**\n考点：名词辨析。\n解析：\"people's widespread ___ to ask for help has led to some high-profile failures\"——普遍**不愿**求助已导致一些引人瞩目的事故，reluctance to do（不愿做）为固定搭配，与\"难以开口求助\"呼应。"},{"num":3,"stem":"","opts":{"A":"attention","B":"talent","C":"courage","D":"patience"},"answer":"C","analysis":"courage**\n考点：名词辨析。\n解析：\"Asking for help takes ___\"——求助需要**勇气**，take courage（需要勇气）为固定表达，与下文\"暴露弱点令人不适\"呼应。"},{"num":4,"stem":"","opts":{"A":"At any time","B":"In other words","C":"By all means","D":"On the contrary"},"answer":"B","analysis":"In other words**\n考点：插入语辨析。\n解析：\"It involves communicating a need on your part—there's something you can't do. ___, you're broadcasting your own weaknesses\"——**换句话说**，你是在公开自己的弱点，In other words（换言之）复述上句。"},{"num":5,"stem":"","opts":{"A":"unrealistic","B":"deceptive","C":"tiresome","D":"uncomfortable"},"answer":"D","analysis":"uncomfortable**\n考点：形容词辨析。\n解析：\"you're broadcasting your own weaknesses, which can be ___\"——公开弱点会令人**不适**（不体面），uncomfortable 与\"担心显得无能\"的心理描写一致。"},{"num":6,"stem":"","opts":{"A":"doubts","B":"concerns","C":"suggestions","D":"secrets"},"answer":"B","analysis":"concerns**\n考点：名词辨析。\n解析：\"You might have ___ about losing control of whatever it is you're asking for help with.\"——担心对所求之事**失去掌控**，have concerns about（对……有担忧）为固定搭配。"},{"num":7,"stem":"","opts":{"A":"Once","B":"Unless","C":"Although","D":"Before"},"answer":"A","analysis":"Once**\n考点：连词。\n解析：\"___ someone starts to help, perhaps they'll take over\"——**一旦**有人开始帮忙，或许他们会接管一切，Once（一旦）引导条件句。"},{"num":8,"stem":"","opts":{"A":"theory","B":"choice","C":"factor","D":"context"},"answer":"C","analysis":"factor**\n考点：名词辨析。\n解析：\"Yet another ___ that might be worried about is being a nuisance\"——还有一个**因素**（担忧源）：怕添麻烦，factor 与前文列举的种种顾虑并列。"},{"num":9,"stem":"","opts":{"A":"overpraising","B":"outperforming","C":"reassessing","D":"inconveniencing"},"answer":"D","analysis":"inconveniencing**\n考点：动词辨析。\n解析：\"being a nuisance or ___ the person you go to for help\"——成为讨厌的人或给对方**添麻烦**，inconvenience sb（给某人带来不便）与 nuisance 同义递进。"},{"num":10,"stem":"","opts":{"A":"reach out","B":"settle down","C":"turn over","D":"look back"},"answer":"A","analysis":"reach out**\n考点：短语动词辨析。\n解析：\"you might find it especially difficult to ___ for help\"——**求助**（reach out for help），reach out（伸手求助）为固定搭配。"},{"num":11,"stem":"","opts":{"A":"declining","B":"considering","C":"criticizing","D":"evaluating"},"answer":"A","analysis":"declining**\n考点：动名词辨析。\n解析：\"the added worry of the other person ___ your request\"——还担心对方**拒绝**自己的请求，decline（拒绝）与下文 \"such refusals\" 呼应。"},{"num":12,"stem":"","opts":{"A":"unnecessary","B":"negative","C":"strange","D":"impractical"},"answer":"B","analysis":"negative**\n考点：形容词辨析。\n解析：\"You might see such refusals as implying something ___ about the status of your relationship\"——被拒会暗示你们的关系**不妙**，negative（负面的）与关系受损的解读一致。"},{"num":13,"stem":"","opts":{"A":"explain","B":"identify","C":"predict","D":"overcome"},"answer":"D","analysis":"overcome**\n考点：动词辨析。\n解析：\"To ___ these difficulties, try to remind yourself…\"——为**克服**这些困难，提醒自己人人需要帮助，overcome（克服）为固定搭配。"},{"num":14,"stem":"","opts":{"A":"deny","B":"forget","C":"miss","D":"fear"},"answer":"D","analysis":"fear**\n考点：动词辨析。\n解析：\"while you might ___ coming across as incompetent\"——尽管你可能**害怕**显得无能，fear 与首段 worry、concerns 的恐惧清单呼应。"},{"num":15,"stem":"","opts":{"A":"disguised","B":"perceived","C":"followed","D":"introduced"},"answer":"B","analysis":"perceived**\n考点：动词辨析。\n解析：\"advice-seekers are ___ as more competent, not less.\"——求助者反而**被认为**更有能力，be perceived as（被视为）为固定搭配。"},{"num":16,"stem":"","opts":{"A":"recall","B":"classify","C":"analyse","D":"compare"},"answer":"A","analysis":"recall**\n考点：动词辨析。\n解析：\"asking people to ___ times they'd sought help in the past\"——请受访者**回忆**过去求助的经历，recall（回想）与\"回顾性调查\"呼应。"},{"num":17,"stem":"","opts":{"A":"brave","B":"disapproving","C":"willing","D":"hesitant"},"answer":"C","analysis":"willing**\n考点：形容词辨析。\n解析：\"help-seekers generally underestimate how ___ other people will be to help\"——求助者普遍低估他人**愿意**帮忙的程度，willing to do（愿意做）为固定搭配。"},{"num":18,"stem":"","opts":{"A":"relaxing","B":"surprising","C":"rewarding","D":"demanding"},"answer":"C","analysis":"rewarding**\n考点：形容词辨析。\n解析：\"having the chance to help someone is highly ___\"——有机会帮人**非常有成就感**（帮人者乐在其中），rewarding（有回报的、令人满足的）正确。"},{"num":19,"stem":"","opts":{"A":"Thus","B":"Also","C":"Finally","D":"Instead"},"answer":"B","analysis":"考点：逻辑衔接。\n解析：末段三条建议：\"bear all this in mind…___, take care over who you ask and when you ask them. And if someone can't help right now…\"——第二条建议以 **Also**（另外）引出（Finally 则意味着是最后一条，与后文 And 建议矛盾）。"},{"num":20,"stem":"","opts":{"A":"polite","B":"proud","C":"busy","D":"lazy"},"answer":"C","analysis":"busy**\n考点：形容词辨析。\n解析：\"if someone can't help right now…They might just be too ___\"——别人帮不上忙时别多想，或许对方只是**太忙**，busy 与\"此刻帮不了\"呼应。"}],"analysisBlob":""},"reading":[{"title":"","passage":["U.S. customers historically tipped people they assumed were earning most of their income via tips, such as restaurant servers earning less than the minimum wage. In the early 2010s, a wide range of businesses started processing purchases with iPads and other digital payment systems. These systems often prompted customers to tip for services that were not previously tipped.","Today's tip requests are often not connected to the salary and service norms that used to determine when and how people tip. Customers in the past nearly always paid tips after receiving a service, such as at the conclusion of a restaurant meal, after getting a haircut or once a pizza was delivered. That timing could reward high-quality service and give workers an incentive to provide it.","It's becoming more common for tips to be requested beforehand. And new tipping technology may even automatically add tips.","The prevalence of digital payment devices has made it easier to ask customers for a tip. That helps explain why tip requests are creeping into new kinds of services. Customers now routinely see menus of suggested default options—often well above 20% of what they owe. The amounts have risen from 10% or less in the 1950s to 15% around the year 2000 to 20% or higher today. This increase is sometimes called tipflation—the expectation of ever-higher tip amounts.","Tipping has always been a vital source of income for workers in historically tipped services, like restaurants, where the tipped minimum wage can be as low as US$2.13 an hour. Tip creep and tipflation are now further supplementing the income of many low-wage service workers.","Notably, tipping primarily benefits some of these workers, such as waiters, but not others, such as cooks and dishwashers. To ensure that all employees were paid fair wages, some restaurants banned tipping and increased prices, but this movement toward no-tipping services has largely fizzled out.","So, to increase employee wages without raising prices, more employers are succumbing to the temptations of tip creep and tipflation. However, many customers are frustrated because they feel they are being asked for too high of a tip, too often. And, as our research emphasizes, tipping now seems to be more coercive, less generous and often completely disassociated from service quality."],"questions":[{"num":21,"stem":"According to Paragraph 1, the practice of tipping in the U.S. ___.","opts":{"A":"was regarded as a sign of generosity","B":"was considered essential for waiters","C":"was a way of rewarding diligence","D":"was optional in most businesses"},"answer":"B","analysis":"**\n考点：细节理解。\n解析：首段：\"customers historically tipped people they assumed were **earning most of their income via tips**, such as restaurant servers earning less than the minimum wage.\"——小费给的是主要收入依赖小费的从业人员，即对小费收入者而言**不可或缺**（waiters 等靠它谋生），B 正确。A（慷慨标志）无据；C（奖励勤勉）是第二段服务后小费的机制；D 反了——过去许多服务\"not previously tipped\"。\n【AI 修正】无。"},{"num":22,"stem":"Compared with tips in the past, today's tips ___.","opts":{"A":"are paid much less frequently","B":"are less often requested in advance","C":"have less to do with service quality","D":"contribute less to workers' income"},"answer":"C","analysis":"**\n考点：细节比较。\n解析：末段：\"tipping now seems to be **more coercive, less generous and often completely disassociated from service quality**.\"＋第三段\"先索要、自动加小费\"——如今的小费与服务质量脱钩，即**与服务质量的关联变小**，C 正确。A 反了——tip creep 使索要小费的服务更多；B 反了——越来越常\"事先\"索要；D 无据——小费\"正在补充\"低收入者收入。\n【AI 修正】无。"},{"num":23,"stem":"Tip requests are creeping into new kinds of services as a result of ___.","opts":{"A":"the advancement of technology","B":"the desire for income increase","C":"the diversification of business","D":"the emergence of tipflation"},"answer":"A","analysis":"**\n考点：细节因果题。\n解析：\"The **prevalence of digital payment devices** has made it easier to ask customers for a tip. That helps explain why tip requests are **creeping into new kinds of services**.\"——数字支付设备普及使索要小费更容易，即**技术进步**推动小费渗透新服务，A 正确。B（增收愿望）无据；C（业态多元化）无据；D 曲解——tipflation 是小费比例上涨的现象，是小费蔓延的伴生结果而非原因。\n【AI 修正】无。"},{"num":24,"stem":"The movement toward no-tipping services was intended to ___.","opts":{"A":"promote consumption","B":"enrich income sources","C":"maintain reasonable prices","D":"guarantee income fairness"},"answer":"D","analysis":"**\n考点：细节理解。\n解析：\"Notably, tipping primarily benefits **some** of these workers, such as waiters, **but not others**, such as cooks and dishwashers. **To ensure that all employees were paid fair wages**, some restaurants banned tipping and increased prices\"——禁小费涨价格的运动为的是**让所有员工获得公平工资**（收入公平），D 正确。A（促进消费）、B（丰富收入来源）、C（维持合理价格）均无据——涨价格恰是其手段。\n【AI 修正】无。"},{"num":25,"stem":"It can be learned from the last paragraph that tipping ___.","opts":{"A":"is becoming a burden for customers","B":"helps encourage quality service","C":"is vital to business development","D":"reflects the need to reduce prices"},"answer":"A","analysis":"**\n考点：细节理解（末段）。\n解析：\"many customers are **frustrated** because they feel they are **being asked for too high of a tip, too often**…tipping now seems to be **more coercive, less generous**…\"——顾客对\"给得太多太频繁\"感到沮丧、感觉被强制——小费正成为顾客的**负担**，A 正确。B 反了——与服务质量脱钩；C（对商业发展至关重要）无据；D 曲解——\"without raising prices\"说的是雇主不涨价靠小费加薪，非\"小费反映降价需要\"。\n【AI 修正】无。\n\n### Text 2（重塑英国医疗）\n\n**文章脉络**：①NHS 创立时是远见之作（高质量及时医疗），75 年后面对完全不同的健康挑战——模式已过时 → ②落后于同行：680 万人排队、无力自费者就医日难；医疗成本挤出其他公共服务投入；人员濒临崩溃 → ③药方众所周知：削减分流需求、加大社区与初级保健投入、扩容社会照护 → ④但二十年策略与多次改革均未奏效——Reform 智库启动\"重塑健康\"计划（十位前卫生部长支持），呼吁就英国医疗的未来开展更开放诚实的对话、对\"以医院为中心\"的模式\"紧急反思\" → ⑤起点应是\"如何最大化国民健康\"而非\"修好 NHS\"：医疗仅占健康结果约 20%，更重要的是居住、工作、社交场所——却缺乏跨政府部门战略改善这些\"健康的社会决定因素\"；肥胖战略被废，纳税人背上糖尿病等疾病的治疗账单 → ⑥Reform 想问：权力与资源该如何分配——哪些职能留在中央，哪些下放给（负责创造健康的服务、更了解民众需求的）地方领导？"}],"overview":"","discourse":""},{"title":"","passage":["When it was established, the National Health Service (NHS) was visionary: offering high-quality, timely care to meet the dominant needs of the population it served. Nearly 75 years on, with the UK facing very different health challenges, it is clear that the model is out of date.","From life expectancy to cancer and infant mortality rates, we are lagging behind many of our peers. With more than 6.8 million on waitlists, healthcare is becoming increasingly inaccessible for those who cannot opt to pay for private treatment; and the cost of providing healthcare is increasingly squeezing out investment in other public services. As demand for healthcare continues to grow, pressures on the workforce—which is already near breaking point—will only become more acute.","Many of the answers to the crisis in health and care are well rehearsed. We need to be much better at reducing and diverting demand on health services, rather than simply managing it. Much more needs to be invested in communities and primary care to reduce our reliance on hospitals. And capacity in social care needs to be greater, to support the growing number of people living with long-term conditions.","Yet despite two decades of strategies and a number of major health reforms, we have failed to make meaningful progress on any of these aims. That is why the *Reform* think tank is launching a new programme of work entitled \"Reimagining health\", supported by ten former health ministers. Together, we are calling for a much more open and honest conversation about the future of health in the UK, and an \"urgent rethink\" of the hospital-centric model we retain.","This must begin with the question of how we maximise the health of the nation, rather than \"fix\" the NHS. It is estimated, for example, that healthcare accounts for only about 20% of health outcomes. Much more important are the places we live, work and socialise—yet there is no clear cross-government strategy for improving these social determinants of health. Worse, when policies like the national obesity strategy are scrapped, taxpayers are left with the heavy price tag of treating the illnesses, like diabetes, that result.","*Reform* wants to ask how power and resources should be distributed in our health system. What health functions should remain at the centre, and what should be given to local leaders, often responsible for services that create health, and with a much better understanding of the needs of their populations?"],"questions":[{"num":26,"stem":"According to the first two paragraphs, the NHS ___.","opts":{"A":"is troubled by funding deficiencies","B":"can hardly satisfy people's needs","C":"can barely retain its current employees","D":"is rivalled by private medical services"},"answer":"B","analysis":"**\n考点：细节理解（前两段）。\n解析：\"With more than 6.8 million on waitlists, healthcare is becoming **increasingly inaccessible** for those who cannot opt to pay for private treatment\"＋首段\"the model is **out of date**\"（NHS 为过去的主导需求而设）——NHS **难以满足民众需求**，B 正确。A（资金困境）偷换——\"cost squeezing out investment\"是财政挤占现象，非 NHS 自身\"缺钱\"的诊断；C（留不住员工）无据——是\"濒临崩溃\"的工作压力；D（受私立医疗挑战）无据——私立只是\"能付费者的选择\"。\n【AI 修正】无。"},{"num":27,"stem":"One answer to the crisis in health and care is to ___.","opts":{"A":"boost the efficiency of hospitals","B":"lighten the burden on social care","C":"increase resources for primary care","D":"reduce the pressure on communities"},"answer":"C","analysis":"**\n考点：细节理解。\n解析：\"Much more needs to be **invested in communities and primary care** to reduce our reliance on hospitals.\"——应加大社区与**初级保健**投入，C 正确。A（提升医院效率）反了——是减少对医院的依赖；B 曲解——社会照护是要\"扩容\"（capacity needs to be greater），非\"减负\"；D 曲解——是要向社区投入，不是\"减轻社区压力\"。\n【AI 修正】无。"},{"num":28,"stem":"\"Reimagining health\" is aimed to ___.","opts":{"A":"reinforce hospital management","B":"readjust healthcare regulations","C":"restructure the health system","D":"resume suspended health reforms"},"answer":"C","analysis":"**\n考点：细节理解。\n解析：\"Reform…launching a new programme…calling for…an 'urgent **rethink**' of the hospital-centric model we retain\"＋\"Reform wants to ask **how power and resources should be distributed** in our health system\"——重新思考以医院为中心的模式、重配权力资源，即**重构医疗体系**，C 正确。A（强化医院管理）反了——医院中心模式恰是反思对象；B（调整医疗法规）无据；D（恢复搁置的改革）无据——二十年改革未奏效，Reform 是要新思路。\n【AI 修正】无。"},{"num":29,"stem":"To maximise the nation's health, the author suggests ___.","opts":{"A":"introducing relevant taxation policies","B":"paying due attention to social factors","C":"reevaluating major health outcomes","D":"enhancing the quality of health care"},"answer":"B","analysis":"**\n考点：观点细节题。\n解析：\"This must begin with the question of how we maximise the health of the nation…healthcare accounts for only about 20% of health outcomes. **Much more important are the places we live, work and socialise**—yet there is no clear cross-government strategy for improving these **social determinants of health**.\"——最大化国民健康须重视居住/工作/社交场所等社会决定因素，即**重视社会因素**，B 正确。A（引入税收政策）无据；C（重新评估健康结果）偷换——20% 是论证数据，非\"重估\"；D（提升医疗质量）反了——重点在医疗之外的 determinant。\n【AI 修正】无。"},{"num":30,"stem":"It can be inferred that local leaders should ___.","opts":{"A":"exercise their power more reasonably","B":"develop a stronger sense of responsibility","C":"play a bigger role in the health system","D":"understand people's health needs better"},"answer":"C","analysis":"**\n考点：推断题。\n解析：\"What health functions should remain at the centre, and **what should be given to local leaders**, often responsible for services that create health, and with a much better understanding of the needs of their populations?\"——Reform 主张把部分职能下放给（负责创造健康服务、更懂民众需求的）地方领导，即地方领导应**在医疗体系中扮演更大角色**，C 正确。A（更合理用权）无据；B（增强责任感）无据；D 曲解——\"更了解民众需求\"是地方领导**已有的优势**（原文 with 短语），非\"应该更懂\"。\n【AI 修正】初始资料给 D \"understand people's health needs better\"：原文的 \"with a much better understanding\" 是地方领导已具备的优势（Reform 主张下放职能的理由），\"should understand better\" 与原文矛盾；由 Reform 的下放提议可推断地方领导应在体系中扮演更大角色，取 C。\n\n### Text 3（印度高温行动计划）\n\n**文章脉络**：①印度近年 HAP（高温行动计划）激增：规定何时如何发布高温预警、通知医院等机构（Nagpur：夏季设\"冷病房\"、酷暑日给建筑工人放假）→ ②但执行参差：资金不足；触发阈值未按本地气候定制（有的地方白天高温即可，有的地方夜间温度或湿度同样重要）→ ③孟买中暑死亡凸显\"更细致、更本地化\"预警之需：36°C 距沿海城市阈值仅差 1°C 未触发，但湿度放大了高温效应（预警系统常忽视）、清晨露天仪式无遮荫 → ④对策：Kotharkar 团队起草可本地化调整的\"最佳实践\"模型计划；所有城市应绘制\"脆弱性地图\"聚焦最脆弱人群 → ⑤地图不必复杂：看几个关键参数即可——老龄人口多的社区、不耐热的非正规居所可获特别预警或增设降温中心；Nagpur 已建风险地图，据此告知官员今夏热浪时聚焦哪些社区 → ⑥HAP 不应只有短期应急，还应提出中长期的\"让社区更凉爽\"的措施（种树遮荫、改造住房、修订建筑法规）；\"减少紧急死亡是好的目标，但它是最低目标\"。"}],"overview":"","discourse":""},{"title":"","passage":["Heat action plans, or HAPs, have been proliferating in India in the past few years. In general, an HAP spells out when and how officials should issue heat warnings and alert hospitals and other institutions. Nagpur's plan, for instance, calls for hospitals to set aside \"cold wards\" in the summer for treating heatstroke patients, and advises builders to give construction laborers a break from work on very hot days.","But implementation of existing HAPs has been uneven, according to a report from the Center for Policy Research. Many lack adequate funding, it found. And their triggering thresholds often are not customized to the local climate. In some areas, high daytime temperatures alone might serve as an adequate trigger for alerts. But in other places, nighttime temperatures or humidity might be as important a gauge of risk as daytime highs.","Mumbai's April heat stroke deaths highlighted the need for more nuanced and localized warnings, researchers say. That day's high temperature of roughly 36°C was 1°C shy of the heat wave alert threshold for coastal cities set by national meteorological authorities. But the effects of the heat were amplified by humidity—an often neglected factor in heat alert systems—and the lack of shade at the late-morning outdoor ceremony.","To help improve HAPs, urban planner Kotharkar's team is working on a model plan that outlines best practices and could be adapted to local conditions. Among other things, she says, all cities should create a vulnerability map to help focus responses on the populations most at risk.","Such mapping doesn't need to be complex, Kotharkar says. \"A useful map can be created by looking at even a few key parameters.\" For example, neighborhoods with a large elderly population or informal dwellings that cope poorly with heat could get special warnings or be bolstered with cooling centers. The Nagpur project has already created a risk and vulnerability map, which enabled Kotharkar to tell officials which neighborhoods to focus on in the event of a heat wave this summer.","HAPs shouldn't just include short-term emergency responses, researchers say, but also recommend medium- to long-term measures that could make communities cooler. In Nagpur, for example, Kotharkar's team has been able to advise city officials about where to plant trees to provide shade. HAPs could also guide efforts to retrofit homes or modify building regulations. \"Reducing deaths in an emergency is good target to have, but it's the lowest target,\" says climate researcher Chandni Singh."],"questions":[{"num":31,"stem":"According to Paragraph 1, Nagpur's plan proposes measures to ___.","opts":{"A":"tackle extreme weather","B":"ensure construction quality","C":"monitor emergency warnings","D":"address excessive workloads"},"answer":"A","analysis":"**\n考点：细节理解。\n解析：Nagpur 计划的措施：\"hospitals to set aside '**cold wards**' in the summer for treating **heatstroke** patients, and advises builders to give construction laborers a break from work **on very hot days**\"——设冷病房、酷暑放假都是**应对极端高温天气**的措施，A 正确。B（保障施工质量）曲解——让工人休息是为了防中暑；C（监测紧急预警）反了——计划的内容是\"发出\"预警而非\"监测预警\"；D（解决超负荷工作）偷换——高温放假不是解决工作负担问题。\n【AI 修正】无。"},{"num":32,"stem":"One problem with existing HAPs is that they ___.","opts":{"A":"prove too costly to be implemented","B":"lack localized alert-issuing criteria","C":"give delayed responses to heat waves","D":"keep hospitals under great pressure"},"answer":"B","analysis":"**\n考点：细节理解。\n解析：\"their **triggering thresholds often are not customized to the local climate**.\"——触发阈值未按本地气候定制，即**缺乏本地化的预警发布标准**，B 正确。A 曲解——\"Many lack adequate funding\"是资金不足，非\"成本高到无法执行\"；C 曲解——问题在阈值设定不在响应迟缓；D 曲解——\"cold wards\"等是计划内容，非医院承压。\n【AI 修正】无。"},{"num":33,"stem":"Mumbai's case shows that India's heat alert systems need to ___.","opts":{"A":"include other factors besides temperature","B":"take subtle weather changes into account","C":"prioritize potentially disastrous heat waves","D":"draw further support from local authorities"},"answer":"A","analysis":"**\n考点：细节理解。\n解析：\"That day's high temperature of roughly 36°C was **1°C shy of the heat wave alert threshold**…**But the effects of the heat were amplified by humidity**—an often neglected factor in heat alert systems—and the lack of shade.\"——温度未及阈值却出人命，因为湿度放大了高温效应（预警系统忽视的因素）——预警系统需要**纳入温度之外的其他因素**，A 正确。B 曲解——\"微妙天气变化\"不如\"湿度这一被忽视因素\"准确；C（优先灾难性热浪）无据；D（争取地方支持）无据。\n【AI 修正】无。"},{"num":34,"stem":"Kotharkar holds that a vulnerability map can help ___.","opts":{"A":"prevent the harm of high humidity","B":"target areas needing special attention","C":"expand the Nagpur project's coverage","D":"make relief plans for heat-stricken people"},"answer":"B","analysis":"**\n考点：观点细节题。\n解析：\"all cities should create a vulnerability map to **help focus responses on the populations most at risk**…enabled Kotharkar to tell officials **which neighborhoods to focus on**\"——脆弱性地图帮助聚焦最脆弱人群/社区，即**确定需要特别关注的区域**，B 正确。A 曲解——湿度是预警系统的问题，非地图功能；C 曲解——Nagpur 地图是地图应用的例证，非\"扩大覆盖\"；D 曲解——是事前聚焦风险人群，非\"为受灾者制定救济计划\"。\n【AI 修正】无。"},{"num":35,"stem":"According to the last paragraph, researchers suggest that HAPs should ___.","opts":{"A":"focus more on the heatstroke treatment","B":"invite wider public participation","C":"apply for more government grants","D":"serve a broader range of purposes"},"answer":"D","analysis":"**\n考点：观点细节题。\n解析：\"HAPs shouldn't **just include short-term emergency responses**, but also recommend **medium- to long-term measures** that could make communities cooler…plant trees…retrofit homes or modify building regulations…'Reducing deaths in an emergency is good target to have, but it's the **lowest target**.'\"——从应急响应扩展到植树、改造房屋等中长期措施，即**服务更广泛的目的**，D 正确。A 反了——中暑治疗只是\"最低目标\"；B（更广的公众参与）无据；C（申请更多政府资助）无据。\n【AI 修正】无。\n\n### Text 4（欲望小径：从捷径到百老汇）\n\n**文章脉络**：①欲望小径（desire paths）：城市正规步道之外、社区自发踩出来的\"非官方足迹\"——抄近道、切草坪、穿山越岭，体现人（和动物）从 A 到 B 的最有效路径 → ②城市规划者视之为规划与行为互动的洞见：俄亥俄州立大学让学生自由穿越 Oval 草坪，然后**按踩出的小径铺路** → ③但也有规划者不愿将其纳入正式规划（安全、环保，主要是美观）：Reddit 专页（近 5 万成员）晒出立着\"请走指定步道\"牌子的欲望小径——凸显这种\"反叛性\"；这是有机的自下而上的空间演化与\"精致受控的城市审美\"之间的拉锯 → ④历史例证：Wickquasgeck 小径（印第安人穿越曼哈顿森林）被荷兰殖民者拓宽为贸易干道（Gentlemen's Street）、英国接管后改名百老汇——百老汇恰是纽约少数打破网格系统的斜向大道 → ⑤线上，欲望小径让人着迷近痴；⑥动物的欲望小径（鸭子踩冰池、狗径直穿花园）彰显人兽共通：坚持开辟非常规路径、拥抱共同选择的精神。"}],"overview":"","discourse":""},{"title":"","passage":["Navigating beyond the organised pavements and parks of our urban spaces, desire paths are the unofficial footprints of a community, revealing the unspoken preferences, shared shortcuts and collective choices of humans. Often appearing as trodden dirt tracks through otherwise neat green spaces, these routes of collective disobedience cut corners, bisect lawns and cross hills, representing the natural capability of people (and animals) to go from point A to point B most effectively.","Urban planners interpret desire paths as more than just convenient shortcuts; they offer valuable insights into the dynamics between planning and behaviour. Ohio State University allowed its students to navigate the Oval, a lawn in the centre of campus, freely, then proceeded to pave the desire paths, creating a web of effective routes students had established.","Yet, reluctance persists among other planners to integrate desire paths into formal plans, citing concerns about safety, environmental impact, or primarily, aesthetics. A Reddit webpage devoted to the phenomenon, boasting nearly 50,000 members, showcases images of local desire paths adorned with signs instructing pedestrians to adhere to designated walkways, underscoring the rebellious nature inherent in these human-made tracks. This clash highlights an ongoing struggle between the organic, user-driven evolution of public spaces and the desire for a visually curated and controlled urban environment.","The Wickquasgeck Trail is an example of a historical desire path, created by Native Americans to cross the forests of Manhattan and move between settlements quickly. This trail, when Dutch colonists arrived, was widened and made into one of the main trade roads across the island, known at the time as de Heere Straat, or Gentlemen's Street. Following the British assumption of control in New York, the street was renamed Broadway. Notably, Broadway stands out as one of the few areas in NYC that defies the grid-based system applied to the rest of the city, cutting a diagonal across parts of the city.","In online spaces, desire paths have sparked a fascination that can approach obsession, with the Reddit page serving as a hub. Contributors offer a wide array of stories, from little-known new shortcuts to long-established alternate routes.","Animal desire paths, such as ducks forging trails through frozen ponds or dogs carving direct routes in gardens, highlight the adaptability of these trails in both human and animal experiences. As desire paths criss-cross through both physical and virtual landscapes, they stand as a proof of the collective insistence on forging unconventional routes and embracing the spirit of communal choice."],"questions":[{"num":36,"stem":"According to Paragraph 1, desire paths are a result of ___.","opts":{"A":"the curiosity to explore surrounding hills","B":"the necessity to preserve green spaces","C":"the tendency to pursue convenience","D":"the wish to find comfort in solitude"},"answer":"C","analysis":"**\n考点：细节理解。\n解析：\"these routes of collective disobedience **cut corners**…representing the natural capability of people to go from point A to point B **most effectively**.\"——欲望小径是抄近道走出来的，即**追求便捷的倾向**的产物，C 正确。A（探索周边山丘的好奇心）无据——穿山越岭只是抄近道的表现；B（保护绿地的需要）反了——小径恰恰切过草坪；D（独处中寻慰藉）无据。\n【AI 修正】无。"},{"num":37,"stem":"It can be inferred that Ohio State University ___.","opts":{"A":"intends to improve its desire paths","B":"leads in the research on desire paths","C":"guides the creation of its desire paths","D":"takes a positive view of desire paths"},"answer":"D","analysis":"**\n考点：推断题。\n解析：\"Ohio State University **allowed** its students to navigate the Oval…**freely, then proceeded to pave the desire paths**, creating a web of effective routes students had established.\"——先放任学生自由踩径，再把踩出的小径铺成正式道路，即**对欲望小径持积极态度**，D 正确。A（打算改进欲望小径）偷换——是\"铺成正式道路\"而非\"改进小径本身\"；B（领跑欲望小径研究）无据；C（引导小径的创造）反了——是\"放任\"学生自主踩出。\n【AI 修正】无。"},{"num":38,"stem":"The images on the Reddit webpage reflect ___.","opts":{"A":"conflicting opinions on the use of desire paths","B":"the call to upgrade the designing of public spaces","C":"the demand for proper planning of desire paths","D":"growing concerns over the loss of public spaces"},"answer":"A","analysis":"**\n考点：细节推断。\n解析：\"showcases images of local desire paths **adorned with signs instructing pedestrians to adhere to designated walkways**, underscoring the **rebellious nature**…This clash highlights an ongoing **struggle** between the organic, user-driven evolution…and the desire for a visually curated and controlled urban environment.\"——欲望小径与\"请走指定步道\"的标牌同框，体现自发使用者与规划管制者的**意见冲突**，A 正确。B（呼吁升级公共空间设计）无据；C（要求对欲望小径适当规划）曲解——标牌恰是拒绝小径的管制措施；D（对公共空间流失的担忧）无据。\n【AI 修正】无。"},{"num":39,"stem":"The example of the Wickquasgeck Trail illustrates ___.","opts":{"A":"the growth of New York City","B":"the Dutch origin of desire paths","C":"the importance of urban planning","D":"the recognition of desire paths"},"answer":"D","analysis":"**\n考点：例证目的题。\n解析：\"The Wickquasgeck Trail is an example of a historical desire path…was **widened and made into one of the main trade roads**…renamed **Broadway**…Broadway stands out as one of the few areas in NYC that **defies the grid-based system**.\"——从印第安人的踩出小径到纽约主干道（百老汇），例证欲望小径**获得认可并被正式采纳**，D 正确。A（纽约市的发展）以偏概全；B（欲望小径的荷兰起源）曲解——荷兰人只是拓宽者，小径源于印第安人；C（城市规划的重要性）无据——百老汇恰是\"不按规划\"的例证。\n【AI 修正】无。"},{"num":40,"stem":"It can be learned from the last paragraph that desire paths ___.","opts":{"A":"reveal humans' deep respect for nature","B":"are crucial to humans' mental well-being","C":"are a human imitation of animal behaviour","D":"show a shared trait in humans and animals"},"answer":"D","analysis":"**\n考点：细节理解（末段）。\n解析：\"Animal desire paths…**highlight the adaptability of these trails in both human and animal experiences**…a proof of the collective insistence on forging unconventional routes.\"——动物踩出的小径与人相同，彰显人兽共通的特质，D 正确。A（对自然的尊重）无据；B（对心理健康至关重要）无据；C 曲解——是人类与动物的共性，非\"人类模仿动物\"。\n【AI 修正】无。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)"],"options":[{"key":"A","text":"Stay positive"},{"key":"B","text":"Respect the past"},{"key":"C","text":"Use channels"},{"key":"D","text":"Give it time"},{"key":"E","text":"Invite resistance"},{"key":"F","text":"Be a salesman"},{"key":"G","text":"Be humble"}],"passage":["- **A.** Stay positive - **B.** Respect the past - **C.** Use channels - **D.** Give it time - **E.** Invite resistance - **F.** Be a salesman - **G.** Be humble","**Five Steps to Suggesting a Change at Work That'll Actually Get Taken Seriously**","Everyone wants to be that person—the one who looks at the same information as everyone else, but who sees a fresh, innovative solution. However, it takes more than simply having a good idea. How you share it is as important as the suggestion itself. Why? Because writing a new script—literally or figuratively—means that other team members will have to adapt to something new. So whether you're suggesting a (seemingly) benign change like streamlining outdated protocol, or a bigger change like adding an hour to each workday so people can leave early on Fridays, you're asking others to reimagine their workflow or schedule. Not to mention, if the process you're scrapping is one someone else suggested, there's the possibility of hurt feelings. To gain buy-in on an innovative, new idea, follow these steps:"],"questions":[{"num":41,"stem":"____________ Great ideas don't stand alone. In other words, you can't mention your suggestion once and expect it to be adopted. To see a change, you'll need to champion your plan and sell its merits. In addition, you need to be willing to stand up to scrutiny and criticism and be prepared to explain your innovation in different ways for various audiences.","opts":{},"answer":"F","analysis":"**（Be a salesman）\n解析：本段核心：\"Great ideas don't stand alone…you'll need to **champion your plan and sell its merits**…be willing to stand up to scrutiny and criticism…explain your innovation in different ways for various audiences.\"——推销你的方案，F 正确。\n【AI 修正】无。"},{"num":42,"stem":"____________ Sometimes it makes sense to go to your boss first. But other times, it's useful to build a coalition among your co-workers or other stakeholders. When it works, it works great—because you're ready for your stubborn supervisor's pushback with answers like, \"Actually, I connected with a few people in our tech department to discuss how much time these kinds of website updates would take, and they suggested they have the bandwidth.\"","opts":{},"answer":"C","analysis":"**（Use channels）\n解析：本段核心：\"Sometimes it makes sense to go to your boss first. But other times, it's useful to **build a coalition** among your co-workers or other stakeholders…I **connected with a few people** in our tech department…\"——先走哪条通道有讲究（先老板还是先结盟），C 正确。\n【AI 修正】无。"},{"num":43,"stem":"____________ One of the biggest barriers to gaining buy-in occurs when the owner of an idea is viewed as argumentative, defensive, or close-minded. Because, let's be honest: No one likes a know-it-all. So, if people disagree with you, don't be indignant. Instead, listen to their concerns fully, try to understand their perspective, and include their concerns (and possible remedies) in future discussions. So, instead of saying, \"Martha, our current slogan is confusing and should be updated,\" you could try, \"Martha raises a great point that our current slogan has a long history for our stakeholders, but I wonder if we might be able to brainstorm a tagline that could build on that—and be clearer for new customers.\"","opts":{},"answer":"G","analysis":"**（Be humble）\n解析：本段核心：提议者被视为\"好斗、防御、自以为是\"是最大障碍；\"No one likes a know-it-all. So, if people disagree with you, **don't be indignant**. Instead, **listen** to their concerns fully, try to **understand their perspective**\"——保持谦逊，G 正确。（E Invite resistance 为干扰——段落讲的是如何\"对待\"异见，而非\"邀请\"异见。）\n【AI 修正】无。"},{"num":44,"stem":"____________ New ideas are the grandchildren of old ones. In other words, don't throw old solutions under the bus to make your improvement stand out. Remember that in light of whatever the problem the old system solved—or maybe, has failed to solve in recent memory—it was a great idea at the time. Appreciating the older contributions as you suggest future innovations helps bolster the credibility of your idea.","opts":{},"answer":"B","analysis":"**（Respect the past）\n解析：本段核心：\"New ideas are the grandchildren of old ones…**don't throw old solutions under the bus**…it was a great idea at the time. **Appreciating the older contributions**…helps bolster the credibility of your idea.\"——尊重旧方案，B 正确。\n【AI 修正】无。"},{"num":45,"stem":"____________ When pitching a new idea, it's important to use the language of abundance instead of the language of deficit. Instead of saying what is wrong, broken, or suboptimal, talk about what is right, fixable, or ideal. For example, try, \"I can see lots of applications for this new approach\" rather than, \"This innovation is the *only* way.\" Be optimistic but realistic, and you will stand out.","opts":{},"answer":"A","analysis":"**（Stay positive）\n解析：本段核心：\"use the **language of abundance** instead of the language of deficit. Instead of saying what is wrong, broken, or suboptimal, **talk about what is right, fixable, or ideal**…Be optimistic but realistic\"——保持积极乐观的措辞，A 正确。多余项：D（Give it time）、E（Invite resistance）均无对应段。\n【AI 修正】无。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","You know the moment—the conversation slows, then there's a pause. It's awkward, and so awkward that some people will panic and say anything. Do we all find such silences so stressful?","Researchers analysed the frequency and impact of gaps greater than 2 seconds during conversations, including an overview of previous studies which indicate that the fear of awkward silences can be so extreme that people avoid talking to strangers, even though doing so is likely to be an enjoyable experience.","During conversations with short gaps, people feel more connected to their conversation partners. But such feelings of connection markedly dip when entering a long gap. Long gaps between strangers are likely to be followed by a change in topic.","But the opposite seems to be true for conversations between friends. Long gaps there saw increased connection. Between friends, longer gaps seem to provide natural moments for reflection and expression."],"reference":"你一定熟悉这样的时刻——谈话慢了下来，接着是一阵沉默。这很尴尬，尴尬到有些人会慌了神、随便说点什么。我们所有人都觉得这样的沉默如此有压力吗？\n\n研究人员分析了谈话中超过 2 秒的停顿的出现频率及其影响，其中还包括对既往研究的综述——这些研究表明，对尴尬沉默的恐惧可以强烈到让人避免与陌生人交谈，尽管这么做（与陌生人交谈）很可能是一次愉快的体验。\n\n在停顿短暂的交谈中，人们感到与交谈对象更亲近。但一旦进入较长的停顿，这种联结感就会明显下降。陌生人之间的长停顿之后，往往紧接着换话题。\n\n但在朋友之间的交谈中，情况似乎恰恰相反：长停顿反而增进了亲近感。在朋友之间，较长的停顿似乎提供了自然的沉思与表达的时刻。\n\n> 翻译要点：① You know the moment（你一定熟悉这样的时刻）；② say anything（随便说点什么——慌不择言）；③ an overview of previous studies（对既往研究的综述）；④ such feelings of connection markedly dip（联结感明显下降）；⑤ natural moments for reflection and expression（自然的沉思与表达的时刻）。","analysis":""},"writing":{"small":["**47.** Directions: Suppose you are planning a short play based on a classic Chinese novel. Write your friend John an email to","1) introduce the play, and","2) invite him to take part in it.","Write your answer in about 100 words on the ANSWER SHEET.","**Do not** sign your own name in your email; use \"Li Ming\" instead. (10 points)"],"large":["**48.** Directions: Write an essay based on the chart below. In your essay, you should","1) describe and interpret the chart, and","2) give your comments.","Write your answer in about 150 words on the ANSWER SHEET. (15 points)","**某社区老年人主要日常休闲活动调查**","| 休闲活动 | 看电视 | 散步 | 养花 | 阅读 | 下棋 | |---|---|---|---|---|---| | 占比 | 90.8% | 68.3% | 34.7% | 31.8% | 18.4% |"],"small_ref":"Dear John,\n\nHow is everything going? I am writing to share some exciting news with you and to invite you to join us in a short play we are preparing.\n\nThe play is adapted from Journey to the West, one of the four great classical Chinese novels. It tells the adventurous story of the Monkey King, who battles demons and protects his master on the journey to the West. The play will be staged at the university's art festival next month, aiming to introduce Chinese classics to international students in a fun and vivid way.\n\nSince you have always been interested in Chinese culture and you have some acting experience, I sincerely invite you to play a role in it. It would be a great honor to have you on board. Looking forward to your reply!\n\nYours,\nLi Ming\n\n> 思路：三段式——点明来意 → 介绍剧目（改编自《西游记》 + 剧情与演出目的）→ 发出邀请（结合对方兴趣与特长）并期待回复。署名 Li Ming，不写地址。","large_ref":"**表格信息**：某社区老年人主要日常休闲活动调查——看电视 90.8%、散步 68.3%、养花 34.7%、阅读 31.8%、下棋 18.4%。\n\nThe table clearly presents the main leisure activities of elderly residents in a certain community. As is shown, watching TV tops the list at 90.8 percent, followed by taking walks at 68.3 percent. Growing flowers and reading account for 34.7 percent and 31.8 percent respectively, while playing chess takes up merely 18.4 percent.\n\nSeveral factors account for this pattern. First, watching TV requires little physical effort and offers constant entertainment, which perfectly suits the elderly who prefer staying at home. Second, walking, an accessible and low-cost exercise, helps seniors keep fit while enjoying fresh air. By contrast, activities like reading and chess, which demand better eyesight and more engagement, are chosen by relatively fewer people.\n\nFrom my perspective, the survey reflects both the preferences and the potential needs of senior residents. It is advisable for the community to organize more diverse activities — for example, reading clubs and chess tournaments — to enrich their daily life, encourage social interaction, and promote their mental well-being in old age.\n\n> 思路：首段描述表格（看电视、散步居前 + 低参与度活动）→ 中段析因（省力娱乐 / 便捷锻炼 / 视力精力限制）→ 末段评论（社区组织多样化活动的建议）。"},"label":"2025 年真题（AI 解析）"};

<script>

window.QUIZ_DATA[2026] = {"year":2026,"cloze":{"directions":["**Directions:** Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)"],"passage":["Most of us strive for self-respect—to see ourselves in a positive light, to be ___1___ of who we are. Any comments or experiences that undermine those feelings of self-worth can be uncomfortable and it’s only ___2___ to want to avoid them. But the thing is, ___3___ your self-worth really is being undermined is, to a large degree, subjective. Much of it comes down to your ___4___ of what someone said or did. When you take things personally, you’re interpreting these situations as saying something significant and negative about you as a person. Say your boss picks holes in your sales report, and you come away feeling like this means she thinks you’re a ___5___ member of staff. Or, two of your friends cancel your ___6___ get-together at the pub and you interpret this as meaning they’re bored of you. Psychologists have a ___7___ for this way of thinking: personalisation. But the ___8___ is that your boss might view you very highly. It’s just you made some ___9___ in the report and she wanted to point these out so that you do better next time.  ___10___ , in the case of your friends cancelling, perhaps they both felt unwell that weekend or they just ___11___ their minds. In both ___12___ —and others that we all experience—there’s another ___13___ at work that psychologists call mind reading. This is when you assume to know what other people are thinking about you, when you can’t really know without ___14___ them directly. One simple way to avoid ___15___ in personalisation and mind-reading is to challenge your negative assumptions of what’s ___16___ . When you find yourself taking a situation personally, try to think of other interpretations that are less focused on you—especially in the sense of saying anything deep or ___17___ about you. When you do thi siness and intellectual property centres, which can help business owners and entrepreneurs. Many have nurses on site to carry out basic health checks, with a link to the GP’s surgery. There are libraries where young people can borrow a Fifa-standard football free. In return for all of this, you’ll be asked for precisely nothing. There will be no charge and you will never be asked to justify or explain yourself; you will simply be welcomed in, offered help if you need it, and left alone if you do not. There is no other institution, public or private, that can say the same. Yet still our libraries are often overlooked and underappreciated. There is an overall decline in visits and many are struggling as local authorities come under continued financial pressure. The number of libraries that have closed since 2010 is disputed. An annual survey by the Chartered Institute of Public Finance and Accountancy puts it at nearly 800 across the UK; official statistics held by the Arts Council record 230 in England. It is, of course, 230 libraries too many. So if we are to protect our libraries for future generations, we must raise awareness of them and the work they do. The review recommends a national branding campaign to give libraries a stronger physical presence, the reintroduction of a scheme to enable members to use their card in any library in the country, and automatic memberships for children. If we don’t use them, we will end up losing them. And for those who haven’t been to a library for some time, they may be surprised by what they find."],"questions":[{"num":21,"stem":"What was the author commissioned to do about English public libraries?","opts":{"A":"Document their valuable traditions.","B":"Make a plan for their expansions.","C":"Obtain reader opinions on them.","D":"Look into their current situation."},"answer":"D","analysis":"【AI 解析】答案 [D]「Look into their current situation.」。本题考查「What was the author commissioned to do a…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余 , with this newfound connection, many of us share sensitive, sometimes highly confidential information, even though over a third of people don’t realise that AI platforms may not be very good at keeping our secrets... secret. For businesses, the implications are worrying. Consider Microsoft Copilot, for example. It grants Microsoft broad rights to the data inputted or outputted by any user—rights to use this data in any way it sees fit; it can even share it with third parties. This means that any sensitive business information could potentially be exposed to the world. Employers are taking note and taking action. According to our research, 25% have decided to either outright ban AI or regulate its use within their organisations. But even with these policies in place, some employees choose to break the rules. They have their reasons—around 63% of them report that using AI increases their productivity, and some even feel AI offers more help than their human colleagues. The situation presents a delicate balance between leveraging AI for its productivity gains and risking confidential data exposure. Employers need to manage AI tools with the same level of care as any other form of data sharing or storage. There’s also a knowledge gap that needs to be addressed—40% of individuals surveyed are unsure about who retains ownership over the content produced by AI. By instilling best practices in AI engagement and creating policies that evolve with the technology, businesses can positively shift the AI landscape. With AI’s potential to simplify our professional lives, do the admin and enhance the work experience, it’s up to us to navigate its usage cautiously so it supports us without compromising our privacy. There’s no need to back away from progress, as long as we’re equipped with the knowledge and tools to make sure AI remains a friend. And this is where the challenge lies. There are so many products out there, being promoted with huge advertising and marketing budgets, that it’s easy to fall victim. But by building a culture of digital responsibility within our businesses, we can create a future where AI can help us without spilling the beans."],"questions":[{"num":26,"stem":"According to Paragraph 1, workers’ engagement with AI can ___","opts":{"A":"facilitate their career progress.","B":"give them emotional support.","C":"help maintain their motivation.","D":"improve workplace communication."},"answer":"B","analysis":"【AI 解析】答案 [B]「give them emotional support.」。本题考查「According to Paragraph 1, workers’ engag…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"Microsoft Copilot is cited to show that the use of AI may ___","opts":{"A":"pose a threat to businesses.","B":"generate unnecessary data.","C":"promote business cooperation.","D":"encourage information sharing."},"answer":"A","analysis":"【AI 解析】答案 [A]「pose a threat to businesses.」。本题考查「Microsoft Copilot is cited to show that …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"Some employees choose to break the rules on AI due to ___","opts":{"A":"easy access to AI products.","B":"the desire to stay well-informed.","C":"its significant role in their work.","D":"the need to compete with others."},"answer":"C","analysis":"【AI 解析】答案 [C]「its significant role in their work.」。本题考查「Some employees choose to break the rules…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"To positively shift the AI landscape, business should ___","opts":{"A":"increase the transparency of their data sources.","B":"prioritise the quality of AI-produced content.","C":"include employee perspectives in their rules.","D":"adjust their management to AI development."},"answer":"D","analysis":"【AI 解析】答案 [D]「adjust their management to AI development.」。本题考查「To positively shift the AI landscape, bu…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"According to the last paragraph, we may easily fall victim to AI as we ___","opts":{"A":"have a limited understanding of it.","B":"underestimate its economic costs.","C":"tend to overemphasise its power.","D":"are excessively exposed to it."},"answer":"A","analysis":"【AI 解析】答案 [A]「have a limited understanding of it.」。本题考查「According to the last paragraph, we may …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Since the 2008 launch of the high-speed rail network between Rome and Milan, trains have become the preferred means of travel across Italy for locals and tourists alike. Fast trains can cover the 500km between the two cities in three hours. The network also connects Naples, Bologna, Florence and Turin. In many cases, it is the best option—in terms of travel time and cost—for both leisure and business travellers. This is why the recent severe delays caused by numerous maintenance works have thrown the rail industry into chaos at a time when most people head on holiday, which matters for business in a country where tourism accounts for 10 percent of GDP. Disruptions have become increasingly frequent with train delays now a fixture in Italian media coverage. Ferrovie dello Stato Italiane, the publicly controlled group that owns train operator Trenitalia and the national train network RFI, said 23 percent of all high-speed trains it operated were late in 2023. The huge improvements in Italy’s obsolete infrastructure partly explained the disruption, said Ferrovie. RFI, the network operator, is the single largest European recovery fund beneficiary with planned investments of €24bn by 2026. Ferrovie will invest a total of €124bn in infrastructure over the next 10 years. But lack of capacity is another problem. Transport economist Andrea Giuricin said the planned investments would bring improvements but disruptions in the meantime were inevitable. “We have a mixed system, there is no spare capacity and as soon as there’s a hiccup on the line, the situation becomes highly complex,” he said. A mixed system means that high-speed trains must travel on the regular tracks on certain routes or when passing through large cities. If there’s congestion or, for example, a local train breaks down, the entire high-speed network is affected. One of the most important changes the upgrades will bring is the segregation of the high-speed line from the regular one in certain urban centres through the construction of underground rail links. Improvements will also come from the high-density technology and satellite signalling that RFI has been investing in for years, say experts. It will allow for a reduction of the distance between high-speed trains travelling on the same line at any given time, which should mean a significant increase in capacity and traffic fluidity, according to Giuricin."],"questions":[{"num":31,"stem":"According to the first two paragraphs, the high-speed rail network in Italy ___","opts":{"A":"is seen by tourists as outdated.","B":"is a popular option for travelling.","C":"is inadequately utilised by locals.","D":"is an example of good maintenance."},"answer":"B","analysis":"【AI 解析】答案 [B]「is a popular option for travelling.」。本题考查「According to the first two paragraphs, t…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"Ferrovie is quoted in Paragraph 3 to show ___","opts":{"A":"the common occurrence of train delays.","B":"the value of the Italian train network.","C":"the wide media coverage of trains.","D":"the high efficiency of Trenitalia."},"answer":"A","analysis":"【AI 解析】答案 [A]「the common occurrence of train delays.」。本题考查「Ferrovie is quoted in Paragraph 3 to sho…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"Which of the following is one cause of the disruptions in the network?","opts":{"A":"Complex train schedules.","B":"Shortage of investments.","C":"Its limited capacity.","D":"Its massive scale."},"answer":"C","analysis":"【AI 解析】答案 [C]「Its limited capacity.」。本题考查「Which of the following is one cause of t…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"It can be learned that the mixed system ___","opts":{"A":"provides a wide choice of routes.","B":"requires extra operational spending.","C":"increases the level of travel comfort.","D":"puts the high-speed network in trouble."},"answer":"D","analysis":"【AI 解析】答案 [D]「puts the high-speed network in trouble.」。本题考查「It can be learned that the mixed system …」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"Improvements to the Italian train network will include ___","opts":{"A":"reconstructing the regular train lines.","B":"shortening high-speed train intervals.","C":"building more stations in urban centres.","D":"enhancing the safety of high-speed trains."},"answer":"B","analysis":"【AI 解析】答案 [B]「shortening high-speed train intervals.」。本题考查「Improvements to the Italian train networ…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["In 2023, Chicago lost one of its most beloved street festivals. The Silver Room Block Party, staged by Hyde Park community leader Eric Williams, announced it would not return in 2024. What began as a small neighborhood gathering blossomed into a massive cultural event, welcoming tens of thousands of people each year over nearly two decades before abruptly shutting down. Williams pointed to rising production costs and declining attendee donations as primary reasons the Silver Room Block Party could not continue, highlighting a reality that all street festival organizers face right now. The cost of producing a street festival in Chicago has skyrocketed. Security, entertainment, portable restrooms, insurance and even basics such as fencing and staffing have all become significantly more expensive. At the same time, donations at festival gates have dropped dramatically. Chicago’s summer festivals are about more than just entertainment; they are economic engines that directly benefit the neighborhoods they’re in and the city of Chicago as whole. Street festivals drive foot traffic to local businesses and foster the kind of cultural vibrancy that makes our city special. We often hear people ask why we solicit donations at our entry points, especially when the city’s largest festivals like the Chicago Jazz Festival do not request donations. The fact is, unlike those large, city-produced music festivals, your neighborhood street festivals receive no city funding and rely on a combination of sponsorships, vendor fees and gate donations to cover their costs. Wicker Park Fest has long been one of Chicago’s most anticipated summer festivals, drawing upward of 70,000 attendees for a full weekend of live indie music, local art, small business vendors and, most importantly, community connection. In 2024, Wicker Park Fest saw record-breaking attendance. Despite the turnout, gate donations reached their lowest point in our history. This year, we’ve been forced to scale back the footprint of the fest. We are eliminating a stage, booking fewer performers and making additional cuts to reduce our costs, all while striving to keep the festival as vibrant as ever, as supportive of local artists and businesses, and as true to Wicker Park’s unique spirit and reputation as festgoers have come to expect. This summer, as you enjoy your favorite neighborhood street festival, I hope you’ll remember that they exist because of community support. A thriving summer festival season doesn’t happen by accident; it happens when we all chip in."],"questions":[{"num":36,"stem":"It can be learned from Paragraph 1 that the Silver Room Block Party ___","opts":{"A":"has been replaced by other festivals.","B":"has gained great international fame.","C":"was held in various neighborhoods.","D":"was an appealing cultural gathering."},"answer":"D","an ":""}],"partB":{"directions":["**Directions:** Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points) In an effort to support restoration programmes, specialists are developing supplies of seeds and seedlings, maintaining gene banks and sequencing the genomes of indigenous trees and other crops. Their work deals with one of the problems that could block major restoration efforts in different parts of the world. “Where’s the planting material going to come from? That’s one big bottleneck,” says genetic-resources specialist Ramni Jamnadass. Asia is arguably the region most neglected by global efforts to increase diversity in restoration and to study native species. Christopher Kettle, Biodiversity International’s director for forest genetic resources and restoration in Rome, says that the need for infrastructure—things such as mechanisms for collecting and storing seeds, and nurseries to raise seedlings—might be most desperate here because many trees are ‘masting’ species, which don’t produce seeds every year. People need to be ready. “Otherwise, you miss the boat, you lose all the seed and you’ve got to wait another seven years,” says Kettle. “This is a really, really critical issue for restoration in Southeast Asia, because many of the most important timber species and tree species—the ones that will lock up the most carbon—they’re all masting species.” Climate change is a driving factor in the push to restore forests, but it also raises questions, such as where trees can thrive in the future. Climate change is also expected to alter relationships between trees, insects, diseases and other forest species. “Insects that today are a minor problem may become a major problem if they can produce three or four generations in a year,” says John Stanturf. This remains a significant knowledge gap. “We know enough to know that this is a concern, but we don’t know enough about how to respond to it yet. That’s a great area to be doing research.” So is soil, says Cindy Prescott, a forest ecologist at the University of British Columbia in Vancouver. “If you don’t look at the soil at the start, you can spend a lot of money and time putting in species that aren’t going to survive there.” With so much research left to do, leaders in the field have been doing some soul-searching, and acknowledging that restoration can be motivated by— and designed to meet—different needs. “When you talk about conservation or restoration, the first question has to be restoration by whom, for whom?” says Daniel Janzen, a biologist at the University of Pennsylvania. The question can have more than one answer. Much of the global funding for restoration is dedicated to developing it as a tool to mitigate climate change, notes restoration ecologist Pedro Brancalion. “But if you ask a farmer in Brazil if he or she is concerned about climate change, they would say, ‘No, I am concerned about water,’” he says. Their interests as stewards of the land need to be better integrated with those who have the money to support restoration. That has been the strongest lesson of all for forest ecologist Robin Chazdon. Restoration is about more than what gets planted in the ground, she says. “Yes, it’s about forests, but it’s really about people. They are the agents of restoration.”"],"options":[{"key":"A","text":"People must pay attention to the fact that some kinds of trees do not produce seeds annually."},{"key":"B","text":"Soil is an important element to be taken into account in forest restoration."},{"key":"C","text":"The purpose of restoration efforts may be different from the real needs of the people involved."},{"key":"D","text":"Human factors, as well as trees planted, should be emphasized in forest restoration."},{"key":"E","text":"The supply of seeds is a tough problem that has to be dealt with."},{"key":"F","text":"When it comes to restoration, we have to stay with an awareness of whose interests to serve."},{"key":"G","text":"Some creatures in the forest that multiply fast can become a great threat to forest restoration."}],"passage":["- **A.** People must pay attention to the fact that some kinds of trees do not produce seeds annually. - **B.** Soil is an important element to be taken into account in forest restoration. - **C.** The purpose of restoration efforts may be different from the real needs of the people involved. - **D.** Human factors, as well as trees planted, should be emphasized in forest restoration. - **E.** The supply of seeds is a tough problem that has to be dealt with. - **F.** When it comes to restoration, we have to stay with an awareness of whose interests to serve. - **G.** Some creatures in the forest that multiply fast can become a great threat to forest restoration."],"questions":[{"num":41,"stem":"Ramni Jamnadass __________","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「The supply of seeds is a tough problem that ha…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"},{"num":42,"stem":"Christopher Kettle __________","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「People must pay attention to the fact that som…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":43,"stem":"John Stanturf __________","opts":{},"answer":"G","analysis":"【AI 解析】答案 [G]「Some creatures in the forest that multiply fas…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [G]。"},{"num":44,"stem":"Pedro Brancalion __________","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「The purpose of restoration efforts may be diff…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"},{"num":45,"stem":"Robin Chazdon __________","opts":{},"answer":"D","analysis":"【AI 解析】答案 [D]「Human factors, as well as trees planted, shoul…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [D]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points) The influence of wearables on psychology refers to how the clothes we wear affect our thoughts, feelings, and behaviors. Clothing is not just about covering our bodies; it plays a significant role in shaping our self-perception and interactions with others. One aspect of this influence is self-expression. The clothes we choose can reflect our personality, mood, and identity. Whether we opt for bold, colorful outfits or prefer more understated styles, our dress choices convey messages about who we are and how we want to be perceived. Additionally, clothing can impact our confidence levels. When we wear clothes that make us feel comfortable and confident, it can positively affect our self-esteem and overall mood. Moreover, cultural and societal influences play a significant role in shaping our dress choices. Different cultures have their norms and expectations regarding dress, which can influence the types of clothing people wear and the meanings attributed to them."],"reference":"服饰对心理的影响，指的是我们所穿的衣物如何影响我们的思想、情感和行为。衣服不仅仅是遮体之物，它在塑造自我认知以及与他人的互动方面发挥着重要作用。这种影响的一个方面是自我表达。我们选择的衣服可以反映我们的个性、情绪和身份。无论我们选择大胆艳丽的服装，还是偏爱低调朴素的风格，着装选择都传递着关于我们是谁、我们希望被如何看待的信息。此外，衣着还会影响我们的自信程度。当我们穿上让自己感到舒适自信的衣服时，它会对我们的自尊和整体情绪产生积极影响。而且，文化与社会因素也在塑造着人们的着装选择。不同文化对于着装有着各自的规范和期望，这会影响人们穿着的服装类型以及赋予这些服装的含义。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose your friend Jack has shared with you a video of his family’s travel in China. Write an email to tell him 1) how you feel about the video, and 2) your wish to learn more about their travel. Write your answer in about 100 words on the ANSWER SHEET. Do not use your own name in your email; use “Li Ming” instead. (10 points)"],"large":["**48.** Directions: Write an essay based on the chart below. In your essay, you should 1) describe and interpret the chart, and 2) give your comments. Write your answer in about 150 words on the ANSWER SHEET. (15 points) **某项关于儿童户外活动看法的调查**","| 看法 | 满足好奇心 | 促进观察力 | 强身健体 | 增强亲子互动 | |---|---|---|---|---| | 占比 | 54.6% | 54.5% | 37.2% | 33.2% |"],"small_ref":"Dear Jack,\n\nI have just watched the video of your family's travel in China, and I simply cannot wait to tell you how much I enjoyed it.\n\nThe footage of the West Lake in the morning mist and the lantern-lit streets of the old town was absolutely stunning. What impressed me most was your grandmother trying to speak Chinese to the local vendors — so lovely and respectful! The video has aroused my strong interest in your journey.\n\nCould you tell me more about the places you visited and the food you tried? If you have any other clips, I would love to see them. Maybe we can meet this weekend and talk about it over coffee.\n\nBest wishes,\nLi Ming","large_ref":"The chart demonstrates the results of a survey on people's views about children's outdoor activities. Satisfying children's curiosity ranks highest at 54.6%, closely followed by promoting observation skills at 54.5%, while building up physical health and enhancing parent-child interaction account for 37.2% and 33.2% respectively.\n\nThe data show that the public values outdoor activities mainly for their educational function. Contact with nature stimulates children's curiosity and trains them to observe the world carefully, which no classroom can fully offer. Physical and emotional benefits, though rated lower, are also widely recognized.\n\nIn my opinion, the findings are encouraging, but they should be translated into action. Parents should take their children outdoors regularly instead of letting screens fill their free time, and schools may organize more field trips. Communities, for their part, can build safer parks and nature trails, so that every child can grow up exploring the real world."},"label":"2026 年真题（AI 解析）"};
