District administrators say that homework will still be a part of schooling; teachers are allowed to assign as much of it as they want. But with homework counting for no more than 10% of their grades, students can easily skip half their homework and see very little difference on their report cards. Some students might do well on state tests without completing their homework, but what about the students who performed well on the tests and did their homework? It is quite possible that the homework helped. Yet rather than empowering teachers to find what works best for their students, the policy imposes a flat, across-the-board rule. At the same time, the policy addresses none of the truly thorny questions about homework. If the district finds homework to be unimportant to its students’academic achievement, it should move to reduce or eliminate the assignments, not make them count for almost nothing. Conversely, if homework matters, it should account for a significant portion of the grade. Meanwhile, this policy does nothing to ensure that the homework students receive is meaningful or appropriate to their age and the subject, or that teachers are not assigning more than they are willing to review and correct. The homework rules should be put on hold while the school board, which is responsible for setting educational policy, looks into the matter and conducts public hearings. It is not too late for L.A. Unified to do homework right."],"questions":[{"num":21,"stem":"It is implied in Paragraph 1 that nowadays homework _____.","opts":{"A":"is receiving more criticism","B":"is gaining more preferences","C":"is no longer an educational ritual","D":"is not required for advanced courses"},"answer":"A","analysis":"【AI 解析】答案 [A]「is receiving more criticism」。本题考查「It is implied in Paragraph 1 that nowada…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"L.A. Unified has made the rule about homework mainly because poor students ___","opts":{"A":"tend to have moderate expectations for their education","B":"have asked for a different educational standard","C":"may have problems finishing their homework","D":"have voiced their complaints about homework"},"answer":"C","analysis":"【AI 解析】答案 [C]「may have problems finishing their homework」。本题考查「L.A. Unified has made the rule about hom…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":23,"stem":"According to Paragraph 3, one problem with the policy is that it may _____.","opts":{"A":"result in students’ indifference to their report cards","B":"undermine the authority of state tests","C":"restrict teachers’ power in education","D":"discourage students from doing homework"},"answer":"D","analysis":"【AI 解析】答案 [D]「discourage students from doing homework」。本题考查「According to Paragraph 3, one problem wi…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":24,"stem":"As mentioned in Paragraph 4, a key question unanswered about homework is ___","opts":{"A":"it should be eliminated","B":"it counts much in schooling","C":"it places extra burdens on teachers","D":"it is important for grades"},"answer":"B","analysis":"【AI 解析】答案 [B]「it counts much in schooling」。本题考查「As mentioned in Paragraph 4, a key quest…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":25,"stem":"A suitable title for this text could be _____.","opts":{"A":"A Faulty Approach to Homework","B":"A Welcomed Policy for Poor Students","C":"Thorny Questions about Homework","D":"Wrong Interpretations of an Educational Policy"},"answer":"A","analysis":"【AI 解析】答案 [A]「A Faulty Approach to Homework」。本题考查「A suitable title for this text could be …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Pretty in pink: adult women do not remember being so obsessed with the colour, yet it is pervasive in our young girls’ lives. It is not that pink is intrinsically bad, but it is such a tiny slice of the rainbow and, though it may celebrate girlhood in one way, it also repeatedly and firmly fuses girls’ identity to appearance. Then it presents that connection, even among two-year-olds, between girls as not only innocent but as evidence of innocence. Looking around, I despaired at the singular lack of imagination about girls’ lives and interests. Girls’ attraction to pink may seem unavoidable, somehow encoded in their DNA, but according to Jo Paoletti, an associate professor of American Studies, it is not. Children were not colour-coded at all until the early 20th century: in the era before domestic washing machines all babies wore white as a practical matter, since the only way of getting clothes clean was to boil them. What’s more, both boys and girls wore what were thought of as gender-neutral dresses. When nursery colours were introduced, pink was actually considered the more masculine colour, a pastel version of red, which was associated with strength. Blue, with its intimations of the Virgin Mary, constancy and faithfulness, symbolised femininity. It was not until the mid-1980s, when amplifying age and sex differences became a dominant children’s marketing strategy, that pink fully came into its own, when it began to seem inherently attractive to girls, part of what defined them as female, at least for the first few critical years. I had not realised how profoundly marketing trends dictated our perception of what is natural to kids, including our core beliefs about their psychological development. Take the toddler. I assumed that phase was something experts developed after years of research into children’s behaviour: wrong. Turns out, according to Daniel Cook, a historian of childhood consumerism, it was popularised as a marketing trick by clothing manufacturers in the 1930s. Trade publications counselled department stores that, in order to increase sales, they should create a “third stepping stone” between infant wear and older kids’ clothes. It was only after “toddler” became a common shoppers’ term that it evolved into a broadly accepted developmental stage. Splitting kids, or adults, into ever-tinier categories has proved a sure-fire way to boost profits. And one of the easiest ways to segment a market is to magnify gender differences – or invent them where they did not previously exist."],"questions":[{"num":26,"stem":"By saying “it is…the rainbow” (Line 3, Para. 1), the author means pink _____.","opts":{"A":"cannot explain girls’ lack of imagination","B":"should not be associated with girls’ innocence","C":"should not be the sole representation of girlhood","D":"cannot influence girls’ lives and interests"},"answer":"C","analysis":"【AI 解析】答案 [C]「should not be the sole representation of girlh…」。本题考查「By saying “it is…the rainbow” (Line 3, P…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"According to Paragraph 2, which of the following is true of colours?","opts":{"A":"Colours are encoded in girls’ DNA.","B":"Blue used to be regarded as the colour for girls.","C":"White is preferred by babies.","D":"Pink used to be a neutral colour in symbolising genders."},"answer":"B","analysis":"【AI 解析】答案 [B]「Blue used to be regarded as the colour for gir…」。本题考查「According to Paragraph 2, which of the f…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"The author suggests that our perception of children’s psychological development ___","opts":{"A":"the observation of children’s nature","B":"the marketing of products for children","C":"researches into children’s behaviour","D":"studies of childhood consumption"},"answer":"B","analysis":"【AI 解析】答案 [B]「the marketing of products for children」。本题考查「The author suggests that our perception …」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"We may learn from Paragraph 4 that department stores were advised to ___","opts":{"A":"classify consumers into smaller groups","B":"attach equal importance to different genders","C":"focus on infant wear and older kids’ clothes","D":"create some common shoppers’ terms"},"answer":"A","analysis":"【AI 解析】答案 [A]「classify consumers into smaller groups」。本题考查「We may learn from Paragraph 4 that depar…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"It can be concluded that girls’ attraction to pink seems to be _____.","opts":{"A":"fully understood by clothing manufacturers","B":"clearly explained by their inborn tendency","C":"mainly imposed by profit-driven businessmen","D":"well interpreted by psychological experts"},"answer":"C","analysis":"【AI 解析】答案 [C]「mainly imposed by profit-driven businessmen」。本题考查「It can be concluded that girls’ attracti…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["In 2010, a federal judge shook America’s biotech industry to its core. Companies had won patents for isolated DNA for decades – by 2005 some 20% of human genes were patented. But in March 2010 a judge ruled that genes were unpatentable. Executives were violently agitated. The Biotechnology Industry Organisation (BIO), a trade group, assured members that this was just a “preliminary step” in a longer battle. On July 29th they were relieved, at least temporarily. A federal appeals court overturned the prior decision, ruling that Myriad Genetics could indeed hold patents to two genes that help forecast a woman’s risk of breast cancer. The chief executive of Myriad, a company in Utah, said the ruling was a blessing to firms and patients alike. But as companies continue their attempts at personalised medicine, the courts will remain rather busy. The Myriad case itself is probably not over. Critics make three main arguments against gene patents: a gene is a product of nature, so it may not be patented; gene patents suppress innovation rather than reward it; and patents’ monopolies restrict access to genetic tests such as Myriad’s. A growing number seem to agree. Last year a federal task-force urged reform for patents related to genetic tests. In October the Department of Justice filed a brief in the Myriad case, arguing that an isolated DNA molecule “is no less a product of nature…than are cotton fibres that have been separated from cotton seeds.” Despite the appeals court’s decision, big questions remain unanswered. For example, it is unclear whether the sequencing of a whole genome violates the patents of individual genes within it. The case may yet reach the Supreme Court. As the industry advances, however, other suits may have an even greater impact. Companies are unlikely to file many more patents for human DNA molecules – most are already patented or in the public domain. Firms are now studying how genes interact, looking for correlations that might be used to determine the causes of disease or predict a drug’s efficacy. Companies are eager to win patents for “connecting the dots,” explains Hans Sauer, a lawyer for the BIO. Their success may be determined by a suit related to this issue, brought by the Mayo Clinic, which the Supreme Court will hear in its next term. The BIO recently held a convention which included sessions to coach lawyers on the shifting landscape for patents. Each meeting was packed."],"questions":[{"num":31,"stem":"It can be learned from Paragraph 1 that the biotech companies would like _____.","opts":{"A":"genes to be patentable","B":"the BIO to issue a warning","C":"their executives to be active","D":"judges to rule out gene patenting"},"answer":"A","analysis":"【AI 解析】答案 [A]「genes to be patentable」。本题考查「It can be learned from Paragraph 1 that …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"Those who are against gene patents believe that _____.","opts":{"A":"genetic tests are not reliable","B":"only man-made products are patentable","C":"patents on genes depend much on innovation","D":"courts should restrict access to genetic tests"},"answer":"B","analysis":"【AI 解析】答案 [B]「only man-made products are patentable」。本题考查「Those who are against gene patents belie…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"According to Hans Sauer, companies are eager to win patents for _____.","opts":{"A":"discovering gene interactions","B":"establishing disease correlations","C":"drawing pictures of genes","D":"identifying human DNA"},"answer":"A","analysis":"【AI 解析】答案 [A]「discovering gene interactions」。本题考查「According to Hans Sauer, companies are e…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"By saying “Each meeting was packed” (Line 4, Para. 6), the author means that ___","opts":{"A":"the supreme court was authoritative","B":"the BIO was a powerful organisation","C":"gene patenting was a great concern","D":"lawyers were keen to attend conventions"},"answer":"C","analysis":"【AI 解析】答案 [C]「gene patenting was a great concern」。本题考查「By saying “Each meeting was packed” (Lin…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"Generally speaking, the author’s attitude toward gene patenting is _____.","opts":{"A":"critical","B":"supportive","C":"scornful","D":"objective"},"answer":"D","analysis":"【AI 解析】答案 [D]「objective」。本题考查「Generally speaking, the author’s attitud…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["The great recession may be over, but this era of high joblessness is probably beginning. Before it ends, it will likely change the life course and character of a generation of young adults. And ultimately, it is likely to reshape our politics, our culture, and the character of our society for years. No one tries harder than the jobless to find silver linings in this national economic disaster. Many said that unemployment, while extremely painful, had improved them in some ways: they had become less materialistic and more financially prudent; they were more aware of the struggles of others. In limited respects, perhaps the recession will leave society better off. At the very least, it has awoken us from our national fever dream of easy riches and bigger houses, and put a necessary end to an era of reckless personal spending. But for the most part, these benefits seem thin, uncertain, and far off. In The Moral Consequences of Economic Growth, the economic historian Benjamin Friedman argues that both inside and outside the U.S., lengthy periods of economic stagnation or decline have almost always left society more mean-spirited and less inclusive, and have usually stopped or reversed the advance of rights and freedoms. Anti-immigrant sentiment typically increases, as does conflict between races and classes. Income inequality usually falls during a recession, but it has not shrunk in this one. Indeed, this period of economic weakness may reinforce class divides, and decrease opportunities to cross them – especially for young people. The research of Till Von Wachter, the economist at Columbia University, suggests that not all people graduating into a recession see their life chances dimmed: those with degrees from elite universities catch up fairly quickly to where they otherwise would have been if they had graduated in better times; it is the masses beneath them that are left behind. In the Internet age, it is particularly easy to see the resentment that has always been hidden within American society. More difficult, in the moment, is discerning precisely how these lean times are affecting society’s character. In many respects, the U.S. was more socially tolerant entering this recession than at any time in its history, and a variety of national polls on social conflict since then have shown mixed results. We will have to wait and see exactly how these hard times will reshape our social fabric. But they certainly will reshape it, and all the more so the longer they extend."],"questions":[{"num":36,"stem":"By saying “to find silver linings” (Line 1, Para. 2) the author suggests that the ___","opts":{"A":"seek subsidies from the government","B":"make profits from the troubled economy","C":"explore reasons for the unemployment","D":"look on the bright side of the recession"},"answer":"D","analysis":"【AI 解析】答案 [D]「look on the bright side of the recession」。本题考查「By saying “to find silver linings” (Line…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"According to Paragraph 2, the recession has made people _____.","opts":{"A":"struggle against each other","B":"realize the national dream","C":"challenge their prudence","D":"reconsider their lifestyle"},"answer":"D","analysis":"【AI 解析】答案 [D]「reconsider their lifestyle」。本题考查「According to Paragraph 2, the recession …」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"Benjamin Friedman believes that economic recessions may _____.","opts":{"A":"impose a heavier burden on immigrants","B":"bring out more evils of human nature","C":"promote the advance of rights and freedoms","D":"ease conflicts between races and classes"},"answer":"B","analysis":"【AI 解析】答案 [B]「bring out more evils of human nature」。本题考查「Benjamin Friedman believes that economic…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"The research of Till Von Wachter suggests that in the recession graduates from ___","opts":{"A":"lag behind the others due to decreased opportunities","B":"catch up quickly with experienced employees","C":"see their life chances as dimmed as the others’","D":"recover more quickly than the others"},"answer":"D","analysis":"【AI 解析】答案 [D]「recover more quickly than the others」。本题考查「The research of Till Von Wachter suggest…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"The author thinks that the influence of hard times on society is _____.","opts":{"A":"trivial","B":"positive","C":"certain","D":"destructive"},"answer":"C","analysis":"【AI 解析】答案 [C]「certain」。本题考查「The author thinks that the influence of …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by finding information from the left column that corresponds to each of the marked details given in the right column. There are two extra choices in the right column. Mark your answers on ANSWER SHEET 1. (10 points) “Universal history, the history of what man has accomplished in this world, is at bottom the History of the Great Men who have worked here,” wrote the Victorian sage Thomas Carlyle. Well, not any more it is not. Suddenly, Britain looks to have fallen out with its favorite historical form. This could be no more than a passing literary craze, but it also points to a broader truth about how we now approach the past: less concerned with learning from our forefathers and more interested in feeling their pain. Today, we want empathy, not inspiration. From the earliest days of the Renaissance, the writing of history meant recounting the exemplary lives of great men. In 1337, Petrarch began work on his rambling writing De Viris Illustribus – On Famous Men, highlighting the virtus (or virtue) of classical heroes. Petrarch celebrated their greatness in conquering fortune and rising to the top. This was the biographical tradition which Niccolò Machiavelli turned on its head. In The Prince, he championed cunning, ruthlessness, and boldness, rather than virtue, mercy and justice, as the skills of successful leaders. Over time, the attributes of greatness shifted. The Romantics commemorated the leading painters and authors of their day, stressing the uniqueness of the artist’s personal experience rather than public glory. By contrast, the Victorian author Samuel Smiles wrote Self -Help as a catalogue of the worthy lives of engineers, industrialists and explorers. “The valuable examples which they furnish of the power of self-help, of patient purpose, resolute working, and steadfast integrity, issuing in the formation of truly noble and manly character, exhibit,” wrote Smiles, “what it is in the power of each to accomplish for himself.” His biographies of James Watt, Richard Arkwright and Josiah Wedgwood were held up as beacons to guide the working man through his difficult life. This was all a bit bourgeois for Thomas Carlyle, who focused his biographies on the truly heroic lives of Martin Luther, Oliver Cromwell and Napoleon Bonaparte. These epochal figures represented lives hard to imitate, but to be acknowledged as possessing higher authority than mere mortals. Not everyone was convinced by such bombast. “The history of all hitherto existing society is the history of class struggles,” wrote Marx and Engels in The Communist Manifesto. For them, history did nothing, it possessed no immense wealth nor waged battles: “It is man, real, living man who does all that.” And history should be the story of the masses and their record of struggle, As such, it needed to appreciate the economic realities, the social contexts and power relations in which each epoch stood. For: “Men make their own history, but they do not make it just as they please; they do not make it under circumstances chosen by themselves, but under circumstances directly found, given and transmitted from the past.” This was the tradition which revolutionised our appreciation of the past. In place of Thomas Carlyle, Britain nurtured Christopher Hill, EP Thompson and Eric Hobsbawm. History from below stood alongside biographies of great men. Whole new realms of understanding – from gender to race to cultural studies – were opened up as scholars unpicked the multiplicity of lost societies. And it transformed public history too: downstairs became just as fascinating as upstairs."],"options":[{"key":"A","text":"emphasized the virtue of classical heroes."},{"key":"B","text":"highlighted the public glory of the leading artists."},{"key":"C","text":"focused on epochal figures whose lives were hard to imitate."},{"key":"D","text":"opened up new realms of understanding the great men in history."},{"key":"E","text":"held that history should be the story of the masses and their record of struggle."},{"key":"F","text":"dismissed virtue as unnecessary for successful leaders."},{"key":"G","text":"depicted the worthy lives of engineers, industrialists and explorers."}],"passage":["- **A.** emphasized the virtue of classical heroes. - **B.** highlighted the public glory of the leading artists. - **C.** focused on epochal figures whose lives were hard to imitate. - **D.** opened up new realms of understanding the great men in history. - **E.** held that history should be the story of the masses and their record of struggle. - **F.** dismissed virtue as unnecessary for successful leaders. - **G.** depicted the worthy lives of engineers, industrialists and explorers."],"questions":[{"num":41,"stem":"Petrarch __________","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「emphasized the virtue of classical heroes.」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":42,"stem":"Niccolò Machiavelli __________","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]「dismissed virtue as unnecessary for successful…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [F]。"},{"num":43,"stem":"Samuel Smiles __________","opts":{},"answer":"G","analysis":"【AI 解析】答案 [G]「depicted the worthy lives of engineers, indust…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [G]。"},{"num":44,"stem":"Thomas Carlyle __________","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「focused on epochal figures whose lives were ha…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"},{"num":45,"stem":"Marx and Engels __________","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「held that history should be the story of the m…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text from English into Chinese. Write your translation on ANSWER SHEET 2. (15 points) When people in developing countries worry about migration, they are usually concerned at the prospect of their best and brightest departure to Silicon Valley or to hospitals and universities in the developed world. These are the kind of workers that countries like Britain, Canada and Australia try to attract by using immigration rules that privilege college graduates. Lots of studies have found that well-educated people from developing countries are particularly likely to emigrate. A big survey of Indian households in 2004 found that nearly 40% of emigrants had more than a high-school education, compared with around 3.3% of all Indians over the age 25. This “brain drain” has long bothered policymakers in poor countries. They fear that it hurts their economies, depriving them of much-needed skilled workers who could have taught at their universities, worked in their hospitals and come up with clever new products for their factories to make."],"reference":"当发展中国家的民众为移民问题担忧时，他们通常担心的是自己国家最优秀、最聪明的人才流向硅谷或发达世界的医院和大学。正是这类人才，是英国、加拿大、澳大利亚等国试图通过给予大学毕业生优惠的移民政策而争相吸引的对象。大量研究表明，来自发展中国家的高学历人群尤其可能移居海外。2004 年对印度家庭的一项大型调查发现，将近 40% 的移民接受过高中以上的教育，而印度 25 岁以上人口中这一比例仅为 3.3% 左右。这种“人才流失”长期以来一直困扰着穷国的决策者。他们担心这会损害本国经济：国家因此失去急需的熟练人才——他们本可以在大学任教、在医院行医，并能为其工厂研发出精巧的新产品。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose you have found something wrong with the electronic dictionary that you bought from an online store the other day. Write an email to the customer service center to 1) make a complaint, and 2) demand a prompt solution. You should write about 100 words on ANSWER SHEET 2. Do not sign your own name at the end of the letter. Use “Zhang Wei” instead. Do not write the address. (10 points)"],"large":["**48.** Directions: Write an essay based on the following table. In your writing, you should 1) describe the table, and 2) give your comments. You should write at least 150 words. Write your essay on ANSWER SHEET 2. (15 points) **某公司员工工作满意度调查**","| 年龄组＼满意度 | 满意 | 不清楚 | 不满意 | |---|---|---|---| | ≤40 岁 | 16.7% | 50.0% | 33.3% | | 41~50 岁 | 0.0% | 36.0% | 64.0% | | >50 岁 | 40.0% | 50.0% | 10.0% |"],"small_ref":"Dear Sir or Madam,\n\nI am writing to complain about an electronic dictionary I purchased from your online store last week (order No. 12345).\n\nTo my disappointment, the screen often goes blank during use, and the pronunciation function does not work at all. Such defects have caused me great inconvenience, as I rely on the device for my daily English study.\n\nI therefore request that you either send me a new, properly functioning dictionary or give me a full refund within seven days. Please reply at your earliest convenience, or contact me at 1234-5678.\n\nThank you for your attention. I look forward to your prompt solution.\n\nYours faithfully,\nZhang Wei","large_ref":"The table shows the results of a survey on job satisfaction among employees of a company across three age groups. While 40% of employees over 50 are satisfied with their jobs, none of the employees aged 41 to 50 feel the same way, and 64% of them are dissatisfied. Among those under 40, only 16.7% report satisfaction.\n\nSeveral factors may explain the data. Middle-aged employees shoulder the heaviest pressures, being caught between career bottlenecks, family burdens and rising expectations, which partly accounts for their lowest satisfaction. Older employees, having achieved stability and nearing retirement, tend to be more content with their current positions.\n\nThe survey suggests that companies should pay particular attention to employees in their forties, offering fair promotion channels, flexible arrangements and psychological support. After all, a workforce that feels respected and fairly treated will serve the company far more effectively in the long run."},"label":"2012 年真题（AI 解析）"};

fficially over. Being average just won't earn you what it used to. It can't when so many more employers have so much more access to so much more above average cheap foreign labor, cheap robotics, cheap software, cheap automation and cheap genius. Therefore, everyone needs to find their extra - their unique value contribution that makes them stand out in whatever is their field of employment. Yes, new technology has been eating jobs forever, and always will. But there's been an acceleration. As Davidson notes, \"In the 10 years ending in 2009, [U.S.] factories shed workers so fast that they erased almost all the gains of the previous 70 years; roughly one out of every three manufacturing jobs - about 6 million in total - disappeared.\" There will always be change - new jobs, new products, new services. But the one thing we know for sure is that with each advance in globalization and the I. T. revolution, the best jobs will require workers to have more and better education to make themselves above average. In a world where average is officially over, there are many things we need to do to support employment, but nothing would be more important than passing some kind of G. I. Bill for the 2l8t century that ensures that every American has access to post-high school education."],"questions":[{"num":21,"stem":"The joke in Paragraph 1 is used to illustrate ___","opts":{"A":"the impact of technological advances","B":"the alleviation of job pressure","C":"the shrinkage of textile mills","D":"the decline of middle-class incomes"},"answer":"A","analysis":"【AI 解析】答案 [A]「the impact of technological advances」。本题考查「The joke in Paragraph 1 is used to illus…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"According to Paragraph 3, to be a successful employee, one has to ___","opts":{"A":"work on cheap software","B":"ask for a moderate salary","C":"adopt an average lifestyle","D":"contribute something unique"},"answer":"D","analysis":"【AI 解析】答案 [ \"uccelli di passaggio,\" birds of passage. Today, we are much more rigid about immigrants. We divide newcomers into two categories: legal or illegal, good or bad. We hail them as Americans in the making, or brand them as aliens to be kicked out. That framework has contr ibuted mightily to our broken immigration system and the long political paralysis over how to fix it. We don't need more categories, but we need to change the way we think about categories. We need to look beyond strict definitions of legal and illegal. To start, we can recognize the new birds of passage, those living and thriving in the gray areas. We might then begin to solve our immigration challenges. Crop pickers, violinists, construction workers, entrepreneurs, engineers, home health-care aides and physicists are among today's birds of passage. They are energetic participants in a global economy driven by the flow of work, money and ideas. They prefer to come and go as opportunity calls them. They can manage to have a job in one place and a family in another. With or without permission, they straddle laws, jurisdictions and identities with ease. We need them to imagine the United States as a place where they can be productive for a while without committing themselves to staying forever. We need them to feel that home can be both here and there and that they can belong to two nations honorably. Accommodating this new world of people in motion will require new attitudes on both sides of the immigration battle. Looking beyond the culture war logic of right or wrong means opening up the middle ground and understanding that managing immigration today requires multiple paths and multiple outcomes, including some that are not easy to accomplish legally in the existing system."],"questions":[{"num":26,"stem":"\"Birds of passage\" refers to those who ___","opts":{"A":"stay in a foreign country temporarily","B":"leave their home countries for good","C":"immigrate across the Atlantic","D":"find permanent jobs overseas"},"answer":"A","analysis":"【AI 解析】答案 [A]「stay in a foreign country temporarily」。本题考查「\"Birds of passage\" refers to those who _…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"It 1s implied in Paragraph 2 that the current immigration system in the US ___","opts":{"A":"needs new immigrant categories","B":"has loosened control over immigrants","C":"should be adapted to meet challenges","D":"has been fixed via political means"},"answer":"C","analysis":"【AI 解析】答案 [C]「should be adapted to meet challenges」。本题考查「It 1s implied in Paragraph 2 that the cu…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"According to the author, today's birds of passage want ___","opts":{"A":"financial incentives","B":"a global recognition","C":"the freedom to stay and leave","D":"opportunities to get regular jobs"},"answer":"C","analysis":"【AI 解析】答案 [C]「the freedom to stay and leave」。本题考查「According to the author, today's birds o…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"The author suggests that the birds of passage today should be treated ___","opts":{"A":"as faithful partners","B":"with legal tolerance","C":"with economic favors","D":"as mighty rivals"},"answer":"B","analysis":"【AI 解析】答案 [B]「with legal tolerance」。本题考查「The author suggests that the birds of pa…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"The most appropriate title for this text would be ___","opts":{"A":"Come and Go: Big Mistake","B":"Living and Thriving: Great Risk","C":"With or Without: Great Risk","D":"Legal or Illegal: Big Mistake"},"answer":"D","analysis":"【AI 解析】答案 [D]「Legal or Illegal: Big Mistake」。本题考查「The most appropriate title for this text…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Scientists have found that although we are prone to snap overreactions, if we take a moment and think about how we are likely to react, we can reduce or even eliminate the negative effects of our quick, hard-wired responses. Snap decisions can be important defense mechanisms; if we are judging whether someone is dangerous, our brains and bodies are hard-wired to react very quickly, within milliseconds. But we need more time to assess other factors. To accurately tell whether someone is sociable, studies show, we need at least a minute, preferably five. It takes a while to judge complex aspects of personality, like neuroticism or open -mindedness. But snap decisions in reaction to rapid stimuli aren't exclusive to the interpersonal realm. Psychologists at the University of Toronto found that viewing a fast-food logo for just a few milliseconds primes us to read 20 percent faster, even though reading has little to do with eating. We unconsciously associate fast food with speed and impatience and carry those impulses into whatever else we're doing, Subjects exposed to fast-food flashes also tend to think a musical piece lasts too long. Yet we can reverse such influences. If we know we will overreact to consumer products or housing options when we see a happy face ( one reason good sales representatives and real estate agents are always smiling), we can take a moment before buying. If we know female job screeners are more likely to reject attractive female applicants, we can help screeners understand their biases - or hire outside screeners. John Gortman, the marriage expert, explains that we quickly \"thin slice\" information reliably only after we ground such snap reactions in \"thick sliced\" long-term study. When Dr. Gortman really wants to assess whether a couple will stay together, he invites them to his island retreat for a much longer evaluation: two days, not two seconds. Our ability to mute our hard-wired reactions by pausing is what differentiates us from animals: dogs can think about the future only intermittently or for a few minutes. But historically we have spent about 12 percent of our days contemplating the longer term. Although technology might change the way we react, it hasn't changed our nature. We still have the imaginative capacity to rise above temptation and reverse the high-speed trend."],"questions":[{"num":31,"stem":"The time needed in making decisions may ___","opts":{"A":"predetermine the accuracy of our judgment","B":"prove the complexity of our brain reaction","C":"depend on the importance of the assessment","D":"vary according to the urgency of the situation"},"answer":"D","analysis":"【AI 解析】答案 [D]「vary according to the urgency of the situation」。本题考查「The time needed in making decisions may …」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"Our reaction to a fast-food logo shows that snap decisions ___","opts":{"A":"can be associative","B":"are not unconscious","C":"can be dangerous","D":"are not impulsive"},"answer":"A","analysis":"【AI 解析】答案 [A]「can be associative」。本题考查「Our reaction to a fast-food logo shows t…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"To reverse the negative influences of snap decisions, we should ___","opts":{"A":"trust our first impression","B":"think before we act","C":"do as people usually do","D":"ask for expert advice"},"answer":"B","analysis":"【AI 解析】答案 [B]「think before we act」。本题考查「To reverse the negative influences of sn…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"John Gottman says that reliable snap reactions are based on ___","opts":{"A":"critical assessment","B":"\"thin sliced\" study","C":"adequate information","D":"sensible explanation"},"answer":"C","analysis":"【AI 解析】答案 [C]「adequate information」。本题考查「John Gottman says that reliable snap rea…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"The author's attitude toward reversing the high-speed trend is ___","opts":{"A":"tolerant","B":"optimistic","C":"uncertain","D":"doubtful"},"answer":"B","analysis":"【AI 解析】答案 [B]「optimistic」。本题考查「The author's attitude toward reversing t…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Europe is not a gender-equality heaven. In particular, the corporate workplace will never be completely family-friendly until women are part of senior management decisions, and Europe's top corporate-governance positions remain overwhelmingly male. Indeed, women hold only 14 per cent of positions on European corporate boards. The European Union is now considering legislation to compel corporate boards to maintain a certain proportion of women - up to 60 per cent. This proposed mandate was born of frustration. Last year, European Commission Vice President Viviane Reding issued a call to voluntary action. Reding invited corporations to sign up for gender balance goals of 40 per cent female board membership. But her appeal was considered a failure: only 24 companies took it up. Do we need quotas to ensure that women can continue to climb the corporate ladder fairly as they balance work and family? \"Personally, I don't like quotas,\" Reding said recently. \"But I like what the quotas do.\" Quotas get action: they \"open the way to equality and they break through the glass ceiling,\" according to Reding, a result seen in France and other countries with legally binding provisions on placing women in top business positions. I understand Reding's reluctance - and her frustration. I don't like quotas either; they run counter to my belief in meritocracy, governance by the capable. But, when one considers the obstacles to achieving the meritocratic ideal, it does look as if a fairer world must be temporarily ordered. After all, four decades of evidence has now shown that corporations in Europe as well as the US are evading the meritocratic hiring and promotion of women to top positions - no matter how much \"soft pressure\" is put upon them. When women do break through to the summit of corporate power - as, for example, Sheryl Sandberg recently did at Facebook - they attract massive attention precisely because they remain the exception to the rule. If appropriate public policies were in place to help all women - whether CEOs or their children's caregivers - and all families, Sandberg would be no more newsworthy than any other highly capable person living in a more just society."],"questions":[{"num":36,"stem":"In the European corporate workplace, generally ___","opts":{"A":"women take the lead","B":"men have the final say","C":"corporate governance is overwhelmed","D":"senior management is family-friendly"},"answer":"B","analysis":"【AI 解析】答案 [B]「men have the final say」。本题考查「In the European corporate workplace, gen…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"The European Union's intended legislation is ___","opts":{"A":"a reflection of gender balance","B":"a response to Reding's call","C":"a reluctant choice","D":"a voluntary action"},"answer":"C","analysis":"【AI 解析】答案 [C]「a reluctant choice」。本题考查「The European Union's intended legislatio…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"According to Reding, quotas may help women ___","opts":{"A":"get top business positions","B":"see through the glass ceiling","C":"balance work and family","D":"anticipate legal results"},"answer":"A","analysis":"【AI 解析】答案 [A]「get top business positions」。本题考查「According to Reding, quotas may help wom…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"The author's attitude toward Reding's appeal is one of --- ___","opts":{"A":"skepticism","B":"objectiveness","C":"indifference","D":"approval"},"answer":"D","analysis":"【AI 解析】答案 [D]「approval」。本题考查「The author's attitude toward Reding's ap…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"Women entering top management become headlines due to the lack of ___","opts":{"A":"more social justice","B":"massive media attention","C":"suitable public policies","D":"greater \"soft pressure\""},"answer":"C","analysis":"【AI 解析】答案 [C]「suitable public policies」。本题考查「Women entering top management become hea…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by choosing the most suitable subtitle from the list A - G for each numbered paragraph ( 41 - 45). There are two extra subtitles which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)"],"options":[{"key":"A","text":"Live like a peasant"},{"key":"B","text":"Balance your diet"},{"key":"C","text":"Shopkeepers are your friends"},{"key":"D","text":"Remember to treat yourself"},{"key":"E","text":"Stick to what you need"},{"key":"F","text":"Planning is everything"},{"key":"G","text":"Waste not, want not"}],"passage":["- **A.** Live like a peasant - **B.** Balance your diet - **C.** Shopkeepers are your friends - **D.** Remember to treat yourself - **E.** Stick to what you need - **F.** Planning is everything - **G.** Waste not, want not The hugely popular blog the Skint Foodie chronicles how Tony balances his love of good food with living on benefits. After bills, Tony has £ 60 a week to spend, £ 40 of which goes on food, but 10 years ago he was earning £ 130,000 a year working in corporate communications and eating at London's best restaurants at least twice a week. Then his marriage failed, his career burned out and his drinking became serious. \"The community mental health team saved my life. And I felt like that again, to a certain degree, when people responded to the blog so well. It gave me the validation and confidence that I'd lost. But it's still a day-by-day thing.\" Now he's living in a council flat and fielding offers from literary agents. He's feeling positive, but he' 11 carry on blogging - not about eating as cheaply as you can - \"there are so many people in a much worse state, with barely any money to spend on food\" - but eating well on a budget. Here's his advice for economical foodies."],"questions":[{"num":41,"stem":"Impulsive spending isn't an option, so plan your week's menu in advance, making shopping lists for your ingredients in their exact quantities. I have an Excel template for a week of breakfast, lunch and dinner. Stop laughing: it's not just cost effective but helps you balance your diet. It's also a good idea to shop daily instead of ( V 14 yf ) weekly, because, being human, you'll sometimes change your mind about what you fancy.","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]「Planning is everything」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [F]。"},{"num":42,"stem":"This is where supermarkets and their anonymity come in handy. With them, there's not the same embarrassment as when buying one carrot in a little greengrocer. And if you plan properly, you'll know that you only need, say, 350g of shin of beef and six rashers of bacon, not whatever weight is pre-packed in the supermarket chiller.","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「Stick to what you need」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"},{"num":43,"stem":"You may proudly claim to only have frozen peas in the freezer - that's not good enough. Mine is filled with leftovers, bread, stock, meat and fish. Planning ahead should eliminate wastage, but if you have surplus vegetables you'll do a vegetable soup, and all fruits threatening to \"go off' will be cooked or juiced.","opts":{},"answer":"G","analysis":"【AI 解析】答案 [G]「Waste not, want not」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [G]。"},{"num":44,"stem":"Everyone says this, but it really is a top tip for frugal eaters. Shop at butchers, delis and fish-sellers regularly, even for small things, and be super friendly. Soon you'll feel comfortable asking if they've any knuckles of ham for soups and stews, or beef bones, chicken carcasses and fish heads for stock which, more often than not, they'll let you have for free.","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「Shopkeepers are your friends」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"},{"num":45,"stem":"You won't be eating out a lot, but save your pennies and once every few months treat yourself to a set lunch at a good restaurant - £ 1. 7 5 a week for three months gives you £ 21 - more than enough for a three-course lunch at Michelin-starred Arbutus. It's £ 16.95 there - or £ 12.99 for a large pizza from Domino's: I know which I'd rather eat.","opts":{},"answer":"D","analysis":"【AI 解析】答案 [D]「Remember to treat yourself」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [D]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET. ( 15 points) I can pick a date from the past 53 years and know instantly where I was, what happened in the news and even the day of the week. I've been able to do this since I was four. I never feel overwhelmed with the amount of information my brain absorbs. My mind seems to be able to cope and the information is stored away neatly. When I think of a sad memory, I do what everybody does - try to put it to one side. I don't think it's harder for me just because my memory is clearer. Powerful memory doesn't make my emotions any more acute or vivid. I can recall the day my grandfather died and the sadness I felt when we went to the hospital the day before. I also remember that the musical play Hair opened on Broadway on the same day - they both just pop into my mind in the same way."],"reference":"我可以从过去 53 年中任选一个日期，然后立刻回想起那天我在什么地方、新闻里发生了什么，甚至那天是星期几。我从四岁起就有这种能力。我从不因大脑吸收的信息量大而感到不堪重负。我的头脑似乎能够从容应对，信息被井井有条地储存起来。当想起一段悲伤的往事时，我会像所有人一样，尽量把它放到一边。我并不认为仅仅因为我的记忆更清晰，这件事对我来说就更难。超强的记忆力并没有让我的情感变得更加敏锐或深刻。我能记得祖父去世的那一天，以及前一天我们去医院时我所感到的悲伤；我也记得音乐剧《毛发》于同一天在百老汇首演——它们都以同样的方式一下子涌上我的心头。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose your class is to hold a charity sale for kids in need of help. Write your classmates an email to 1) inform them about the details, and 2) encourage them to participate. You should write about 100 words on the ANSWER SHEET. Do not use your own name. Use \"Li Ming\" instead. Do not write your address. (10 points)"],"large":["**48.** Directions: Write an essay based on the following chart. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points) 100% 88.24% 80% A $ 60%","**某高校学生兼职情况**（人数百分比）","| 大一 | 大二 | 大三 | 大四 | |---|---|---|---| | 67.77% | 71.13% | 71.93% | 88.24% |"],"small_ref":"Dear classmates,\n\nI am writing to inform you that our class will hold a charity sale on the playground next Friday afternoon to raise money for children in remote mountainous areas who cannot afford schooling.\n\nThe sale will start at 2 p.m. and last about three hours. You are welcome to donate books, stationery, toys or handicrafts, which will be sold at the stalls. All proceeds will be sent to the children through a local charity organization.\n\nThis is a meaningful chance to help those in need, and every contribution, however small, counts. I sincerely hope you will take an active part. Please contact me before Wednesday if you have items to donate.\n\nThank you for your kindness.\n\nYours,\nLi Ming","large_ref":"The chart reveals the percentages of undergraduates doing part-time jobs in a university from their first to fourth year: 67.77% of freshmen, 71.13% of sophomores, 71.93% of juniors and 88.24% of seniors take part-time jobs, showing a steady upward trend.\n\nThe figures are easy to interpret. As students approach graduation, they feel an increasing need to gain work experience and achieve financial independence, so more and more of them seek part-time positions. The emphasis employers place on practical experience further pushes students to enter the workplace early.\n\nPart-time jobs, in my view, benefit students by sharpening their social skills and helping them understand society. Nevertheless, students should strike a balance between work and study, since academic performance remains the primary task at university. Only in this way can part-time experience truly prepare them for their future careers."},"label":"2013 年真题（AI 解析）"};

ney on experiences, say Ms Dunn and Mr Norton, like interesting trips, unique meals or even going to the cinema. These purchases often become more valuable with time - as stories or memories - particularly if they involve feeling more connected to others. This slim volume is packed with tips to help wage slaves as well as lottery winners get the most \"happiness bang for your buck.\" It seems most people would be better off if they could shorten their commutes to work, spend more time with friends and family and less of it watching television (something the average American spends a whopping two months a year doing, and is hardly jollier for it). Buying gifts or giving to charity is often more pleasurable than purchasing things for oneself, and luxuries are most enjoyable when they are consumed sparingly. This is apparently the reason McDonald's restricts the availability of its popular McRib - a marketing trick that has turned the pork sandwich into an object of obsession. Readers of Happy Money are clearly a privileged lot, anxious about fulfilment, not hunger. Money may not quite buy happiness, but people in wealthier countries are generally happier than those in poor ones. Yet the link between feeling good and spending money on others can be seen among rich and poor people around the world, and scarcity enhances the pleasure of most things for most people. Not everyone will agree with the authors' policy ideas, which range from mandating more holiday time to reducing tax incentives for American homebuyers. But most people will come away from this book believing it was money well spent."],"questions":[{"num":21,"stem":"According to Dunn and Norton, which of the following is the most rewarding ___","opts":{"A":"A big house.","B":"A special tour.","C":"A stylish car.","D":"A rich meal."},"answer":"B","analysis":"【AI 解析】答案 [B]「A special tour.」。本题考查「According to Dunn and Norton, which of t…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22 this. Social psychologists have amassed oceans of research into what they call the \"above average effect\", or \"illusory superiority\", and shown that, for example, 70% of us rate ourselves as above average in leadership, 93% in driving and 85% at getting on well with others - all obviously statistical impossibilities. We rose-tint our memories and put ourselves into self-affirming situations. We become defensive when criticised, and apply negative stereotypes to others to boost our own esteem. We stalk around thinking we're hot stuff. Psychologist and behavioural scientist Nicholas Epley oversaw a key study into self-enhancement and attractiveness. Rather than have people simply rate their beauty compared with others, he asked them to identify an original photograph of themselves from a lineup including versions that had been altered to appear more and less attractive. Visual recognition, reads the study, is \"an automatic psychological process, occurring rapidly and intuitively with little or no apparent conscious deliberation\". If the subjects quickly chose a falsely flattering image - which most did - they genuinely believed it was really how they looked. Epley found no significant gender difference in responses. Nor was there any evidence that those who self-enhanced the most (that is, the participants who thought the most positively doctored pictures were real) were doing so to make up for profound insecurities. In fact, those who thought that the images higher up the attractiveness scale were real directly corresponded with those who showed other markers for having higher self-esteem. \"I don't think the findings that we have are any evidence of personal delusion,\" says Epley. \"It's a reflection simply of people generally thinking well of themselves.\" If you are depressed, you won't be self-enhancing. Knowing the results of Epley's study, it makes sense that many people hate photographs of themselves viscerally - on one level, they don't even recognise the person in the picture as themselves. Facebook, therefore, is a self-enhancer's paradise, where people can share only the most flattering photos, the cream of their wit, style, beauty, intellect and lifestyles. It's not that people's profiles are dishonest, says Catalina Toma of Wisconsin-Madison University, \"but they portray an idealised version of themselves.\""],"questions":[{"num":26,"stem":"According to the first paragraph, social psychologists have found that ___","opts":{"A":"our self-ratings are unrealistically high","B":"illusory superiority is a baseless effect","C":"our need for leadership is unnatural","D":"self-enhancing strategies are ineffective"},"answer":"A","analysis":"【AI 解析】答案 [A]「our self-ratings are unrealistically high」。本题考查「According to the first paragraph, social…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"Visual recognition is believed to be people's ___","opts":{"A":"rapid matching","B":"conscious choice","C":"intuitive response","D":"automatic self-defence"},"answer":"C","analysis":"【AI 解析】答案 [C]「intuitive response」。本题考查「Visual recognition is believed to be peo…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"Epley found that people with higher self-esteem tended to ___","opts":{"A":"underestimate their insecurities","B":"believe in their attractiveness","C":"cover up their depressions","D":"oversimplify their illusions"},"answer":"B","analysis":"【AI 解析】答案 [B]「believe in their attractiveness」。本题考查「Epley found that people with higher self…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"The word \"viscerally\" (Line 2, Para.5) is closest in meaning to ___","opts":{"A":"instinctively","B":"occasionally","C":"particularly","D":"aggressively"},"answer":"A","analysis":"【AI 解析】答案 [A]「instinctively」。本题考查「The word \"viscerally\" (Line 2, Para.5) i…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"It can be inferred that Facebook is a self-enhancer's paradise because people ___","opts":{"A":"present their dishonest profiles","B":"define their traditional lifestyles","C":"share their intellectual pursuits","D":"withhold their unflattering sides"},"answer":"D","analysis":"【AI 解析】答案 [D]「withhold their unflattering sides」。本题考查「It can be inferred that Facebook is a se…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["The concept of man versus machine is at least as old as the industrial revolution, but this phenomenon tends to be most acutely felt during economic downturns and fragile recoveries. And yet, it would be a mistake to think we are right now simply experiencing the painful side of a boom and bust cycle. Certain jobs have gone away for good, outmoded by machines. Since technology has such an insatiable appetite for eating up human jobs, this phenomenon will continue to restructure our economy in ways we cannot immediately foresee. When there is rapid improvement in the price and performance of technology, jobs that were once thought to be immune from automation suddenly become threatened. This argument has attracted a lot of attention, via the success of the book Race Against the Machine, by Erik Brynjolfsson and Andrew McAfee, who both hail from MIT's Center for Digital Business. This is a powerful argument, and a scary one. And yet, John Hagel, author of The Power of Pull and other books, says Brynjolfsson and McAfee miss the reason why these jobs are so vulnerable to technology in the first place. Hagel says we have designed jobs in the U.S. that tend to be \"tightly scripted\" and \"highly standardized\" ones that leave no room for \"individual initiative or creativity\". In short, these are the types of jobs that machines can perform much better at than human beings. That is how we have put a giant target sign on the backs of American workers, Hagel says. It's time to reinvent the formula for how work is conducted, since we are still relying on a very 20th century notion of work, Hagel says. In our rapidly changing economy, we more than ever need people in the workplace who can take initiative and exercise their imagination \"to respond to unexpected events\". That is not something machines are good at. They are designed to perform very predictable activities. As Hagel notes, Brynjolfsson and McAfee indeed touched on this point in their book. We need to reframe race against the machine as race with the machine. In other words, we need to look at the ways in which machines can augment human labor rather than replace it. So then the problem is not really about technology, but rather, \"how do we innovate our institutions and our work practices?\""],"questions":[{"num":31,"stem":"According to the first paragraph, economic downturns would ___","opts":{"A":"ease the competition of man vs. machine","B":"highlight machines' threat to human jobs","C":"provoke a painful technological revolution","D":"outmode our current economic structure"},"answer":"B","analysis":"【AI 解析】答案 [B]「highlight machines' threat to human jobs」。本题考查「According to the first paragraph, econom…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"The authors of Race Against the Machine argue that ___","opts":{"A":"technology is diminishing man's job opportunities","B":"automation is accelerating technological development","C":"certain jobs will remain intact after automation","D":"man will finally win the race against machine"},"answer":"A","analysis":"【AI 解析】答案 [A]「technology is diminishing man's job opportunit…」。本题考查「The authors of Race Against the Machine …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"Hagel argues that jobs in the U.S. are often ___","opts":{"A":"performed by innovative minds","B":"scripted with an individual style","C":"standardized without a clear target","D":"designed against human creativity"},"answer":"D","analysis":"【AI 解析】答案 [D]「designed against human creativity」。本题考查「Hagel argues that jobs in the U.S. are o…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"According to the last paragraph, Brynjolfsson and McAfee discussed ___","opts":{"A":"the predictability of machine behavior in practice","B":"the formula for how work is conducted efficiently","C":"the ways machines replace human labor in modem times","D":"the necessity of human involvement in the workplace"},"answer":"D","analysis":"【AI 解析】答案 [D]「the necessity of human involvement in the work…」。本题考查「According to the last paragraph, Brynjol…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"Which of the following could be the most appropriate title for the text?","opts":{"A":"How to Innovate Our Work Practices?","B":"Machines Will Replace Human Labor","C":"Can We Win the Race Against Machines?","D":"Economic Downturns Stimulate Innovations"},"answer":"C","analysis":"【AI 解析】答案 [C]「Can We Win the Race Against Machines?」。本题考查「Which of the following could be the most…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["When the government talks about infrastructure contributing to the economy the focus is usually on roads, railways, broadband and energy. Housing is seldom mentioned. Why is that? To some extent the housing sector must shoulder the blame. We have not been good at communicating the real value that housing can contribute to economic growth. Then there is the scale of the typical housing project. It is hard to shove for attention among multibillion-pound infrastructure projects, so it is inevitable that the attention is focused elsewhere. But perhaps the most significant reason is that the issue has always been so politically charged. Nevertheless, the affordable housing situation is desperate. Waiting lists increase all the time and we are simply not building enough new homes. The comprehensive spending review offers an opportunity for the government to help rectify this. It needs to put historical prejudices to one side and take some steps to address our urgent housing need. There are some indications that it 1s preparing to do just that. The communities minister, Don Foster, has hinted that George Osborne, Chancellor of the Exchequer, may introduce more flexibility to the current cap on the amount that local authorities can borrow against their housing stock debt. Evidence shows that 60,000 extra new homes could be built over the next five years if the cap were lifted, increasing GDP by 0.6%. Ministers should also look at creating greater certainty m the rental environment, which would have a significant impact on the ability of registered providers to fund new developments from revenues. But it is not just down to the government. While these measures would be welcome in the short term, we must face up to the fact that the existing £ 4.5bn programme of grants to fund new affordable housing, set to expire in 2015, is unlikely to be extended beyond then. The Labour party has recently announced that it will retain a large part of the coalition's spending plans if it returns to power. The housing sector needs to accept that we are very unlikely to ever return to the era of large-scale public grants. We need to adjust to this changing climate. While the government's commitment to long-term funding may have changed, the very pressing need for more affordable housing is real and is not going away ."],"questions":[{"num":36,"stem":"The author believes that the housing sector ___","opts":{"A":"has attracted much attention","B":"involves certain political factors","C":"shoulders too much responsibility","D":"has lost its real value in economy"},"answer":"B","analysis":"【AI 解析】答案 [B]「involves certain political factors」。本题考查「The author believes that the housing sec…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"It can be learned that affordable housing has ___","opts":{"A":"increased its home supply","B":"offered spending opportunities","C":"suffered government biases","D":"disappointed the government"},"answer":"C","analysis":"【AI 解析】答案 [C]「suffered government biases」。本题考查「It can be learned that affordable housin…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"According to Paragraph 5, George Osborne may ___","opts":{"A":"allow greater government debt for housing","B":"stop local authorities from building homes","C":"prepare to reduce housing stock debt","D":"release a lifted GDP growth forecast"},"answer":"A","analysis":"【AI 解析】答案 [A]「allow greater government debt for housing」。本题考查「According to Paragraph 5, George Osborne…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"It can be inferred that a stable rental environment would --- ___","opts":{"A":"lower the costs of registered providers","B":"lessen the impact of government interference","C":"contribute to funding new developments","D":"relieve the ministers of responsibilities"},"answer":"C","analysis":"【AI 解析】答案 [C]「contribute to funding new developments」。本题考查「It can be inferred that a stable rental …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"The author believes that after 2015, the government may ___","opts":{"A":"implement more policies to support housing","B":"review the need for large-scale public grants","C":"renew the affordable housing grants programme","D":"stop generous funding to the housing sector"},"answer":"D","analysis":"【AI 解析】答案 [D]「stop generous funding to the housing sector」。本题考查「The author believes that after 2015, the…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEERT. (10 points) Emerging in the late Sixties and reaching a peak in the Seventies, Land Art was one of a range of new forms, including Body Art, Performance Art, Action Art and Installation Art, which pushed art beyond the traditional confines of the studio and gallery. Rather than portraying landscape, land artists used the physical substance of the land itself as their medium. The British land art, typified by Richard Long's piece, was not only more domestically scaled, but a lot quirkier than its American counterpart. Indeed, while you might assume that an exhibition of Land Art would consist only of records of works rather than the works themselves, Long's photograph of his work is the work. Since his \"action\" is in the past, the photograph is its sole embodiment. That might seem rather an obscure point, but it sets the tone for an exhibition that contains a lot of black-and-white photographs and relatively few natural objects. Long is Britain's best-known Land Artist and his Stone Circle, a perfect ring of purplish rocks from Portishead beach laid out on the gallery floor, represents the elegant, rarefied side of the form. The Boyle Family, on the other hand, stand for its dirty, urban aspect. Comprising artists Mark Boyle and Joan Hills and their children, they recreated random sections of the British landscape on gallery walls. Their Olaf Street Study, a square of brick-strewn waste ground, is one of the few works here to embrace the commonplaceness that characterises most of our experience of the landscape most of the time. Parks feature, particularly in the earlier works, such as John Hilliard's very funny Across the Park, in which a long-haired stroller is variously smiled at by a pretty girl and unwittingly assaulted in a sequence of images that tum out to be different parts of the same photograph. Generally however British land artists preferred to get away from towns, gravitating towards landscapes that are traditionally considered beautiful such as the Lake District or the Wiltshire Downs. While it probably wasn't apparent at the time, much of this work is permeated by a spirit of romantic escapism that the likes of Wordsworth would have readily understood. Derek Jarman's yellow-tinted film Towards Avebury, a collection of long, mostly still shots of the Wiltshire landscape, evokes a tradition of English landscape painting stretching from . 1 1 . (¥ 14 flt\") Samuel Palmer to Paul Nash. In the case of Hamish Fulton, you can't help feeling that the Scottish artist has simply found a way of making his love of walking pay. A typical work, such as Seven Days, consists of a single beautiful black-and-white photograph taken on an epic walk, with the mileage and number of days taken listed beneath. British Land Art as shown in this well selected, but relatively modestly scaled exhibition wasn't about imposing on the landscape, more a kind of landscape-orientated light conceptual art created passing through. It had its origins in the great outdoors, but the results were as gallery-bound as the paintings of Turner and Constable."],"options":[{"key":"A","text":"originates from a long walk that the artist"},{"key":"B","text":"illustrates a kind of landscape-orientated"},{"key":"C","text":"reminds people of the English landscape"},{"key":"D","text":"represents the elegance of the British land"},{"key":"E","text":"depicts the ordinary side of the British"},{"key":"F","text":"embodies a romantic escape into the"},{"key":"G","text":"contains images from different parts of the took. light conceptual art. painting tradition. art. land art. Scottish outdoors. same photograph..12. C-*-- 14 Jr )"}],"passage":["- **A.** originates from a long walk that the artist - **B.** illustrates a kind of landscape-orientated - **C.** reminds people of the English landscape - **D.** represents the elegance of the British land - **E.** depicts the ordinary side of the British - **F.** embodies a romantic escape into the - **G.** contains images from different parts of the took. light conceptual art. painting tradition. art. land art. Scottish outdoors. same photograph..12. C-*-- 14 Jr )"],"questions":[{"num":41,"stem":"Stone Circle __________","opts":{},"answer":"D","analysis":"【AI 解析】答案 [D]「represents the elegance of the British land」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [D]。"},{"num":42,"stem":"Olaf Street Study __________","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「depicts the ordinary side of the British」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"},{"num":43,"stem":"Across the Park __________","opts":{},"answer":"G","analysis":"【AI 解析】答案 [G]「contains images from different parts of the to…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [G]。"},{"num":44,"stem":"Towards Avebury __________","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「reminds people of the English landscape」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"},{"num":45,"stem":"Seven Days __________","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「originates from a long walk that the artist」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET.( 15 points) Most people would define optimism as being endlessly happy, with a glass that's perpetually half full. But that's exactly the kind of false cheerfulness that positive psychologists wouldn't recommend. \"Healthy optimism means being in touch with reality,\" says Tal Ben-Shahar, a Harvard professor. According to Ben-Shahar, realistic optimists are those who make the best of things that happen, but not those who believe everything happens for the best. Ben-Shahar uses three optimistic exercises. When he feels down - say, after giving a bad lecture - he grants himself permission to be human. He reminds himself that not every lecture can be a Nobel winner; some will be less effective than others. Next is reconstruction. He analyzes the weak lecture, learning lessons for the future about what works and what doesn't. Finally, there is perspective, which involves acknowledging that in the grand scheme of life, one lecture really doesn't matter."],"reference":"大多数人把乐观定义为永无止境的快乐，总觉得杯子里的水有一半是满的。但这恰恰是积极心理学家所不推荐的那种虚假的快乐。哈佛大学教授泰勒·本-沙哈尔说：“健康的乐观意味着不脱离现实。”按照本-沙哈尔的说法，现实的乐观主义者是那些尽力把眼前事情做好的人，而不是相信一切事情都会朝着最好的方向发展的人。本-沙哈尔使用三种乐观训练法。当他情绪低落时——比如一次讲座讲得很糟糕——他允许自己做个凡人；他提醒自己，不是每次讲座都能得诺贝尔奖，有些讲座总会逊色一些。其次是重塑：他会分析那次失败的讲座，汲取经验教训，为将来弄清什么行得通、什么行不通。最后是换个角度看待问题，即承认在人生的宏大蓝图中，一次讲座真的无关紧要。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose you are going to study abroad and share an apartment with John, a local student. Write him an email to 1) tell him about your living habits, and 2) ask for advice about living there. You should write about 100 words on the ANSWER SHEET. Do not use your own name. Use \"Li Ming\" instead. Do not write your address. ( 10 points)"],"large":["**48.** Directions: Write an essay based on the following chart. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points) 2 #JxU!A D D 3tJ-A D 1000 666 674 ,,...__ µ:::: 600 .. 458 1990!rf 2000!rf 2010!rf . 14. C-*-- 14 Jr)","**20 年间中国城镇人口与乡村人口变化图**（单位：百万）","| 年份 | 城镇人口 | 乡村人口 | |---|---|---| | 1990 年 | 300 | 834 | | 2000 年 | 458 | 807 | | 2010 年 | 666 | 674 |"],"small_ref":"Dear John,\n\nI am Li Ming, your future roommate. As I will soon arrive in your city to study, I would like to share my living habits and ask for your advice.\n\nFirst, I am an early riser and usually go to bed before eleven, so I hope our schedules will not clash. Second, I enjoy keeping my room tidy and would appreciate it if we could work out a cleaning rota together. Besides studying, I love cooking and would be happy to share Chinese dishes with you.\n\nCould you tell me what appliances the apartment provides and whether I need to bring my own bedding? Any suggestions about settling in would be greatly appreciated.\n\nLooking forward to meeting you soon.\n\nBest wishes,\nLi Ming","large_ref":"The chart illustrates the changes of China's urban and rural populations over two decades. From 1990 to 2010, the urban population grew rapidly from 300 million to 666 million, whereas the rural population declined steadily from 834 million to 674 million, and the two lines are clearly converging.\n\nThe figures mirror the profound transformation of Chinese society. The process of urbanization, driven by industrial development and better job opportunities in cities, has attracted hundreds of millions of people from the countryside. Meanwhile, improvements in agricultural productivity have released surplus rural labor.\n\nUrbanization brings benefits such as economic growth and modern lifestyles, but it also poses challenges, including housing pressure, traffic congestion and the care of left-behind children and the elderly. Therefore, while continuing to promote urbanization, the government should improve public services in rural areas so that both urban and rural residents can share the fruits of development."},"label":"2014 年真题（AI 解析）"};

her it is household work or work brought home from the office. For many men, the end of the workday is a time to kick back. For women who stay home, they never get to leave the office. And for women who work outside the home, they often are playing catch-up-with-household tasks. With the blurring of roles, and the fact that the home front lags well behind the workplace in making adjustments for working women, it's not surprising that women are more stressed at home. But it's not just a gender thing. At work, people pretty much know what they're supposed to be doing: working, making money, doing the tasks they have to do in order to draw an income. The bargain is very pure: Employee puts in hours of physical or mental labor and employee draws out life-sustaining moola. On the home front, however, people have no such clarity. Rare is the household in which the division of labor is so clinically and methodically laid out. There are a lot of tasks to be done, there are inadequate rewards for most of them. Your home colleagues - your family - have no clear rewards for their labor; they need to be talked into it, or if they're teenagers, threatened with complete removal of all electronic devices. Plus, they're your family. You cannot fire your family. You never really get to go home from home. So it's not surprising that people are more stressed at home. Not only are the tasks apparently infinite, the co-workers are much harder to motivate. .3."],"questions":[{"num":21,"stem":"According to Paragraph 1, most previous surveys found that home ___","opts":{"A":"offered greater relaxation than the workplace","B":"was an ideal place for stress measurement","C":"generated more stress than the workplace","D":"was an umealistic place for relaxation"},"answer":"A","analysis":"【AI 解析】答案 [A]「offered greater relaxation than the workplace」。本题考查「According to Paragraph 1, most previous …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"According to Da
