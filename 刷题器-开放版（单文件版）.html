ed in higher education, colleges and universities have pushed for decades to recruit more of them. This has created \"a paradox\" in that recruiting first-generation students, but then watching many of them fail, means that higher education has \"continued to reproduce and widen, rather than close\" an achievement gap based on social class, according to the depressing beginning of a paper forthcoming in the journal Psychological Science. But the article is actually quite optimistic, as it outlines a potential solution to this problem, suggesting that an approach (which involves a one-hour, next-to-no-cost program) can close 63 percent of the achievement gap (measured by such factors as grades) between first-generation and other students. The authors of the paper are from different universities, and their findings are based on a study involving 147 students (who completed the project) at an unnamed private university. First generation was defined as not having a parent with a four-year college degree. Most of the first-generation students (59.1 percent) were recipients of Pell Grants, a federal grant for undergraduates with financial need, while this was true only for 8.6 percent of the students with at least one parent with a four-year degree. Their thesis - that a relatively modest intervention could have a big impact -was based on the view that first-generation students may be most lacking not in potential but in practical knowledge about how to deal with the issues that face most college students. They cite past research by several authors to show that this is the gap that must be narrowed to close the achievement gap. Many first-generation students \"struggle to navigate the middle-class culture of higher education, learn the 'rules of the game,' and take advantage of college resources,\" they write. And this becomes more of a problem when colleges don't talk about the class advantages and disadvantages of different groups of students. \"Because US colleges and universities seldom acknowledge how social class can affect students' educational experiences, many first-generation students lack insight about why they are struggling and do not understand how students 'like them' can improve.\" .5."],"questions":[{"num":26,"stem":"Recruiting more first-generation students has ___","opts":{"A":"reduced their drop out rates","B":"narrowed the achievement gap","C":"missed its original purpose","D":"depressed college students"},"answer":"C","analysis":"【AI 解析】答案 [C]「missed its original purpose」。本题考查「Recruiting more first-generation student…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"The authors of the research article are optimistic because ___","opts":{"A":"their findings appeal to students","B":"the recruiting rate has increased","C":"the problem is solvable","D":"their approach is costless"},"answer":"C","analysis":"【AI 解析】答案 [C]「the problem is solvable」。本题考查「The authors of the research article are …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"The study suggests that most first-generation students ___","opts":{"A":"are from single-parent families","B":"study at private universities","C":"are in need of financial support","D":"have failed their college"},"answer":"C","analysis":"【AI 解析】答案 [C]「are in need of financial support」。本题考查「The study suggests that most first-gener…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"The authors of the paper believe that first-generation students ___","opts":{"A":"may lack opportunities to apply for research projects","B":"are inexperienced in handling their issues at college","C":"can have a potential influence on other students","D":"are actually indifferent to the achievement gap"},"answer":"B","analysis":"【AI 解析】答案 [B]「are inexperienced in handling their issues at …」。本题考查「The authors of the paper believe that fi…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"We may infer from the last paragraph that ___","opts":{"A":"universities often reject the culture of the middle-class","B":"students are usually to blame for their lack of resources","C":"social class greatly helps enrich educational experiences","D":"colleges are partly responsible for the problem in question"},"answer":"D","analysis":"【AI 解析】答案 [D]「colleges are partly responsible for the proble…」。本题考查「We may infer from the last paragraph tha…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Even in traditional offices, \"the lingua franca of corporate America has gotten much more emotional and much more right-brained than it was 20 years ago,\" said Harvard Business School professor Nancy Koehn. She started spinning off examples. \"If you and I parachuted back to Fortune 500 companies in 1990, we would see much less frequent use of terms like journey, mission, passion. There were goals, there were strategies, there were objectives, but we didn't talk about energy; we didn't talk about passion.\" Koehn pointed out that this new era of corporate vocabulary is very \"team\"-oriented - and not by coincidence. \"Let's not forget sports - m male-dominated corporate America, it's still a big deal. It's not explicitly conscious; it's the idea that I'm a coach, and you're my team, and we're in this together. There are lots and lots of CEOs in very different companies, but most think of themselves as coaches and this is their team and they want to win. \" These terms are also intended to infuse work with meaning - and, as Rakesh Khurana, another professor, points out, increase allegiance to the firm. \"You have the importation of terminology that historically used to be associated with non-profit organizations and religious organizations: terms like vision, values, passion, and purpose,\" said Khurana. This new focus on personal fulfillment can help keep employees motivated amid increasingly loud debates over work-life balance. The \"mommy wars\" of the 1990s are still going on today, prompting arguments about why women still can't have it all and books like Sheryl Sandberg's Lean In, whose title has become a buzzword in its own right. Terms like unplug, ofjline, life-hack, bandwidth, and capacity are all about setting boundaries between the office and the home. But if your work is your \"passion,\" you'll be more likely to devote yourself to it, even if that means going home for dinner and then working long after the kids are in bed. But this seems to be the irony of office speak: Everyone makes fun of it, but managers love it, companies depend on it, and regular people willingly absorb it. As a linguist once said, \"You can get people to think it's nonsense at the same time that you buy into it.\" In a workplace that's fundamentally indifferent to your life and its meaning, office speak can help you figure out how you relate to your work - and how your work defines who you are. .7."],"questions":[{"num":31,"stem":"According to Nancy Koehn, office language has become ___","opts":{"A":"less strategic","B":"less energetic","C":"more objective","D":"more emotional"},"answer":"D","analysis":"【AI 解析】答案 [D]「more emotional」。本题考查「According to Nancy Koehn, office languag…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"\"Team\" -oriented corporate vocabulary is closely related to ___","opts":{"A":"sports culture","B":"gender difference","C":"historical incidents","D":"athletic executives"},"answer":"A","analysis":"【AI 解析】答案 [A]「sports culture」。本题考查「\"Team\" -oriented corporate vocabulary is…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"Khurana believes that the importation of terminology aims to ___","opts":{"A":"revive historical terms","B":"promote company image","C":"foster corporate cooperation","D":"strengthen employee loyalty"},"answer":"D","analysis":"【AI 解析】答案 [D]「strengthen employee loyalty」。本题考查「Khurana believes that the importation of…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"It can be inferred that Lean In -- ___","opts":{"A":"voices for working women","B":"appeals to passionate workaholics","C":"triggers debates among mommies","D":"praises motivated employees"},"answer":"A","analysis":"【AI 解析】答案 [A]「voices for working women」。本题考查「It can be inferred that Lean In -- ___」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"Which of the following statements is true about office speak?","opts":{"A":"Linguists believe it to be nonsense.","B":"Regular people mock it but accept it.","C":"Companies find it to be fundamental.","D":"Managers admire it but avoid it."},"answer":"B","analysis":"【AI 解析】答案 [B]「Regular people mock it but accept it.」。本题考查「Which of the following statements is tru…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Many people talked of the 288,000 new jobs the Labor Department reported for June, along with the drop in the unemployment rate to 6.1 percent, as good news. And they were right. For now it appears the economy is creating jobs at a decent pace. We still have a long way to go to get back to full employment, but at least we are now finally moving forward at a faster pace. However, there is another important part of the jobs picture that was largely overlooked. There was a big jump in the number of people who report voluntarily working part-time. This figure is now 830,000 ( 4.4 percent) above its year ago level. Before explaining the connection to the Obamacare, it is worth making an important distinction. Many people who work part-time jobs actually want full-time jobs. They take part-time work because this is all they can get. An increase in involuntary part-time work is evidence of weakness in the labor market and it means that many people will be having a very hard time making ends meet. There was an increase in involuntary part-time in June, but the general direction has been down. Involuntary part-time employment is still far higher than before the recession, but it is down by 640,000 (7.9 percent) from its year ago level. We know the difference between voluntary and involuntary part-time employment because people tell us. The survey used by the Labor Department asks people if they worked less than 35 hours in the reference week. If the answer is \"yes,\" they are classified as working part-time. The survey then asks whether they worked less than 3 5 hours in that week because they wanted to work less than full time or because they had no choice. They are only classified as voluntary part-time workers if they tell the survey taker they chose to work less than 35 hours a week. The issue of voluntary part-time relates to Obamacare because one of the main purposes was to allow people to get insurance outside of employment. For many people, especially those with serious health conditions or family members with serious health conditions, before Obamacare the only way to get insurance was through a job that provided health insurance. However, Obamacare has allowed more than 12 million people to either get insurance through Medicaid or the exchanges. These are people who may previously have felt the need to get a full-time job that provided insurance in order to cover themselves and their families. With Obamacare there is no longer a link between employment and insurance."],"questions":[{"num":36,"stem":"Which part of the jobs picture was neglected?","opts":{"A":"The prospect of a thriving job market.","B":"The increase of voluntary part-time jobs.","C":"The possibility of full employment.","D":"The acceleration of job creation."},"answer":"B","analysis":"【AI 解析】答案 [B]「The increase of voluntary part-time jobs.」。本题考查「Which part of the jobs picture was negle…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"Many people work part-time because they ___","opts":{"A":"prefer part-time jobs to full-time jobs","B":"feel that is enough to make ends meet","C":"cannot get their hands on full-time jobs","D":"haven' t seen the weakness of the market"},"answer":"C","analysis":"【AI 解析】答案 [C]「cannot get their hands on full-time jobs」。本题考查「Many people work part-time because they …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"Involuntary part-time employment in the US ___","opts":{"A":"shows a general tendency of decline","B":"is harder to acquire than one year ago","C":"satisfies the real need of the jobless","D":"is lower than before the recession"},"answer":"A","analysis":"【AI 解析】答案 [A]「shows a general tendency of decline」。本题考查「Involuntary part-time employment in the …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"It can be learned that with Obamacare, -- ___","opts":{"A":"it is no longer easy for part-timers to get insurance","B":"full-time employment is still essential for insurance","C":"it is still challenging to get insurance for family members","D":"employment is no longer a precondition to get insurance"},"answer":"D","analysis":"【AI 解析】答案 [D]「employment is no longer a precondition to get …」。本题考查「It can be learned that with Obamacare, -…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"The text mainly discusses ___","opts":{"A":"employment in the US","B":"part-timer classification","C":"insurance through Medicaid","D":"Obamacare's trouble"},"answer":"A","analysis":"【AI 解析】答案 [A]「employment in the US」。本题考查「The text mainly discusses ___」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by choosing the most suitable subheading from the list A-G for each of the numbered paragraphs (41-45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)"],"options":[{"key":"A","text":"You are not alone"},{"key":"B","text":"Experience helps you grow"},{"key":"C","text":"Pave your own unique path"},{"key":"D","text":"Most of your fears are unreal"},{"key":"E","text":"Think about the present moment"},{"key":"F","text":"Don't fear responsibility for your life"},{"key":"G","text":"There are many things to be grateful for"}],"passage":["- **A.** You are not alone - **B.** Experience helps you grow - **C.** Pave your own unique path - **D.** Most of your fears are unreal - **E.** Think about the present moment - **F.** Don't fear responsibility for your life - **G.** There are many things to be grateful for Some Old Truths to Help You Overcome Tough Times Unfortunately, life is not a bed of roses. We are going through life facing sad experiences. Moreover, we are grieving various kinds of loss: a friendship, a romantic relationship or a house. Hard times may hold you down at what usually seems like the most inopportune time, but you should remember that they won't last forever. When our time of mourning is over, we press forward, stronger with a greater understanding and respect for life. Furthermore, these losses make us mature and eventually move us toward future opportunities for growth and happiness. I want to share these old truths I've learned along the way."],"questions":[{"num":41,"stem":"Fear is both useful and harmful. This normal human reaction is used to protect us by signaling danger and preparing us to deal with it. Unfortunately, people create inner barriers with a help of exaggerating fears. My favorite actor Will Smith once said, \"Fear is not real. It is a product of thoughts you create. Do not misunderstand me. Danger is very real. But fear is a choice.\" I do completely agree that fears are just the product of our luxuriant imagination.","opts":{},"answer":"D","analysis":"【AI 解析】答案 [D]「Most of your fears are unreal」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [D]。"},{"num":42,"stem":".11. ( \u001b 14 :m ) If you are surrounded by problems and cannot stop thinking about the past, try to focus on the present moment. Many of us are weighed down by the past or anxious about the future. You may feel guilt over your past, but you are poisoning the present with the things and circumstances you cannot change. Value the present moment and remember how fortunate you are to be alive. Enjoy the beauty of the world around and keep the eyes open to see the possibilities before you. Happiness is not a point of future and not a moment from the past, but a mindset that can be designed into the present.","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「Think about the present moment」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"},{"num":43,"stem":"Sometimes it is easy to feel bad because you are going through tough times. You can be easily caught up by life problems that you forget to pause and appreciate the things you have. Only strong people prefer to smile and value their life instead of crying and complaining about something.","opts":{},"answer":"G","analysis":"【AI 解析】答案 [G]「There are many things to be grateful for」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [G]。"},{"num":44,"stem":"No matter how isolated you might feel and how serious the situation is, you should always remember that you are not alone. Try to keep in mind that almost everyone respects and wants to help you if you are trying to make a good change in your life, especially your dearest and nearest people. You may have a circle of friends who provide constant good humor, help and companionship. If you have no friends or relatives, try to participate in several online communities, full of people who are always willing to share advice and encouragement.","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「You are not alone」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":45,"stem":"Today many people find it difficult to trust their own opinion and seek balance by gaining objectivity from external sources. This way you devalue your opinion and show that you are incapable of managing your own life. When you are struggling to achieve something important you should believe in yourself and be sure that your decision is the best. You live in your skin, think your own thoughts, have your own values and make your own choices. . 12. C -*'\" 14 yf )","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「Pave your own unique path」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET. ( 15 points) Think about driving a route that's very familiar. It could be your commute to work, a trip into town or the way home. Whichever it is, you know every twist and tum like the back of your hand. On these sorts of trips it's easy to lose concentration on the driving and pay little attention to the passing scenery. The consequence is that you perceive that the trip has taken less time than it actually has. This is the well-travelled road effect: People tend to underestimate the time it takes to travel a familiar route. The effect is caused by the way we allocate our attention. When we travel down a well-known route, because we don't have to concentrate much, time seems to flow more quickly. And afterwards, when we come to think back on it, we can't remember the journey well because we didn't pay much attention to it. So we assume it was shorter."],"reference":"设想一下，你行驶在一条非常熟悉的路线上。可能是上班的路，可能是去市里的路，也可能是回家的路。无论是哪一种，你对沿途的每个转弯都了如指掌。在这类行程中，人们很容易分散对驾驶的注意力，也很少留意沿途的景色。其结果是，你会觉得这趟旅程所花的时间比实际上要短。这就是“熟路效应”：人们往往会低估走熟悉路线所需的时间。这种效应源于我们分配注意力的方式。当我们行驶在熟悉的路线上时，因为不必太集中注意力，时间似乎流逝得更快。而事后回想这段旅程时，由于我们没有投入多少注意力，对旅程的记忆并不清晰，于是便误以为它更短。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose your university is going to host a summer camp for high school students. Write a notice to 1) briefly introduce the camp activities, and 2) call for volunteers. You should write about 100 words on the ANSWER SHEET. Do not use your name or the name of your university. Do not write your address. (10 points) . 13. C -*'\" 14 yf )"],"large":["**48.** Directions: Write an essay based on the following chart. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points) . 14. C -*'- 14 Jf )","**我国某市居民春节假期花销比例**","| 新年礼物 | 聚会吃饭 | 交通 | 其他 | |---|---|---|---| | 40% | 20% | 20% | 20% |"],"small_ref":"NOTICE\n\nVolunteers Wanted\n\nA summer camp for high school students will be held on our campus from July 10 to July 25, and volunteers are now being recruited.\n\nThe camp includes English classes, sports competitions, a city tour and a talent show, all designed to broaden the students' horizons. Volunteers will serve as group leaders, helping organize activities and taking care of the campers.\n\nRequirements: fluency in English, a strong sense of responsibility and experience in student work are preferred. Those interested please send your application to camp@university.edu.cn before June 20.\n\nThis is a valuable opportunity to develop organizational skills and make new friends. Join us!\n\nThe Students' Union","large_ref":"The chart illustrates the proportions of residents' spending during the Spring Festival holiday in a Chinese city. Buying New Year gifts accounts for the largest share at 40%, followed by dinner parties and transportation, each taking up 20%, while the remaining 20% goes to other expenses.\n\nBehind the figures lies the deep-rooted culture of the Spring Festival. Gift-giving and family gatherings are the essence of the festival, through which people express love and respect, so it is natural that they take the largest portions of the budget. The relatively high spending on transportation reflects the large-scale travel for family reunions.\n\nHowever, the phenomenon also deserves reflection. Some people spend beyond their means on extravagant gifts, turning a heartwarming tradition into a financial burden. In my opinion, the true value of the Spring Festival lies in companionship rather than expensive presents. Spending the holiday in a simpler but more sincere way deserves promotion."},"label":"2015 年真题（AI 解析）"};

e children this training could increase the number of people interested in the field and help fill the jobs gap, Cortina said. Students also benefit from learning something about coding before they get to college, where introductory computer-science classes are packed to the brim, which can drive the less-experienced or -determined students away. The Flatiron School, where people pay to learn programming, started as one of the many coding bootcamps that's become popular for adults looking for a career change. The high-schoolers get the same curriculum, but \"we try to gear lessons toward things they're interested in,\" said Victoria Friedman, an instructor. For instance, one of the apps the students are developing suggests movies based on your mood. The students in the Flatiron class probably won't drop out of high school and build the next Facebook. Programming languages have a quick turnover, so the \"Ruby on Rails\" language they learned may not even be relevant by the time they enter the job market. But the skills they learn - how to think logically through a problem and organize the results - apply to any coding language, said Deborah Seehorn, an education consultant for the state of North Carolina. Indeed, the Flatiron students might not go into IT at all. But creating a future army of coders is not the sole purpose of the classes. These kids are going to be surrounded by computers - in their pockets, in their offices, in their homes - for the rest of their lives. The younger they learn how computers think, how to coax the machine into producing what they want - the earlier they learn that they have the power to do that - the better."],"questions":[{"num":21,"stem":"Cortina holds that early exposure to computer science makes it easier to ___","opts":{"A":"complete future job training","B":"remodel the way of thinking","C":"formulate logical hypotheses","D":"perfect artwork production"},"answer":"B","analysis":"【AI 解析】答案 [B]「remodel the way of thinking」。本题考查「Cortina holds that early exposure to com…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"In delivering lessons for high-schoolers, Flatiron has considered their ___","opts":{"A":"experience","B":"interest","C":"career prospects","D":"academic backgrounds"},"answer":"B","analysis":"【AI 解析】答案 [B]「interest」。本题考查「In delivering lessons for high-schoolers…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":23,"stem":"Deborah Seehorn believes that the skills learned at Flatiron will ___","opts":{"A":"help students learn other computer languages","B":"have to be upgraded when new technologies come","C":"need improving when students look for jobs","D":"enable students to make big quick money"},"answer":"A","analysis":"【AI 解析】答案 [A]「help students learn other computer languages」。本题考查「Deborah Seehorn believes that the skills…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":24,"stem":"According to the last paragraph, Flatiron students are expected to ___","opts":{"A":"bring forth innovative computer technologies","B":"stay longer in the information technology industry","C":"become better prepared for the digitalized world","D":"compete with a future army of programmers"},"answer":"C","analysis":"【AI 解析】答案 [C]「become better prepared for the digitalized wor…」。本题考查「According to the last paragraph, Flatiro…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":25,"stem":"The word \"coax\" (Line 4, Para. 6) is closest in meaning to ___","opts":{"A":"persuade","B":"frighten","C":"misguide","D":"challenge"},"answer":"A","analysis":"【AI 解析】答案 [A]「persuade」。本题考查「The word \"coax\" (Line 4, Para. 6) is clo…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Biologists estimate that as many as 2 million lesser prairie chickens - a kind of bird living on stretching grasslands - once lent red to the often grey landscape of the midwestern and southwestern United States. But just some 22,000 birds remain today, occupying about 16% of the species' historic range. The crash was a major reason the U.S. Fish and Wildlife Service (USFWS) decided to formally list the bird as threatened. \"The lesser prairie chicken is in a desperate situation,\" said USFWS Director Daniel Ashe. Some environmentalists, however, were disappointed. They had pushed the agency to designate the bird as \"endangered,\" a status that gives federal officials greater regulatory power to crack down on threats. But Ashe and others argued that the \"threatened\" tag gave the federal government flexibility to try out new, potentially less confrontational conservation approaches. In particular, they called for forging closer collaborations with western state governments, which are often uneasy with federal action, and with the private landowners who control an estimated 95% of the prairie chicken's habitat. Under the plan, for example, the agency said it would not prosecute landowners or businesses that unintentionally kill, harm, or disturb the bird, as long as they had signed a range-wide management plan to restore prairie chicken habitat. Negotiated by USFWS and the states, the plan requires individuals and businesses that damage habitat as part of their operations to pay into a fund to replace every acre destroyed with 2 new acres of suitable habitat. The fund will also be used to compensate landowners who set aside habitat. USFWS also set an interim goal of restoring prairie chicken populations to an annual average of 67,000 birds over the next 10 years. And it gives the Western Association of Fish and Wildlife Agencies (WAFWA), a coalition of state agencies, the job of monitoring progress. Overall, the idea is to let \"states remain in the driver's seat for managing the species,\" Ashe said. Not everyone buys the win-win rhetoric. Some Congress members are trying to block the plan, and at least a dozen industry groups, four states, and three environmental groups are challenging it in federal court. Not surprisingly, industry groups and states generally argue it goes too far; environmentalists say it doesn't go far enough. \"The federal government is giving responsibility for managing the bird to the same industries that are pushing it to extinction,\" says biologist Jay Lininger."],"questions":[{"num":26,"stem":"The major reason for listing the lesser prairie chicken as threatened is ___","opts":{"A":"its drastically decreased population","B":"the underestimate of the grassland acreage","C":"a desperate appeal from some biologists","D":"the insistence of private landowners"},"answer":"A","analysis":"【AI 解析】答案 [A]「its drastically decreased population」。本题考查「The major reason for listing the lesser …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"The \"threatened\" tag disappointed some environmentalists in that it ___","opts":{"A":"was a give-in to governmental pressure","B":"would involve fewer agencies in action","C":"granted less federal regulatory power","D":"went against conservation policies"},"answer":"C","analysis":"【AI 解析】答案 [C]「granted less federal regulatory power」。本题考查「The \"threatened\" tag disappointed some e…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"It can be learned from Paragraph 3 that unintentional harm-doers will not be ___","opts":{"A":"agree to pay a sum for compensation","B":"volunteer to set up an equally big habitat","C":"offer to support the WAFWA monitoring job","D":"promise to raise funds for USFWS operations"},"answer":"A","analysis":"【AI 解析】答案 [A]「agree to pay a sum for compensation」。本题考查「It can be learned from Paragraph 3 that …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"According to Ashe, the leading role in managing the species is __ ___","opts":{"A":"the federal government","B":"the wildlife agencies","C":"the landowners","D":"the states"},"answer":"D","analysis":"【AI 解析】答案 [D]「the states」。本题考查「According to Ashe, the leading role in m…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"Jay Lininger would most likely support -- ___","opts":{"A":"industry groups","B":"the win-win rhetoric","C":"environmental groups","D":"the plan under challenge"},"answer":"C","analysis":"【AI 解析】答案 [C]「environmental groups」。本题考查「Jay Lininger would most likely support -…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["That everyone's too busy these days is a cliche. But one specific complaint is made especially mournfully: There's never any time to read. What makes the problem thornier is that the usual time-management techniques don't seem sufficient. The web's full of articles offering tips on making time to read: \"Give up TV\" or \"Carry a book with you at all times.\" But in my experience, using such methods to free up the odd 30 minutes doesn't work. Sit down to read and the flywheel of work-related thoughts keeps spinning - or else you're so exhausted that a challenging book's the last thing you need. The modem mind, Tim Parks, a novelist and critic, writes, \"is overwhelmingly inclined toward communication... It is not simply that one is interrupted; it is that one is actually inclined to interruption.\" Deep reading requires not just time, but a special kind of time which can't be obtained merely by becoming more efficient. In fact, \"becoming more efficient\" is part of the problem. Thinking of time as a resource to be maximised means you approach it instrumentally, judging any given moment as well spent only in so far as it advances progress toward some goal. Immersive reading, by contrast, depends on being willing to risk inefficiency, goallessness, even time-wasting. Try to slot it in as a to-do list item and you'll manage only goal-focused reading - useful, sometimes, but not the most fulfilling kind. \"The future comes at us like empty bottles along an unstoppable and nearly infinite conveyor belt,\" writes Gary Eberle in his book Sacred Time, and \"we feel a pressure to fill these different-sized bottles ( days, hours, minutes) as they pass, for if they get by without being filled, we will have wasted them.\" No mind-set could be worse for losing yourself in a book. So what does work? Perhaps surprisingly, scheduling regular times for reading. You'd think this might fuel the efficiency mind-set, but in fact, Eberle notes, such ritualistic behaviour helps us \"step outside time's flow\" into \"soul time.\" You could limit distractions by reading only physical books, or on single-purpose e-readers. \"Carry a book with you at all times\" can actually work, too - providing you dip in often enough, so that reading becomes the default state from which you temporarily surface to take care of business, before dropping back down. On a really good day, it no longer feels as if you're \"making time to read,\" but just reading, and making time for everything else."],"questions":[{"num":31,"stem":"The usual time-management techniques don't work because ___","opts":{"A":"what they can offer does not ease the modem mind","B":"what challenging books demand is repetitive reading","C":"what people often forget is carrying a book with them","D":"what deep reading requires cannot be guaranteed"},"answer":"D","analysis":"【AI 解析】答案 [D]「what deep reading requires cannot be guarantee…」。本题考查「The usual time-management techniques don…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"The \"empty bottles\" metaphor illustrates that people feel a pressure to ___","opts":{"A":"update their to-do lists","B":"make passing time fulfilling","C":"carry their plans through","D":"pursue carefree reading"},"answer":"B","analysis":"【AI 解析】答案 [B]「make passing time fulfilling」。本题考查「The \"empty bottles\" metaphor illustrates…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"Eberle would agree that scheduling regular times for reading helps ___","opts":{"A":"encourage the efficiency mind-set","B":"develop online reading habits","C":"promote ritualistic reading","D":"achieve immersive reading"},"answer":"D","analysis":"【AI 解析】答案 [D]「achieve immersive reading」。本题考查「Eberle would agree that scheduling regul…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"\"Carry a book with you at all times\" can work if ___","opts":{"A":"reading becomes your primary business of the day","B":"all the daily business has been promptly dealt with","C":"you are able to drop back to business after reading","D":"time can be evenly split for reading and business"},"answer":"A","analysis":"【AI 解析】答案 [A]「reading becomes your primary business of the d…」。本题考查「\"Carry a book with you at all times\" can…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"The best title for this text could be ___","opts":{"A":"How to Enjoy Easy Reading","B":"How to Find Time to Read","C":"How to Set Reading Goals","D":"How to Read Extensively"},"answer":"B","analysis":"【AI 解析】答案 [B]「How to Find Time to Read」。本题考查「The best title for this text could be __…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Against a backdrop of drastic changes in economy and population structure, younger Americans are drawing a new 21 st-century road map to success, a latest poll has found. Across generational lines, Americans continue to prize many of the same traditional milestones of a successful life, including getting married, having children, owning a home, and retiring in their sixties. But while young and old mostly agree on what constitutes the finish line of a fulfilling life, they offer strikingly different paths for reaching it. Young people who are still getting started in life were more likely than older adults to prioritize personal fulfillment in their work, to believe they will advance their careers most by regularly changing jobs, to favor communities with more public services and a faster pace of life, to agree that couples should be financially secure before getting married or having children, and to maintain that children are best served by two parents working outside the home, the survey found. From career to community and family, these contrasts suggest that in the aftermath of the searing Great Recession, those just starting out in life are defining priorities and expectations that will increasingly spread through virtually all aspects of American life, from consumer preferences to housing patterns to politics. Young and old converge on one key point: Overwhelming majorities of both groups said they believe it is harder for young people today to get started in life than it was for earlier generations. While younger people are somewhat more optimistic than their elders about the prospects for those starting out today, big majorities in both groups believe those \"just getting started in life\" face a tougher climb than earlier generations in reaching such signpost achievements as securing a good-paying job, starting a family, managing debt, and finding affordable housing. Pete Schneider considers the climb tougher today. Schneider, a 27-year-old auto technician from the Chicago suburbs, says he struggled to find a job after graduating from college. Even now that he is working steadily, he said, \"I can't afford to pay my monthly mortgage payments on my own, so I have to rent rooms out to people to make that happen.\" Looking back, he is struck that his parents could provide a comfortable life for their children even though neither had completed college when he was young. \"I still grew up in an upper middle-class home with parents who didn't have college degrees,\" Schneider said. \"I don't think people are capable of that anymore.\""],"questions":[{"num":36,"stem":"One cross-generation mark of a successful life is ___","opts":{"A":"trying out different lifestyles","B":"having a family with children","C":"working beyond retirement age","D":"setting up a profitable business"},"answer":"B","analysis":"【AI 解析】答案 [B]「having a family with children」。本题考查「One cross-generation mark of a successfu…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"It can be learned from Paragraph 3 that young people tend to ___","opts":{"A":"favor a slower life pace","B":"hold an occupation longer","C":"attach importance to pre-marital finance","D":"give priority to childcare outside the home"},"answer":"C","analysis":"【AI 解析】答案 [C]「attach importance to pre-marital finance」。本题考查「It can be learned from Paragraph 3 that …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"The priorities and expectations defined by the young will ___","opts":{"A":"become increasingly clear","B":"focus on materialistic issues","C":"depend largely on political preferences","D":"reach almost all aspects of American life"},"answer":"D","analysis":"【AI 解析】答案 [D]「reach almost all aspects of American life」。本题考查「The priorities and expectations defined …」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"Both young and old agree that ___","opts":{"A":"good-paying jobs are less available","B":"the old made more life achievements","C":"housing loans today are easy to obtain","D":"getting established is harder for the young"},"answer":"D","analysis":"【AI 解析】答案 [D]「getting established is harder for the young」。本题考查「Both young and old agree that ___」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"Which of the following is true about Schneider?","opts":{"A":"He found a dream job after graduating from college.","B":"His parents believe working steadily is a must for success.","C":"His parents' good life has little to do with a college degree.","D":"He thinks his job as a technician quite challenging."},"answer":"C","analysis":"【AI 解析】答案 [C]「His parents' good life has little to do with a…」。本题考查「Which of the following is true about Sch…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by choosing the most suitable subheading from the list A-G for each of the numbered paragraphs ( 41-45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)"],"options":[{"key":"A","text":"Be silly"},{"key":"B","text":"Have fun"},{"key":"C","text":"Ask for help"},{"key":"D","text":"Express your emotions"},{"key":"E","text":"Don't overthink it"},{"key":"F","text":"Be easily pleased"},{"key":"G","text":"Notice things"}],"passage":["- **A.** Be silly - **B.** Have fun - **C.** Ask for help - **D.** Express your emotions - **E.** Don't overthink it - **F.** Be easily pleased - **G.** Notice things Act Your Shoe Size, Not Your Age As adults, it seems that we are constantly pursuing happiness, often with mixed results. Yet children appear to have it down to an art - and for the most part they don't need self-help books or therapy. Instead, they look after their wellbeing instinctively, and usually more effectively than we do as grownups. Perhaps it's time to learn a few lessons from them."],"questions":[{"num":41,"stem":"What does a child do when he's sad? He cries. When he's angry? He shouts. Scared? Probably a bit of both. As we grow up, we learn to control our emotions so they are manageable and don't dictate our behaviours, which is in many ways a good thing. But too often we take this process too far and end up suppressing emotions, especially negative ones. That's about as effective as brushing dirt under a carpet and can even make us ill. What we need to do is find a way to acknowledge and express what we feel appropriately, and then - again, like children - move on.","opts":{},"answer":"D","analysis":"【AI 解析】答案 [D]「Express your emotions」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [D]。"},{"num":42,"stem":"A couple of Christmases ago, my youngest stepdaughter, who was nine years old at the time, got a Superman T-shirt for Christmas. It cost less than a fiver but she was overjoyed, and couldn't stop talking about it. Too often we believe that a new job, bigger house or better car will be the magic silver bullet that will allow us to finally be content, but the reality is these things have very little lasting impact on our happiness levels. Instead, being grateful for small things every day ** ( _.::. ) -ij\\° .11. is a much better way to improve wellbeing.","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]「Be easily pleased」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [F]。"},{"num":43,"stem":"Have you ever noticed how much children laugh? If we adults could indulge in a bit of silliness and giggling, we would reduce the stress hormones in our bodies, increase good hormones like endorphins, improve blood flow to our hearts and even have a greater chance of fighting off infection. All of which would, of course, have a positive effect on our happiness levels.","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「Be silly」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":44,"stem":"The problem with being a grownup is that there's an awful lot of serious stuff to deal with - work, mortgage payments, figuring out what to cook for dinner. But as adults we also have the luxury of being able to control our own diaries and it's important that we schedule in time to enjoy the things we love. Those things might be social, sporting, creative or completely random (dancing around the living room, anyone?) - it doesn't matter, so long as they're enjoyable, and not likely to have negative side effects, such as drinking too much alcohol or going on a wild spending spree if you're on a tight budget.","opts":{},"answer":"B","analysis":"【AI 解析】答案 [B]「Have fun」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [B]。"},{"num":45,"stem":"Having said all of the above, it's important to add that we shouldn't try too hard to be happy. Scientists tell us this can backfire and actually have a negative impact on our wellbeing. As the Chinese philosopher Chuang Tzu is reported to have said: \"Happiness is the absence of striving for happiness.\" And in that, once more, we need to look to the example of our children, to whom happiness is not a goal but a natural byproduct of the way they live.","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「Don't overthink it」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions Translate the following text into Chinese. Write your translation on the ANSWER SHEET. ( 15 points) The supermarket is designed to lure customers into spending as much time as possible within its doors. The reason for this is simple: The longer you stay in the store, the more stuff you'll see, and the more stuff you see, the more you'll buy. And supermarkets contain a lot of stuff. The average supermarket, according to the Food Marketing Institute, carries some 44,000 different items, and many carry tens of thousands more. The sheer volume of available choice is enough to send shoppers into a state of information overload. According to brain-scan experiments, the demands of so much decision-making quickly become too much for us. After about 40 minutes of shopping, most people stop struggling to be rationally selective, and instead begin shopping emotionally - which is the point at which we accumulate the 50 percent of stuff in our cart that we never intended buying."],"reference":"超市的设计旨在诱使顾客在店内停留尽可能长的时间。原因很简单：你在店里待的时间越长，看到的商品就越多；看到的商品越多，买的就越多。而超市里确实商品繁多。根据食品营销研究院的数据，一家普通超市大约有 4.4 万种不同的商品，许多超市的商品种类还要多出数万种。如此庞大的可选数量足以让购物者陷入信息过载的状态。根据脑部扫描实验，如此大量的决策需求很快就会让我们不堪重负。大约购物 40 分钟后，大多数人就不再努力进行理性选择，而是开始凭情绪购物——正是在这个时候，我们购物车里 50% 的商品是我们原本根本没打算买的。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose you won a translation contest and your friend, Jack, wrote an email to congratulate you and ask for advice on translation. Write him a reply to 1) thank him, and 2) give your advice. You should write about 100 words on the ANSWER SHEET. Do not use your own name. Use \"Li Ming\" instead. Do not write your address. (10 points)"],"large":["**48.** Directions: Write an essay based on the chart below. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points) tifltѮff:tJ 33%","**某高校学生旅游目的调查**","| 欣赏风景 | 缓解压力 | 其他 | 广交朋友 | 培养独立能力 | |---|---|---|---|---| | 37% | 33% | 15% | 9% | 6% |"],"small_ref":"Dear Jack,\n\nThank you very much for your congratulation on my winning the translation contest. I am more than glad to share some advice on translation with you.\n\nFirst, build a solid vocabulary, especially of words with multiple meanings, because choosing the right sense in context is the key to accurate translation. Second, practice regularly by comparing your version with published translations, and note down the differences. Third, learn some basic translation techniques, such as dividing and recombining long sentences, which will make your version smoother.\n\nTranslation is a skill that grows with practice, so be patient and persistent. If you have further questions, I am always at your service.\n\nYours,\nLi Ming","large_ref":"The chart demonstrates the purposes of college students' travels in a university. Viewing scenery ranks first with 37%, closely followed by relieving pressure at 33%, while other purposes, making friends and cultivating independence account for 15%, 9% and 6% respectively.\n\nThe data reflect the dual role of travel in students' lives. On the one hand, appreciating beautiful landscapes satisfies their curiosity about the outside world. On the other hand, with heavier academic and employment pressure, more and more students regard travel as an effective way to relax and recharge themselves.\n\nIn my opinion, travel is of great significance to young people. It not only broadens their horizons but also improves their adaptability and independence. Therefore, universities should organize more well-planned trips, and students themselves should make rational plans within their budgets, so that travel can truly become a beneficial supplement to campus study."},"label":"2016 年真题（AI 解析）"};

window.QUIZ_DATA[2017] = {"year":2017,"cloze":{"directions":["**Directions:** Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)"],"passage":["People have speculated for centuries about a future without work. Today is no different, with academics, writers, and activists once again ___1___ that technology is replacing human workers. Some imagine that the coming work-free world will be defined by ___2___ : A few wealthy people will own all the capital, and the masses will struggle in an impoverished wasteland. A different and not mutually exclusive ___3___ holds that the future will be a wasteland of a different sort, one ___4___ by purposelessness: Without jobs to give their lives ___5___ , people will simply become lazy and depressed. ___6___ , today's unemployed don't seem to be having a great time. One Gallup poll found that 20 percent of Americans who have been unemployed for at least a year report having depression, double the rate for ___7___ Americans. Also, some research suggests that the ___8___ for rising rates of mortality, mental-health problems, and addiction ___9___ poorly-educated, middle-aged people is a shortage of well-paid jobs. Perhaps this is why many ___10___ the agonizing dullness of a jobless future. But it doesn't ___11___ follow from findings like these that a world without work would be filled with unease. Such visions are based on the ___12___ of being unemployed in a society built on the concept of employment. In the ___13___ of work, a society designed with other ends in mind could ___14___ strikingly different circumstances for the future of labor and leisure. Today, the ___15___ of work may be a bit overblown. \"Many jobs are boring, degrading, unhealthy, and a waste of human potential,\" says John Danaher, a lecturer at the National University of Ireland in Galway. These days, because leisure time is relatively ___16___ for most workers, people use their free e fitter, healthier and produce more winners. It has not happened. The number of adults doing weekly sport did rise, by nearly 2 million in the run-up to 2012 - but the general population was growing faster. Worse, the numbers are now falling at an accelerating rate. The opposition claims primary school pupils doing at least two hours of sport a week have nearly halved. Obesity has risen among adults and children. Official retrospections continue as to why London 2012 failed to \"inspire a generation.\" The success of Parkrun offers answers. Parkun is not a race but a time trial: Your only competitor is the clock. The ethos welcomes anybody. There is as much joy over a puffed-out first-timer being clapped over the line as there is about top talent shining. The Olympic bidders, by contrast, wanted to get more people doing sport and to produce more elite athletes. The dual aim was mixed up: The stress on success over taking part was intimidating for newcomers. Indeed, there is something a little absurd in the state getting involved in the planning of such a fundamentally \"grassroots\" concept as community sports associations. If there is a role for government, it should really be getting involved in providing common goods - making sure there is space for playing fields and the money to pave tennis and netball courts, and encouraging the provision of all these activities in schools. But successive governments have presided over selling green spaces, squeezing money from local authorities and declining attention on sport in education. Instead of wordy, worthy strategies, future governments need to do more to provide the conditions for sport to thrive. Or at least not make them worse."],"questions":[{"num":21,"stem":"According to Paragraph 1, Parkrun has ___","opts":{"A":"gained great popularity","B":"created many jobs","C":"strengthened community ties","D":"become an official festival"},"answer":"A","analysis":"【AI 解析】答案 [A]「gained great popularity」。本题考查「According to Paragraph 1, Parkrun has __…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"The author believes that London's Olympic \"legacy\" has failed to ___","opts":{"A":"boost population growth","B":"promote sport participation","C":"improve the city's image","D":"increase sport hours in schools"},"answer":"B","analysis":"【AI 解析】答案 [B]「promote sport participation」。本题考查「The author believes that London's Olympi…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":23,"stem":"Parkrun is different from Olympic games in that it ___","opts":{"A":"aims at discovering talents","B":"focuses on mass competition","C":"does not emphasize elitism","D":"does not attract first-timers"},"answer":"C","analysis":"【AI 解析】答案 [C]「does not emphasize elitism」。本题考查「Parkrun is different from Olympic games …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":24,"stem":"With regard to mass sports, the author holds that governments should ___","opts":{"A":"organize \"grassroots\" sports events","B":"supervise local sports associations","C":"increase funds for sports clubs","D":"invest in public sports facilities"},"answer":"D","analysis":"【AI 解析】答案 [D]「invest in public sports facilities」。本题考查「With regard to mass sports, the author h…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":25,"stem":"The author's attitude to what UK governments have done for sports is ___","opts":{"A":"tolerant","B":"critical","C":"uncertain","D":"sympathetic"},"answer":"B","analysis":"【AI 解析】答案 [B]「critical」。本题考查「The author's attitude to what UK governm…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["With so much focus on children's use of screens, it's easy for parents to forget about their own screen use. \"Tech is designed to really suck you in,\" says Jenny Radesky in her study of digital play, \"and digital products are there to promote maximal engagement. It makes it hard to disengage, and leads to a lot of bleed-over into the family routine.\" Radesky has studied the use of mobile phones and tablets at mealtimes by giving mother-child pairs a food-testing exercise. She found that mothers who used devices during the exercise started 20 per cent fewer verbal and 39 per cent fewer nonverbal interactions with their children. During a separate observation, she saw that phones became a source of tension in the family. Parents would be looking at their emails while the children would be making excited bids for their attention. Infants are wired to look at parents' faces to try to understand their world, and if those faces are blank and umesponsive - as they often are when absorbed in a device - it can be extremely disconcerting for the children. Radesky cites the \"still face experiment\" devised by developmental psychologist Ed Tronick in the 1970s. In it, a mother is asked to interact with her child in a normal way before putting on a blank expression and not giving them any visual social feedback: The child becomes increasingly distressed as she tries to capture her mother's attention. \"Parents don't have to be exquisitely present at all times, but there needs to be a balance and parents need to be responsive and sensitive to a child's verbal or nonverbal expressions of an emotional need,\" says Radesky. On the other hand, Tronick himself is concerned that the worries about kids'use of screens are born out of an \"oppressive ideology that demands that parents should always be interacting\" with their children: \"It's based on a somewhat fantasised, very white, very upper-middle-class ideology that says if you're failing to expose your child to 30,000 words you are neglecting them.\" Tronick believes that just because a child isn't learning from the screen doesn't mean there's no value to it - particularly if it gives parents time to have a shower, do housework or simply have a break from their child. Parents, he says, can get a lot out of using their devices to speak to a friend or get some work out of the way. This can make them feel happier, which lets them be more available to their child the rest of the time."],"questions":[{"num":26,"stem":"According to Jenny Radesky, digital products are designed to ___","opts":{"A":"simplify routine matters","B":"absorb user attention","C":"better interpersonal relations","D":"increase work efficiency"},"answer":"B","analysis":"【AI 解析】答案 [B]「absorb user attention」。本题考查「According to Jenny Radesky, digital prod…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"Radesky's food-testing exercise shows that mothers' use of devices ___","opts":{"A":"takes away babies' appetite","B":"distracts children's attention","C":"slows down babies' verbal development","D":"reduces mother-child communication"},"answer":"D","analysis":"【AI 解析】答案 [D]「reduces mother-child communication」。本题考查「Radesky's food-testing exercise shows th…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"Radesky cites the \"still face experiment\" to show that ___","opts":{"A":"it is easy for children to get used to blank expressions","B":"verbal expressions are unnecessary for emotional exchange","C":"children are insensitive to changes in their parents' mood","D":"parents need to respond to children's emotional needs"},"answer":"D","analysis":"【AI 解析】答案 [D]「parents need to respond to children's emotiona…」。本题考查「Radesky cites the \"still face experiment…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"The oppressive ideology mentioned by Tronick requires parents to ___","opts":{"A":"protect kids from exposure to wild fantasies","B":"teach their kids at least 30,000 words a year","C":"ensure constant interaction with their children","D":"remain concerned about kids' use of screens"},"answer":"C","analysis":"【AI 解析】答案 [C]「ensure constant interaction with their childre…」。本题考查「The oppressive ideology mentioned by Tro…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"According to Tronick, kids' use of screens may ___","opts":{"A":"give their parents some free time","B":"make their parents more creative","C":"help them with their homework","D":"help them become more attentive"},"answer":"A","analysis":"【AI 解析】答案 [A]「give their parents some free time」。本题考查「According to Tronick, kids' use of scree…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Today, widespread social pressure to immediately go to college in conjunction with increasingly high expectations in a fast-moving world often causes students to completely overlook the possibility of taking a gap year. After all, if everyone you know is going to college in the fall, it seems silly to stay back a year, doesn't it? And after going to school for 12 years, it doesn't feel natural to spend a year doing something that isn't academic. But while this may be true, it's not a good enough reason to condemn gap years. There's always a constant fear of falling behind everyone else on the socially perpetuated \"race to the finish line,\" whether that be toward graduate school, medical school or a lucrative career. But despite common misconceptions, a gap year does not hinder the success of academic pursuits - in fact, it probably enhances it. Studies from the United States and Australia show that students who take a gap year are generally better prepared for and perform better in college than those who do not. Rather than pulling students back, a gap year pushes them ahead by preparing them for independence, new responsibilities and environmental changes - all things that first-year students often struggle with the most. Gap year experiences can lessen the blow when it comes to adjusting to college and being thrown into a brand new environment, making it easier to focus on academics and activities rather than acclimation blunders. If you're not convinced of the inherent value in taking a year off to explore interests, then consider its financial impact on future academic choices. According to the National Center for Education Statistics, nearly 80 percent of college students end up changing their majors at least once. This isn't surprising, considering the basic mandatory high school curriculum leaves students with a poor understanding of the vast academic possibilities that await them in college. Many students find themselves listing one major on their college applications, but switching to another after taking college classes. It's not necessarily a bad thing, but depending on the school, it can be costly to make up credits after switching too late in the game. At Boston College, for example, you would have to complete an extra year were you to switch to the nursing school from another department. Taking a gap year to figure things out initially can help prevent stress and save money later on."],"questions":[{"num":31,"stem":"One of the reasons for high-school graduates not taking a gap year is that ___","opts":{"A":"they think it academically misleading","B":"they have a lot of fun to expect in college","C":"it feels strange to do differently from others","D":"it seems worthless to take off-campus courses"},"answer":"C","analysis":"【AI 解析】答案 [C]「it feels strange to do differently from others」。本题考查「One of the reasons for high-school gradu…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"Studies from the US and Australia imply that taking a gap year helps ___","opts":{"A":"keep students from being unrealistic","B":"lower risks in choosing careers","C":"ease freshmen's financial burdens","D":"relieve freshmen of pressures"},"answer":"D","analysis":"【AI 解析】答案 [D]「relieve freshmen of pressures」。本题考查「Studies from the US and Australia imply …」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无 s that are likely to be lost to a wildfire? \"It's already a huge problem from a public expenditure perspective for the whole country,\" he says. \"We need to take a magnifying glass to that. Like, 'Wait a minute, is this OK?' Do we want instead to redirect those funds to concentrate on lower-hazard parts of the landscape?\" Such a view would require a corresponding shift in the way US society today views fire, researchers say. For one thing, conversations about wildfires need to be more inclusive. Over the past decade, the focus has been on climate change - how the warming of the Earth from greenhouse gases is leading to conditions that worsen fires. While climate is a key element, Moritz says, it shouldn't come at the expense of the rest of the equation. \"The human systems and the landscapes we live on are linked, and the interactions go both ways,\" he says. Failing to recognize that, he notes, leads to \"an overly simplified view of what the solutions might be. Our perception of the problem and of what the solution is becomes very limited.\" At the same time, people continue to treat fire as an event that needs to be wholly controlled and unleashed only out of necessity, says Professor Balch at the University of Colorado. But acknowledging fire's inevitable presence in human life is an attitude crucial to developing the laws, policies, and practices that make it as safe as possible, she says. \"We've disconnected ourselves from living with fire,\" Balch says. \"It is really important to understand and try and tease out what is the human connection with fire today.\""],"questions":[{"num":36,"stem":"More frequent wildfires have become a national concern because in 2015 they ___","opts":{"A":"exhausted unprecedented management efforts","B":"consumed a record-high percentage of budget","C":"severely damaged the ecology of western states","D":"caused a huge rise of infrastructure expenditure"},"answer":"B","analysis":"【AI 解析】答案 [B]「consumed a record-high percentage of budget」。本题考查「More frequent wildfires have become a na…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"Moritz calls for the use of \"a magnifying glass\" to ___","opts":{"A":"raise more funds for fire-prone areas","B":"avoid the redirection of federal money","C":"find wildfire-free parts of the landscape","D":"guarantee safer spending of public funds"},"answer":"D","analysis":"【AI 解析】答案 [D]「guarantee safer spending of public funds」。本题考查「Moritz calls for the use of \"a magnifyin…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"While admitting that climate is a key element, Moritz notes that ___","opts":{"A":"public debates have not settled yet","B":"fire-fighting conditions are improving","C":"other factors should not be overlooked","D":"a shift in the view of fire has taken place"},"answer":"C","analysis":"【AI 解析】答案 [C]「other factors should not be overlooked」。本题考查「While admitting that climate is a key el…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"The overly simplified view Moritz mentions is a result of failing to ___","opts":{"A":"discover the fundamental makeup of nature","B":"explore the mechanism of the human systems","C":"maximize the role of landscape in human life","D":"understand the interrelations of man and nature"},"answer":"D","analysis":"【AI 解析】答案 [D]「understand the interrelations of man and natur…」。本题考查「The overly simplified view Moritz mentio…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"Professor Balch points out that fire is something man should ___","opts":{"A":"do away with","B":"come to terms with","C":"pay a price for","D":"keep away from"},"answer":"B","analysis":"【AI 解析】答案 [B]「come to terms with」。本题考查「Professor Balch points out that fire is …」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points) The decline in American manufacturing is a common refrain, particularly from Donald Trump. \"We don't make anything anymore,\" he told Fox News, while defending his own made-in-Mexico clothing line. Without question, manufacturing has taken a significant hit during recent decades, and further trade deals raise questions about whether new shocks could hit manufacturing. But there is also a different way to look at the data. Across the country, factory owners are now grappling with a new challenge: Instead of having too many workers, they may end up with too few. Despite trade competition and outsourcing, American manufacturing still needs to replace tens of thousands of retiring boomers every year. Millennials may not be that interested in taking their place. Other industries are recruiting them with similar or better pay. For factory owners, it all adds up to stiff competition for workers - and upward pressure on wages. \"They're harder to find and they have job offers,\" says Jay Dunwell, president of Wolverine Coil Spring, a family-owned firm, \"They may be coming [into the workforce], but they've been plucked by other industries that are also doing as well as manufacturing.\" Mr. Dunwell has begun bringing high school juniors to the factory so they can get exposed to its culture. At RoMan Manufacturing, a maker of electrical transformers and welding equipment that his father cofounded in 1980, Robert Roth keeps a close eye on the age of his nearly 200 workers. Five are retiring this year. Mr. Roth has three community-college students enrolled in a work-placement program, with a starting wage of $13 an hour that rises to $17 after two years. At a worktable inside the transformer plant, young Jason Stenquist looks flustered by the copper coils he's trying to assemble and the arrival of two visitors. It's his first week on the job. Asked about his choice of career, he says at high school he considered medical school before switching to electrical engineering. \"I love working with tools. I love creating,\" he says. But to win over these young workers, manufacturers have to clear another * major hurdle: parents, who lived through the worst US economic downturn since the Great Depression, telling them to avoid the factory. Millennials \"remember their father and mother both were laid off. They blame it on the manufacturing recession,\" says Birgit Klohs, chief executive of The Right Place, a business development agency for western Michigan. These concerns aren't misplaced: Employment in manufacturing has fallen from 17 million in 1970 to 12 million in 2015. When the recovery began, worker shortages first appeared in the high-skilled trades. Now shortages are appearing at the mid-skill levels. \"The gap is between the jobs that take no skills and those that require a lot of skill,\" says Rob Spohr, a business professor at Montcalm Community College. \"There're enough people to fill the jobs at McDonalds and other places where you don't need to have much skill. It's that gap in between, and that's where the problem is.\" Julie Parks of Grand Rapids Community College points to another key to luring Millennials into manufacturing: a work/life balance. While their parents were content to work long hours, young people value flexibility. \"Overtime is not attractive to this generation. They really want to live their lives,\" she says."],"options":[{"key":"A","text":"says that he switched to electrical engineering because he loves working with tools."},{"key":"B","text":"points out that there are enough people to fill the jobs that don't need much skill."},{"key":"C","text":"points out that the US doesn't manufacture anything anymore."},{"key":"D","text":"believes that it is important to keep a close eye on the age of his workers."},{"key":"E","text":"says that for factory owners, workers are harder to find because of stiff competition."},{"key":"F","text":"points out that a work/life balance can attract young people into manufacturing."},{"key":"G","text":"says that the manufacturing recession is to blame for the lay-off of the young people's parents."}],"passage":["- **A.** says that he switched to electrical engineering because he loves working with tools. - **B.** points out that there are enough people to fill the jobs that don't need much skill. - **C.** points out that the US doesn't manufacture anything anymore. - **D.** believes that it is important to keep a close eye on the age of his workers. - **E.** says that for factory owners, workers are harder to find because of stiff competition. - **F.** points out that a work/life balance can attract young people into manufacturing. - **G.** says that the manufacturing recession is to blame for the lay-off of the young people's parents."],"questions":[{"num":41,"stem":"Jay Dun well __________","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「says that for factory owners, workers are hard…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"},{"num":42,"stem":"Jason Stenquist __________","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「says that he switched to electrical engineerin…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":43,"stem":"Birgit Klohs __________","opts":{},"answer":"G","analysis":"【AI 解析】答案 [G]「says that the manufacturing recession is to bl…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [G]。"},{"num":44,"stem":"Rob Spohr __________","opts":{},"answer":"B","analysis":"【AI 解析】答案 [B]「points out that there are enough people to fil…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [B]。"},{"num":45,"stem":"Julie Parks __________","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]「points out that a work/life balance can attrac…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [F]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions Translate the following text into Chinese. Write your translation on the ANSWER SHEET. ( 15 points) My dream has always been to work somewhere in an area between fashion and publishing. Two years before graduating from secondary school, I took a sewing and design course thinking that I would move on to a fashion design course. However, during that course I realized I was not good enough in this area to compete with other creative personalities in the future, so I decided that it was not the right path for me. Before applying for university I told everyone that I would study journalism, because writing was, and still is, one of my favourite activities. But, to be honest, I said it, because I thought that fashion and me together was just a dream - I knew that no one could imagine me in the fashion industry at all! So I decided to look for some fashion-related courses that included writing. This is when I noticed the course \"Fashion Media & Promotion.\""],"reference":"我的梦想一直是在时尚与出版之间的某个领域工作。中学毕业前两年，我修了一门缝纫与设计课程，本打算之后继续学习时装设计。然而，在学习那门课程的过程中，我意识到自己在这一领域并不够出色，无法在将来与其他富有创造力的人竞争，于是我认定这条路并不适合我。在申请大学之前，我告诉所有人我将学习新闻学，因为写作过去是、现在依然是我最喜爱的活动之一。但说实话，我那样说是因为我以为时尚之于我只是一个梦——我知道根本没有人能想象我会进入时尚行业！于是我决定寻找一些与时尚相关、又包含写作内容的课程。就在这时，我注意到了“时尚媒体与推广”这门课程。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose you are invited by Professor Williams to give a presentation about Chinese culture to a group of international students. Write a reply to 1) accept the invitation, and 2) introduce the key points of your presentation. You should write about 100 words on the ANSWER SHEET. Do not use your own name. Use \"Li Ming\" instead. Do not write your address. (10 points)"],"large":["**48.** Directions: Write an essay based on the chart below. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points) 201 3(¥ 201 4(¥ 201 5(¥ l -+-tt¥JJig\"it(*) ---- #$Jii,A% C+75Al.X) I 201 3-2015:1f:JX ² iw¥JJtt&:i:fi:J' ѯJi',)\\_Ѱ","**2013-2015 年我国博物馆数量和参观人数**","| 项目 | 2013 年 | 2014 年 | 2015 年 | |---|---|---|---| | 博物馆数量（家） | 约 4 100 | 约 4 500 | 约 4 600 | | 参观人数（十万人次） | 约 63 | 约 72 | 约 78 |","（折线图无逐点数值标注，以上为按坐标轴估读值）"],"small_ref":"Dear Professor Williams,\n\nThank you very much for inviting me to give a presentation on Chinese culture to the international students. I am honored to accept the invitation.\n\nThe presentation will cover three key points: the philosophy of harmony embodied in traditional Chinese culture, the charm of Chinese festivals such as the Spring Festival and the Mid-Autumn Festival, and the appeal of traditional arts like calligraphy and paper-cutting. To make it lively, I will bring some handicrafts and teach the audience basic paper-cutting skills.\n\nThe presentation is scheduled for next Friday afternoon. Please let me know if any adjustment is needed. I look forward to meeting the students.\n\nYours sincerely,\nLi Ming","large_ref":"The chart indicates the changes in the number of museums and their visitors in China from 2013 to 2015. Within three years, the number of museums grew from about 4,100 to 4,600, while annual visits rose from approximately 6.3 million person-times to 7.8 million, showing a synchronized upward trend.\n\nSeveral factors contribute to the museum boom. Economically, rising incomes enable people to pursue spiritual and cultural enjoyment. Policy-wise, the government has built more public museums and opened most of them free of charge. Besides, museums themselves have become more attractive by adopting modern technologies and interactive exhibitions.\n\nThe flourishing of museums is undoubtedly good news: it enriches people's cultural life and preserves historical heritage. However, to sustain the enthusiasm, museums should continue to innovate their exhibitions, and the public should visit with a genuine desire to learn rather than merely to take photos."},"label":"2017 年真题（AI 解析）"};

he family of vocational education \"have that stereotype ... that it's for kids who can't make it academically,\" he says. On one hand, that viewpoint is a logical product of America's evolution. Manufacturing is not the economic engine that it once was. The job security that the US economy once offered to high school graduates has largely evaporated. More education is the new principle. We want more for our kids, and rightfully so. But the headlong push into bachelor's degrees for all - and the subtle devaluing of anything less - misses an important point: That's not the only thing the American economy needs. Yes, a bachelor's degree opens more doors. But even now, 54 percent of the jobs in the country are middle-skill jobs, such as construction and high-skill manufacturing. But only 44 percent of workers are adequately trained. In other words, at a time when the working class has turned the country on its political head, frustrated that the opportunity that once defined America is vanishing, one obvious solution is staring us in the face. There is a gap in working-class jobs, but the workers who need those jobs most aren't equipped to do them. Koziatek's Manchester School of Technology High School is trying to fill that gap. Koziatek's school is a wake-up call. When education becomes one-size-fits-all, it risks overlooking a nation's diversity of gifts."],"questions":[{"num":21,"stem":"A broken bike chain is mentioned to show students' lack of -- ___","opts":{"A":"practical ability","B":"academic training","C":"pioneering spirit","D":"mechanical memorization"},"answer":"A","analysis":"【AI 解析】答案 [A]「practical ability」。本题考查「A broken bike chain is mentioned to show…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"There exists the prejudice that vocational education is for kids who ___","opts":{"A":"have a stereotyped mind","B":"have no career motivation","C":"are not academically successful","D":"are financially disadvantaged"},"
