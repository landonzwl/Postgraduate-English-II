window.QUIZ_DATA[2024] = {"year":2024,"cloze":{"directions":["**Directions:** Read the following text. Choose the best word(s) fbr each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)"],"passage":["Your social life is defined as “the activities you do with other people, fbr pleasure, when you are not working”. It's important to have a social life, but whafs right fbr one person won't be right for another. Some of us feel energised by spending lots of time with others, ___1___ some of us may feel drained, even if ifs doing something we enjoy. This is why finding a ___2___ in your social life is key. Spending too much time on your own, not ___3___ others, can make you feel lonely and ___4___ . Loneliness is known to impact on your mental health and ___5___ a low mood. Anyone can feel lonely at any time. This might be especially true if, ___6___ , you are working from home and you are ___7___ on the usual social conversations that happen in an office. Other life changes can ___8___ periods of loneliness too, such as retirement, changing jobs or becoming a parent. It's important to recognise these feelings of loneliness. There are ways to ___9___ a social life, but it can feel overwhelming ___10___ . It's a great idea to start by thinking about hobbies you enjoy. You can then find groups and activities related to those where you will be able to meet ___11___ people. There are groups aimed at new parents, at those who want to ___12___ a new sport fbr the first time, or networking events fbr those in the same profession to meet up and ___13___ ideas. On the other hand, it's ___14___ possible to have too much of a social life. If you feel like you're always doing something and there is never any ___15___ in your calendar fbr downtime, you could suffer social burnout or social ___16___ . We all have our own social limit and it's important to recognise when you're feeling like it's all too much. Low mood, low energy, irritability and trouble sleeping could all be ___17___ of poor social health. Make sure you ___18___ some time in your diary when you're ___19___ for socialising and use this time to relax, ___20___ and recover."],"questions":[{"num":1,"stem":"","opts":{"A":"because","B":"unless","C":"whereas","D":"until"},"answer":"C","analysis":"whereas**\n考点：连词（对比）。\n解析：\"Some of us feel energised by spending lots of time with others, ___ some of us may feel drained\"——有人社交充电、有人社交耗电，whereas（然而、对比）衔接两类人。"},{"num":2,"stem":"","opts":{"A":"contrast","B":"balance","C":"link","D":"gap"},"answer":"B","analysis":"balance**\n考点：名词辨析。\n解析：\"This is why finding a ___ in your social life is key.\"——所以关键是找到社交生活的**平衡**，balance 呼应\"太少孤独、太多倦怠\"（末段 social burnout）的两端论述。"},{"num":3,"stem":"","opts":{"A":"seeing","B":"pleasing","C":"judging","D":"teaching"},"answer":"A","analysis":"seeing**\n考点：动词辨析。\n解析：\"Spending too much time on your own, not ___ others\"——独处过多、**不见**他人，see others（与人见面）为社交语境表达。"},{"num":4,"stem":"","opts":{"A":"misguided","B":"surprised","C":"spoiled","D":"disconnected"},"answer":"D","analysis":"disconnected**\n考点：形容词辨析。\n解析：\"can make you feel lonely and ___\"——使人感到孤独且**与世隔绝**，disconnected（疏离的）与 lonely 同义递进。"},{"num":5,"stem":"","opts":{"A":"contribute to","B":"rely on","C":"interfere with","D":"go against"},"answer":"A","analysis":"contribute to**\n考点：短语动词辨析。\n解析：\"Loneliness is known to impact on your mental health and ___ a low mood.\"——孤独已知会影响心理健康并**导致**情绪低落，contribute to（促成）正确。"},{"num":6,"stem":"","opts":{"A":"in fact","B":"of course","C":"for example","D":"on average"},"answer":"C","analysis":"for example**\n考点：插入语。\n解析：\"This might be especially true if, ___, you are working from home\"——**例如**居家办公时（举例说明\"任何人在任何时候都可能孤独\"），for example 插入举例。"},{"num":7,"stem":"","opts":{"A":"cutting back","B":"missing out","C":"breaking in","D":"looking down"},"answer":"B","analysis":"missing out**\n考点：短语动词辨析。\n解析：\"you are ___ on the usual social conversations that happen in an office.\"——**错过**办公室里的日常闲聊，miss out on（错失）为固定搭配。"},{"num":8,"stem":"","opts":{"A":"shorten","B":"trigger","C":"follow","D":"interrupt"},"answer":"B","analysis":"trigger**\n考点：动词辨析。\n解析：\"Other life changes can ___ periods of loneliness too\"——其他生活变故也会**引发**孤独期，trigger（引发）正确。"},{"num":9,"stem":"","opts":{"A":"assess","B":"interpret","C":"provide","D":"regain"},"answer":"D","analysis":"regain**\n考点：动词辨析。\n解析：\"There are ways to ___ a social life\"——有办法**重新建立**社交生活（上文是孤独者的处境），regain（重获）正确。A assess（评估——\"有办法评估社交生活\"不通）。"},{"num":10,"stem":"","opts":{"A":"at first","B":"in turn","C":"on time","D":"by chance"},"answer":"A","analysis":"at first**\n考点：介词短语辨析。\n解析：\"but it can feel overwhelming ___\"——但**起初**会觉得难以招架，at first（起初）与\"从兴趣入手\"的建议衔接。"},{"num":11,"stem":"","opts":{"A":"far-sighted","B":"strong-willed","C":"kind-hearted","D":"like-minded"},"answer":"D","analysis":"like-minded**\n考点：复合形容词辨析。\n解析：\"find groups and activities related to those where you will be able to meet ___ people.\"——结识**志同道合的**人（因小组围绕共同爱好），like-minded 正确。"},{"num":12,"stem":"","opts":{"A":"try","B":"promote","C":"watch","D":"describe"},"answer":"A","analysis":"try**\n考点：动词辨析。\n解析：\"those who want to ___ a new sport for the first time\"——想**尝试**新运动的人，try a new sport（尝试新运动）为固定搭配。"},{"num":13,"stem":"","opts":{"A":"test","B":"share","C":"accept","D":"revise"},"answer":"B","analysis":"share**\n考点：动词辨析。\n解析：\"networking events for those in the same profession to meet up and ___ ideas.\"——同行社交活动上见面**交流**想法，share ideas（分享想法）为固定搭配。"},{"num":14,"stem":"","opts":{"A":"already","B":"thus","C":"also","D":"only"},"answer":"C","analysis":"also**\n考点：副词逻辑。\n解析：\"On the other hand, it's ___ possible to have too much of a social life.\"——反过来说，社交**也**可能过多，also 与 On the other hand 呼应（前文谈太少的问题）。"},{"num":15,"stem":"","opts":{"A":"list","B":"order","C":"space","D":"boundary"},"answer":"C","analysis":"space**\n考点：名词辨析。\n解析：\"there is never any ___ in your calendar for downtime\"——日程表里从未给休整留**空隙**，space（空间、空档）正确。"},{"num":16,"stem":"","opts":{"A":"fatigue","B":"criticism","C":"injustice","D":"dilemma"},"answer":"A","analysis":"fatigue**\n考点：名词辨析。\n解析：\"you could suffer social burnout or social ___.\"——社交倦怠或社交**疲劳**，fatigue（疲劳）与 burnout 并列同义。"},{"num":17,"stem":"","opts":{"A":"sources","B":"standards","C":"signs","D":"scores"},"answer":"C","analysis":"signs**\n考点：名词辨析。\n解析：\"Low mood, low energy, irritability and trouble sleeping could all be ___ of poor social health.\"——这些都是社交健康不佳的**征兆**，signs of（……的迹象）为固定搭配。"},{"num":18,"stem":"","opts":{"A":"take over","B":"wipe off","C":"add up","D":"mark out"},"answer":"D","analysis":"mark out**\n考点：短语动词辨析。\n解析：\"Make sure you ___ some time in your diary\"——确保在日程表里**划出**一些时间，mark out（划出、标出）为固定搭配。"},{"num":19,"stem":"","opts":{"A":"ungrateful","B":"unavailable","C":"responsible","D":"regretful"},"answer":"B","analysis":"unavailable**\n考点：形容词辨析。\n解析：\"when you're ___ for socialising\"——在**不安排社交**（无空档）的时间里，unavailable（不得空）与\"用于休息恢复\"呼应。"},{"num":20,"stem":"","opts":{"A":"react","B":"repeat","C":"return","D":"rest"},"answer":"D","analysis":"rest**\n考点：动词辨析。\n解析：\"use this time to relax, ___ and recover.\"——用这段时间放松、**休息**与恢复，rest 与 relax、recover 并列。"}],"analysisBlob":""},"reading":[{"title":"","passage":["In her new book Cogs and Monsters: What Economics Is, and What It Should Be, Diane Coyle, an economist at Cambridge University, argues that the digital economy requires new ways of thinking about progress. \"Whatever we mean by the economy growing, by things getting better, the gains will have to be more evenly shared than in the recent past,\" she writes. uAn economy of tech millionaires or billionaires and gig workers, with middle-income jobs undercut by automation, will not be politically sustainable.\" Improving living standards and increasing prosperity for more people will require greater use of digital technologies to boost productivity in various sectors, including health care and construction, says Coyle. But people can't be expected to embrace the changes if they're not seeing the benefits- if they're just seeing good jobs being destroyed. In a recent interview, Coyle said she fears that tech's inequality problem could be a roadblock to deploying AI. \"We're talking about disruption”, she says. \"These are transformative technologies that change the ways we spend our time every day, that change business models that succeed.\" To make such \"tremendous changes,” she adds, you need social buy-in. Instead, says Coyle, resentment is simmering among many as the benefits are perceived to go to elites in a handful of prosperous cities. According to the Brookings Institution, a short list of eight American cities that included San Francisco, San Jose, Boston, and Seattle had roughly 38% of all tech jobs by 2019. New AI technologies are particularly concentrated: Brookings's Mark Muro and Sifan Liu estimate that just 15 cities account for two-thirds of the AI assets and capabilities in the United States. The dominance of a few cities in the invention and commercialization of AI means that geographical disparities in wealth will continue to soar. Not only will this foster political and social unrest, but it could, as Coyle suggests, hold back the sorts of AI technologies needed fbr regional economies to grow. Part of the solution could lie in somehow loosening the stranglehold that Big Tech has on defining the AI agenda. That will likely take increased federal funding fbr research independent of the tech giants. A more immediate response is to broaden our digital imaginations to conceive of AI technologies that don't simply replace jobs but expand opportunities in the sectors that different parts of the country care most about, like health care, education, and manufacturing."],"questions":[{"num":21,"stem":"Coyle argues in her new book that economic growth should ___","opts":{"A":"give rise to innovations","B":"diversify career choices","C":"benefit people equally","D":"be promoted forcefully"},"answer":"C","analysis":"**\n考点：观点细节题。\n解析：\"'the gains will have to be **more evenly shared** than in the recent past'\"——增长收益应比过去更均分，即**让人们平等受益**，C 正确。A（催生创新）无据；B（多元化职业选择）曲解——middle-income jobs 被侵蚀是问题描述非主张；D（强力推进）无据。\n【AI 修正】无。"},{"num":22,"stem":"According to Paragraph 2, digital technologies should be used to ___","opts":{"A":"bring about instant prosperity","B":"reduce people's workload","C":"raise overall work efficiency","D":"enhance cross-sector cooperation"},"answer":"C","analysis":"**\n考点：细节理解。\n解析：\"will require greater use of digital technologies to **boost productivity** in various sectors, including health care and construction\"——用数字技术**提升生产率**，即 C 提高整体工作效率，C 正确。A（带来即时繁荣）无据；B（减轻工作负担）曲解——是\"提升生产率\"非\"减少工作量\"；D（促进跨部门合作）偷换——\"various sectors\"是生产率的应用领域。\n【AI 修正】无。"},{"num":23,"stem":"What does Coyle fear about transformative technologies?","opts":{"A":"They may affect work-life balance.","B":"They may be impractical to deploy.","C":"They may incur huge expenditure.","D":"They may be unwelcome to the public."},"answer":"D","analysis":"**\n考点：观点细节题。\n解析：\"tech's inequality problem could be a **roadblock to deploying AI**…To make such 'tremendous changes,' you need **social buy-in**…**resentment is simmering** among many as the benefits are perceived to go to elites.\"——缺乏社会认同、怨气积聚，即变革性技术**可能不受公众欢迎**，D 正确。A（影响工作生活平衡）无据；B（难以落地）偷换——路障是\"民意\"而非技术不可行；C（耗费巨资）无据。\n【AI 修正】无。"},{"num":24,"stem":"Several American cities are mentioned to s h o w ___","opts":{"A":"the uneven distribution of AI technologies in the US","B":"the disappointing prospect of tech jobs in the US","C":"the fast progress of US regional economies","D":"the increasing significance of US AI assets"},"answer":"A","analysis":"**\n考点：例证目的题。\n解析：\"a short list of **eight American cities**…had roughly **38%** of all tech jobs…just **15 cities** account for **two-thirds** of the AI assets and capabilities\"——数据展示科技岗位与 AI 资产高度集中于少数城市，即**AI 技术在美国分布不均**，A 正确。B（科技岗位前景堪忧）、C（区域经济进步快）、D（AI 资产日益重要）均偏离例证焦点。\n【AI 修正】无。"},{"num":25,"stem":"With regard to Coyle's concern, the author suggests ___","opts":{"A":"raising funds to start new AI projects","B":"encouraging collaboration in AI research","C":"guarding against the side effects of AI","D":"redefining the role of AI technologies"},"answer":"D","analysis":"**\n考点：观点细节题。\n解析：末段：\"A more immediate response is to **broaden our digital imaginations to conceive of AI technologies that don't simply replace jobs but expand opportunities** in the sectors that different parts of the country care most about.\"——构想不取代岗位而创造机会的 AI，即**重新定义 AI 技术的角色**，D 正确。A（筹资启动新 AI 项目）偷换——\"联邦资助独立研究\"是\"松绑巨头议程\"的对策且非\"启动新项目\"；B（鼓励 AI 研究协作）无据；C（防范 AI 副作用）无据。\n【AI 修正】无。\n\n### Text 2（英国木材危机：多种树）\n\n**文章脉络**：①Confor 警告：因不种树产木，英国将面临未来建筑危机；呼吁紧急行动减少木材进口依赖、为后代提供稳定木源 → ②现状：木材需求仅 20% 自产，却是全球第二大木材净进口国 → ③政府新激励\"力度不够\"且未宣传种树供木的好处；Goodall：几十年来未担起投资国内木材供给之责，价格波动、全球需求涨、本国供给降 → ④英国其实条件理想（低碳建筑木材、森林认证全球领先），但英格兰自产木材使用率仅 25%；成因复杂：过时观念、灰松鼠祸害、农场主与地主对长期种植的犹豫 → ⑤生产性植树利农利净零，但政府支持聚焦粮食生产与纯生物多样性的再野化——Goodall：粮食与生物多样性固然关键，土地还需供应建筑制造用木 → ⑥政府有植树雄心却少行动——Confor 呼吁为这些愿景注入更大动力。"}],"overview":"","discourse":""},{"title":"","passage":["The UK is facing a future construction crisis because of a failure to plant trees to produce wood, Confdr has warned. The forestry and wood trade body has called for urgent action to reduce the country's reliance on timber imports and provide a stable supply of wood for future generations. Currently only 20 per cent of the UK's wood requirement is home-grown while it remains the second-largest net importer of timber in the world. Coming at a time of fresh incentives from the UK government for landowners to grow more trees, the trade body says these don't go far enough and fail to promote the benefits of planting them to boost timber supplies. uNot only are we facing a carbon crisis now, but we will also be facing a future construction crisis because of a failure to plant trees to produce wood,“ said Stuart Goodall, chief executive of Confdr. “For decades we have not taken responsibility for investing in our domestic wood supply, leaving us exposed to fluctuating prices and fighting for future supplies of wood as global demand rises and our own supplies fall.\" The UK has ideal conditions for growing wood to build low-carbon homes and is a global leader in certifying that its forests are sustainably managed, Confbr says. While around three quarters of Scottish homes are built from Scottish timber, the use of home-grown wood in England is only around 25 per cent. The causes of the UK's current position are complex and range from outdated perceptions of productive forestry to the decimation of trees by grey squirrels. It also encompasses significant hesitation on behalf of farmers and other landowners to invest in longer-term planting projects. While productive tree planting can deliver real financial benefits to rural economies and contribute to the UK's net-zero strategy, the focus of government support continues to be on food production and the rewilding and planting of native woodland solely for biodiversity. Goodall added: \"While food production and biodiversity health are clearly of critical importance, we need our land to also provide secure supplies of wood for construction, manufacturing and contribute to net zero. uWhile the UK government has stated its ambition for more tree planting, there has been little action on the ground. Confdr is now calling fbr much greater impetus behind those aspirations to ensure we have enough wood to meet increasing demand."],"questions":[{"num":26,"stem":"It can be learned from Paragraph 1 that the UK needs t o ___","opts":{"A":"increase its domestic wood supply","B":"reduce its demand for timber","C":"lower its wood production costs","D":"lift its control on timber imports"},"answer":"A","analysis":"**\n考点：细节理解。\n解析：\"has called for urgent action to **reduce the country's reliance on timber imports** and **provide a stable supply of wood** for future generations.\"——减少进口依赖、稳定木源，即**增加国内木材供给**，A 正确。B（减少木材需求）、C（降低木材生产成本）、D（放松进口管制）均无据。\n【AI 修正】无。"},{"num":27,"stem":"According to Confdr, the UK govemmenfs fresh i n c e n t i v e s ___","opts":{"A":"can hardly address a construction crisis","B":"are believed to come at a wrong time","C":"seem to be misleading for landowners","D":"will be too costly to put into practice"},"answer":"A","analysis":"**\n考点：观点细节题。\n解析：\"Coming at a time of fresh incentives from the UK government for landowners to grow more trees, the trade body says these **don't go far enough** and fail to promote the benefits of planting them to boost timber supplies.\"——激励措施\"力度不够\"、未促进供木种植，即**难以解决建筑危机**，A 正确。B（时机不对）反了——是\"恰逢其时但不够\"；C（误导地主）无据；D（成本过高难实施）无据。\n【AI 修正】无。"},{"num":28,"stem":"The UK's exposure to fluctuating wood prices is a result o f ___","opts":{"A":"the govemmenfs inaction on timber imports","B":"inadequate investment in growing wood","C":"the competition among timber traders at home","D":"wood producers' motive to maximise profits"},"answer":"B","analysis":"**\n考点：细节因果题。\n解析：\"'For decades we have **not taken responsibility for investing in our domestic wood supply**, leaving us exposed to fluctuating prices…'\"——几十年不投资国内木材供给导致暴露于价格波动，即**种植投资不足**，B 正确。A（政府对进口不作为）无据——直接原因是国内种植投资缺失；C（国内木材商竞争）无据；D（生产商逐利动机）无据。\n【AI 修正】无。"},{"num":29,"stem":"Which of the following causes the shortage of wood supply in the UK?","opts":{"A":"Excessive timber consumption in construction.","B":"Unfavourable conditions for growing wood.","C":"Outdated technologies of the wood industry.","D":"Farmers' unwillingness to plant trees."},"answer":"D","analysis":"**\n考点：细节理解（成因）。\n解析：\"It also encompasses **significant hesitation on behalf of farmers and other landowners to invest in longer-term planting projects**.\"——成因之一是农民与地主对长期种植项目**犹豫不决**（不愿种树），D 正确。A（建筑业过度消耗木材）无据——是供给侧问题；B 反了——\"The UK has **ideal conditions** for growing wood\"；C 曲解——是\"过时的观念\"（perceptions）而非\"过时的技术\"。\n【AI 修正】无。"},{"num":30,"stem":"What does Goodall think the UK government should do?","opts":{"A":"Subsidise the building of low-carbon homes.","B":"Pay greater attention to boosting rural economies.","C":"Provide more support for productive tree planting.","D":"Give priority to pursuing its net-zero strategy."},"answer":"C","analysis":"**\n考点：观点细节题。\n解析：\"the focus of government support continues to be on food production and the rewilding…**Goodall added**…we need our land to **also provide secure supplies of wood**…Conffor is now calling for **much greater impetus behind those aspirations**\"——Goodall 主张政府在粮食与生物多样性之外支持**生产性植树**，C 正确。A（补贴低碳住宅建设）无据；B（更重视农村经济）曲解——植树\"利农\"是论据非诉求；D（优先净零战略）曲解——植树是\"贡献\"净零，非\"优先\"净零。\n【AI 修正】无。\n\n### Text 3（让高龄司机安全下路）\n\n**文章脉络**：①最大挑战是说服不安全的高龄司机交出钥匙——停止驾车是\"彻底的人生巨变\" → ②AMA 建议：医生建议遭无视且明显危及安全时，通报车管所合乎伦理；各州规定不一（强制/允许/视之为泄密）——医生须按州法行事以免担责 → ③Dugan：问题被各行业零敲碎打地处理（老年学、公路管理、汽车工程各管一段），缺一个\"高龄司机研究国家所\"——需要更好的证据 → ④有效做法：到场面签换照（85+ 致命事故降 31%）与视力测试（类似降幅），两者合并无增益 → ⑤现实困难：老人不看眼科或看不起；基层医生分身乏术，难跟进\"转不了头、记不住路、没调座椅够不着踏板\"的患者 → ⑥Dugan：路上还有人类司机时自动驾驶解不了撞车难题（应对人类司机的算法太多）；真要百岁人生，就需要 90 岁老人也能舒心驾驶的汽车。"}],"overview":"","discourse":""},{"title":"","passage":["One of the biggest challenges in keeping unsafe aging drivers off the road is convincing them that ifs time to turn over the keys. \"It's a complete life-changer” when someone stops- or is forced to stop- driving, said former risk manager Anne M. Menke. “The American Medical Association advises physicians that 'in situations where clear evidence of substantial driving impairment implies a strong threat to patient and public safety, and where the physician's advice to discontinue driving privileges is ignored, it is desirable and ethical to notify the Department of Motor Vehicles” Menke wrote. \"Some states require physicians to report, others allow but do not mandate reports, while a few consider a report a breach of confidentiality. There could be liability and penalties if a physician does not act in accordance with state laws on reporting and confidentiality”, she counseled. Part of the problem in keeping older drivers safe is that the difficulties are addressed piecemeal by different professions with different focuses, including gerontologists, highway administration officials, automotive engineers and others, said gerontologist Elizabeth Dugan. \"There's not a National Institute of Older Driver Studies J she said. \"We need better evidence on what makes drivers unsafe” and what can help, said Dugan. One thing that does seem to work is requiring drivers to report in person for license renewal. Mandatory in-person renewal was associated with a 31 per cent reduction in fatal crashes involving drivers 85 or older, according to one study. Passing vision tests also produced a similar decline in fatal crashes for those drivers, although there appeared to be no benefit from combining the two. Many older drivers don't see eye doctors or can't afford to. Primary care providers have their hands full and may not be able to follow through with patients who have trouble driving because they can't turn their heads or remember where they are going—or have gotten shorter and haven't changed their seat settings sufficiently to reach car pedals easily. As long as there are other cars on the roads, self-driving cars won't solve the problems of crashes, said Dugan. Avoiding dangers posed by all those human drivers would require too many algorithms, she said. But we need to do more to improve safety, said Dugan. utIf we're going to have 100-year lives, we need cars that a 90-year-old can drive comfortably.\""],"questions":[{"num":31,"stem":"According to Paragraph 1, keeping unsafe aging drivers off the road ___","opts":{"A":"is a new safety measure","B":"has become a disputed issue","C":"can be a tough task to complete","D":"will be beneficial to their health"},"answer":"C","analysis":"**\n考点：细节理解。\n解析：\"One of the **biggest challenges** in keeping unsafe aging drivers off the road is **convincing them** that it's time to turn over the keys.\"——最大挑战是说服他们交钥匙，即**任务艰巨**，C 正确。A（新的安全措施）无据；B（成为争议议题）无据；D（有益其健康）无据——是\"人生巨变\"的中性描述。\n【AI 修正】无。"},{"num":32,"stem":"The American Medical Association's a d v i c e ___","opts":{"A":"has won support from drivers","B":"is generally considered unrealistic","C":"is widely dismissed as unnecessary","D":"has met with different responses"},"answer":"D","analysis":"**\n考点：细节理解。\n解析：\"**Some states require** physicians to report, **others allow** but do not mandate reports, while **a few consider a report a breach of confidentiality**.\"——AMA 建议在三种州法规下得到**不同的回应**，D 正确。A（赢得司机支持）、B（被认为不现实）、C（被斥为多余）均无据。\n【AI 修正】无。"},{"num":33,"stem":"According to Dugan, efforts to keep older drivers s a f e ___","opts":{"A":"have brought about big changes","B":"need to be well coordinated","C":"have gained public recognition","D":"call for relevant legal support"},"answer":"B","analysis":"**\n考点：观点细节题。\n解析：\"the difficulties are addressed **piecemeal by different professions** with different focuses…'There's not a National Institute of Older Driver Studies…We need **better evidence**'\"——各行业零敲碎打、缺乏统筹研究，即相关工作**需要协调**（与更好的证据），B 正确。A（已带来大变化）无据；C（获得公众认可）无据；D（需要法律支持）曲解——是研究统筹而非立法。\n【AI 修正】无。"},{"num":34,"stem":"Some older drivers have trouble driving because they tend to ___","opts":{"A":"stick with bad driving habits","B":"have a weakened memory","C":"suffer from chronic pains","D":"neglect car maintenance"},"answer":"B","analysis":"**\n考点：细节理解。\n解析：\"patients who have trouble driving because they can't turn their heads or **remember where they are going**\"——记不住要去哪，即**记忆衰退**，B 正确。A（固守坏习惯）、C（慢性疼痛）、D（忽视车辆保养）均无据。\n【AI 修正】无。"},{"num":35,"stem":"Dugan thinks that the solution to the problems of crashes may lie in ___","opts":{"A":"upgrading self-driving vehicles","B":"developing senior-friendly cars","C":"renovating transport facilities","D":"adjusting the age limit for drivers"},"answer":"B","analysis":"**\n考点：观点细节题。\n解析：\"self-driving cars **won't solve** the problems of crashes…But we need to do more to improve safety…'If we're going to have 100-year lives, we need **cars that a 90-year-old can drive comfortably**.'\"——出路不是自动驾驶而是**研发适合老人的汽车**，B 正确。A（升级自动驾驶车）反了——自动驾驶被否定；C（改造交通设施）、D（调整驾驶年龄限制）无据。\n【AI 修正】无。\n\n### Text 4（健康 App 的隐私保护缺口）\n\n**文章脉络**：①手机里总有几款健康 App：35 万款在市、仅 2020 年就新增 9 万 → ②但个人信息的收集、保护与共享不透明；现行健康隐私法（HIPAA）聚焦医院、诊所、保险公司——App 与可穿戴设备采集的信息**不受同等法律保护** → ③后果：公司可能未经授权地共享（甚至变现）健康数据——2021 年 Flo Health 遭 FTC 调查（违背隐私承诺、向第三方共享生育数据），和解令要求其获得用户明确同意、并令第三方删除数据 → ④FTC 法案第 5 条只能事后执法——健康 App 上架速度之快表明挑战何其巨大 → ⑤联邦全面立法短期无望；各州已自寻对策：加州先行（CCPA 2018），弗吉尼亚、科罗拉多、犹他也相继立法。"}],"overview":"","discourse":""},{"title":"","passage":["If you look at the apps on your phone, chances are you have at least one related to your health- and probably several. Whether it is a mental health app, a fitness tracker, a connected health device or something else, many of us are taking advantage of this technology to keep better track of our health in some shape or form. Recent research from the Organization fbr the Review of Care and Health Applications found that 350,000 health apps were available on the market, 90,000 of which launched in 2020 alone. While these apps have a great deal to offer, it is not always clear how the personal information we input is collected, safeguarded and shared online. Existing health privacy law, such as the Health Insurance Portability and Accountability Act, is primarily focused on the way hospitals, doctors' offices, clinics and insurance companies store health records online. The health information these apps and health data tracking wearables are collecting typically does not receive the same legal protections. Without additional protections in place, companies may share (and potentially monetize) personal health information in a way consumers may not have authorized or anticipated. In 2021, Flo Health faced a Federal Trade Commission (FTC) investigation. The FTC alleged in a complaint that “despite express privacy claims, the company took control of users' sensitive fertility data and shared it with third parties.\" Flo Health and the FTC settled the matter with a Consent Order requiring the company to get app users' express affirmative consent before sharing their health information as well as to instruct the third parties to delete the data they had obtained. Section 5 of the FTC Act empowers the FTC to initiate enforcement action against unfair or deceptive acts, meaning the FTC can only act after the fact if a company's privacy practices are misleading or cause unjustified consumer harm. While the FTC is doing what it can to ensure apps are keeping their promises to consumers around the handling of their sensitive health information, the rate at which these health apps are hitting the market demonstrates just how immense of a challenge this is. As to the prospects for federal legislation, commentators suggest that comprehensive federal privacy legislation seems unlikely in the short term. States have begun implementing their own solutions to shore up protections for consumer-generated health data. California has been at the forefront of state privacy efforts with the California Consumer Privacy Act of 2018. Virginia, Colorado and Utah have also recently passed state consumer data privacy legislation."],"questions":[{"num":36,"stem":"The research findings are cited in Paragraph 1 to s h o w ___","opts":{"A":"the prevalence of health apps","B":"the public concern over health","C":"the popularity of smartphones","D":"the advancement of technology"},"answer":"A","analysis":"**\n考点：例证目的题。\n解析：\"Recent research…found that **350,000 health apps** were available on the market, **90,000** of which launched in 2020 alone.\"——海量且增速惊人的健康 App，例证其**流行程度**，A 正确。B（公众健康关注）、C（智能手机普及）、D（技术进步）均非例证焦点。\n【AI 修正】无。"},{"num":37,"stem":"What does the author imply about existing health privacy law?","opts":{"A":"Its coverage needs to be extended.","B":"Its enforcement needs strengthening.","C":"It has discouraged medical misconduct.","D":"It has disappointed insurance companies."},"answer":"A","analysis":"**\n考点：推断题。\n解析：\"Existing health privacy law…is **primarily focused on** the way hospitals…store health records online. The health information these apps…are collecting **typically does not receive the same legal protections**.\"——现行法只覆盖医疗机构，App 数据不受同等保护，即**法律覆盖范围需要扩展**，A 正确。B（执行需加强）无据；C（已遏制医疗不端）反了；D（令保险公司失望）无据。\n【AI 修正】无。"},{"num":38,"stem":"Before sharing its users' health information, Flo Health is required to ___","opts":{"A":"seek the approval of the FTC","B":"find qualified third parties","C":"remove irrelevant personal data","D":"obtain their explicit permission"},"answer":"D","analysis":"**\n考点：细节理解。\n解析：\"a Consent Order requiring the company to **get app users' express affirmative consent** before sharing their health information\"——共享前须获得用户**明确许可**，D 正确。A（寻求 FTC 批准）、B（甄选第三方）、C（删除无关数据）均无据。\n【AI 修正】无。"},{"num":39,"stem":"What challenge is the FTC currently faced with?","opts":{"A":"The complexity of health information.","B":"The rapid increase in new health apps.","C":"The subtle deceptiveness of health apps.","D":"The difficulty in assessing consumer harm."},"answer":"B","analysis":"**\n考点：细节理解。\n解析：\"the **rate at which these health apps are hitting the market** demonstrates just how immense of a challenge this is.\"——健康 App 上市**速度**之快表明监管挑战巨大，即**新 App 快速增长**，B 正确。A（健康信息的复杂性）无据；C（App 的隐性欺骗性）无据；D（评估消费者损害的难度）无据。\n【AI 修正】无。"},{"num":40,"stem":"It can be learned from the last paragraph that health data protection ___","opts":{"A":"has been embraced by health app developers","B":"has been a focus of federal policy-making","C":"has encountered opposition in California","D":"has gained legislative support in some states"},"answer":"D","analysis":"**\n考点：细节理解（末段）。\n解析：\"comprehensive **federal** privacy legislation seems unlikely in the short term. **States** have begun implementing their own solutions…California…Virginia, Colorado and Utah have also recently passed state consumer data privacy legislation.\"——联邦无望但**多州已立法**支持健康数据保护，D 正确。A（获开发者拥抱）反了；B（联邦政策焦点）反了——联邦短期无望；C（在加州遇阻）反了——加州是先锋。\n【AI 修正】无。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points) High school students eager to stand out in the college application process often participate in a litany of extracurricular activities hoping to bolster their chances of admission to a selective undergraduate institution. However, college admissions experts say that the quality of a college hopeful's extracurricular activities matters more than the number of activities he or she participates in. Sue Rexford, the director of college guidance at the Charles E. Smith Jewish Day School, says it is not necessary for a student filling out the Common Application to list 10 activities in the application. “No college will expect that a student has a huge laundry list of extracurriculars that they have been passionately involved in each for an extended period of time J Rexford wrote in an email. Experts say it is tougher to distinguish oneself in a school-affiliated extracurricular activity that is'common among high school students than it is to stand out while doing an uncommon activity. “The competition to stand out and make an impact is going to be much stiffer, and so if they're going to do a popular activity, I'd say, be the best at it,“ says Sara Harberson, a college admissions consultant. High school students who have an impressive personal project they are working on independently often impress colleges, experts say. “For example, a student with an interest in entrepreneurship could demonstrate skill and potential by starting a profitable small business”, Olivia Valdes, the founder of Zen Admissions consulting firm, wrote in an email. Joseph Adegboyega-Edun, a Maryland high school guidance counselor, says unconventional extracurricular activities can help students impress college admissions offices, assuming they demonstrated serious commitment. \"Again, since one of the big questions high school seniors must consider is 'What makes you unique?' having an uncommon extracurricular activity vs. a conventional one is an advantage,he wrote in an email. Experts say demonstrating talent in at least one extracurricular activity can help in the college admissions process, especially at top-tier undergraduate institutions. \"\"Distinguishing yourself in one focused type of extracurricular activity can be a positive in the admissions process, especially for highly selective institutions, where having top grades and test scores is not enough,\" Katie Kelley, admissions counselor at IvyWise admissions consultancy, wrote in an email. ''Students need to have that quality or hook that will appeal to admissions officers and allow them to visualize how the student might come and enrich their campus community.\" Extracurricular activities related to the college major declared on a college application are beneficial, experts suggest. 4tIf you already know your major, having an extracurricular that fits into that major can be a big plus,\" says Mayghin Levine, the manager of educational opportunities with The Cabbage Patch Settlement House, a Louisville, Kentucky, nonprofit community center. High school students who have had a strong positive influence on their community through an extracurricular activity may impress a college and win a scholarship, says Erica Gwyn, a former math and science magnet program assistant at a public high school who is now executive director of the Kaleidoscope Careers Academy in Atlanta, a nonprofit organization."],"options":[{"key":"A","text":"Students who stand out in a specific extracurricular activity will be favored by top-tier institutions."},{"key":"B","text":"Students whose extracurricular activity has benefited their community are likely to win a scholarship."},{"key":"C","text":"Undertaking too many extracurricular activities will hardly be seen as a plus by colleges."},{"key":"D","text":"A student who exhibits abilities in doing business can impress colleges."},{"key":"E","text":"High school students participating in a popular activity should excel in it."},{"key":"F","text":"Engaging in uncommon activities can demonstrate students' determination and dedication."},{"key":"G","text":"It is advisable for students to choose an extracurricular activity that is related to their future study at college."}],"passage":["- **A.** Students who stand out in a specific extracurricular activity will be favored by top-tier institutions. - **B.** Students whose extracurricular activity has benefited their community are likely to win a scholarship. - **C.** Undertaking too many extracurricular activities will hardly be seen as a plus by colleges. - **D.** A student who exhibits abilities in doing business can impress colleges. - **E.** High school students participating in a popular activity should excel in it. - **F.** Engaging in uncommon activities can demonstrate students' determination and dedication. - **G.** It is advisable for students to choose an extracurricular activity that is related to their future study at college."],"questions":[{"num":41,"stem":"Sue Rexford __________","opts":{},"answer":"C","analysis":"**（Sue Rexford）\n解析：原文 \"says it is **not necessary** for a student…to **list 10 activities**…'No college will expect that a student has a huge laundry list of extracurriculars…'\"——活动数量多并不会被大学视为加分，对应 C。"},{"num":42,"stem":"Sara Harberson __________","opts":{},"answer":"E","analysis":"**（Sara Harberson）\n解析：原文 \"'if they're going to do a **popular activity**, I'd say, **be the best at it**,'\"——参加热门活动就要做到最出色，对应 E。"},{"num":43,"stem":"Katie Kelley __________","opts":{},"answer":"A","analysis":"**（Katie Kelley）\n解析：原文 \"'Distinguishing yourself in one focused type of extracurricular activity can be a positive…**especially for highly selective institutions**…'\"——在某一具体活动中脱颖而出者受顶尖院校青睐，对应 A。"},{"num":44,"stem":"Mayghin Levine __________","opts":{},"answer":"G","analysis":"**（Mayghin Levine）\n解析：原文 \"'If you already know your major, having an extracurricular that **fits into that major** can be a big plus,'\"——课外活动与未来专业相关更佳，对应 G。"},{"num":45,"stem":"Erica Gwyn __________","opts":{},"answer":"B","analysis":"**（Erica Gwyn）\n解析：原文 \"High school students who have had a **strong positive influence on their community**…may impress a college and **win a scholarship**.\"——课外活动惠及社区者可能获奖学金，对应 B。多余项：D（展现经商才能可给大学留下印象——对应 Valdes 的创业例子，但其不在左列）、F（非常规活动体现决心与投入——对应 Adegboyega-Edun 的观点，其不在左列）。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points) With the smell of coffee and fresh bread floating in the air, stalls bursting with colourful vegetables and tempting cheeses, and the buzz of friendly chats, farmers' markets are a feast for the senses. They also provide an opportunity to talk to the people responsible for growing or raising your food, support your local economy and pick up fresh seasonal produce—all at the same time. Farmers' markets are usually weekly or monthly events, most often with outdoor stalls, which allow farmers or producers to sell their food directly to customers. The size or regularity of markets can vary from season to season, depending on the area's agricultural calendar, and you're likely to find different produce on sale at different times of the year. By cutting out the middlemen, the fanners secure more profit for their produce. Shoppers also benefit from seeing exactly where—and to who—their money is going."],"reference":"空气中飘散着咖啡与新鲜面包的香气，摊位上堆满五颜六色的蔬菜和诱人的奶酪，四处是友好交谈的喧声——农贸市场是一场感官的盛宴。在这里，你还可以与种植或饲养你盘中食物的人交谈，支持本地经济，买到新鲜的时令农产品——一石多鸟。\n\n农贸市场通常每周或每月举办一次，多为露天摊位，农民或生产者由此把食物直接卖给顾客。市场的规模与频次会随季节而变化，取决于当地的农事历；一年中不同的时候，你会发现上市的产品也各不相同。由于省去了中间商，农民能从自己的产品中获得更多利润。购物者也能从中受益——他们可以清清楚楚地看到自己的钱花在了哪里、进了谁的口袋。\n\n> 翻译要点：① a feast for the senses（一场感官的盛宴）；② talk to the people responsible for growing or raising your food（与种植或饲养你盘中食物的人交谈）；③ agricultural calendar（农事历）；④ by cutting out the middlemen（省去中间商）；⑤ where—and to who—your money is going（钱花在了哪里、进了谁的口袋）。","analysis":""},"writing":{"small":["**47.** Directions: Suppose you and Jack are going to do a survey on the protection of old houses in an ancient town. Write him an email to 1) put forward your plan, and 2) ask for his opinion. Write your answer in about 100 words on the ANSWER SHEET. Do not use your own name in your email; use “Li Ming” instead. (10 points)"],"large":["**48.** Directions: Write an essay based on the chart below. In your essay, you should 1) describe and interpret the chart, and 2) give your comments. Write your answer in about 150 words on the ANSWER SHEET. (15 points) **某高校劳动实践课学生主要收获调查**","| 提升了动手能力 | 学习了相关知识 | 增强了合作能力 | 感觉到心情舒畅 | |---|---|---|---| | 84.8% | 91.3% | 32.6% | 54.4% |"],"small_ref":"Dear Jack,\n\nAs agreed, we are going to carry out a survey on the protection of old houses in the ancient town. I am writing to put forward my plan and hear your opinions.\n\nI propose that we conduct the survey next Monday and Tuesday. On the first day, we will interview local residents and craftsmen to learn about the history of these houses and the difficulties in preserving them. On the second day, we will photograph and record the conditions of the buildings, especially those in urgent need of repair. Afterwards, we will summarize our findings and draft a report with practical suggestions for the local authorities.\n\nWhat do you think of the schedule and approach? If you have any other ideas — for example, whom we should contact first — please let me know so that we can finalize the plan.\n\nYours,\nLi Ming\n\n> 思路：三段式——点明任务并提出计划（两天分工：访谈 + 实地记录 + 报告）→ 征求意见（请对方补充联系人等）→ 收尾。署名 Li Ming，不写地址。","large_ref":"**图表信息**：某高校劳动实践课学生主要收获——学习了相关知识 91.3%、提升了动手能力 84.8%、感觉到心情舒畅 54.4%、增强了合作能力 32.6%。\n\nThe chart above presents the main gains that students have made from labor practice courses in a certain university. As is shown, learning relevant knowledge ranks first at 91.3 percent, followed by improving hands-on skills at 84.8 percent. Feeling relaxed and happy accounts for 54.4 percent, while enhancing cooperation ability takes up 32.6 percent.\n\nThe statistics reveal that labor practice courses have fulfilled their educational purposes well: most students have not only acquired knowledge but also strengthened their practical abilities, which are exactly what classroom lectures can hardly offer. Meanwhile, more than half of the participants find such courses mentally refreshing, indicating that manual labor serves as an effective antidote to academic stress. The relatively low percentage of cooperation ability suggests that more team-based tasks should be incorporated into the courses.\n\nFrom my perspective, labor practice deserves a permanent place in higher education. Universities are advised to design more cooperative projects and real-work scenarios, so that students can benefit more comprehensively — in knowledge, skills, collaboration and well-being.\n\n> 思路：首段描述图表（知识、动手居前）→ 中段解读（课程达成育人目的 / 愉悦缓解学业压力 / 合作占比低引出建议）→ 末段评论（劳动教育应有固定地位 + 增设协作任务）。"},"label":"2024 年真题（AI 解析）"};
