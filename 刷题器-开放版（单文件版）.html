<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语真题刷题器 · AI 解析版（2010-2026）</title>
<style>
:root {
  --bg: #f5f7fa;
  --card: #ffffff;
  --ink: #1f2937;
  --ink2: #6b7280;
  --line: #e5e7eb;
  --brand: #2563eb;
  --brand-soft: #eff6ff;
  --ok: #16a34a;
  --ok-soft: #f0fdf4;
  --bad: #dc2626;
  --bad-soft: #fef2f2;
  --warn-soft: #fffbeb;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--ink); line-height: 1.65;
}
#app { max-width: 1080px; margin: 0 auto; padding: 24px 16px 80px; }
a { color: var(--brand); text-decoration: none; }

/* 顶栏 */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; margin-bottom: 20px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  position: sticky; top: 12px; z-index: 10; box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.topbar .back {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 8px; padding: 5px 14px; cursor: pointer; font-size: 14px;
}
.topbar .back:hover { border-color: var(--brand); color: var(--brand); }
.topbar h2 { font-size: 16px; font-weight: 600; }
.topbar .spacer { flex: 1; }
.topbar .meta { color: var(--ink2); font-size: 13px; }

/* 首页 */
.hero { text-align: center; padding: 28px 0 8px; }
.hero h1 { font-size: 26px; margin-bottom: 8px; }
.hero p { color: var(--ink2); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 24px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; cursor: pointer; transition: .15s;
}
.card:hover { border-color: var(--brand); box-shadow: 0 3px 10px rgba(37,99,235,.1); transform: translateY(-2px); }
.card h3 { font-size: 18px; margin-bottom: 4px; }
.card .sub { color: var(--ink2); font-size: 12.5px; }
.card .stat { margin-top: 10px; font-size: 12.5px; color: var(--brand); }
.card.wide { grid-column: 1 / -1; cursor: default; }
.card.wide:hover { transform: none; box-shadow: none; border-color: var(--line); }

/* 篇目列表 */
.sec-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.sec-row {
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 20px; cursor: pointer; transition: .15s;
}
.sec-row:hover { border-color: var(--brand); box-shadow: 0 3px 10px rgba(37,99,235,.08); }
.sec-row .tag {
  font-size: 12px; background: var(--brand-soft); color: var(--brand);
  border-radius: 6px; padding: 3px 10px; white-space: nowrap;
}
.sec-row .tag.self { background: var(--warn-soft); color: #b45309; }
.sec-row h3 { font-size: 15.5px; flex: 1; }
.sec-row .sub { color: var(--ink2); font-size: 12.5px; }

/* 练习页布局 */
.layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px;
}
.panel h3 { font-size: 15px; margin-bottom: 12px; color: var(--brand); }
.panel .passage { font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
.panel .directions { font-size: 13px; color: var(--ink2); margin-bottom: 12px; padding: 10px 12px; background: var(--bg); border-radius: 8px; }
.blank { color: var(--brand); font-weight: 600; }
.pb-opt { padding: 3px 0; }
.pb-opt b { color: var(--brand); }

/* 题卡 */
.qcard { position: sticky; top: 76px; }
.qnum { font-size: 13px; color: var(--ink2); margin-bottom: 6px; display: flex; justify-content: space-between; }
.qstem { font-size: 15.5px; margin-bottom: 14px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; gap: 10px; align-items: baseline; text-align: left;
  border: 1.5px solid var(--line); background: #fff; border-radius: 10px;
  padding: 10px 14px; cursor: pointer; font-size: 14.5px; transition: .12s; width: 100%;
  font-family: inherit; color: var(--ink); line-height: 1.5;
}
.opt:hover { border-color: var(--brand); }
.opt .key { font-weight: 700; color: var(--brand); }
.opt.chosen { border-color: var(--brand); background: var(--brand-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { color: var(--bad); }
.opt:disabled { cursor: default; }
.actions { margin-top: 14px; display: flex; gap: 10px; }
.btn {
  border: none; border-radius: 10px; padding: 9px 22px; cursor: pointer;
  font-size: 14.5px; font-weight: 600; font-family: inherit; transition: .15s;
}
.btn.primary { background: var(--brand); color: #fff; }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--brand); color: var(--brand); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* 判分与解析 */
.verdict { margin-top: 14px; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.analysis {
  margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px;
  font-size: 13.5px; color: var(--ink); max-height: 420px; overflow-y: auto;
}
.analysis h4 { font-size: 13px; color: var(--brand); margin: 10px 0 4px; }
.analysis p { margin: 6px 0; }
.analysis li { margin: 3px 0 3px 18px; }
.analysis .opt-tag { color: var(--brand); font-weight: 700; }
.analysis .ana-block { margin: 10px 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; }
.analysis .ana-block > b:first-child { color: var(--brand); }
.ana-toggle { margin-top: 10px; font-size: 13px; }

/* 结果页 */
.summary { max-width: 560px; margin: 40px auto; text-align: center; }
.summary .score { font-size: 44px; font-weight: 700; color: var(--brand); margin: 12px 0; }
.summary .wrong-list { text-align: left; margin-top: 18px; }
.summary .wrong-list .w {
  display: flex; justify-content: space-between; padding: 8px 12px;
  border-bottom: 1px solid var(--line); font-size: 14px;
}

/* 错题本 */
.wrong-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px;
}
.wrong-item .wq { flex: 1; font-size: 14px; }
.wrong-item .wq .meta { color: var(--ink2); font-size: 12px; }
.wrong-item button { white-space: nowrap; }

/* 自评 */
.ref-block { margin-top: 14px; white-space: pre-wrap; font-size: 14px; background: var(--bg); border-radius: 8px; padding: 14px; }
.empty { text-align: center; color: var(--ink2); padding: 60px 0; }

/* 拖拽导入区 */
.dropzone {
  border: 2px dashed var(--brand); background: var(--brand-soft);
  border-radius: var(--radius); padding: 26px 20px; text-align: center;
  color: var(--brand); font-size: 15px; cursor: pointer; margin: 18px auto 6px;
  max-width: 720px; transition: .15s;
}
.dropzone .sub { color: var(--ink2); font-size: 12.5px; margin-top: 6px; }
.dropzone:hover, .dropzone.dragging { background: #dbeafe; border-color: #1d4ed8; transform: scale(1.01); }

/* 填空题输入框 */
.blank-input {
  width: 100%; max-width: 420px; padding: 10px 12px; font-size: 15px;
  font-family: inherit; border: 1.5px solid var(--line); border-radius: 8px;
  margin: 4px 0 10px; background: var(--card); color: var(--ink);
}
.blank-input:focus { outline: none; border-color: var(--brand); }
.blank-input:disabled { background: var(--bg); color: var(--ink2); }

/* KaTeX 公式（数学等科目） */
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.katex { font-size: 1.05em; }

 way matched by few other industries. In the weeks and months that followed Mr. Hirst’s sale, spending of any sort became deeply unfashionable. In the art world that meant collectors stayed away from galleries and salerooms. Sales of contemporary art fell by two-thirds, and in the most overheated sector, they were down by nearly 90% in the year to November 2008. Within weeks the world’s two biggest auction houses, Sotheby’s and Christie’s, had to pay out nearly $200m in guarantees to clients who had placed works for sale with them. The current downturn in the art market is the worst since the Japanese stopped buying Impressionists at the end of 1989. This time experts reckon that prices are about 40% down on their peak on average, though some have been far more fluctuant. But Edward Dolman, Christie’s chief executive, says: “I’m pretty confident we’re at the bottom.” What makes this slump different from the last, he says, is that there are still buyers in the market. Almost everyone who was interviewed for this special report said that the biggest problem at the moment is not a lack of demand but a lack of good work to sell. The three Ds – death, debt and divorce – still deliver works of art to the market. But anyone who does not have to sell is keeping away, waiting for confidence to return."],"questions":[{"num":21,"stem":"In the first paragraph, Damien Hirst’s sale was referred to as “a last victory” ___","opts":{"A":"the art market had witnessed a succession of victories","B":"the auctioneer finally got the two pieces at the highest bids","C":"Beautiful Inside My Head Forever won over all masterpieces","D":"it was successfully made just before the world financial crisis"},"answer":"D","analysis":"【AI 解析】答案 [D]「it was successfully made just before the world…」。本题考查「In the first paragraph, Damien Hirst’s s…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"By saying “spending of any sort became deeply unfashionable” (Line 1-2, Para. 3), ___","opts":{"A":"collectors were no longer actively involved in art-market auctions","B":"people stopped every kind of spending and stayed away from galleries","C":"art collection as a fashion had lost its appeal to a great extent","D":"works of art in general had gone out of fashion so they were not worth buying"},"answer":"A","analysis":"【AI 解析】答案 [A]「collectors were no longer actively involved in…」。本题考查「By saying “spending of any sort became d…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":23,"stem":"Which of the following statements is NOT true?","opts":{"A":"Sales of contemporary art fell dramatically from 2007 to 2008.","B":"The art market surpassed many other industries in momentum.","C":"The art market generally went downward in various ways.","D":"Some art dealers were awaiting better chances to come."},"answer":"B","analysis":"【AI 解析】答案 [B]「The art market surpassed many other industries…」。本题考查「Which of the following statements is NOT…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":24,"stem":"The three Ds mentioned in the last paragraph are ______.","opts":{"A":"auction houses’ favorites","B":"contemporary trends","C":"factors promoting artwork circulation","D":"styles representing Impressionists"},"answer":"C","analysis":"【AI 解析】答案 [C]「factors promoting artwork circulation」。本题考查「The three Ds mentioned in the last parag…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":25,"stem":"The most appropriate title for this text could be ______.","opts":{"A":"Fluctuation of Art Prices","B":"Up-to-date Art Auctions","C":"Art Market in Decline","D":"Shifted Interest in Arts"},"answer":"C","analysis":"【AI 解析】答案 [C]「Art Market in Decline」。本题考查「The most appropriate title for this text…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["I was addressing a small gathering in a suburban Virginia living room – a women’s group that had invited men to join them. Throughout the evening, one man had been particularly talkative, frequently offering ideas and anecdotes, while his wife sat silently beside him on the couch. Toward the end of the evening, I commented that women frequently complain that their husbands don’t talk to them. This man quickly nodded in agreement. He gestured toward his wife and said, “She’s the talker in our family.” The room burst into laughter; the man looked puzzled and hurt. “It’s true,” he explained. “When I come home from work I have nothing to say. If she didn’t keep the conversation going, we’d spend the whole evening in silence.” This episode crystallizes the irony that although American men tend to talk more than women in public situations, they often talk less at home. And this pattern is wreaking havoc with marriage. The pattern was observed by political scientist Andrew Hacker in the late 1970s. Sociologist Catherine Kohler Riessman reports in her new book Divorce Talk that most of the women she interviewed – but only a few of the men – gave lack of communication as the reason for their divorces. Given the current divorce rate of nearly 50 percent, that amounts to millions of cases in the United States every year – a virtual epidemic of failed conversation. In my own research, complaints from women about their husbands most often focused not on tangible inequities such as having given up the chance for a career to accompany a husband to his, or doing far more than their share of daily life-support work like cleaning, cooking and social arrangements. Instead, they focused on communication: “He doesn’t listen to me.” “He doesn’t talk to me.” I found, as Hacker observed years before, that most wives want their husbands to be, first and foremost, conversational partners, but few husbands share this expectation of their wives. In short, the image that best represents the current crisis is the stereotypical cartoon scene of a man sitting at the breakfast table with a newspaper held up in front of his face, while a woman glares at the back of it, wanting to talk."],"questions":[{"num":26,"stem":"What is most wives’ main expectation of their husbands?","opts":{"A":"Talking to them.","B":"Trusting them.","C":"Supporting their careers.","D":"Sharing housework."},"answer":"A","analysis":"【AI 解析】答案 [A]「Talking to them.」。本题考查「What is most wives’ main expectation of …」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"Judging from the context, the phrase “wreaking havoc” (Line 3, Para. 2) most ___","opts":{"A":"generating motivation","B":"exerting influence","C":"causing damage","D":"creating pressure"},"answer":"C","analysis":"【AI 解析】答案 [C]「causing damage」。本题考查「Judging from the context, the phrase “wr…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"All of the following are true EXCEPT ______.","opts":{"A":"men tend to talk more in public than women","B":"nearly 50 percent of recent divorces are caused by failed conversation","C":"women attach much importance to communication between couples","D":"a female tends to be more talkative at home than her spouse"},"answer":"B","analysis":"【AI 解析】答案 [B]「nearly 50 percent of recent divorces are cause…」。本题考查「All of the following are true EXCEPT ___…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"Which of the following can best summarize the main idea of this text?","opts":{"A":"The moral decaying deserves more research by sociologists.","B":"Marriage break-up stems from sex inequalities.","C":"Husband and wife have different expectations from their marriage.","D":"Conversational patterns between man and wife are different."},"answer":"D","analysis":"【AI 解析】答案 [D]「Conversational patterns between man and wife a…」。本题考查「Which of the following can best summariz…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"In the following part immediately after this text, the author will most probably ___","opts":{"A":"a vivid account of the new book Divorce Talk","B":"a detailed description of the stereotypical cartoon","C":"other possible reasons for a high divorce rate in the U.S.","D":"a brief introduction to the political scientist Andrew Hacker"},"answer":"B","analysis":"【AI 解析】答案 [B]「a detailed description of the stereotypical ca…」。本题考查「In the following part immediately after …」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Over the past decade, many companies had perfected the art of creating automatic behaviors – habits – among consumers. These habits have helped companies earn billions of dollars when customers eat snacks or wipe counters almost without thinking, often in response to a carefully designed set of daily cues. “There are fundamental public health problems, like dirty hands instead of a soap habit, that remain killers only because we can’t figure out how to change people’s habits,” said Dr. Curtis, the director of the Hygiene Center at the London School of Hygiene & Tropical Medicine. “We wanted to learn from private industry how to create new behaviors that happen automatically.” The companies that Dr. Curtis turned to – Procter & Gamble, Colgate-Palmolive and Unilever – had invested hundreds of millions of dollars finding the subtle cues in consumers’ lives that corporations could use to introduce new routines. If you look hard enough, you’ll find that many of the products we use every day – chewing gums, skin moisturizers, disinfecting wipes, air fresheners, water purifiers, health snacks, teeth whiteners, fabric softeners, vitamins – are results of manufactured habits. A century ago, few people regularly brushed their teeth multiple times a day. Today, because of shrewd advertising and public health campaigns, many Americans habitually give their pearly whites a cavity-preventing scrub twice a day, often with Colgate, Crest or one of the other brands. A few decades ago, many people didn’t drink water outside of a meal. Then beverage companies started bottling the production of far-off springs, and now office workers unthinkingly sip bottled water all day long. Chewing gum, once bought primarily by adolescent boys, is now featured in commercials as a breath freshener and teeth cleanser for use after a meal. Skin moisturizers are advertised as part of morning beauty rituals, slipped in between hair brushing and putting on makeup. “Our products succeed when they become part of daily or weekly patterns,” said Carol Berning, a consumer psychologist who recently retired from Procter & Gamble, the company that sold $76 billion of Tide, Crest and other products last year. “Creating positive habits is a huge part of improving our consumers’ lives, and it’s essential to making new products commercially viable.” Through experiments and observation, social scientists like Dr. Berning have learned that there is power in tying certain behaviors to habitual cues through ruthless advertising. As this new science of habit has emerged, controversies have erupted when the tactics have been used to sell questionable beauty creams or unhealthy foods."],"questions":[{"num":31,"stem":"According to Dr. Curtis, habits like hand washing with soap ______.","opts":{"A":"should be further cultivated","B":"should be changed gradually","C":"are deeply rooted in history","D":"are basically private concerns"},"answer":"A","analysis":"【AI 解析】答案 [A]「should be further cultivated」。本题考查「According to Dr. Curtis, habits like han…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"Bottled water, chewing gum and skin moisturizers are mentioned in Paragraph 5 ___","opts":{"A":"reveal their impact on people’s habits","B":"show the urgent need of daily necessities","C":"indicate their effect on people’s buying power","D":"manifest the significant role of good habits"},"answer":"A","analysis":"【AI 解析】答案 [A]「reveal their impact on people’s habits」。本题考查「Bottled water, chewing gum and skin mois…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"Which of the following does NOT belong to products that help create people’s ___","opts":{"A":"Tide.","B":"Crest.","C":"Colgate.","D":"Unilever."},"answer":"D","analysis":"【AI 解析】答案 [D]「Unilever.」。本题考查「Which of the following does NOT belong t…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"From the text we know that some of consumers’habits are developed due to _____.","opts":{"A":"perfected art of products","B":"automatic behavior creation","C":"commercial promotions","D":"scientific experiments"},"answer":"C","analysis":"【AI 解析】答案 [C]「commercial promotions」。本题考查「From the text we know that some of consu…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"The author’s attitude toward the influence of advertisement on people’s habits is ___","opts":{"A":"indifferent","B":"negative","C":"positive","D":"biased"},"answer":"B","analysis":"【AI 解析】答案 [B]「negative」。本题考查「The author’s attitude toward the influen…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Many Americans regard the jury system as a concrete expression of crucial democratic values, including the principles that all citizens who meet minimal qualifications of age and literacy are equally competent to serve on juries; that jurors should be selected randomly from a representative cross section of the community; that no citizen should be denied the right to serve on a jury on account of race, religion, sex, or national origin; that defendants are entitled to trial by their peers; and that verdicts should represent the conscience of the community and not just the letter of the law. The jury is also said to be the best surviving example of direct rather than representative democracy. In a direct democracy, citizens take turns governing themselves, rather than electing representatives to govern for them. But as recently as in 1968, jury selection procedures conflicted with these democratic ideals. In some states, for example, jury duty was limited to persons of supposedly superior intelligence, education, and moral character. Although the Supreme Court of the United States had prohibited intentional racial discrimination in jury selection as early as the 1880 case of Strauder v. West Virginia, the practice of selecting so-called elite or blue-ribbon juries provided a convenient way around this and other antidiscrimination laws. The system also failed to regularly include women on juries until the mid-20th century. Although women first served on state juries in Utah in 1898, it was not until the 1940s that a majority of states made women eligible for jury duty. Even then several states automatically exempted women from jury duty unless they personally asked to have their names included on the jury list. This practice was justified by the claim that women were needed at home, and it kept juries unrepresentative of women through the 1960s. In 1968, the Congress of the United States passed the Jury Selection and Service Act, ushering in a new era of democratic reforms for the jury. This law abolished special educational requirements for federal jurors and required them to be selected at random from a cross section of the entire community. In the landmark 1975 decision Taylor v. Louisiana, the Supreme Court extended the requirement that juries be representative of all parts of the community to the state level. The Taylor decision also declared sex discrimination in jury selection to be unconstitutional and ordered states to use the same procedures for selecting male and female jurors."],"questions":[{"num":36,"stem":"From the principles of the US jury system, we learn that _____.","opts":{"A":"both literate and illiterate people can serve on juries","B":"defendants are immune from trial by their peers","C":"no age limit should be imposed for jury service","D":"judgment should consider the opinion of the public"},"answer":"D","analysis":"【AI 解析】答案 [D]「judgment should consider the opinion of the pu…」。本题考查「From the principles of the US jury syste…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"The practice of selecting so-called elite jurors prior to 1968 showed _____.","opts":{"A":"the inadequacy of antidiscrimination laws","B":"the prevalent discrimination against certain races","C":"the conflicting ideals in jury selection procedures","D":"the arrogance common among the Supreme Court judges"},"answer":"A","analysis":"【AI 解析】答案 [A]「the inadequacy of antidiscrimination laws」。本题考查「The practice of selecting so-called elit…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"Even in the 1960s, women were seldom on the jury list in some states because ___","opts":{"A":"they were automatically banned by state laws","B":"they fell far short of the required qualifications","C":"they were supposed to perform domestic duties","D":"they tended to evade public engagement"},"answer":"C","analysis":"【AI 解析】答案 [C]「they were supposed to perform domestic duties」。本题考查「Even in the 1960s, women were seldom on …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"After the Jury Selection and Service Act was passed, _____.","opts":{"A":"sex discrimination in jury selection was unconstitutional and had to be abolished","B":"educational requirements became less rigid in the selection of federal jurors","C":"jurors at the state level ought to be representative of the entire community","D":"states ought to conform to the federal court in reforming the jury system"},"answer":"B","analysis":"【AI 解析】答案 [B]「educational requirements became less rigid in …」。本题考查「After the Jury Selection and Service Act…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"In discussing the US jury system, the text centers on _____.","opts":{"A":"its nature and problems","B":"its characteristics and tradition","C":"its problems and their solutions","D":"its tradition and development"},"answer":"C","analysis":"【AI 解析】答案 [C]「its problems and their solutions」。本题考查「In discussing the US jury system, the te…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and decide whether each of the statements is true or false. Choose T if the statement is true or F if the statement is not true. Mark your answers on ANSWER SHEET 1. (10 points)"],"options":[],"passage":["Copying Birds May Save Aircraft Fuel Both Boeing and Airbus have trumpeted the efficiency of their newest aircraft, the 787 and A350 respectively. Their clever designs and lightweight composites certainly make a difference. But a group of researchers at Stanford University, led by Ilan Kroo, has suggested that airlines could take a more naturalistic approach to cutting jet-fuel use and it would not require them to buy new aircraft. The answer, says Dr. Kroo, lies with birds. Since 1914, scientists have known that birds flying in formation – a V-shape – expend less energy. The air flowing over a bird’s wings curls upwards behind the wingtips, a phenomenon known as upwash. Other birds flying in the upwash experience reduced drag, and spend less energy propelling themselves. Peter Lissaman, an aeronautics expert who was formerly at Caltech and the University of Southern California, has suggested that a formation of 25 birds might enjoy a range increase of 71%. When applied to aircraft, the principles are not substantially different. Dr. Kroo and his team modeled what would happen if three passenger jets departing from Los Angeles, San Francisco and Las Vegas were to assemble over Utah, assume an inverted V-formation, occasionally change places so all could have a turn in the most favourable positions, and proceed to London. They found that the aircraft consumed as much as 15% less fuel (coupled with a reduction in carbon-dioxide output). Nitrogen-oxide emissions during the cruising portions of the flight fell by around a quarter. There are, of course, knots to be worked out. One consideration is safety, or at least the perception of it. Would passengers feel comfortable travelling in companion? Dr. Kroo points out that the aircraft could be separated by several nautical miles, and would not be in the intimate groupings favoured by display teams like the Red Arrows. A passenger peering out of the window might not even see the other planes. Whether the separation distances involved would satisfy air-traffic-control regulations is another matter, although a working group at the International Civil Aviation Organisation has included the possibility of formation flying in a blueprint for new operational guidelines. It remains to be seen how weather conditions affect the air flows that make formation flight more efficient. In zones of increased turbulence, the planes’ wakes will decay more quickly and the effect will diminish. Dr. Kroo says this is one of the areas his team will investigate further. It might also be hard for airlines to co-ordinate the departure times and destinations of passenger aircraft in a way that would allow them to gain from formation flight. Cargo aircraft, in contrast, might be easier to reschedule, as might routine military flights. As it happens, America’s armed forces are on the case already. Earlier this year the country’s Defence Advanced Research Projects Agency announced plans to pay Boeing to investigate formation flight, though the programme has yet to begin. There are reports that some military aircraft flew in formation when they were low on fuel during the Second World War, but Dr. Lissaman says they are unsubstantiated. “My father was an RAF pilot and my cousin the skipper of a Lancaster lost over Berlin,” he adds. So he should know."],"questions":[{"num":41,"stem":"Findings of the Stanford University researchers will promote the sales of new Boeing and Airbus aircraft.","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]，该判断与原文相应表述一致。"},{"num":42,"stem":"The upwash experience may save propelling energy as well as reducing resistance.","opts":{},"answer":"T","analysis":"【AI 解析】答案 [T]，该判断与原文相应表述一致。"},{"num":43,"stem":"Formation flight is more comfortable because passengers can not see the other planes.","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]，该判断与原文相应表述一致。"},{"num":44,"stem":"The role that weather plays in formation flight has not yet been clearly defined.","opts":{},"answer":"T","analysis":"【AI 解析】答案 [T]，该判断与原文相应表述一致。"},{"num":45,"stem":"It has been documented that during World War Ⅱ, America’s armed forces once tried formation flight to save fuel.","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]，该判断与原文相应表述一致。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: In this section there is a text in English. Translate it into Chinese. Write your translation onANSWER SHEET 2. (15 points) “Sustainability” has become a popular word these days, but to Ted Ning, the concept will always have personal meaning. Having endured a painful period of unsustainability in his own life made it clear to him that sustainability-oriented values must be expressed through everyday action and choice. Ning recalls spending a confusing year in the late 1990s selling insurance. He’d been through the dot-com boom and burst and, desperate for a job, signed on with a Boulder agency. It didn’t go well. “It was a really bad move because that’s not my passion,” says Ning, whose dilemma about the job translated, predictably, into a lack of sales. “I was miserable. I had so much anxiety that I would wake up in the middle of the night and stare at the ceiling. I had no money and needed the job. Everyone said, ‘Just wait, you’ll turn the corner, give it some time.’”"],"reference":"如今，“可持续性”已成为一个流行词，但对特德·宁来说，这个概念始终有着切身的含义。在经历了自己生命中一段痛苦的“不可持续”时期之后，他清楚地认识到：以可持续为导向的价值观，必须通过日常的行动和选择来体现。宁回忆起上世纪 90 年代末那段迷茫的岁月——他当时在卖保险。在经历了互联网泡沫的兴起与破裂之后，急于找工作的他与博尔德市的一家保险机构签了约，但情况并不顺利。“那真是一个糟糕的决定，因为那不是我的热情所在，”宁说。可以预见，他对这份工作的纠结直接反映在销售业绩上。“我痛苦不堪，焦虑到我半夜醒来盯着天花板。我没有钱，又需要这份工作。所有人都说：再等等，情况会好转的，给它一点时间。”","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: You have just come back from the U.S. as a member of a Sino-American cultural exchange program. Write a letter to your American colleague to 1) express your thanks for his/her warm reception; 2) welcome him/her to visit China in due course. You should write about 100 words on ANSWER SHEET 2. Do not sign your own name at the end of the letter. Use “Zhang Wei” instead. Do not write your address. (10 points)"],"large":["**48.** Directions: In this section, you are asked to write an essay based on the following chart. In your writing, you should 1) interpret the chart and 2) give your comments. You should write at least 150 words. Write your essay on ANSWER SHEET 2. (15 points)","**Mobile-phone subscriptions (2000-2008)**","| 用户数 | 2000 | 2008 | |---|---|---| | 发展中国家 | 约 2 亿 | 约 40 亿 | | 发达国家 | 约 5 亿 | 约 10 亿 |","（柱状图，纵轴为 subscription number：0-4 billion）"],"small_ref":"Dear Lucy,\n\nI am writing to express my heartfelt gratitude for your warm reception during my stay in the United States as a member of the Sino-American cultural exchange program. Your thoughtful arrangements, from the city tour to the farewell dinner, made my visit both productive and enjoyable.\n\nI also learned a great deal from our discussions about American culture, which greatly broadened my horizons. Please allow me to repay your kindness by welcoming you to visit China in due course. I would be delighted to be your guide and show you around my hometown.\n\nThank you again for everything. I look forward to seeing you soon.\n\nYours sincerely,\nZhang Wei","large_ref":"The chart presents striking changes in mobile-phone subscriptions in developing and developed countries between 2000 and 2008. During this period, subscriptions in developing countries surged from about 0.2 billion to around 4 billion, while those in developed countries rose modestly from 0.5 billion to about 1 billion.\n\nTwo conclusions can be drawn from the figures. First, mobile phones have spread far more rapidly in developing countries, largely because of their huge populations, lower service charges and the leapfrogging of landline infrastructure. Second, the developed markets are approaching saturation, since most residents already own a phone.\n\nIn my view, the trend reflects both technological progress and the narrowing of digital gaps. However, developing countries should improve network quality and service regulation to ensure that rapid growth benefits users. Meanwhile, manufacturers may shift their focus to emerging markets, where enormous potential still lies."},"label":"2010 年真题（AI 解析）"};

ns elsewhere, they presumably have enough independence to disagree with the chief executive’s proposals. If the sky, and the share price is falling, outside directors should be able to give advice based on having weathered their own crises. The researchers from Ohio University used a database that covered more than 10,000 firms and more than 64,000 different directors between 1989 and 2004. Then they simply checked which directors stayed from one proxy statement to the next. The most likely reason for departing a board was age, so the researchers concentrated on those “surprise” disappearances by directors under the age of 70. They found that after a surprise departure, the probability that the company will subsequently have to restate earnings increases by nearly 20%. The likelihood of being named in a federal class-action lawsuit also increases, and the stock is likely to perform worse. The effect tended to be larger for larger firms. Although a correlation between them leaving and subsequent bad performance at the firm is suggestive, it does not mean that such directors are always jumping off a sinking ship. Often they “trade up,” leaving riskier, smaller firms for larger and more stable firms. But the researchers believe that outside directors have an easier time of avoiding a blow to their reputations if they leave a firm before bad news breaks, even if a review of history shows they were on the board at the time any wrongdoing occurred. Firms who want to keep their outside directors through tough times may have to create incentives. Otherwise outside directors will follow the example of Ms. Simmons, once again very popular on campus."],"questions":[{"num":21,"stem":"According to Paragraph 1, Ms. Simmons was criticized for _____.","opts":{"A":"gaining excessive profits","B":"failing to fulfill her duty","C":"refusing to make compromises","D":"leaving the board in tough times"},"answer":"B","analysis":"【AI 解析】答案 [B]「failing to fulfill her duty」。本题考查「According to Paragraph 1, Ms. Simmons wa…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"We learn from Paragraph 2 that outside directors are supposed to be _____.","opts":{"A":"generous investors","B":"unbiased executives","C":"share price forecasters","D":"independent advisers"},"answer":"D","analysis":"【AI 解析】答案 [D]「independent advisers」。本题考查「We learn from Paragraph 2 that outside d…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":23,"stem":"According to the researchers from Ohio University, after an outside director’s ___","opts":{"A":"become more stable","B":"report increased earnings","C":"do less well in the stock market","D":"perform worse in lawsuits"},"answer":"C","analysis":"【AI 解析】答案 [C]「do less well in the stock market」。本题考查「According to the researchers from Ohio U…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":24,"stem":"It can be inferred from the last paragraph that outside directors _____.","opts":{"A":"may stay for the attractive offers from the firm","B":"have often had records of wrongdoings in the firm","C":"are accustomed to stress-free work in the firm","D":"will decline incentives from the firm"},"answer":"A","analysis":"【AI 解析】答案 [A]「may stay for the attractive offers from the fi…」。本题考查「It can be inferred from the last paragra…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":25,"stem":"The author’s attitude toward the role of outside directors is _____.","opts":{"A":"permissive","B":"positive","C":"scornful","D":"critical"},"answer":"D","analysis":"【AI 解析】答案 [D]「critical」。本题考查「The author’s attitude toward the role of…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Whatever happened to the death of newspapers? A year ago the end seemed near. The recession threatened to remove the advertising and readers that had not already fled to the internet. Newspapers like the San Francisco Chronicle were chronicling their own doom. America’s Federal Trade Commission launched a round of talks about how to save newspapers. Should they become charitable corporations? Should the state subsidize them? It will hold another meeting soon. But the discussions now seem out of date. In much of the world there is little sign of crisis. German and Brazilian papers have shrugged off the recession. Even American newspapers, which inhabit the most troubled corner of the global industry, have not only survived but often returned to profit. Not the 20% profit margins that were routine a few years ago, but profit all the same. It has not been much fun. Many papers stayed afloat by pushing journalists overboard. The American Society of News Editors reckons that 13,500 newsroom jobs have gone since 2007. Readers are paying more for slimmer products. Some papers even had the nerve to refuse delivery to distant suburbs. Yet these desperate measures have proved the right ones and, sadly for many journalists, they can be pushed further. Newspapers are becoming more balanced businesses, with a healthier mix of revenues from readers and advertisers. American papers have long been highly unusual in their reliance on ads. Fully 87% of their revenues came from advertising in 2008, according to the Organization for Economic Cooperation & Development (OECD). In Japan the proportion is 35%. Not surprisingly, Japanese newspapers are much more stable. The whirlwind that swept through newsrooms harmed everybody, but much of the damage has been concentrated in areas where newspapers are least distinctive. Car and film reviewers have gone. So have science and general business reporters. Foreign bureaus have been savagely cut off. Newspapers are less complete as a result. But completeness is no longer a virtue in the newspaper business."],"questions":[{"num":26,"stem":"By saying “Newspapers like ... their own doom” (Lines3-4, Para.1), the ___","opts":{"A":"neglected the sign of crisis","B":"failed to get state subsidies","C":"were not charitable corporations","D":"were in a desperate situation"},"answer":"D","analysis":"【AI 解析】答案 [D]「were in a desperate situation」。本题考查「By saying “Newspapers like ... their own…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"Some newspapers refused delivery to distant suburbs probably because _____.","opts":{"A":"readers threatened to pay less","B":"newspapers wanted to reduce costs","C":"journalists reported little about these areas","D":"subscribers complained about slimmer products"},"answer":"B","analysis":"【AI 解析】答案 [B]「newspapers wanted to reduce costs」。本题考查「Some newspapers refused delivery to dist…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"Compared with their American counterparts, Japanese newspapers are much ___","opts":{"A":"have more sources of revenue","B":"have more balanced newsrooms","C":"are less dependent on advertising","D":"are less affected by readership"},"answer":"C","analysis":"【AI 解析】答案 [C]「are less dependent on advertising」。本题考查「Compared with their American counterpart…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"What can be inferred from the last paragraph about the current newspaper ___","opts":{"A":"Distinctiveness is an essential feature of newspapers.","B":"Completeness is to blame for the failure of newspaper.","C":"Foreign bureaus play a crucial role in the newspaper business.","D":"Readers have lost their interest in car and film reviews."},"answer":"A","analysis":"【AI 解析】答案 [A]「Distinctiveness is an essential feature of new…」。本题考查「What can be inferred from the last parag…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"The most appropriate title for this text would be _____.","opts":{"A":"American Newspapers: Struggling for Survival","B":"American Newspapers: Gone with the Wind","C":"American Newspapers: A Thriving Business","D":"American Newspapers: A Hopeless Story"},"answer":"A","analysis":"【AI 解析】答案 [A]「American Newspapers: Struggling for Survival」。本题考查「The most appropriate title for this text…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["We tend to think of the decades immediately following World War II as a time of prosperity and growth, with soldiers returning home by the millions, going off to college on the G. I. Bill and lining up at the marriage bureaus. But when it came to their houses, it was a time of common sense and a belief that less could truly be more. During the Depression and the war, Americans had learned to live with less, and that restraint, in combination with the postwar confidence in the future, made small, efficient housing positively stylish. Economic condition was only a stimulus for the trend toward efficient living. The phrase “less is more” was actually first popularized by a German, the architect Ludwig Mies van der Rohe, who like other people associated with the Bauhaus, a school of design, emigrated to the United States before World War II and took up posts at American architecture schools. These designers came to exert enormous influence on the course of American architecture, but none more so than Mies. Mies’s signature phrase means that less decoration, properly organized, has more impact than a lot. Elegance, he believed, did not derive from abundance. Like other modern architects, he employed metal, glass and laminated wood – materials that we take for granted today but that in the 1940s symbolized the future. Mies’s sophisticated presentation masked the fact that the spaces he designed were small and efficient, rather than big and often empty. The apartments in the elegant towers Mies built on Chicago’s Lake Shore Drive, for example, were smaller – two-bedroom units under 1,000 square feet – than those in their older neighbors along the city’s Gold Coast. But they were popular because of their airy glass walls, the views they afforded and the elegance of the buildings’ details and proportions, the architectural equivalent of the abstract art so popular at the time. The trend toward “less” was not entirely foreign. In the 1930s Frank Lloyd Wright started building more modest and efficient houses – usually around 1,200 square feet – than the spreading two-story ones he had designed in the 1890s and the early 20th century. The “Case Study Houses” commissioned from talented modern architects by California Arts & Architecture magazine between 1945 and 1962 were yet another homegrown influence on the “less is more” trend. Aesthetic effect came from the landscape, new materials and forthright detailing. In his Case Study House, Ralph Rapson may have mispredicted just how the mechanical revolution would impact everyday life – few American families acquired helicopters, though most eventually got clothes dryers – but his belief that self-sufficiency was both desirable and inevitable was widely shared."],"questions":[{"num":31,"stem":"The postwar American housing style largely reflected the Americans’ _____.","opts":{"A":"prosperity and growth","B":"efficiency and practicality","C":"restraint and confidence","D":"pride and faithfulness"},"answer":"C","analysis":"【AI 解析】答案 [C]「restraint and confidence」。本题考查「The postwar American housing style large…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"Which of the following can be inferred from Paragraph 3 about the Bauhaus?","opts":{"A":"It was founded by Ludwig Mies van der Rohe.","B":"Its designing concept was affected by World War II.","C":"Most American architects used to be associated with it.","D":"It had a great influence upon American architecture."},"answer":"D","analysis":"【AI 解析】答案 [D]「It had a great influence upon American archite…」。本题考查「Which of the following can be inferred f…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"Mies held that elegance of architectural design _____.","opts":{"A":"was related to large space","B":"was identified with emptiness","C":"was not reliant on abundant decoration","D":"was not associated with efficiency"},"answer":"C","analysis":"【AI 解析】答案 [C]「was not reliant on abundant decoration」。本题考查「Mies held that elegance of architectural…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"What is true about the apartments Mies built on Chicago’s Lake Shore Drive?","opts":{"A":"They ignored details and proportions.","B":"They were built with materials popular at that time.","C":"They were more spacious than neighboring buildings.","D":"They shared some characteristics of abstract art."},"answer":"D","analysis":"【AI 解析】答案 [D]「They shared some characteristics of abstract a…」。本题考查「What is true about the apartments Mies b…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"What can we learn about the design of the “Case Study Houses”?","opts":{"A":"Mechanical devices were widely used.","B":"Natural scenes were taken into consideration.","C":"Details were sacrificed for the overall effect.","D":"Eco-friendly materials were employed."},"answer":"B","analysis":"【AI 解析】答案 [B]「Natural scenes were taken into consideration.」。本题考查「What can we learn about the design of th…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Will the European Union make it? The question would have sounded strange not long ago. Now even the project’s greatest cheerleaders talk of a continent facing a “Bermuda triangle” of debt, population decline and lower growth. As well as those chronic problems, the EU faces an acute crisis in its economic core, the 16 countries that use the single currency. Markets have lost faith that the euro zone’s economies, weaker or stronger, will one day converge thanks to the discipline of sharing a single currency, which denies uncompetitive members the quick fix of devaluation. Yet the debate about how to save Europe’s single currency from disintegration is stuck. It is stuck because the euro zone’s dominant powers, France and Germany, agree on the need for greater harmonisation within the euro zone, but disagree about what to harmonise. Germany thinks the euro must be saved by stricter rules on borrowing, spending and competitiveness, backed by quasi-automatic sanctions for governments that do not obey. These might include threats to freeze EU funds for poorer regions and EU mega-projects, and even the suspension of a country’s voting rights in EU ministerial councils. It insists that economic co-ordination should involve all 27 members of the EU club, among whom there is a small majority for free-market liberalism and economic rigour; in the inner core alone, Germany fears, a small majority favour French interference. A “southern” camp headed by France wants something different: “European economic government” within an inner core of euro-zone members. Translated, that means politicians intervening in monetary policy and a system of redistribution from richer to poorer members, via cheaper borrowing for governments through common Eurobonds or complete fiscal transfers. Finally, figures close to the Franch government have murmured, euro-zone members should agree to some fiscal and social harmonisation: e.g., curbing competition in corporate-tax rates or labour costs. It is too soon to write off the EU. It remains the world’s largest trading block. At its best, the European project is remarkably liberal: built around a single market of 27 rich and poor countries, its internal borders are far more open to goods, capital and labour than any comparable trading area. It is an ambitious attempt to blunt the sharpest edges of globalisation, and make capitalism benign."],"questions":[{"num":36,"stem":"The EU is faced with so many problems that _____.","opts":{"A":"it has more or less lost faith in markets","B":"even its supporters begin to feel concerned","C":"some of its member countries plan to abandon euro","D":"it intends to deny the possibility of devaluation"},"answer":"B","analysis":"【AI 解析】答案 [B]「even its supporters begin to feel concerned」。本题考查「The EU is faced with so many problems th…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"The debate over the EU’s single currency is stuck because the dominant ___","opts":{"A":"are competing for the leading position","B":"are busy handling their own crises","C":"fail to reach an agreement on harmonisation","D":"disagree on the steps towards disintegration"},"answer":"C","analysis":"【AI 解析】答案 [C]「fail to reach an agreement on harmonisation」。本题考查「The debate over the EU’s single currency…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"To solve the euro problem, Germany proposed that _____.","opts":{"A":"EU funds for poor regions be increased","B":"stricter regulations be imposed","C":"only core members be involved in economic co-ordination","D":"voting rights of the EU members be guaranteed"},"answer":"B","analysis":"【AI 解析】答案 [B]「stricter regulations be imposed」。本题考查「To solve the euro problem, Germany propo…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"The French proposal of handling the crisis implies that _____.","opts":{"A":"poor countries are more likely to get funds","B":"strict monetary policy will be applied to poor countries","C":"loans will be readily available to rich countries","D":"rich countries will basically control Eurobonds"},"answer":"A","analysis":"【AI 解析】答案 [A]「poor countries are more likely to get funds」。本题考查「The French proposal of handling the cris…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"Regarding the future of the EU, the author seems to feel _____.","opts":{"A":"pessimistic","B":"desperate","C":"conceited","D":"hopeful"},"answer":"D","analysis":"【AI 解析】答案 [D]「hopeful」。本题考查「Regarding the future of the EU, the auth…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by finding information from the right column that corresponds to each of the marked details given in the left column. There are two extra choices in the right column. Mark your answers on ANSWER SHEET 1. (10 points) Leading doctors today weigh in on the debate over the government’s role in promoting public health by demanding that ministers impose “fat taxes” on unhealthy food and introduce cigarette-style warnings to children about the dangers of a poor diet. The demands follow comments made last week by the health secretary, Andrew Lansley, who insisted the government could not force people to make healthy choices and promised to free businesses from public health regulations. But senior medical figures want to stop fast-food outlets opening near schools, restrict advertising of products high in fat, salt or sugar, and limit sponsorship of sports events by fast-food producers such as McDonald’s. They argue that government action is necessary to curb Britain’s addiction to unhealthy food and help halt spiraling rates of obesity, diabetes and heart disease. Professor Terence Stephenson, president of the Royal College of Paediatrics and Child Health, said that the consumption of unhealthy food should be seen to be just as damaging as somking or excessive drinking. “Thirty years ago, it would have been inconceivable to have imagined a ban on smoking in the workplace or in pubs, and yet that is what we have now. Are we willing to be just as courageous in respect of obesity? I would suggest that we should be,” said the leader of the UK’s children’s doctors. Lansley has alarmed health campaigners by suggesting he wants industry rather than government to take the lead. He said that manufacturers of crisps and candies could play a central role in the Change4Life campaign, the centrepiece of government efforts to boost healthy eating and fitness. He has also criticised the celebrity chef Jamie Oliver’s high-profile attempt to improve school lunches in England as an example of how “lecturing” people was not the best way to change their behaviour. Stephenson suggested potential restrictions could include banning TV advertisements for foods high in fat, salt or sugar before 9 pm and limiting them on billboards or in cinemas. “If we were really bold, we might even begin to think of high-calorie fast food in the same way as cigarettes – by setting strict limits on advertising, product placement and sponsorship of sports events,” he said. Such a move could affect firms such as McDonald’s, which sponsors the youth coaching scheme run by the Football Association. Fast-food chains should also stop offering “inducements” such as toys, cute animals and mobile phone credit to lure young customers, Stephenson said. Professor Dinesh Bhugra, president of the Royal College of Psychiatrists, said: “If children are taught about the impact that food has on their growth, and that some things can harm, at least information is available up front.” He also urged councils to impose “fast-food-free zones” around schools and hospitals – areas within which takeaways cannot open. A Department of Health spokesperson said: “We need to create a new vision for public health where all of society works together to get healthy and live longer. This includes creating a new ‘responsibility deal’ with business, built on social responsibility, not state regulation. Later this year, we will publish a white paper setting out exactly how we will achieve this.” The food industry will be alarmed that such senior doctors back such radical moves, especially the call to use some of the tough tactics that have been deployed against smoking over the last decade."],"options":[{"key":"A","text":"“fat taxes” should be imposed on fast-food producers such as McDonald’s."},{"key":"B","text":"the government should ban fast-food outlets in the neighborhood of schools."},{"key":"C","text":"“lecturing” was an effective way to improve that school lunches in England."},{"key":"D","text":"cigarette-style warnings should be believe that introduced to children about the dangers of a poor diet."},{"key":"E","text":"the producers of crisps and candies could that contribute significantly to the Change4Life campaign."},{"key":"F","text":"parents should set good examples for their spokesperson proposed that children by keeping a healthy diet at home."},{"key":"G","text":"the government should strengthen the sense of responsibility among businesses."}],"passage":["- **A.** “fat taxes” should be imposed on fast-food producers such as McDonald’s. - **B.** the government should ban fast-food outlets in the neighborhood of schools. - **C.** “lecturing” was an effective way to improve that school lunches in England. - **D.** cigarette-style warnings should be believe that introduced to children about the dangers of a poor diet. - **E.** the producers of crisps and candies could that contribute significantly to the Change4Life campaign. - **F.** parents should set good examples for their spokesperson proposed that children by keeping a healthy diet at home. - **G.** the government should strengthen the sense of responsibility among businesses."],"questions":[{"num":41,"stem":"Andrew Lansley held that __________","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「the producers of crisps and candies could that…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"},{"num":42,"stem":"Terence Stephenson agreed __________","opts":{},"answer":"D","analysis":"【AI 解析】答案 [D]「cigarette-style warnings should be believe tha…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [D]。"},{"num":43,"stem":"Jamie Oliver seemed to __________","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「“lecturing” was an effective way to improve th…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"},{"num":44,"stem":"Dinesh Bhugra suggested __________","opts":{},"answer":"B","analysis":"【AI 解析】答案 [B]「the government should ban fast-food outlets in…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [B]。"},{"num":45,"stem":"A Department of Health __________","opts":{},"answer":"G","analysis":"【AI 解析】答案 [G]「the government should strengthen the sense of …」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [G]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: In this section there is a text in English. Translate it into Chinese. Write your translation on ANSWER SHEET 2. (15 points) Who would have thought that, globally, the IT industry produces about the same volume of greenhouse gases as the world’s airlines do – roughly 2 percent of all CO2 emissions? Many everyday tasks take a surprising toll on the environment. A Google search can leak between 0.2 and 7.0 grams of CO2, depending on how many attempts are needed to get the “right” answer. To deliver results to its users quickly, then, Google has to maintain vast data centres around the world, packed with powerful computers. While producing large quantities of CO2, these computers emit a great deal of heat, so the centres need to be well air-conditioned, which uses even more energy. However, Google and other big tech providers monitor their efficiency closely and make improvements. Monitoring is the first step on the road to reduction, but there is much more to be done, and not just by big companies."],"reference":"谁能想到，从全球来看，信息产业产生的温室气体竟与世界航空业不相上下——约占二氧化碳总排放量的 2%？许多日常工作对环境的影响令人吃惊。以谷歌搜索为例，每次搜索会排放 0.2 至 7 克二氧化碳，具体取决于需要尝试多少次才能得到“正确”答案。为了将结果快速送达用户，谷歌必须在世界各地建立大型数据中心，配备大量高性能计算机。这些计算机在排放大量二氧化碳的同时，也释放出大量热量，因此数据中心必须配备良好的空调系统，而这又要消耗更多的能量。不过，谷歌和其他大型技术供应商都在密切监控各自的能效并不断加以改进。监控是减排之路的第一步，但要做的还有很多，而且不应只靠大公司。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose your cousin Li Ming has just been admitted to a university. Write him/her a letter to 1) congratulate him/her, and 2) give him/her suggestions on how to get prepared for university life. You should write about 100 words on ANSWER SHEET 2. Do not sign your own name at the end of the letter. Use “Zhang Wei” instead. Do not write the address. (10 points)"],"large":["**48.** Directions: Write an essay based on the following chart. In your writing, you should 1) interpret the chart and 2) give your comments. You should write at least 150 words. Write your essay on ANSWER SHEET 2. (15 points)","**2008、2009 年国内轿车市场部分品牌市场份额示意图**","| 品牌 | 2008 年 | 2009 年 | |---|---|---| | 国产品牌 | 约 25% | 约 31% | | 日系品牌 | 约 35% | 约 25% | | 美系品牌 | 约 12% | 约 13% |","（柱状图无逐条数值标注，以上为按坐标轴估读值）"],"small_ref":"Dear Li Ming,\n\nCongratulations on your admission to university! Knowing how hard you have worked in the past year, I am truly delighted that your efforts have finally paid off.\n\nTo prepare for university life, I would like to offer a few suggestions. First, learn to manage your time independently, as nobody will remind you of deadlines in college. Second, take an active part in club activities, which will help you make friends and develop interpersonal skills. Finally, keep a regular schedule and exercise often, because good health is the foundation of everything.\n\nWish you a colorful and rewarding campus life. If you have any questions, do not hesitate to write to me.\n\nYours,\nZhang Wei","large_ref":"The chart illustrates the market shares of selected car brands in China's domestic sedan market in 2008 and 2009. Domestic brands increased their share from about 25% to 31%, while Japanese brands dropped sharply from 35% to 25%, and American brands remained roughly stable at around 12-13%.\n\nThe rise of domestic brands can be attributed to their improving quality, competitive prices and better after-sales services, which have won the trust of Chinese consumers. The decline of Japanese brands, by contrast, was partly affected by the global financial crisis and the intensified competition from both local and other foreign manufacturers.\n\nIn my opinion, the trend indicates the growing maturity of China's automobile industry. Domestic companies should continue to invest in research and development to maintain this momentum. Meanwhile, they should explore overseas markets, where Chinese cars are gaining popularity for their cost-effectiveness."},"label":"2011 年真题（AI 解析）"};
