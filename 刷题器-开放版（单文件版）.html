time frame for the ___17___ of these goals. The growth leader is also ___18___ for keeping the team focused on moving forward and steering them clear of distractions. ___19___ attractive, new ideas can be distracting; the team leader must recognize when these ideas don't ___20___ the current goal and need to be put on the back burner."],"questions":[{"num":1,"stem":"","opts":{"A":"purchase","B":"profit","C":"connection","D":"bet"},"answer":"B","analysis":"profit**\n考点：名词辨析。\n解析：\"you're the CEO of a small business, and though you're making a nice ___ , you need to take it to the next level\"——公司经营状况不错但想更上层楼，make a profit（盈利）为固定搭配。"},{"num":2,"stem":"","opts":{"A":"define","B":"predict","C":"prioritize","D":"appreciate"},"answer":"C","analysis":"prioritize**\n考点：动词辨析。\n解析：\"What you need to do is ___ growth by establishing a growth team\"——通过建立增长团队来**优先推进**增长，prioritize（把……列为优先）与 growth team 的使命呼应。"},{"num":3,"stem":"","opts":{"A":"exclusively","B":"temporarily","C":"potentially","D":"initially"},"answer":"A","analysis":"exclusively**\n考点：副词辨析。\n解析：\"harnesses the power of collaboration to focus ___ on finding ways to grow\"——**专门**专注于寻找增长途径，focus exclusively on（专门专注于）为固定搭配。"},{"num":4,"stem":"","opts":{"A":"experiment","B":"proposal","C":"debate","D":"example"},"answer":"D","analysis":"example**\n考点：名词辨析。\n解析：\"Let's look at a real-world ___\"——让我们看一个现实世界的**例子**（下文引 BitTorrent 案例），example 正确。"},{"num":5,"stem":"","opts":{"A":"identical","B":"marginal","C":"provisional","D":"traditional"},"answer":"D","analysis":"traditional**\n考点：形容词辨析。\n解析：\"50 employees working in the ___ departments of engineering, marketing and product development\"——工程、市场、产品开发这些**传统**部门（与后文跨部门的 growth team 形成对照），traditional 正确。"},{"num":6,"stem":"","opts":{"A":"rumor","B":"secret","C":"myth","D":"problem"},"answer":"D","analysis":"problem**\n考点：名词辨析。\n解析：\"The ___ was that too many customers were using the basic, free version\"——**问题**在于太多客户用的是免费基础版，problem 引出瓶颈原因。"},{"num":7,"stem":"","opts":{"A":"despite","B":"unlike","C":"through","D":"besides"},"answer":"A","analysis":"despite**\n考点：介词辨析。\n解析：\"___ improvements to the premium, paid version, few people were making the upgrade\"——**尽管**付费版有所改进，升级者寥寥，despite（尽管）表让步。"},{"num":8,"stem":"","opts":{"A":"moreover","B":"however","C":"therefore","D":"again"},"answer":"B","analysis":"however**\n考点：逻辑衔接。\n解析：\"Things changed, ___, when an innovative project-marketing manager came aboard\"——局面**然而**发生了变化，however 表转折（前文是停滞，此处是转机）。"},{"num":9,"stem":"","opts":{"A":"inspected","B":"created","C":"expanded","D":"reformed"},"answer":"B","analysis":"created**\n考点：动词辨析。\n解析：\"___ a growth team and sparked the kind of ___ perspective\"——**创建**增长团队，create a team 为固定搭配。"},{"num":10,"stem":"","opts":{"A":"cultural","B":"objective","C":"fresh","D":"personal"},"answer":"C","analysis":"fresh**\n考点：形容词辨析。\n解析：\"sparked the kind of ___ perspective they needed\"——带来了他们需要的**全新**视角，fresh perspective（新视角）为固定搭配。"},{"num":11,"stem":"","opts":{"A":"end","B":"burden","C":"lack","D":"decrease"},"answer":"C","analysis":"lack**\n考点：名词辨析。\n解析：\"the ___ of upgrades wasn't due to a quality issue\"——**缺乏**升级并非质量问题，the lack of（缺乏）为固定搭配。"},{"num":12,"stem":"","opts":{"A":"policy","B":"suggestion","C":"purpose","D":"insight"},"answer":"D","analysis":"insight**\n考点：名词辨析。\n解析：\"Armed with this ___ , the marketing and engineering teams joined forces\"——带着这一**洞见**，两个团队联合行动，armed with this insight（带着这一洞察）呼应上文的发现。"},{"num":13,"stem":"","opts":{"A":"contributing","B":"allocating","C":"promoting","D":"transferring"},"answer":"C","analysis":"promoting**\n考点：动词辨析。\n解析：\"raise awareness by prominently ___ the premium version to users of the free version\"——通过醒目地**推广**付费版来提高认知度，promote（推广、宣传）正确。"},{"num":14,"stem":"","opts":{"A":"As a result","B":"At any rate","C":"By the way","D":"In a sense"},"answer":"A","analysis":"考点：逻辑衔接。\n解析：\"___ , upgrades skyrocketed, and revenue increased by 92 percent.\"——推广的**结果**：升级暴增、收入增 92%，As a result 表因果。"},{"num":15,"stem":"","opts":{"A":"unite","B":"finance","C":"follow","D":"choose"},"answer":"A","analysis":"unite**\n考点：动词辨析。\n解析：\"someone who can ___ the interdisciplinary team and keep them on course\"——能**凝聚**跨学科团队并使其保持正轨，unite（团结、凝聚）正确。"},{"num":16,"stem":"","opts":{"A":"share","B":"identify","C":"divide","D":"broaden"},"answer":"B","analysis":"identify**\n考点：动词辨析。\n解析：\"This leader will ___ the target area, set clear goals\"——领导者要**确定**目标领域、设定清晰目标，identify（确定、锁定）正确。"},{"num":17,"stem":"","opts":{"A":"announcement","B":"assessment","C":"adjustment","D":"accomplishment"},"answer":"D","analysis":"accomplishment**\n考点：名词辨析。\n解析：\"establish a time frame for the ___ of these goals\"——为实现这些目标建立时间框架，the accomplishment of（……的实现）为固定搭配。"},{"num":18,"stem":"","opts":{"A":"famous","B":"responsible","C":"available","D":"respectable"},"answer":"B","analysis":"responsible**\n考点：形容词辨析。\n解析：\"The growth leader is also ___ for keeping the team focused\"——负责人还要**负责**让团队保持专注，be responsible for（对……负责）为固定搭配。"},{"num":19,"stem":"","opts":{"A":"Before","B":"Once","C":"While","D":"Unless"},"answer":"C","analysis":"While**\n考点：连词（让步）。\n解析：\"___ attractive, new ideas can be distracting\"——**尽管**吸引人，新想法也可能令人分心，While 表让步（前置形容词省略结构）。"},{"num":20,"stem":"","opts":{"A":"serve","B":"limit","C":"summarize","D":"alter"},"answer":"A","analysis":"serve**\n考点：动词辨析。\n解析：\"the team leader must recognize when these ideas don't ___ the current goal\"——识别这些想法何时**无助于**当前目标，serve the goal（服务于目标）为固定搭配。"}],"analysisBlob":""},"reading":[{"title":"","passage":["In the quest for the perfect lawn, homeowners across the country are taking a shortcut- and it is the environment that is paying the price. About eight million square metres of plastic grass is sold each year but opposition has now spread to the highest gardening circles. The Chelsea Flower Show has banned fake grass from this year's event, declaring it to be not part of its ethos. The Royal Horticultural Society (RHS), which runs the annual show in west London, says it has introduced the ban because of the damage plastic grass does to the environment and biodiversity. Ed Home, of the RHS, said: \"We launched our sustainability strategy last year and fake grass is just not in line with our ethos and views on plastic. We recommend using real grass because of its environmental benefits, which include supporting wildlife, alleviating flooding and cooling the environment.,, The RHS's decision comes as campaigners try to raise awareness of the problems fake grass causes. A Twitter account, which claims to “cut through the greenwash,, of artificial grass, already has more than 20,000 followers. It is trying to encourage people to sign two petitions, one calling for a ban on the sale of plastic grass and another calling for an u ecological damage” tax on such lawns. They have gathered 7,276 and 11,282 signatures. However, supporters of fake grass point out that there is also an environmental impact with natural lawns, which need mowing and therefore usually consume electricity or petrol. The industry also points out that real grass requires considerable amounts of water, weed killer or other treatments and that people who lay fake grass tend to use their garden more. The industry also claims that people who lay fake grass spend an average of £500 on trees or shrubs for their garden, which provides habitat for insects. In response to another petition last year about banning fake lawns, which gathered 30,000 signatures, the government responded that it has “no plans to ban the use of artificial grass” . It added: \"We prefer to help people and organisations make the right choice rather than legislating on such matters. However, the use of artificial grass must comply with the legal and policy safeguards in place to protect biodiversity and ensure sustainable drainage, while measures such as the strengthened biodiversity duty should serve to encourage public authorities to consider sustainable alternatives.\""],"questions":[{"num":21,"stem":"The RHS thinks that plastic g r a s s ___","opts":{"A":"is harmful to the environment","B":"is a hot topic in gardening circles","C":"is overpraised in the annual show","D":"is ruining the view of west London"},"answer":"A","analysis":"**\n考点：观点细节题。\n解析：\"the RHS…has introduced the ban because of the **damage plastic grass does to the environment and biodiversity**.\"——RHS 认为塑料草皮**危害环境**（与生物多样性），A 正确。B（园艺圈热门话题）无据——是\"opposition has now spread to the highest gardening circles\"；C（在年度花展上被过度赞扬）反了——是被禁；D（毁坏西伦敦景观）无据——西伦敦是花展地点。\n【AI 修正】无。"},{"num":22,"stem":"The petitions mentioned in Paragraph 3 reveal the campaigners’ ___","opts":{"A":"disappointment with the RHS","B":"resistance to fake grass use","C":"anger over the proposed tax","D":"concern about real grass supply"},"answer":"B","analysis":"**\n考点：细节推断。\n解析：两个请愿——\"one calling for **a ban on the sale** of plastic grass and another calling for an 'ecological damage' **tax on such lawns**\"——禁售与征税请愿体现了环保运动者对人造草坪的**抵制**，B 正确。A（对 RHS 失望）无据——请愿与 RHS 禁令是相互呼应；C 曲解——请愿目的是征生态税，不是\"对拟议税收发怒\"；D（关心真草供应）无据。\n【AI 修正】无。"},{"num":23,"stem":"In Paragraph 4, supporters of fake grass point o u t ___","opts":{"A":"the necessity to lower the costs of fake grass","B":"the disadvantages of growing real grass","C":"the way to take care of artificial lawns","D":"the challenges of insect habitat protection"},"answer":"B","analysis":"**\n考点：细节理解。\n解析：\"supporters of fake grass point out that there is **also an environmental impact with natural lawns**, which need mowing and therefore usually consume electricity or petrol…real grass requires considerable amounts of **water, weed killer** or other treatments\"——支持者列举**种植真草的弊端**（耗电、耗水、除草剂），B 正确。A（降低假草成本之必要）、C（人造草坪的养护方法）、D（昆虫栖息地保护的挑战）均非该段论点。\n【AI 修正】无。"},{"num":24,"stem":"What would the government do with regard to artificial grass?","opts":{"A":"Urge legislation to restrict its use.","B":"Take measures to guarantee its quality.","C":"Remind its users to obey existing rules.","D":"Replace it with sustainable alternatives."},"answer":"C","analysis":"**\n考点：细节推断（末段）。\n解析：\"'We prefer to help people and organisations make the right choice rather than legislating…However, the use of artificial grass **must comply with the legal and policy safeguards in place** to protect biodiversity and ensure sustainable drainage…'\"——政府不立法禁售，但提醒使用者**遵守现行规则**，C 正确。A 反了——\"no plans to ban\"；B（保证质量）无据；D（用可持续替代品取代）曲解——只是\"鼓励公共机构考虑替代品\"。\n【AI 修正】无。"},{"num":25,"stem":"It can be learned from the text that fake g r a s s ___","opts":{"A":"is being improved continuously","B":"has seen a market share decline","C":"is becoming increasingly affordable","D":"has been a controversial product"},"answer":"D","analysis":"**\n考点：推断题（全文）。\n解析：全文呈现三方角力：环保组织禁售请愿 + RHS 禁令 vs 行业与支持者的辩护 vs 政府的\"不禁止\"——人造草坪**是个有争议的产品**，D 正确。A（不断改进）无据；B（市场份额下降）无据——年销 800 万平方米仍在售；C（日益实惠）无据。\n【AI 修正】无。\n\n### Text 2（美国国家公园危机）\n\n**文章脉络**：①联邦政府\"帐篷里收亚马逊快递、红杉下停餐车\"的点子看似荒唐 → ②但公园危机是真的：120 亿美元维护积欠、设施破败 → ③但私营化营地非万灵药：营地只占积欠一小部分，园内商家平均只上缴 5% 收入；且私营化会侵蚀 3 亿游客来园的初衷（远离商业喧嚣亲近自然）→ ④真正问题是长期资金匮乏：81% 纳税人愿为公园加税 → ⑤公园兼具休憩价值与自然象征、教育、固碳、文化艺术、旅游价值，还协同地方保护历史遗迹 → ⑥但这一切都靠\"鞋带\"撑着：国会年拨款 30 亿美元、自 2001 年通胀调整后基本原地踏步，而游客自 1980 年增长逾 50%、达 3.3 亿。"}],"overview":"","discourse":""},{"title":"","passage":["It's easy to dismiss as absurd the federal govemmenfs ideas for plugging the chronic funding gap of our national parks. Can anyone really think ifs a good idea to allow Amazon deliveries to your tent in Yosemite or food trucks to line up under the redwood trees at Sequoia National Park? But the government is right about one thing: U. S. national parks are in crisis. Collectively, they have a maintenance backlog of more than $ 12 billion. Roads, trails, restrooms, visitor centers and other infrastructure are crumbling. But privatizing and commercializing the campgrounds would not be a cure-all. Campgrounds are a tiny portion of the overall infrastructure backlog, and businesses in the parks hand over, on average, only about 5% of their revenues to the National Park Service. Moreover, increased privatization would certainly undercut one of the major reasons why 300 million visitors come to the parks each year: to enjoy nature and get a break from the commercial drumbeat that overwhelms daily life. The real problem is that the parks have been chronically starved of funding. An economic survey of 700 U.S. taxpayers found that people would be willing to pay a significant amount of money to make sure the parks and their programs are kept intact. Some 81% of respondents said they would be willing to pay additional taxes for the next 10 years to avoid any cuts to the national parks. The national parks provide great value to U.S. residents both as places to escape and as symbols of nature. On top of this, they produce value from their extensive educational programs, their positive impact on the climate through carbon sequestration, their contribution to our cultural and artistic life, and of course through tourism. The parks also help keep America's past alive, working with thousands of local jurisdictions around the country to protect historical sites and to bring the stories of these places to life. The parks do all this on a shoestring. Congress allocates only $ 3 billion a year to the national park system—an amount that has been flat since 2001 (in inflation-adjusted dollars) with the exception of a onetime boost in 2009. Meanwhile, the number of annual visitors has increased by more than 50% since 1980, and now stands at 330 million visitors per year."],"questions":[{"num":26,"stem":"What problem are U.S. national parks faced with?","opts":{"A":"Decline of business profits.","B":"Inadequate commercialization.","C":"Lack of transportation services.","D":"Poorly maintained infrastructure."},"answer":"D","analysis":"**\n考点：细节理解。\n解析：\"they have a **maintenance backlog** of more than $12 billion. Roads, trails, restrooms…are **crumbling**.\"——维护积欠 120 亿、设施崩坏，即**基础设施维护不善**，D 正确。A（商业利润下滑）无据；B（商业化不足）反了——文中批评的是私营化方案；C（缺乏交通服务）无据。\n【AI 修正】无。"},{"num":27,"stem":"Increased privatization of the campgrounds m a y ___","opts":{"A":"spoil visitor experience","B":"help preserve nature","C":"bring operational pressure","D":"boost visits to parks"},"answer":"A","analysis":"**\n考点：细节推断。\n解析：\"increased privatization would certainly **undercut** one of the major reasons why 300 million visitors come to the parks each year: to enjoy nature and **get a break from the commercial drumbeat** that overwhelms daily life.\"——私营化将侵蚀游客\"远离商业喧嚣\"的体验，即**破坏游览体验**，A 正确。B（有助于保护自然）反了；C（带来运营压力）无据；D（提振游览人数）反了——会 undercut 来园理由。\n【AI 修正】无。"},{"num":28,"stem":"According to Paragraph 5, most respondents in the survey would ___","opts":{"A":"go to the national parks on a regular basis","B":"advocate a bigger budget for the national parks","C":"agree to pay extra for the national parks","D":"support the national parks' recent reforms"},"answer":"C","analysis":"**\n考点：细节理解。\n解析：\"Some **81% of respondents** said they would be willing to **pay additional taxes** for the next 10 years to avoid any cuts to the national parks.\"——81% 的受访者愿意加税，即**同意为公园额外付费**，C 正确。A（定期游园）无据；B（主张更大预算）偷换——是愿意自己多缴税，不是\"呼吁预算\"；D（支持近期改革）无据。\n【AI 修正】无。"},{"num":29,"stem":"The national parks are valuable in that t h e y ___","opts":{"A":"lead the way in tourism","B":"have historical significance","C":"sponsor research on climate","D":"provide an income for the locals"},"answer":"B","analysis":"**\n考点：细节理解。\n解析：\"The parks also help keep **America's past alive**, working with thousands of local jurisdictions around the country to **protect historical sites** and bring the stories of these places to life.\"——公园保护历史遗迹、让美国历史鲜活，即**有历史意义**，B 正确。A（引领旅游）无据；C 曲解——\"positive impact on the climate through carbon sequestration\"是固碳的气候影响，不是\"赞助气候研究\"；D（为当地带来收入）无据。\n【AI 修正】无。"},{"num":30,"stem":"It can be concluded from the text that the national park system ___","opts":{"A":"is able to cope with staff shortages","B":"is able to meet visitors’ demands","C":"is in need of a new pricing policy","D":"is in need of a funding increase"},"answer":"D","analysis":"**\n考点：推断题（全文结论）。\n解析：\"The parks do all this **on a shoestring**. Congress allocates only $3 billion a year…an amount that has been **flat since 2001**…Meanwhile, the number of annual visitors has increased by **more than 50%**.\"——拨款停滞而游客大增，结论：公园系统**需要增加资金**，D 正确。A（能应对人手短缺）、B（能满足游客需求）无据且与\"危机\"基调矛盾；C（需要新定价政策）无据。\n【AI 修正】无。\n\n### Text 3（互联网与记忆）\n\n**文章脉络**：①Sparrow 研究：被告知信息会保存的一组后来不再努力回忆——记的是\"存在哪个文件夹\"；结论：人类记忆没退化，而是在\"适应新技术\" → ②互联网正成为记忆的外接硬盘（\"认知卸载\"）；传统上这角色由数据银行、图书馆和其他人承担（父亲记不住生日因为母亲记）；有人担忧破坏社会，Sparrow 却看到好处：学习方式或从记事实转向概念性思考（互联网给不了的）；\"我没觉得死记硬背有多少智力价值\" → ③其他专家：现在下结论太早——没有实验证据表明网络干扰专注力；2008 年研究：网络冲浪比阅读更锻炼\"网虫\"老年大脑 → ④Storm：依赖增加或有代价，但总体收益大于成本；\"记忆在变化，是变好还是变坏？尚不清楚。\""}],"overview":"","discourse":""},{"title":"","passage":["The Internet may be changing merely what we remember, not our capacity to do so, suggests Columbia University psychology professor Betsy Sparrow. In 2011, Sparrow led a study in which participants were asked to record 40 factoids in a computer (\" an ostrich's eye is bigger than its brain/J for example). Half of the participants were told the information would be erased, while the other half were told it would be saved. Guess what? The latter group made no effort to recall the information when quizzed on it later, because they knew they could find it on their computers. In the same study, a group was asked to remember both the information and the folders it was stored in. They didn't remember the information, but they remembered how to find the folders. In other words, human memory is not deteriorating but “ adapting to new communications technology,“ Sparrow says. In a very practical way, the Internet is becoming an external hard drive for our memories, a process known as “ cognitive offloading.\" Traditionally, this role was fulfilled by data banks, libraries, and other humans. Your father may never remember birthdays because your mother does, for instance. Some worry that this is having a destructive effect on society, but Sparrow sees an upside. Perhaps, she suggests, the trend will change our approach to learning from a focus on individual facts and memorization to an emphasis on more conceptual thinking- something that is not available on the Internet. UI personally have never seen all that much intellectual value in memorizing things,“ Sparrow says, adding that we haven't lost our ability to do it. Still other experts say it's too soon to understand how the Internet affects our brains. There is no experimental evidence showing that it interferes with our ability to focus, for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. And surfing the web exercised the brain more than reading did among computer-savvy older adults in a 2008 study involving 24 participants at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles. “ There may be costs associated with our increased reliance on the Internet, but I'd have to imagine that overall the benefits are going to outweigh those costs,“ observes psychology professor Benjamin Storm. \"It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don't know.”"],"questions":[{"num":31,"stem":"Sparrow's study shows that with the Internet, the human brain will ___","opts":{"A":"analyze information in detail","B":"collect information efficiently","C":"switch its focus of memory","D":"extend its memory duration"},"answer":"C","analysis":"**\n考点：细节理解。\n解析：\"The latter group made no effort to recall the information…they knew they could find it on their computers…They didn't remember the information, but they **remembered how to find the folders**.\"＋\"human memory is not deteriorating but **adapting to new communications technology**\"——记内容转向记存放位置，即**转移了记忆的焦点**，C 正确。A（详细分析信息）无据；B（高效收集信息）无据；D（延长记忆时长）反了——是\"不再努力回忆\"。\n【AI 修正】无。"},{"num":32,"stem":"The process of u cognitive offloading“ ___","opts":{"A":"helps us identify false information","B":"keeps our memory from failing","C":"enables us to classify trivial facts","D":"lessens our memory burdens"},"answer":"D","analysis":"**\n考点：细节理解。\n解析：\"the Internet is becoming an **external hard drive for our memories**, a process known as 'cognitive offloading.' Traditionally, this role was fulfilled by…**other humans. Your father may never remember birthdays because your mother does**\"——把记忆\"卸载\"给外部载体，即**减轻我们的记忆负担**，D 正确。A（识别假信息）、B（防止记忆衰退）反了——Sparrow 说的是记忆\"适应\"而非\"不衰退\"；C（整理琐碎事实）无据。\n【AI 修正】无。"},{"num":33,"stem":"Which of the following would Sparrow support about the Internet?","opts":{"A":"It may reform our learning approach.","B":"It may impact our society negatively.","C":"It may enhance our adaptability to technology.","D":"It may interfere with our conceptual thinking."},"answer":"A","analysis":"**\n考点：观点细节题。\n解析：\"Sparrow sees an upside. Perhaps, she suggests, the trend will **change our approach to learning** from a focus on individual facts and memorization to an emphasis on **more conceptual thinking**.\"——学习方式或从死记事实转向概念思考，即**可能革新学习方式**，A 正确。B 反了——她看到的是 upside；C（增强对技术的适应力）无据；D 反了——概念性思考恰是网络**给不了**的、她主张的新重点。\n【AI 修正】无。"},{"num":34,"stem":"It is indicated in Paragraph 3 that how the Internet affects our brains ___","opts":{"A":"requires further academic research","B":"is most studied in older adults","C":"is reflected in our reading speed","D":"depends on our web-surfing habits"},"answer":"A","analysis":"**\n考点：观点细节题（第三段）。\n解析：\"Still other experts say **it's too soon to understand** how the Internet affects our brains. There is **no experimental evidence** showing that it interferes with our ability to focus\"——现在理解网络如何影响大脑为时尚早、证据缺失，即**需要进一步的学术研究**，A 正确。B（多在老年人身上研究）偷换——老年人只是 2008 年研究的一个样本；C（体现于阅读速度）无据；D（取决于上网习惯）无据。\n【AI 修正】无。"},{"num":35,"stem":"Neither Sparrow nor Storm would agree t h a t ___","opts":{"A":"our reliance on the Internet will be costly","B":"the Internet is weakening our memory","C":"memory exercise is a must for our brains","D":"our ability to focus declines with age"},"answer":"B","analysis":"**\n考点：观点比较题。\n解析：Sparrow：\"human memory is **not deteriorating** but adapting\"；Storm：\"'It seems pretty clear that **memory is changing**, but is it changing for the better? At this point, we don't know.'\"——两人都不同意\"互联网正在削弱我们的记忆\"（一个明确否认，一个说不清好坏），B 正确。A 曲解——Storm 明说 \"There may be costs associated\"（可能存在代价），即他部分认同\"依赖有代价\"，故非\"两人都不同意\"。\n【AI 修正】无。\n\n### Text 4（青少年的悖论）\n\n**文章脉络**：①青少年是悖论体：依赖的孩童长成能自理互助的独立者，温顺的孩子却变成叛逆冒险者 → ②Crone 新研究（《儿童发展》期刊）：正负两面并存——新思潮：青春期既是风险期也是**机遇期**（旧观念把青少年当\"待解决的问题\"）→ ③研究 200 余名 11-28 岁人群的\"亲社会\"与叛逆特质问卷 → ④旧研究：叛逆随年龄升后降；新研究：亲社会行为**同样如此**——青少年更愿无私助人 → ⑤最关键：亲社会性与叛逆性**正相关**——更叛逆的青少年也更愿助人，好坏两面同步发展 → ⑥共同根源：**奖赏敏感性**——决策权衡奖赏与风险，青少年对社会奖赏（赢球、吸引新朋友）特别敏感；该敏感性青春期上扬、30 岁后回落。"}],"overview":"","discourse":""},{"title":"","passage":["Teenagers are paradoxical. Thafs a mild and detached way of saying something that parents often express with considerably stronger language. But the paradox is scientific as well as personal. In adolescence, helpless and dependent children who have relied on grown-ups for just about everything become independent people who can take care of themselves and help each other. At the same time, once cheerful and compliant children become rebellious teenage risk-takers. A new study published in the journal Child Development, by Eveline Crone of the University of Leiden and colleagues, suggests that the positive and negative sides of teenagers go hand in hand. The study is part of a new wave of thinking about adolescence. For a long time, scientists and policy makers concentrated on the idea that teenagers were a problem that needed to be solved. The new work emphasizes that adolescence is a time of opportunity as well as risk. The researchers studied “prosocial“ and rebellious traits in more than 200 children and young adults, ranging from 11 to 28 years old. The participants filled out questionnaires about how often they did things that were altruistic and positive, like sacrificing their own interests to help a friend, or rebellious and negative, Hke getting drunk or staying out late. Other studies have shown that rebellious behavior increases as you become a teenager and then fades away as you grow older. But the new study shows that, interestingly, the same pattern holds for prosocial behavior. Teenagers were more likely than younger children or adults to report that they did things like unselfishly helping a friend. Most significantly, there was a positive correlation between prosociality and rebelliousness. The teenagers who were more rebellious were also more likely to help others. The good and bad sides of adolescence seem to develop together. Is there some common factor that underlies these apparently contradictory developments? One idea is that teenage behavior is related to what researchers call u reward sensitivity.\" Decision-making always involves balancing rewards and risks, benefits and costs. \" Reward sensitivity “ measures how much reward it takes to outweigh risk. Teenagers are particularly sensitive to social rewards—winning the game, impressing a new friend, getting that boy to notice you. Reward sensitivity, like prosocial behavior and risk-taking, seems to go up in adolescence and then down again as we age. Somehow, when you hit 30, the chance that something exciting and new will happen at that party just doesn't seem to outweigh the effort of getting up off the couch."],"questions":[{"num":36,"stem":"According to Paragraph 1, children growing into adolescence tend to ___","opts":{"A":"develop opposite personality traits","B":"see the world in an unreasonable way","C":"have fond memories of their past","D":"show affection for their parents"},"answer":"A","analysis":"**\n考点：细节理解。\n解析：\"helpless and dependent children…become **independent** people who can take care of themselves…At the same time, once **cheerful and compliant** children become **rebellious** teenage risk-takers.\"——从依赖到独立、从顺从到叛逆，即**发展出相反的性格特质**，A 正确。B（以不理性方式看世界）、C（怀念过去）、D（对父母表达爱意）均无据。\n【AI 修正】无。"},{"num":37,"stem":"It can be learned from Paragraph 2 that Crone's s t u d y ___","opts":{"A":"explores teenagers’ social responsibilities","B":"examines teenagers5 emotional problems","C":"provides a new insight into adolescence","D":"highlights negative adolescent behavior"},"answer":"C","analysis":"**\n考点：细节推断。\n解析：\"The study is part of **a new wave of thinking** about adolescence…The new work emphasizes that adolescence is **a time of opportunity as well as risk**.\"——新研究强调青春期是机遇与风险并存的时期，即**为理解青春期提供了新视角**，C 正确。A（探索社会责任）无据——研究的是亲社会**行为**；B（审视情绪问题）无据——非情绪研究；D（突出负面行为）反了——恰恰强调积极面。\n【AI 修正】无。"},{"num":38,"stem":"What does Crone's study find about prosocial behavior?","opts":{"A":"It results from the wish to cooperate.","B":"It is cultivated through education.","C":"It is subject to family influence.","D":"It tends to peak in adolescence."},"answer":"D","analysis":"**\n考点：细节推断。\n解析：\"Other studies have shown that rebellious behavior increases as you become a teenager and then fades away…**the same pattern holds for prosocial behavior**. Teenagers were more likely than younger children or adults to report that they did things like unselfishly helping a friend.\"——亲社会行为与叛逆行为同型：青春期上升、成年回落，即**在青春期达到峰值**，D 正确。A（源于合作意愿）、B（经教育培养）、C（受家庭影响）均无据。\n【AI 修正】无。"},{"num":39,"stem":"It can be learned from the last two paragraphs that t e e n a g e r s ___","opts":{"A":"overstress their influence on others","B":"care a lot about social recognition","C":"become anxious about their future","D":"endeavor to live a joyful life"},"answer":"B","analysis":"**\n考点：细节推断。\n解析：\"Teenagers are particularly sensitive to **social rewards**—winning the game, **impressing a new friend**, getting that boy to notice you.\"——对社会奖赏（他人的注意与认可）高度敏感，即**很在意社会认可**，B 正确。A（夸大对他人的影响）、C（对未来焦虑）、D（努力过快乐生活）均无据。\n【AI 修正】无。"},{"num":40,"stem":"What is the text mainly about?","opts":{"A":"Why teenagers are self-contradictory.","B":"Why teenagers are risk-sensitive.","C":"How teenagers develop prosociality.","D":"How teenagers become independent."},"answer":"A","analysis":"**\n考点：主旨题。\n解析：全文由\"青少年是悖论体\"开篇，以 Crone 研究揭示亲社会与叛逆**正相关**、并归因于共同的根源\"奖赏敏感性\"——核心是**解释青少年为何自相矛盾**，A 正确。B（为何风险敏感）只是末段的解释环节；C（如何发展亲社会性）只覆盖一半；D（如何变得独立）只是首段背景。\n【AI 修正】无。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points) Net-Zero Rules Set to Send Cost of New Homes and Extensions Soaring New building regulations aimed at improving energy efficiency are set to increase the price of new homes, as well as those of extensions and loft conversions on existing ones. The rules, which came into effect on Wednesday in England, are part of government plans to reduce the UK's carbon emissions to net zero by 2050. They set new standards for ventilation, energy efficiency and heating, and state that new residential buildings must have charging points for electric vehicles. The moves are the most significant change to building regulations in years, and industry experts say they will inevitably lead to higher prices at a time when a shortage of materials and high labour costs are already driving up bills. Brian Berry, chief executive of the Federation of Master Builders, says the measures will require new materials, testing methods, products and systems to be installed. UA11 this comes at an increased cost during a time when prices are already sky high. Inevitably, consumers will have to pay more,\" he says. Gareth Belsham, of surveyors Naismiths, says people who are upgrading, or extending their home, will be directly affected. The biggest changes relate to heating and insulation/ he explains. \" There are new rules concerning the amount of glazing used in extensions, and any new windows or doors must be highly insulated.” Windows and doors will have to adhere to higher standards, while there are new limits on the amount of glazing you can have to reduce unwanted heat from the sun. Thomas Goodman, of MyJobQuote, says this will bring in new restrictions for extensions. u Glazing on windows, doors and roof lights must cover no more than 25% of the floor area to prevent heat loss, “ he says. As the rules came into effect last Wednesday, property developers were rushing to file plans just before the deadline. Any plans submitted before that date are considered to be under the previous rules, and can go ahead as long as work starts before 15 June next year. Builders which have costed projects, but have not filed the paperwork, may need to go back and submit fresh estimates, says Marcus Jeffbrd of Build Aviator.","Materials prices are already up 25% in the last two years. How much overall prices will increase as a result of the rule changes is not clear. \" Whilst admirable in their intentions, they will add to the cost of housebuilding at a time when many already feel that they are priced out of homeownership, says Jonathan Rolande of the National Association of Property Buyers. \" An average extension will probably see around £3,000 additional cost thanks to the new regs.” John Kelly, a construction lawyer at Freeths law firm, believes prices will eventually come down. But not in the immediate future. 66 As the marketplace adapts to the new requirements, and the technologies that support them, the scaling up of these technologies will eventually bring costs down, but in the short term, we will all have to pay the price of the necessary transition,“ he says. However, the long-term effects of the changes will be more comfortable and energy-efficient homes, adds Andrew Mellor, of PRP architects. \" Homeowners will probably recoup that cost over time in energy bill savings. It will obviously be very volatile at the moment, but they will have that benefit over time.”"],"options":[{"key":"A","text":"The rise of home prices is a temporary matter."},{"key":"B","text":"Builders possibly need to submit new estimates of their projects."},{"key":"C","text":"There will be specific limits on home extensions to prevent heat loss."},{"key":"D","text":"The new rules will take home prices to an even higher level."},{"key":"E","text":"Many people feel that home prices are already beyond what they can afford."},{"key":"F","text":"The new rules will affect people whose home extensions include new windows or doors."},{"key":"G","text":"The rule changes will benefit homeowners eventually."}],"passage":["- **A.** The rise of home prices is a temporary matter. - **B.** Builders possibly need to submit new estimates of their projects. - **C.** There will be specific limits on home extensions to prevent heat loss. - **D.** The new rules will take home prices to an even higher level. - **E.** Many people feel that home prices are already beyond what they can afford. - **F.** The new rules will affect people whose home extensions include new windows or doors. - **G.** The rule changes will benefit homeowners eventually."],"questions":[{"num":41,"stem":"Brian Berry __________","opts":{},"answer":"D","analysis":"**（Brian Berry）\n解析：原文 \"'**All this comes at an increased cost** during a time when prices are already sky high. **Inevitably, consumers will have to pay more**,' he says.\"＋首段\"set to **increase the price of new homes**\"——新规将把房价推得更高，对应 D。"},{"num":42,"stem":"Gareth Belsham __________","opts":{},"answer":"F","analysis":"**（Gareth Belsham）\n解析：原文 \"people who are **upgrading, or extending their home, will be directly affected**…'any **new windows or doors** must be highly insulated.'\"——扩建含新门窗者直接受影响，对应 F。"},{"num":43,"stem":"Marcus Jefford __________","opts":{},"answer":"B","analysis":"**（Marcus Jefford）\n解析：原文 \"Builders which have costed projects, but have not filed the paperwork, **may need to go back and submit fresh estimates**.\"——建筑商或需提交新的报价，对应 B。"},{"num":44,"stem":"John Kelly __________","opts":{},"answer":"A","analysis":"**（John Kelly）\n解析：原文 \"believes prices will **eventually come down**…'the scaling up of these technologies will eventually bring costs down, but **in the short term**, we will all have to pay the price…'\"——房价上涨是暂时现象（终将回落），对应 A。"},{"num":45,"stem":"Andrew Mellor __________","opts":{},"answer":"G","analysis":"**（Andrew Mellor）\n解析：原文 \"'the long-term effects…will be more comfortable and **energy-efficient homes**…Homeowners will probably **recoup that cost over time in energy bill savings**.'\"——规则变革终将惠及房主（节能省钱），对应 G。多余项：C（扩建防热损的具体限制——是 Goodman 的观点，不在左列）、E（很多人已觉得房价高不可攀——是 Rolande 的话，不在左列）。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions ： Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points) In the late 18th century, William Wordsworth became famous for his poems about nature. And he was one of the founders of a movement called Romanticism, which celebrated the wonders of the natural world. Poetry is powerful. Its energy and rhythm can capture a reader, transport them to another world and make them see things differently. Through carefully selected words and phrases, poems can be dramatic, funny, beautiful, moving and inspiring. No one knows for sure when poetry began but it has been around for thousands of years, even before people could write. It was a way to tell stories and pass down history. It is closely related to song and even when written it is usually created to be performed out loud. Poems really come to life when they are recited. This can also help with understanding them too, because the rhythm and sounds of the words become clearer."],"reference":"18 世纪晚期，威廉·华兹华斯以描写自然的诗歌闻名于世。他也是一场名为\"浪漫主义\"的运动的开创者之一，这场运动讴歌自然世界的种种奇观。\n\n诗歌的力量是强大的。诗歌的能量与韵律能够抓住读者，将他们带到另一个世界，让他们以不同的眼光看待事物。通过精心挑选的字词与短语，诗歌可以波澜壮阔、妙趣横生、动人心弦、感人至深、催人奋进。\n\n没有人确切知道诗歌起源于何时，但它已存在数千年，甚至在人们会写字之前就已出现。诗歌曾是讲故事、传历史的方式。它与歌谣关系密切——即使写了下来，通常也是为了吟诵而作。诗被朗诵出来才真正活了。朗诵还有助于理解诗歌，因为词语的节奏与音韵会变得更加清晰。\n\n> 翻译要点：① celebrated the wonders of the natural world（讴歌自然世界的奇观）；② capture a reader, transport them to another world（抓住读者，带他们到另一个世界）；③ dramatic, funny, beautiful, moving and inspiring 的四字格处理（波澜壮阔、妙趣横生、感人至深、催人奋进）；④ created to be performed out loud（为吟诵而作）；⑤ Poems really come to life when they are recited（诗被朗诵出来才真正活了）。","analysis":""},"writing":{"small":["**47.** Directions ： An art exhibition and a robot show are to be held on Sunday, and your friend David asks you which one he should go to. Write him an email to 1) make a suggestion, and 2) give your reason(s). Write your answer in about 100 words on the ANSWER SHEET. Do not use your own name in your email; use “Li Ming” instead. (10 points)"],"large":["**48.** Directions： Write an essay based on the chart below. In your essay, you should 1) describe and interpret the chart, and 2) give your comments. Write your answer in about 150 words on the ANSWER SHEET. (15 points)","**2012—2021 年我国居民健康素养水平**","| 年份 | 2012 | 2013 | 2014 | 2015 | 2016 | 2017 | 2018 | 2019 | 2020 | 2021 | |---|---|---|---|---|---|---|---|---|---|---| | 水平 | 8.80% | 9.48% | 9.79% | 10.25% | 11.58% | 14.18% | 17.06% | 19.17% | 23.15% | 25.40% | *注：健康素养（health literacy）指个人获取和理解基本健康信息和服务，并运用这些信息和服务做出正确决策，以维护和促进自身健康的能力；健康素养水平指具备基本健康素养的人在总人群（15—69岁城乡居民）中所占的比例。*"],"small_ref":"Dear David,\n\nI'm glad to hear that you are interested in the art exhibition and the robot show this Sunday. My suggestion is that you go to the robot show, and here is why.\n\nFirst, as an engineering enthusiast, you have always been curious about how things work, and the robot show will offer you a close look at the cutting-edge technologies behind intelligent machines — some robots can even interact with visitors. Second, the art exhibition will last for a whole month, so you can visit it any weekend you like, whereas the robot show is on for this Sunday only.\n\nI hope you will enjoy the robot show. If you like, we can go to the art exhibition together some other time.\n\nYours,\nLi Ming\n\n> 思路：三段式——明确建议（机器人展）+ 两条理由（兴趣匹配 / 展期长短对比）→ 收尾（表示愿意另约艺术展）。署名 Li Ming，不写地址。","large_ref":"**图表信息**：2012-2021 年我国居民健康素养水平由 8.80% 逐年攀升至 25.40%。\n\nThe chart above illustrates the changes in Chinese residents' health literacy from 2012 to 2021. As is shown, the literacy level climbed steadily from 8.80 percent in 2012 to 25.40 percent in 2021 — nearly tripling within a decade, with the growth accelerating notably after 2016.\n\nSeveral factors account for this encouraging trend. First, the government has been promoting health education in recent years, spreading basic medical knowledge through public campaigns, community lectures and new media platforms. Second, with living standards improving, people are paying more attention to their well-being and are more willing to acquire and apply health information in their daily lives. Third, the pandemic since 2020 has further raised public awareness of scientific health knowledge.\n\nFrom my perspective, the rising health literacy is of great significance, for it means more people are able to make sound decisions about their own health. It is advisable for the government and schools to continue such education, so that the figure will keep climbing in the years to come.\n\n> 思路：首段描述图表（十年近两倍、2016 年后加速）→ 中段析因（健康教育推广 / 生活水平与观念 / 疫情提升意识）→ 末段评论（意义 + 建议持续教育）。"},"label":"2023 年真题（AI 解析）"};
