ng prices of renewables, especially wind and solar. The cost of solar panels has dropped by 80 percent and the cost of wind turbines by close to one-third in the past eight years. In many parts of the world renewable energy is already a principal energy source. In Scotland, for example, wind turbines provide enough electricity to power 95 percent of homes. While the rest of the world takes the lead, notably China and Europe, the United States is also seeing a remarkable shift. In March, for the first time, wind and solar power accounted for more than 10 percent of the power generated in the US, reported the US Energy Information Administration. President Trump has underlined fossil fuels - especially coal - as the path to economic growth. In a recent speech in Iowa, he dismissed wind power as an unreliable energy source. But that message did not play well with many in Iowa, where wind turbines dot the fields and provide 36 percent of the state's electricity generation - and where tech giants like Microsoft are being attracted by the availability of clean energy to power their data centers. The question \"what happens when the wind doesn't blow or the sun doesn't shine?\" has provided a quick put-down for skeptics. But a boost in the storage capacity of batteries is making their ability to keep power flowing around the clock more likely. The advance is driven in part by vehicle manufacturers, who are placing big bets on battery-powered electric vehicles. Although electric cars are still a rarity on roads now, this massive investment could change the picture rapidly in coming years. While there's a long way to go, the trend lines for renewables are spiking. The pace of change in energy sources appears to be speeding up - perhaps just in time to have a meaningful effect in slowing climate change. What Washington does -or doesn't do - to promote alternative energy may mean less and less at a time of a global shift in thought."],"questions":[{"num":26,"stem":"The word \"plummeting\" (Line 3, Para. 2) is closest in meaning to ___","opts":{"A":"stabilizing","B":"changing","C":"falling","D":"nsmg"},"answer":"C","analysis":"【AI 解析】答案 [C]「falling」。本题考查「The word \"plummeting\" (Line 3, Para. 2) …」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"According to Paragraph 3, the use of renewable energy in America ___","opts":{"A":"is progressing notably","B":"is as extensive as in Europe","C":"faces many challenges","D":"has proved to be impractical"},"answer":"A","analysis":"【AI 解析】答案 [A]「is progressing notably」。本题考查「According to Paragraph 3, the use of ren…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"It can be learned that in Iowa, -- ___","opts":{"A":"wind is a widely used energy source","B":"wind energy has replaced fossil fuels","C":"tech giants are investing in clean energy","D":"there is a shortage of clean energy supply"},"answer":"A","analysis":"【AI 解析】答案 [A]「wind is a widely used energy source」。本题考查「It can be learned that in Iowa, -- ___」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"Which of the following is true about clean energy according to Paragraphs 5&6?","opts":{"A":"Its application has boosted battery storage.","B":"It is commonly used in car manufacturing.","C":"Its continuous supply is becoming a reality.","D":"Its sustainable exploitation will remain difficult."},"answer":"C","analysis":"【AI 解析】答案 [C]「Its continuous supply is becoming a reality.」。本题考查「Which of the following is true about cle…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"It can be inferred from the last paragraph that renewable energy ___","opts":{"A":"will bring the US closer to other countries","B":"will accelerate global environmental change","C":"is not really encouraged by the US government","D":"is not competitive enough with regard to its cost"},"answer":"C","analysis":"【AI 解析】答案 [C]「is not really encouraged by the US government」。本题考查「It can be inferred from the last paragra…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["The power and ambition of the giants of the digital economy is astonishing -Amazon has just announced the purchase of the upmarket grocery chain Whole Foods for $ 13.5bn, but two years ago Facebook paid even more than that to acquire the WhatsApp messaging service, which doesn't have any physical product at all. What WhatsApp offered Facebook was an intricate and finely detailed web of its users' friendships and social lives. Facebook promised the European commission then that it would not link phone numbers to Facebook identities, but it broke the promise almost as soon as the deal went through. Even without knowing what was in the messages, the knowledge of who sent them and to whom was enormously revealing and still could be. What political journalist, what party whip, would not want to know the makeup of the WhatsApp groups in which Theresa May's enemies are currently plotting? It may be that the value of Whole Foods to Amazon is not so much the 460 shops it owns, but the records of which customers have purchased what. Competition law appears to be the only way to address these imbalances of power. But it is clumsy. For one thing, it is very slow compared to the pace of change within the digital economy. By the time a problem has been addressed and remedied it may have vanished in the marketplace, to be replaced by new abuses of power. But there is a deeper conceptual problem, too. Competition law as presently interpreted deals with financial disadvantage to consumers and this is not obvious when the users of these services don't pay for them. The users of their services are not their customers. That would be the people who buy advertising from them - and Facebook and Google, the two virtual giants, dominate digital advertising to the disadvantage of all other media and entertainment companies. The product they're selling is data, and we, the users, convert our lives to data for the benefit of the digital giants. Just as some ants farm the bugs called aphids for the honeydew they produce when they feed, so Google farms us for the data that our digital lives yield. Ants keep predatory insects away from where their aphids feed; Gmail keeps the spammers out of our inboxes. It doesn't feel like a human or democratic relationship, even if both sides benefit."],"questions":[{"num":31,"stem":"According to Paragraph 1, Facebook acquired WhatsApp for its ___","opts":{"A":"digital products","B":"user information","C":"physical assets","D":"quality service"},"answer":"B","analysis":"【AI 解析】答案 [B]「user information」。本题考查「According to Paragraph 1, Facebook acqui…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"Linking phone numbers to Facebook identities may ___","opts":{"A":"worsen political disputes","B":"mess up customer records","C":"pose a risk to Facebook users","D":"mislead the European commission"},"answer":"C","analysis":"【AI 解析】答案 [C]「pose a risk to Facebook users」。本题考查「Linking phone numbers to Facebook identi…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"According to the author, competition law ___","opts":{"A":"should serve the new market powers","B":"may worsen the economic imbalance","C":"should not provide just one legal solution","D":"cannot keep pace with the changing market"},"answer":"D","analysis":"【AI 解析】答案 [D]「cannot keep pace with the changing market」。本题考查「According to the author, competition law…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"Competition law as presently interpreted can hardly protect Facebook users ___","opts":{"A":"they are not defined as customers","B":"they are not financially reliable","C":"the services are generally digital","D":"the services are paid for by advertisers"},"answer":"A","analysis":"【AI 解析】答案 [A]「they are not defined as customers」。本题考查「Competition law as presently interpreted…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"The ants analogy is used to illustrate ___","opts":{"A":"a win-win business model between digital giants","B":"a typical competition pattern among digital giants","C":"the benefits provided for digital giants' customers","D":"the relationship between digital giants and their users"},"answer":"D","analysis":"【AI 解析】答案 [D]「the relationship between digital giants and th…」。本题考查「The ants analogy is used to illustrate _…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["To combat the trap of putting a premium on being busy, Cal Newport, author of Deep Work: Rules for Focused Success in a Distracted World, recommends building a habit of \"deep work\" - the ability to focus without distraction. There are a number of approaches to mastering the art of deep work - be it lengthy retreats dedicated to a specific task; developing a daily ritual; or taking a \"journalistic\" approach to seizing moments of deep work when you can throughout the day. Whichever approach, the key is to determine your length of focus time and stick to it. Newport also recommends \"deep scheduling\" to combat constant interruptions and get more done in less time. \"At any given point, I should have deep work scheduled for roughly the next month. Once on the calendar, I protect this time like I would a doctor's appointment or important meeting\", he writes. Another approach to getting more done in less time is to rethink how you prioritise your day - in particular how we craft our to-do lists. Tim Harford, author of Messy: The Power of Disorder to Transform Our Lives, points to a study in the early 1980s that divided undergraduates into two groups: some were advised to set out monthly goals and study activities; others were told to plan activities and goals in much more detail, day by day. While the researchers assumed that the well-structured daily plans would be most effective when it came to the execution of tasks, they were wrong: the detailed daily plans demotivated students. Harford argues that inevitable distractions often render the daily to-do list ineffective, while leaving room for improvisation in such a list can reap the best results. In order to make the most of our focus and energy, we also need to embrace downtime, or as Newport suggests, \"be lazy\". \"Idleness is not just a vacation, an indulgence or a vice; it is as indispensable to the brain as vitamin D is to the body ... [idleness] is, paradoxically, necessary to getting any work done,\" he argues. Srini Pillay, an assistant professor of psychiatry at Harvard Medical School, believes this counterintuitive link between downtime and productivity may be due to the way our brains operate. When our brains switch between being focused and unfocused on a task, they tend to be more efficient. \"What people don't realise is that in order to complete these tasks they need to use both the focus and unfocus circuits in their brain,\" says Pillay."],"questions":[{"num":36,"stem":"The key to mastering the art of deep work is to ___","opts":{"A":"keep to your focus time","B":"list your immediate tasks","C":"make specific daily plans","D":"seize every minute to work"},"answer":"A","analysis":"【AI 解析】答案 [A]「keep to your focus time」。本题考查「The key to mastering the art of deep wor…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"The study in the early 1980s cited by Harford shows that ___","opts":{"A":"distractions may actually increase efficiency","B":"daily schedules are indispensable to studying","C":"students are hardly motivated by monthly goals","D":"detailed plans may not be as fruitful as expected"},"answer":"D","analysis":"【AI 解析】答案 [D]「detailed plans may not be as fruitful as expec…」。本题考查「The study in the early 1980s cited by Ha…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"According to Newport, idleness is ___","opts":{"A":"a desirable mental state for busy people","B":"a major contributor to physical health","C":"an effective way to save time and energy","D":"an essential factor in accomplishing any work"},"answer":"D","analysis":"【AI 解析】答案 [D]「an essential factor in accomplishing any work」。本题考查「According to Newport, idleness is ___」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"Pillay believes that our brains' shift between being focused and unfocused ___","opts":{"A":"can result in psychological well-being","B":"can bring about greater efficiency","C":"is aimed at better balance in work","D":"is driven by task urgency"},"answer":"B","analysis":"【AI 解析】答案 [B]「can bring about greater efficiency」。本题考查「Pillay believes that our brains' shift b…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"This text is mainly about ___","opts":{"A":"ways to relieve the tension of busy life","B":"approaches to getting more done in less time","C":"the key to eliminating distractions","D":"the cause of the lack of focus time"},"answer":"B","analysis":"【AI 解析】答案 [B]「approaches to getting more done in less time」。本题考查「This text is mainly about ___」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by choosing the most suitable subtitles from the list A-G for each numbered paragraph (41-45). There are two extra subtitles which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)"],"options":[{"key":"A","text":"Just say it"},{"key":"B","text":"Be present"},{"key":"C","text":"Pay a unique compliment"},{"key":"D","text":"Name, places, things"},{"key":"E","text":"Find the \"me too\"s"},{"key":"F","text":"Skip the small talk"},{"key":"G","text":"Ask for an opinion"}],"passage":["- **A.** Just say it - **B.** Be present - **C.** Pay a unique compliment - **D.** Name, places, things - **E.** Find the \"me too\"s - **F.** Skip the small talk - **G.** Ask for an opinion Five ways to make conversation with anyone Conversations are links, which means when you have a conversation with a new person a link gets formed and every conversation you have after that moment will strengthen the link. You meet new people every day: the grocery worker, the cab driver, new people at work or the security guard at the door. Simply starting a conversation with them will form a link. Here are five simple ways that you can make the first move and start a conversation with strangers."],"questions":[{"num":41,"stem":"Suppose you are in a room with someone you don't know and something within you says \"I want to talk with this person\" - this is something that mostly happens with all of us. You wanted to say something - the first word - but it just won't come out, it feels like it is stuck somewhere. I know the feeling and here is my advice: just get it out. Just think: what is the worst that could happen? They won't talk with you? Well, they are not talking with you now! I truly believe that once you get that first word out everything else will just flow. So keep it simple: \"Hi\", \"Hey\"or \"Hello\" - do the best you can to gather all of the enthusiasm and energy you can, put on a big smile and say \"Hi\".","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「Just say it」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":42,"stem":"It is a problem all of us face; you have limited time with the person that you want to talk with and you want to make this talk memorable. Honestly, if we got stuck in the rut of \"hi\", \"hello\", \"how are you?\" and \"what is going on?\", you will fail to give the initial jolt to the conversation that can make it so memorable. So don't be afraid to ask more personal questions. Trust me, you'll be surprised to see how much people are willing to share if you just ask.","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]「Skip the small talk」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [F]。"},{"num":43,"stem":"When you meet a person for the first time, make an effort to find the things which you and that person have in common so that you can build the conversation from that point. When you start conversation from there and then move outwards, you'll find all of a sudden that the conversation becomes a lot easier.","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「Find the \"me too\"s」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"},{"num":44,"stem":"Imagine you are pouring your heart out to someone and they are just busy on their phone, and if you ask for their attention you get the response \"I can multitask\". So when someone tries to communicate with you, just be in that communication wholeheartedly. Make eye contact. Trust me, eye contact is where all the magic happens. When you make eye contact, you can feel the conversation.","opts":{},"answer":"B","analysis":"【AI 解析】答案 [B]「Be present」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [B]。"},{"num":45,"stem":"You all came into a conversation where you first met the person, but after some time you may have met again and have forgotten their name. Isn't that awkward! So, remember the little details of the people you met or you talked with; perhaps the places they have been to, the places they want to go, the things they like, the things they hate - whatever you talk about. When you remember such things you can automatically become investor in their wellbeing. So they feel a responsibility to you to keep that relationship going. That's it. Five amazing ways that you can make conversation with almost anyone. Every person is a really good book to read, or to have a conversation with!","opts":{},"answer":"D","analysis":"【AI 解析】答案 [D]「Name, places, things」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [D]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation neatly on the ANSWER SHEET. (15 points) A fifth grader gets a homework assignment to select his future career path from a list of occupations. He ticks \"astronaut\" but quickly adds \"scientist\" to the list and selects it as well. The boy is convinced that if he reads enough, he can explore as many career paths as he likes. And so he reads - everything from encyclopedias to science fiction novels. He reads so passionately that his parents have to institute a \"no reading policy\" at the dinner table. That boy was Bill Gates, and he hasn't stopped reading yet - not even after becoming one of the most successful people on the planet. Nowadays, his reading material has changed from science fiction and reference books: recently, he revealed that he reads at least 50 nonfiction books a year. Gates chooses nonfiction titles because they explain how the world works. \"Each book opens up new avenues of knowledge to explore\", Gates says."],"reference":"一个五年级学生收到一份家庭作业，要求他从一份职业清单中选出自己未来的职业道路。他勾选了“宇航员”，但很快又把“科学家”加进清单并同样选中。这个男孩相信，只要读的书足够多，他就可以随心所欲地探索尽可能多的职业道路。于是他开始阅读——从百科全书到科幻小说，无所不包。他读书的热情如此之高，以至于父母不得不立下“餐桌上不许看书”的规矩。那个男孩就是比尔·盖茨，而且他至今没有停止阅读——即使已经成为全球最成功的人士之一也没有。如今，他的阅读材料已从科幻小说和参考书发生了转变：最近他透露，自己每年至少读 50 本非虚构类图书。盖茨选择非虚构类书籍，是因为它们解释了世界是如何运转的。“每一本书都开辟了新的知识途径供人探索，”盖茨说。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose you have to cancel your travel plan and will not be able to visit Professor Smith. Write him an email to 1) apologize and explain the situation, and 2) suggest a future meeting. You should write about 100 words on the ANSWER SHEET. Do not use your own name. Use \"Li Ming\" instead. Do not write your address. (10 points)"],"large":["**48.** Directions: Write an essay based on the chart below. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points)","**2017 年某市消费者选择餐厅时的关注因素**","| 服务 | 价格 | 环境 | 特色 | 其他 | |---|---|---|---|---| | 26.80% | 23.80% | 36.30% | 8.40% | 4.70% |"],"small_ref":"Dear Professor Smith,\n\nI am writing to apologize for having to cancel my planned visit to you next week.\n\nUnfortunately, an important academic conference has been suddenly scheduled at the same time, and as one of the organizers, I have no choice but to attend it. I am terribly sorry for any inconvenience this may cause you.\n\nWould it be convenient for us to meet after the conference, say, on the afternoon of June 20? If the time does not suit you, please feel free to suggest another date. I am also considering visiting you during the summer vacation.\n\nThank you for your understanding. I look forward to seeing you soon.\n\nYours sincerely,\nLi Ming","large_ref":"The chart shows the factors consumers in a city consider when choosing restaurants in 2017. Environment ranks first at 36.3%, followed by service (26.8%) and price (23.8%), while special features and other factors account for 8.4% and 4.7% respectively.\n\nThe data reveal an interesting change in consumption patterns. With rising incomes, people no longer regard eating out as merely filling the stomach; instead, they care more about the whole dining experience. A pleasant environment and considerate service, which symbolize comfort and respect, have therefore overtaken price as the primary considerations.\n\nThe findings offer valuable implications for restaurant operators. Simply lowering prices can hardly win customers today; improving the decoration and atmosphere, training staff and providing distinctive dishes are more effective strategies. For consumers, the trend also reminds them to choose rationally and avoid blindly following fashion."},"label":"2018 年真题（AI 解析）"};

window.QUIZ_DATA[2019] = {"year":2019,"cloze":{"directions":["**Directions:** Read the following text. Choose the best word ( s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)"],"passage":["Weighing yourself regularly is a wonderful way to stay aware of any significant weight fluctuations. ___1___, when done too often, this habit can sometimes hurt more than it ___2___. As for me, weighing myself every day caused me to shift my focus from being generally healthy and physically active, to focusing ___3___ on the scale. That was bad to my overall fitness goals. I had gained weight in the form of muscle mass, but thinking only of ___4___ the number on the scale, I altered my training program. That conflicted with how I needed to train to ___5___ my goals. I also found that weighing myself daily did not provide an accurate ___6___ of the hard work and progress I was making in the gym. It takes about three weeks to a month to notice significant changes in your weight ___7___ altering your training program. The most ___8___ changes will be observed in skill level, strength and inches lost. For these ___9___ , I stopped weighing myself every day and switched to a bimonthly weighing schedule ___10___ . Since weight loss is not my goal, it is less important for me to ___11___ my weight each week. Weighing every other week allows me to observe and ___12___ any significant weight changes. That tells me whether I need to ___13___ my training program. I use my bimonthly weigh-in ___14___ to get information about my nutrition as well. If my training intensity remains the same, but I'm constantly ___15___ and dropping weight, this is a ___16___ that I need to increase my daily caloric intake. The ___17___ to stop weighing myself every day has done wonders for my overall health, fitness and well-being. I'm experiencing increased zeal for working out since I no longer carry the burden of a ___18___ morning weigh-in. I've also experienced greater succe text may be harmful in another. Jealousy and anger, for example, may have evolved to alert us to important inequalities. Too much happiness can be destructive. And guilt, by prompting us to think more deeply about our goodness, can encourage humans to make up for errors and fix relationships. Guilt, in other words, can help hold a cooperative species together. It is a kind of social glue. Viewed in this light, guilt is an opportunity. Work by Tina Malti, a psychology professor at the University of Toronto, suggests that guilt may compensate for an emotional deficiency. In a number of studies, Malti and others have shown that guilt and sympathy may represent different pathways to cooperation and sharing. Some kids who are low in sympathy may make up for that shortfall by experiencing more guilt, which can rein in their nastier impulses. And vice versa: High sympathy can substitute for low guilt. In a 2014 study, for example, Malti looked at 244 children. Using caregiver assessments and the children's self-observations, she rated each child's overall sympathy level and his or her tendency to feel negative emotions after moral transgressions. Then the kids were handed chocolate coins, and given a chance to share them with an anonymous child. For the low-sympathy kids, how much they shared appeared to turn on how inclined they were to feel guilty. The guilt-prone ones shared more, even though they hadn't magically become more sympathetic to the other child's deprivation. \"That's good news, \" Malti says. \"We can be prosocial because we caused harm and we feel regret.\" *-i½"],"questions":[{"num":21,"stem":"Researchers think that guilt can be a good thing because it may help ___","opts":{"A":"regulate a child's basic emotions","B":"improve a child's intellectual ability","C":"foster a child's moral development","D":"intensify a child's positive feelings"},"answer":"C","analysis":"【AI 解析】答案 [C]「foster a child's moral development」。本题考查「Researchers think that guilt can be a go…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"According to Paragraph 2, many people still consider guilt to be ___","opts":{"A":"deceptive","B":"burdensome","C":"addictive","D":"inexcusable"},"answer":"B","analysis":"【AI 解析】答案 [B]「burdensome」。本题考查「According to Paragraph 2, many people st…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":23,"stem":"Yaish holds that the rethinking about guilt comes from an awareness that ___","opts":{"A":"emotions are context-independent","B":"emotions are socially constructive","C":"emotional stability can benefit health","D":"an emotion can play opposing roles"},"answer":"D","analysis":"【AI 解析】答案 [D]「an emotion can play opposing roles」。本题考查「Yaish holds that the rethinking about gu…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":24,"stem":"Malti and others have shown that cooperation and sharing ___","opts":{"A":"may help correct emotional deficiencies","B":"can result from either sympathy or guilt","C":"can bring about emotional satisfaction","D":"may be the outcome of impulsive acts"},"answer":"B","analysis":"【AI 解析】答案 [B]「can result from either sympathy or guilt」。本题考查「Malti and others have shown that coopera…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":25,"stem":"The word \"transgressions\" (Line 4, Para.5) is closest in meaning to ___","opts":{"A":"teachings","B":"discussions","C":"restrictions","D":"wrongdoings"},"answer":"D","analysis":"【AI 解析】答案 [D]「wrongdoings」。本题考查「The word \"transgressions\" (Line 4, Para.…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Forests give us shade, quiet and one of the harder challenges in the fight against climate change. Even as we humans count on forests to soak up a good share of the carbon dioxide we produce, we are threatening their ability to do so. The climate change we are hastening could one day leave us with forests that emit more carbon than they absorb. Thankfully, there is a way out of this trap - but it involves striking a subtle balance. Helping forests flourish as valuable \"carbon sinks\" long into the future may require reducing their capacity to absorb carbon now. California is leading the way, as it does on so many climate efforts, in figuring out the details. The state's proposed Forest Carbon Plan aims to double efforts to thin out young trees and clear brush in parts of the forest. This temporarily lowers carbon-carrying capacity. But the remaining trees draw a greater share of the available moisture, so they grow and thrive, restoring the forest's capacity to pull carbon from the air. Healthy trees are also better able to fend off insects. The landscape is rendered less easily burnable. Even in the event of a fire, fewer trees are consumed. The need for such planning is increasingly urgent. Already, since 2010, drought and insects have killed over 100 million trees in California, most of them in 2016 alone, and wildfires have burned hundreds of thousands of acres. California plans to treat 35, 000 acres of forest a year by 2020, and 60,000 by 2030 - financed from the proceeds of the state's emissions-permit auctions. That's only a small share of the total acreage that could benefit, about half a million acres in all, so it will be vital to prioritize areas at greatest risk of fire or drought. The strategy also aims to ensure that carbon in woody material removed from the forests is locked away in the form of solid lumber or burned as biofuel in vehicles that would otherwise run on fossil fuels. New research on transportation biofuels is already under way. State governments are well accustomed to managing forests, but traditionally they've focused on wildlife, watersheds and opportunities for recreation. Only recently have they come to see the vital part forests will have to play in storing carbon. California's plan, which is expected to be finalized by the governor next year, should serve as a model."],"questions":[{"num":26,"stem":"By saying \"one of the harder challenges,\" the author implies that ___","opts":{"A":"global climate change may get out of control","B":"people may misunderstand global warming","C":"extreme weather conditions may arise","D":"forests may become a potential threat"},"answer":"D","analysis":"【AI 解析】答案 [D]「forests may become a potential threat」。本题考查「By saying \"one of the harder challenges,…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"To maintain forests as valuable \"carbon sinks,\" we may need to ___","opts":{"A":"preserve the diversity of species in them","B":"accelerate the growth of young trees","C":"strike a balance among different plants","D":"lower their present carbon-absorbing capacity"},"answer":"D","analysis":"【AI 解析】答案 [D]「lower their present carbon-absorbing capacity」。本题考查「To maintain forests as valuable \"carbon …」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"California's Forest Carbon Plan endeavors to --- ___","opts":{"A":"cultivate more drought-resistant trees","B":"reduce the density of some of its forests","C":"find more effective ways to kill insects","D":"restore its forests quickly after wildfires"},"answer":"B","analysis":"【AI 解析】答案 [B]「reduce the density of some of its forests」。本题考查「California's Forest Carbon Plan endeavor…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"What is essential to California's plan according to Paragraph 5?","opts":{"A":"To handle the areas in serious danger first.","B":"To carry it out before the year of 2020.","C":"To perfect the emissions-permit auctions.","D":"To obtain enough financial support."},"answer":"A","analysis":"【AI 解析】答案 [A]「To handle the areas in serious danger first.」。本题考查「What is essential to California's plan a…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"The author's attitude to California's plan can best be described as ___","opts":{"A":"ambiguous","B":"tolerant","C":"supportive","D":"cautious"},"answer":"C","analysis":"【AI 解析】答案 [C]「supportive」。本题考查「The author's attitude to California's pl…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["American farmers have been complaining of labor shortages for several years. The complaints are unlikely to stop without an overhaul of immigration rules for farm workers. Congress has obstructed efforts to create a more straightforward visa for agricultural workers that would let foreign workers stay longer in the U.S. and change jobs within the industry. If this doesn't change, American businesses, communities, and consumers will be the losers. Perhaps half of U.S. farm laborers are undocumented immigrants. As fewer such workers enter the country, the characteristics of the agricultural workforce are changing. Today's farm laborers, while still predominantly born in Mexico, are more likely to be settled rather than migrating and more likely to be married than single. They're also aging. At the start of this century, about one-third of crop workers were over the age of 35. Now more than half are. And picking crops is hard on older bodies. One oft-debated cure for this labor shortage remains as implausible as it's been all along: Native U.S. workers won't be returning to the farm. Mechanization isn't the answer, either - not yet, at least. Production of corn, cotton, rice, soybeans, and wheat has been largely mechanized, but many high-value, labor-intensive crops, such as strawberries, need labor. Even dairy farms, where robots do a small share of milking, have a long way to go before they're automated. As a result, farms have grown increasingly reliant on temporary guest workers using the H-2A visa to fill the gaps in the workforce. Starting around 2012, requests for the visas rose sharply; from 2011 to 2016 the number of visas issued more than doubled. The H-2A visa has no numerical cap, unlike the H-2B visa for nonagricultural work, which is limited to 66,000 a year. Even so, employers complain they aren't given all the workers they need. The process is cumbersome, expensive, and unreliable. One survey found that bureaucratic delays led the average H-2A worker to arrive on the job 22 days late. The shortage is compounded by federal immigration raids, which remove some workers and drive others underground. In a 2012 survey, 71 percent of tree-fruit growers and almost 80 percent of raisin and berry growers said they were short of labor. Some western farmers have responded by moving operations to Mexico. From 1998 to 2000, 14.5 percent of the fruit Americans consumed was imported. Little more than a decade later, the share of imports was 25.8 percent. In effect, the U.S. can import food or it can import the workers who pick it."],"questions":[{"num":31,"stem":"What problem should be addressed according to the first two paragraphs?","opts":{"A":"Discrimination against foreign workers in the U.S.","B":"Biased laws in favor of some American businesses.","C":"Flaws in U.S. immigration rules for farm workers.","D":"Decline of job opportunities in U.S. agriculture."},"answer":"C","analysis":"【AI 解析】答案 [C]「Flaws in U.S. immigration rules for farm worke…」。本题考查「What problem should be addressed accordi…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"One trouble with U.S. agricultural workforce is ___","opts":{"A":"the rising number of illegal immigrants","B":"the high mobility of crop workers","C":"the lack of experienced laborers","D":"the aging of immigrant farm workers"},"answer":"D","analysis":"【AI 解析】答案 [D]「the aging of immigrant farm workers」。本题考查「One trouble with U.S. agricultural workf…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"What is the much-argued solution to the labor shortage in U.S. farming?","opts":{"A":"To attract younger laborers to farm work.","B":"To get native U.S. workers back to farming.","C":"To use more robots to grow high-value crops.","D":"To strengthen financial support for farmers."},"answer":"B","analysis":"【AI 解析】答案 [B]「To get native U.S. workers back to farming.」。本题考查「What is the much-argued solution to the …」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"Agricultural employers complain about the H-2A visa for its ___","opts":{"A":"slow granting procedures","B":"limit on duration of stay","C":"tightened requirements","D":"control of annual admissions"},"answer":"A","analysis":"【AI 解析】答案 [A]「slow granting procedures」。本题考查「Agricultural employers complain about th…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"Which of the following could be the best title for this text?","opts":{"A":"U.S. Agriculture in Decline?","B":"Import Food or Labor?","C":"America Saved by Mexico?","D":"Manpower vs. Automation?"},"answer":"B","analysis":"【AI 解析】答案 [B]「Import Food or Labor?」。本题考查「Which of the following could be the best…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Arnold Schwarzenegger, Dia Mirza and Adrian Grenier have a message for you: It's easy to beat plastic. They're part of a bunch of celebrities starring in a new video for World Environment Day - encouraging you, the consumer, to swap out your single-use plastic staples like straws and cutlery to combat the plastics crisis. The key messages that have been put together for World Environment Day do include a call for governments to enact legislation to curb single-use plastics. But the overarching message is directed at individuals. My concern with leaving it up to the individual, however, is our limited sense of what needs to be achieved. On their own, taking our own bags to the grocery store or quitting plastic straws, for example, will accomplish little and require very little of us. They could even be detrimental, satisfying a need to have \"done our bit\" without ever progressing onto bigger, bolder, more effective actions - a kind of \"moral licensing\" that allays our concerns and stops us doing more and asking more of those in charge. While the conversation around our environment and our responsibility toward it remains centered on shopping bags and straws, we're ignoring the balance of power that implies that as \"consumers\" we must shop sustainably, rather than as \"citizens\" hold our governments and industries to account to push for real systemic change. It's important to acknowledge that the environment isn't everyone's priority - or even most people's. We shouldn't expect it to be. In her latest book, Why Good People Do Bad Environmental Things, Wellesley College professor Elizabeth R. DeSombre argues that the best way to collectively change the behavior of large numbers of people is for the change to be structural. This might mean implementing policy such as a plastic tax that adds a cost to environmentally problematic action, or banning single-use plastics altogether. India has just announced it will \"eliminate all single-use plastic in the country by 2022.\" There are also incentive-based ways of making better environmental choices easier, such as ensuring recycling is at least as easy as trash disposal. DeSombre isn't saying people should stop caring about the environment. It's just that individual actions are too slow, she says, for that to be the only, or even primary, approach to changing widespread behavior. None of this is about writing off the individual. It's just about putting things into perspective. We don't have time to wait. We need progressive policies that shape collective action ( and rein in polluting businesses), alongside engaged citizens pushing for change."],"questions":[{"num":36,"stem":"Some celebrities star in a new video to 析】答案 [C]「are far from sufficient」。本题考查「The author concludes that individual eff…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points) In choosing a new home, Camille McClain's kids have a single demand: a backyard. McClain's little ones aren't the only kids who have an opinion when it comes to housing, and in many cases youngsters' views weigh heavily on parents' real estate decisions, according to a 2018 Harris Poll survey of more than 2,000 U.S. adults. While more families buck an older-generation proclivity to leave kids in the dark about real estate decisions, realty agents and psychologists have mixed views about the financial, personal and long-term effects kids' opinions may have. The idea of involving children in a big decision is a great idea because it can help them feel a sense of control and ownership in what can be an overwhelming process, said Ryan Hooper, clinical psychologist in Chicago. \"Children may face serious difficulties in coping with significant moves, especially if it removes them from their current school or support system,\" he said. Greg Jaroszewski, real estate broker with Gagliardo Realty Associates, said he's not convinced that kids should be involved in selecting a home - but their opinions should be considered in regards to proximity to friends and social activities, if possible. Younger children should feel like they're choosing their home - without actually getting a choice in the matter, said Adam Bailey, real estate attorney based in New York. Asking them questions about what they like about the backyard of a potential home will make them feel like they're being included in the decision-making process, Bailey said. Many of the aspects of homebuying aren't a consideration for children, said Tracey Hampson, a real estate agent based in Santa Clarita, Calif. And placing too much emphasis on their opinions can ruin a fantastic home purchase. \"Speaking with your children before you make a real estate decision is wise, but I wouldn't base the purchasing decision solely on their opinions.\" Hampson said. real estate knowledge on HGTV shows, said Aaron Norris of The Norris Group in Riverside, Calif. \"They love Chip and Joanna Gaines just as much as the rest of us,\" he said. \"HGTV has seriously changed how people view real estate. It's not shelter, it's a lifestyle. With that mindset change come some serious money consequences.\" Kids tend to get stuck in the features and the immediate benefits to them personally, Norris said. Parents need to remind their children that their needs and desires may change over time, said Julie Gurner, a real estate analyst with FitSmallBusiness.com. \"Their opinions can change tomorrow,\" Gurner said. \"Harsh as it may be to say, that decision should likely not be made contingent on a child's opinions, but rather made for them with great consideration into what home can meet their needs best - and give them an opportunity to customize it a bit and make it their own.\" This advice is more relevant now than ever before, even as more parents want to embrace the ideas of their children, despite the current housing crunch."],"options":[{"key":"A","text":"remarks that significant moves may pose challenges to children."},{"key":"B","text":"says that it is wise to leave kids in the dark about real estate decisions."},{"key":"C","text":"advises that home purchases should not be based only on children's opinions."},{"key":"D","text":"thinks that children should be given a sense of involvement in homebuying decisions."},{"key":"E","text":"notes that aspects like children's friends and social activities should be considered upon homebuying."},{"key":"F","text":"believes that homebuying decisions should be based on children's needs rather than their opinions."},{"key":"G","text":"assumes that many children's views on real estate are influenced by the media."}],"passage":["- **A.** remarks that significant moves may pose challenges to children. - **B.** says that it is wise to leave kids in the dark about real estate decisions. - **C.** advises that home purchases should not be based only on children's opinions. - **D.** thinks that children should be given a sense of involvement in homebuying decisions. - **E.** notes that aspects like children's friends and social activities should be considered upon homebuying. - **F.** believes that homebuying decisions should be based on children's needs rather than their opinions. - **G.** assumes that many children's views on real estate are influenced by the media."],"questions":[{"num":41,"stem":"Ryan Hooper __________","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「remarks that significant moves may pose challe…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":42,"stem":"Adam Bailey __________","opts":{},"answer":"D","analysis":"【AI 解析】答案 [D]「thinks that children should be given a sense o…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [D]。"},{"num":43,"stem":"Tracey Hampson __________","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「advises that home purchases should not be base…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"},{"num":44,"stem":"Aaron Norris __________","opts":{},"answer":"G","analysis":"【AI 解析】答案 [G]「assumes that many children's views on real est…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [G]。"},{"num":45,"stem":"Julie Gurner __________","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]「believes that homebuying decisions should be b…」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [F]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET. ( 15 points) It is easy to underestimate English writer James Herriot. He had such a pleasant, readable style that one might think that anyone could imitate it. How many times have I heard people say, \"I could write a book. I just haven't the time.\" Easily said. Not so easily done. James Herriot, contrary to popular opinion, did not find it easy in his early days of, as he put it, \"having a go at the writing game\". While he obviously had an abundance of natural talent, the final, polished work that he gave to the world was the result of years of practicing, re-writing and reading. Like the majority of authors, he had to suffer many disappointments and rejections along the way, but these made him all the more determined to succeed. Everything he achieved in life was earned the hard way and his success in the literary field was no exception."],"reference":"人们很容易低估英国作家詹姆斯·赫里奥特。他的文笔如此令人愉悦、如此平易近人，以至于人们可能认为谁都能模仿。我曾多少次听人说：“我也能写书，只是没有时间罢了。”说来容易，做起来难。与流行的看法相反，詹姆斯·赫里奥特在早期——用他自己的话说——“在写作这一行试水”的阶段并不轻松。虽然他显然极有天赋，但他最终呈现给世人的成熟作品，是多年练习、修改和阅读的结果。与大多数作家一样，他一路上不得不经受多次失望与退稿，但这些挫折反而使他更加坚定了成功的决心。他一生所取得的一切都是艰难挣来的，他在文学领域的成功也不例外。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose Professor Smith asked you to plan a debate on the theme of city traffic. Write him an email to 1) suggest a specific topic with your reasons, and .. 2) tell him about your arrangements. You should write about 100 words on the ANSWER SHEET. Do not use your one name. Use \"Li Ming\" instead. Do not write your address. (10 points)"],"large":["**48.** Directions: Write an essay based on the chart below. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points) **80.** 0% 70.0% 68. 1% 60.0% 50.0% 40.0% 30.0% 20.0% 10.0% 0.0% )J)t5 frT 'BѱѲ \u0015rci*12O1 3\u0016\u001702O1 8\u0018**4-*\u0019\u001a*iaJ;!ci.t","**某高校 2013 年和 2018 年本科毕业生去向统计**","| 去向 | 2013 年 | 2018 年 | |---|---|---| | 就业 | 68.1% | 60.7% | | 升学 | 26.3% | 34.0% | | 创业 | 1.3% | 2.6% |"],"small_ref":"Dear Professor Smith,\n\nFollowing your request, I have worked out a plan for the debate on city traffic and would like to report the main arrangements.\n\nI suggest the topic \"Should private cars be restricted in city centers?\" This topic is closely related to our daily life, arouses wide concern and allows both sides sufficient arguments. The debate is scheduled for Friday afternoon, June 14, in Lecture Hall 2. Ten debaters have been divided into two teams, and three teachers, including you, are invited to act as judges.\n\nA detailed schedule is attached to this email. If you have any suggestions for improvement, please let me know at your earliest convenience.\n\nYours sincerely,\nLi Ming","large_ref":"The chart compares the destinations of undergraduate graduates of a university in 2013 and 2018. The proportion of graduates taking employment fell from 68.1% to 60.7%, while those pursuing further study rose from 26.3% to 34%, and entrepreneurship doubled from 1.3% to 2.6%.\n\nThe changes reflect new trends among young people. Fierce competition in the job market and higher demands for qualifications have driven more graduates to pursue master's degrees. Meanwhile, supportive government policies, such as loans and incubator programs, have encouraged a growing number of students to start their own businesses.\n\nIn my view, these shifts are generally positive, as they indicate that graduates are planning their careers in more diversified ways. However, whether to work, study or start a business, one should base the decision on personal interests and strengths rather than blindly follow others, for only a well-considered choice leads to a satisfying career."},"label":"2019 年真题（AI 解析）"};

 robot free than the asocial one. This suggests that the rats perceived the social robot as a genuine social being. They may have bonded more with the social robot because it displayed behaviors like communal exploring and playing. This could lead to the rats better remembering having freed it earlier, and wanting the robot to return the favour when they get trapped, says Quinn. \"Rats have been shown to engage in multiple forms of reciprocal help and cooperation, including what is referred to as direct reciprocity - where a rat will help another rat that has previously helped them,\" says Quinn. The readiness of the rats to befriend the social robot was surprising given its minimal design. The robot was the same size as a regular rat but resembled a simple plastic box on wheels. \"We'd assumed we'd have to give it a moving head and tail, facial features, and put a scent on it to make it smell like a real rat, but that wasn't necessary,\" says Janet Wiles at the University of Queensland in Australia, who helped with the research. The finding shows how sensitive rats are to social cues, even when they come from basic robots. Similarly, children tend to treat robots as if they are fellow beings, even when they display only simple social signals. \"We humans seem to be fascinated by robots, and it turns out other animals are too,\" says Wiles."],"questions":[{"num":21,"stem":"Quinn and her colleagues conducted a test to see if rats can ___","opts":{"A":"pick up social signals from non-living rats","B":"distinguish a friendly rat from a hostile one","C":"attain sociable traits through special training","D":"send out warning messages to their fellows"},"answer":"A","analysis":"【AI 解析】答案 [A]「pick up social signals from non-living rats」。本题考查「Quinn and her colleagues conducted a tes…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"What did the asocial robot do during the experiment?","opts":{"A":"It followed the social robot.","B":"It played with some toys.","C":"It set the trapped rats free.","D":"It moved around alone."},"answer":"D","analysis":"【AI 解析】答案 [D]「It moved around alone.」。本题考查「What did the asocial robot do during the…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":23,"stem":"According to Quinn, the rats released the social robot because they ___","opts":{"A":"tried to practice a means of escape","B":"expected it to do the same in return","C":"wanted to display their intelligence","D":"considered that an interesting game"},"answer":"B","analysis":"【AI 解析】答案 [B]「expected it to do the same in return」。本题考查「According to Quinn, the rats released th…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":24,"stem":"Janet Wiles notes that rats ___","opts":{"A":"can remember other rats' facial features","B":"differentiate smells better than sizes","C":"respond more to actions than to looks","D":"can be scared by a plastic box on wheels"},"answer":"C","analysis":"【AI 解析】答案 [C]「respond more to actions than to looks」。本题考查「Janet Wiles notes that rats ___」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":25,"stem":"It can be learned from the text that rats ___","opts":{"A":"appear to be adaptable to new surroundings","B":"are more socially active than other animals","C":"behave differently from children in socializing","D":"are more sensitive to social cues than expected"},"answer":"D","analysis":"【AI 解析】答案 [D]「are more sensitive to social cues than expecte…」。本题考查「It can be learned from the text that rat…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["It is true that CEO pay has gone up - top ones may make 300 times the pay of typical workers on average, and since the mid-1970s, CEO pay for large publicly traded American corporations has, by varying estimates, gone up by about 500%. The typical CEO of a top American corporation now makes about $18.9 million a year. The best model for understanding the growth of CEO pay is that of limited CEO talent in a world where business opportunities for the top firms are growing rapidly. The efforts of America's highest-earning 1 % have been one of the more dynamic elements of the global economy. It's not popular to say, but one reason their pay has gone up so much is that CEOs really have upped their game relative to many other workers in the U.S. economy. Today's CEO, at least for major American firms, must have many mere skills than simply being able to \"run the company.\" CEOs must have a good sense of financial markets and maybe even how the company should trade in them . They also need better public relations skills than their predecessors, as the costs of even a minor slipup can be significant. Then there's the fact that large American companies are much more globalized than ever before, with supply chains spread across a larger number of countries. To lead in that system requires knowledge that is fairly mind-boggling. Plus, virtually all major American companies are becoming tech companies, often with their own research and development. And beyond this, major CEOs still have to do all the day-to-day work they have always done. The common idea that high CEO pay is mainly about ripping people off doesn't explain history very well. By most measures, corporate governance has become a lot tighter and more rigorous since the 1970s. Yet it is principally during this period of stronger governance that CEO pay has been high and rising. That suggests it is in the broader corporate interest to recruit top candidates for increasingly tough jobs. Furthermore, the highest CEO salaries are paid to outside candidates, not to the cozy insider picks, another sign that high CEO pay is not some kind of depredation at the expense of the rest of the company. And the stock market reacts positively when companies tie CEO pay to, say, stock prices, a sign that those practices build up corporate value not just for the CEO."],"questions":[{"num":26,"stem":"Which of the following has contributed to CEO pay rise?","opts":{"A":"The growth in the number of corporations.","B":"The general pay rise with a better economy.","C":"Increased business opportunities for top firms.","D":"Close cooperation among leading economies."},"answer":"C","analysis":"【AI 解析】答案 [C]「Increased business opportunities for top firms…」。本题考查「Which of the following has contributed t…」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":27,"stem":"Compared with their predecessors, today's CEOs are required to ___","opts":{"A":"foster a stronger sense of teamwork","B":"finance more research and development","C":"establish closer ties with tech companies","D":"operate more globalized companies"},"answer":"D","analysis":"【AI 解析】答案 [D]「operate more globalized companies」。本题考查「Compared with their predecessors, today'…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":28,"stem":"CEO pay has been rising since the 1970s despite ___","opts":{"A":"continual internal opposition","B":"strict corporate governance","C":"conservative business strategies","D":"repeated government warnings"},"answer":"B","analysis":"【AI 解析】答案 [B]「strict corporate governance」。本题考查「CEO pay has been rising since the 1970s …」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":29,"stem":"High CEO pay can be justified by the fact that it helps ___","opts":{"A":"confirm the status of CEOs","B":"motive inside candidates","C":"boost the efficiency of CEOs","D":"increase corporate value"},"answer":"D","analysis":"【AI 解析】答案 [D]「increase corporate value」。本题考查「High CEO pay can be justified by the fac…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":30,"stem":"The most suitable title for this text would be ___","opts":{"A":"CEOs Are Not Overpaid","B":"CEO Pay: Past and Present","C":"CEOs' Challenges of Today","D":"CEO Traits: Not Easy to Define"},"answer":"A","analysis":"【AI 解析】答案 [A]「CEOs Are Not Overpaid」。本题考查「The most suitable title for this text wo…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Madrid was hailed as a public health guiding light last November when it rolled out ambitious restrictions on the most polluting cars. Seven months and one election day later, a new conservative city council suspended enforcement of the clean air zone, a first step toward its possible termination. Mayor Jose Luis Martinez-Almeida made opposition to the zone a centrepiece of his election campaign, despite its success in improving air quality. A judge has now overruled the city's decision to stop levying fines, ordering them restored. But with legal battles ahead, the zone's future looks uncertain at best. Madrid's back and forth on clean air is a pointed reminder of the limits to the patchwork, city-by-city approach that characterises efforts on air pollution across Europe, Britain very much included. Among other weaknesses, the measures cities must employ when left to tackle dirty air on their own are politically controversial, and therefore vulnerable. That's because they inevitably put the costs of cleaning the air on to individual drivers-who must pay fees or buy better vehicles-rather than on to the car manufacturers whose cheating is the real cause of our toxic pollution. It's not hard to imagine a similar reversal happening in London. The new ultra-low emission zone (Ulez) is likely to be a big issue in next year's mayoral election. And if Sadiq khan wins and extends it to the North and South Circular roads in 2021 as he intends, it is sure to spark intense opposition from the far larger number of motorists who will then be affected. It's not that measures such as London's Ulez are useless. Far from it. Local officials are using the levers that are available to them to safeguard residents' health in the face of a serious threat. The zones do deliver some improvements to air quality, and the science tells us that means real health benefits. But mayors and councilors can only do so much about a problem that is far bigger than any one city or town. They are acting because national governments -Britain's and others across Europe -have failed to do so. Restrictions that keep highly polluting cars out of certain areas - city centres, \"school streets\", even individual roads - are a response to the absence of a larger effort to properly enforce existing regulations and require auto companies to bring their vehicles into compliance. Wales has introduced special low speed limits to minimise pollution. We're doing everything but insist that manufacturers clean up their cars."],"questions":[{"num":31,"stem":"Which of the following is true about Madrid's clean air zone?","opts":{"A":"Its effects are questionable.","B":"It has been opposed by a judge.","C":"It needs tougher enforcement.","D":"Its fate is yet to be decided."},"answer":"D","analysis":"【AI 解析】答案 [D]「Its fate is yet to be decided.」。本题考查「Which of the following is true about Mad…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":32,"stem":"Which is considered a weakness of the city-level measures to tackle dirty air?","opts":{"A":"They are biased against car manufacturers.","B":"They prove impractical for city councils.","C":"They are deemed too mild by politicians.","D":"They put the burden on individual motorists."},"answer":"D","analysis":"【AI 解析】答案 [D]「They put the burden on individual motorists.」。本题考查「Which is considered a weakness of the ci…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":33,"stem":"The author believes that the extension of London's Ulez will ___","opts":{"A":"arouse strong resistance","B":"ensure Khan's electoral success","C":"improve the city's traffic","D":"discourage car manufacturing"},"answer":"A","analysis":"【AI 解析】答案 [A]「arouse strong resistance」。本题考查「The author believes that the extension o…」，根据原文相应内容即可直接定位。正确项 [A] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":34,"stem":"Who does the author think should have addressed the problem?","opts":{"A":"Local residents.","B":"Mayors.","C":"Councilors.","D":"National governments."},"answer":"D","analysis":"【AI 解析】答案 [D]「National governments.」。本题考查「Who does the author think should have ad…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":35,"stem":"It can be learned from the last paragraph that auto companies ___","opts":{"A":"will raise low-emission car production","B":"should be forced to follow regulations","C":"will upgrade the design of their vehicles","D":"should be put under public supervision"},"answer":"B","analysis":"【AI 解析】答案 [B]「should be forced to follow regulations」。本题考查「It can be learned from the last paragrap…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""},{"title":"","passage":["Now that members of Generation Z are graduating college this spring-the most commonly-accepted definition says this generation was born after 1995, give or take a year-the attention has been rising steadily in recent weeks. Gen Zs are about to hit the streets looking for work in a labor market that's tighter than it's been in decades. And employers are planning on hiring about 17 percent more new graduates for jobs in the U.S. this year than last, according to a survey conducted by the National Association of Colleges and Employers. Everybody wants to know how the people who will soon inhabit those empty office cubicles will differ from those who came before them. If \"entitled\" 1s the most common adjective, fairly or not, applied to millennials (those born between 1981 and 1995), the catchwords for Generation Z are practical and cautious. According to the career counselors and experts who study them, Generation Zs are clear-eyed, economic pragmatists. Despite graduating into the best economy in the past 50 years, Gen Zs know what an economic train wreck looks like. They were impressionable kids during the crash of 2008, when many of their parents lost their jobs or their life savings or both. They aren't interested in taking any chances. The booming economy seems to have done little to assuage this underlying generational sense of anxious urgency, especially for those who have college debt. College loan balances in the U.S. now stand at a record $1.5 trillion, according to the Federal Reserve. One survey from Accenture found that 88 percent of graduating seniors this year chose their major with a job in mind. In a 2019 survey of University of Georgia students, meanwhile, the career office found the most desirable trait in a future employer was the ability to offer secure employment (followed by professional development and training, and then inspiring purpose). Job security or stability was the second most important career goal ( work-life balance was number one), followed by a sense of being dedicated to a cause or to feel good about serving the greater good. That's a big change from the previous generation. \"Millennials wanted more flexibility in their lives,\" notes Tanya Michelsen, Associate Director of YouthSight, a UK-based brand manager that conducts regular 60-day surveys of British youth, in findings that might just as well apply to American youth. \"Generation Zs are looking for more certainty and stability, because of the rise of the gig economy. They have trouble seeing a financial future and they are quite risk averse.\""],"questions":[{"num":36,"stem":"Generation Zs graduating college this spring ___","opts":{"A":"are recognized for their abilities","B":"are optimistic about the labor market","C":"are in favor of office job offers","D":"are drawing growing public attention"},"answer":"D","analysis":"【AI 解析】答案 [D]「are drawing growing public attention」。本题考查「Generation Zs graduating college this sp…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":37,"stem":"Generation Zs are keenly aware ___","opts":{"A":"what their parents expect of them","B":"how valuable a counselor’s advice is","C":"what a tough economic situation is like","D":"how they differ from past generations"},"answer":"C","analysis":"【AI 解析】答案 [C]「what a tough economic situation is like」。本题考查「Generation Zs are keenly aware ___」，根据原文相应内容即可直接定位。正确项 [C] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":38,"stem":"The word “assuage”(line 9, para. 2) is closest in meaning to ___","opts":{"A":"deepen","B":"define","C":"maintain","D":"relieve"},"answer":"D","analysis":"【AI 解析】答案 [D]「relieve」。本题考查「The word “assuage”(line 9, para. 2) is c…」，根据原文相应内容即可直接定位。正确项 [D] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":39,"stem":"It can be learned from Paragraph 3 that Generation Zs ___","opts":{"A":"give top priority to professional training","B":"have a clear idea about their future job","C":"care little about their job performance","D":"think it hard to achieve work-life balance"},"answer":"B","analysis":"【AI 解析】答案 [B]「have a clear idea about their future job」。本题考查「It can be learned from Paragraph 3 that …」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":40,"stem":"Michelsen thinks that compared with millennials, Generation Zs are ___","opts":{"A":"less realistic","B":"less adventurous","C":"more diligent","D":"more generous"},"answer":"B","analysis":"【AI 解析】答案 [B]「less adventurous」。本题考查「Michelsen thinks that compared with mill…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"}],"overview":"","discourse":""}],"partB":{"directions":["**Directions:** Read the following text and answer the questions by choosing the most suitable subheading from the list A-G for each numbered paragraphs ( 41-45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)"],"options":[{"key":"A","text":"Give compliments, just not too many"},{"key":"B","text":"Put on a good face, always"},{"key":"C","text":"Tailor your interactions"},{"key":"D","text":"Spend time with everyone"},{"key":"E","text":"Reveal, don't hide, information"},{"key":"F","text":"Slow down and listen"},{"key":"G","text":"Put yourselves in others' shoes"}],"passage":["- **A.** Give compliments, just not too many - **B.** Put on a good face, always - **C.** Tailor your interactions - **D.** Spend time with everyone - **E.** Reveal, don't hide, information - **F.** Slow down and listen - **G.** Put yourselves in others' shoes Five Ways to Win Over Everyone in the Office Is it possible to like everyone in your office? Think about how tough it is to get together 15 people, much less 50, who all get along perfectly. But unlike in friendships, you need coworkers. You work with them every day, and you depend on them just as they depend on you. Here are some ways that you can get the whole office on your side."],"questions":[{"num":41,"stem":"If you have a bone to pick with someone in your workplace, you may try to stay tight-lipped around them. But you won't be helping either one of you. A Harvard Business School study found that observers consistently rated those who were frank about themselves more highly, while those who hid lost trustworthiness. The lesson is not that you should make your personal life an open book, but rather, when given the option to offer up details about yourself or painstakingly conceal them, you should just be honest.","opts":{},"answer":"E","analysis":"【AI 解析】答案 [E]「Reveal, don't hide, information」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [E]。"},{"num":42,"stem":"Just as important as being honest about yourself is being receptive to others. We often feel the need to tell others how we feel, whether it's a concern about a project, a stray thought, or a compliment. Those are all valid, but you need to take time to hear out your coworkers, too. In fact, rushing to get your own ideas out there can cause colleagues to feel you don't value their opinions. Do your best to engage coworkers m a genuine, back-and-forth conversation, rather than prioritizing your own thoughts.","opts":{},"answer":"F","analysis":"【AI 解析】答案 [F]「Slow down and listen」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [F]。"},{"num":43,"stem":"It's common to have a \"cubicle mate\" or special confidant in a work setting. But in addition to those trusted coworkers, you should expand your horizons and find out about all the people around you. Use your lunch and coffee breaks to meet up with colleagues you don't always see. Find out about their lives and interests beyond the job. It requires minimal effort and goes a long way. This will help to grow your internal network, in addition to being a nice break in the work day.","opts":{},"answer":"D","analysis":"【AI 解析】答案 [D]「Spend time with everyone」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [D]。"},{"num":44,"stem":"Positive feedback is important for anyone to hear. And you don't have to be someone's boss to tell them they did an exceptional job on a particular project. This will help engender good will in others. But don't overdo it or be fake about it. One study found that people responded best to comments that shifted from negative to positive, possibly because it suggested they had won somebody over.","opts":{},"answer":"A","analysis":"【AI 解析】答案 [A]「Give compliments, just not too many」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [A]。"},{"num":45,"stem":"This one may be a bit more difficult to pull off, but it can go a long way to achieving results. Remember in dealing with any coworker what they appreciate from an interaction. Watch out for how they verbalize with others. Some people like small talk in a meeting before digging into important matters, while others are more straightforward. Jokes that work on one person won't necessarily land with another. So, adapt your style accordingly to type. Consider the person that you're dealing with in advance and what will get you to your desired outcome.","opts":{},"answer":"C","analysis":"【AI 解析】答案 [C]「Tailor your interactions」。该项与题干表述构成同义对应，其余选项内容与题干不符，故选 [C]。"}],"analysisBlob":""},"translation":{"blocks":["**46.** Directions: Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points) It's almost impossible to go through life without expenencmg some kind of failure. But, the wonderful thing about failure is that it's entirely up to us to decide how to look at it. We can choose to see failure as \"the end of the world.\" Or, we can look at failure as the incredible learning experience that it often is. Every time we fail at something, we can choose to look for the lesson we're meant to learn. These lessons are very important; they're how we grow, and how we keep from making that same mistake again. Failures stop us only if we let them. Failure can also teach us things about ourselves that we would never have learned otherwise. For instance, failure can help you discover how strong a person you are. Failing at something can help you discover your truest friends, or help you find unexpected motivation to succeed."],"reference":"人这一生几乎不可能不经历某种失败。但失败的绝妙之处在于，如何看待失败完全取决于我们自己。我们可以选择把失败看作“世界末日”，也可以把失败看作它常常带给我们的宝贵的学习经历。每当我们做某件事失败时，我们都可以选择去寻找其中注定要吸取的教训。这些教训十分重要：它们是我们成长的途径，也是我们避免重蹈覆辙的保障。只要我们自己不放弃，失败就无法阻挡我们。失败还能教会我们一些别的途径永远无法领会的关于自身的道理。例如，失败能帮你发现自己有多坚强。做某件事的失败可以帮你辨别真正的朋友，或帮助你找到意想不到的迈向成功的动力。","analysis":"【AI 译文说明】参考译文为 AI 生成，供对照参考；建议先自行翻译再比对。"},"writing":{"small":["**47.** Directions: Suppose you are planning a tour of a historical site for a group of international students. Write them an email to 1) tell them about the site, and 2) give them some tips for the tour. You should write about 100 words on the ANSWER SHEET. Do not use your own name. use \"Li Ming\" instead. (10 points)"],"large":["**48.** Directions: Write an essay based on the following chart. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points) m.matfaJ / 21.3%","**某高校学生手机阅读目的的调查**","| 学习知识 | 消磨时间 | 获取信息 | 其他 | |---|---|---|---| | 59.5% | 21.3% | 17.0% | 2.2% |"],"small_ref":"Dear international students,\n\nI am delighted to tell you that a tour to the Great Wall, one of the most famous historical sites in China, has been arranged for this Saturday.\n\nAs a world cultural heritage site, the Great Wall stretches thousands of miles across northern China and was first built over two thousand years ago. Standing on it, you will not only enjoy magnificent views but also feel the wisdom of the ancient Chinese people.\n\nHere are some tips: please wear comfortable sports shoes, since we will climb for about three hours; bring enough water and some snacks; and take a light jacket, as it is windy on the wall. We will gather at the school gate at 8 a.m.\n\nWish you a pleasant trip!\n\nYours,\nLi Ming","large_ref":"The chart illustrates the purposes of mobile-phone reading among students of a university. Acquiring knowledge accounts for the largest proportion at 59.5%, followed by killing time at 21.3% and obtaining information at 17%, while other purposes make up merely 2.2%.\n\nThe figures indicate that mobile reading has become, above all, a learning tool for students. With abundant e-books, online courses and study applications available, smartphones enable people to learn anytime and anywhere, which traditional paper books can hardly achieve. The relatively small proportion of entertainment-oriented reading is also encouraging.\n\nNevertheless, mobile reading has its limits: fragmented reading on small screens may weaken deep thinking. Therefore, students should take advantage of the convenience of mobile learning while keeping the habit of reading classic works in depth. Only by combining the two can mobile phones truly serve our intellectual growth."},"label":"2020 年真题（AI 解析）"};

 and Disney had also pledged to create their own plans. When the skills mismatch is in the broader economy though, the focus usually turns to government to handle. Efforts in Canada and elsewhere have been arguably languid at best, and have given us a situation where we frequently hear of employers begging for workers, even at times and in regions where unemployment is high. With the pandemic, unemployment is very high indeed. In February, at 3.5 per cent and 5 .5 per cent respectively, unemployment rates in Canada and the United States were at generational lows and worker shortages were everywhere. As of May, those rates had spiked up to 13. 3 per cent and 13. 7 per cent, and although many worker shortages had disappeared, not all had done so. In the medical field, to take an obvious example, the pandemic meant that there were still clear shortages of doctors, nurses and other medical personnel. Of course, it is not like you can take an unemployed waiter and train him to be a doctor in a few weeks, no matter who pays for it. But even if you cannot close that gap, maybe you can close others, and doing so would be to the benefit of all concerned. That seems to be the case in Sweden: When forced to furlough 90 per cent of their cabin staff, Scandinavian Airlines decided to start up a short retraining program that reskilled the laid-off workers to support hospital staff. The effort was a collective one and involved other companies as well as a Swedish university."],"questions":[{"num":21,"stem":"Research by the World Economic Forum suggests ___","opts":{"A":"an increase in full-time employment","B":"an urgent demand for new job skills","C":"a steady growth of job opportunities","D":"a controversy about the \" core skills\""},"answer":"B","analysis":"【AI 解析】答案 [B]「an urgent demand for new job skills」。本题考查「Research by the World Economic Forum sug…」，根据原文相应内容即可直接定位。正确项 [B] 与原文对应内容构成同义转述；其余选项或偷换概念、或以偏概全、或无中生有，均不成立。"},{"num":22,"stem":"AT&T is cited to show --- ___","opts":{ a rather particular reason: Brexit. Brexit is seen by some as an opportunity to reverse a recent trend towards the UK importing food. The country produces only about 60 per cent of the food it eats, down from almost three-quarters in the late 1980s. A move back to self-sufficiency, the argument goes, would boost the farming industry, political sovereignty and even the nation's health. Sounds great-but how feasible is this vision? According to a report on UK food production from the University of Leeds, UK, 85 per cent of the country's total land area is associated with meat and dairy production. That supplies 80 per cent of what is consumed, so even covering the whole country in livestock farms wouldn't allow us to cover all our meat and dairy needs. There are many caveats to those figures, but they are still grave. To become much more self-sufficient, the UK would need to drastically reduce its consumption of animal foods, and probably also farm more intensively-meaning fewer green fields and more factory-style production. But switching to a mainly plant-based diet wouldn't help. There is a good reason why the UK is dominated by animal husbandry: most of its terrain doesn't have the right soil or climate to grow crops on a commercial basis. Just 25 per cent of the country's land is suitable for crop-growing, most of which is already occupied by arable fields. Even if we converted all the suitable land to fields of fruit and veg-which would involve taking out all the nature reserves and removing thousands of people from their homes-we would achieve only a 30 per cent boost in crop production. Just 23 per cent of the fruit and vegetables consumed in the UK are currently home-grown, so even with the most extreme measures we could meet only 30 per cent of our fresh produce needs. That is before we look for the space to grow the grains, sugars, seeds and oils that provide us with the vast bulk of our current calorie intake."],"questions":[{"num":26,"stem":"Some people a
